    const out = refl(v)
      ? [form(1), form(3), form(1).replace(' sich', ' dich')]
      : [form(1), form(3), form(4), build(v, word1(v.prt)), form(0)];
    return [...new Set(out)].filter((x) => !list(v.pr).includes(x) && x !== f).slice(0, 3);
  }
  function prtWrong(v) {
    const w = word1(v.prt);
    if (v.inf === 'sein') return ['ist', 'wart', 'wurde'];
    if (!strongPrt(v)) return [list(v.pr)[0], build(v, w + 'n'), v.pf];
    const regular = stem(v) + (/[td]$/.test(stem(v)) ? 'ete' : 'te');
    const plusT = w + (/[td]$/.test(w) ? 'et' : 't');
    return [...new Set([build(v, regular), build(v, plusT), list(v.pr)[0]])].filter((x) => x !== v.prt);
  }

  // --- the cards ---------------------------------------------------------------------------------------
  const cards = [];
  V.forEach((v, i) => {
    const id = 'vl-' + slug(v);
    const hint = label(v);
    const pr = list(v.pr);

    // Präsens (level 1): multiple choice and typed answers take turns
    const prBase = { id: id + '-pr', level: 1, rule: prRules(v), explain: prWhy(v) };
    if (i % 2 === 0) cards.push(card(Object.assign(prBase, { type: 'mc', prompt: 'Präsens — er / sie / es', q: 'er ___', hint, correct: pr[0], wrong: prWrong(v) })));
    else cards.push(card(Object.assign(prBase, { type: 'type', prompt: 'Präsens — er / sie / es', q: 'er ___', hint, answer: withEr(pr) })));

    // Präteritum (level 2): mostly typed, every third one multiple choice
    const prtBase = { id: id + '-prt', level: 2, rule: prtRules(v), explain: prtWhy(v) };
    if (i % 3 === 1) cards.push(card(Object.assign(prtBase, { type: 'mc', prompt: 'Präteritum — the written past', q: 'er ___', hint, correct: v.prt, wrong: prtWrong(v) })));
    else cards.push(card(Object.assign(prtBase, { type: 'type', prompt: 'Präteritum — the written past', q: 'er ___', hint, answer: withEr([v.prt]) })));

    // Perfekt (level 3): a sentence with gaps where the list has one, otherwise typed
    const pfBase = { id: id + '-pf', level: 3, rule: pfRules(v), explain: pfWhy(v) };
    if (v.gap) cards.push(card(Object.assign(pfBase, { type: 'gap', prompt: `Perfekt of **${v.inf}**`, q: v.gap, options: v.chips })));
    else cards.push(card(Object.assign(pfBase, { type: 'type', prompt: 'Perfekt — the spoken past', q: 'er ___', hint, answer: withEr([v.pf]) })));
  });

  // --- overview cards ----------------------------------------------------------------------------------
  const by = (inf) => V.find((v) => v.inf === inf);
  const pairs = (infs, col) => infs.map((inf) => [inf, list(by(inf)[col])[0]]);

  cards.push(
    {
      id: 'vl-tab-pr-1', type: 'table', level: 1, rule: 'vowel-change', asksRule: true,
      prompt: 'Write the **Präsens** (er / sie / es) — careful, the vowel changes!',
      head: ['Infinitiv', 'Präsens (er)'],
      rows: pairs(['fahren', 'schlafen', 'halten', 'geben', 'helfen', 'nehmen'], 'pr'),
      blanks: 4,
      explain: '**a → ä**: fährt, schläft, hält · **e → i**: gibt, hilft, nimmt. Only du and er/sie/es change; ihr keeps the vowel (*ihr fahrt, ihr gebt*).',
    },
    {
      id: 'vl-tab-pr-2', type: 'table', level: 1, rule: ['vowel-change', 'present-stem'], asksRule: true,
      prompt: 'Write the **Präsens** (er / sie / es)',
      head: ['Infinitiv', 'Präsens (er)'],
      rows: pairs(['essen', 'lesen', 'sprechen', 'vergessen', 'bieten', 'heißen'], 'pr'),
      blanks: 4,
      explain: '**e → i / ie**: isst, liest, spricht, vergisst. Stem in -t: **-et** (bietet). Stem in -ß: only **-t** (heißt).',
    },
    {
      id: 'vl-match-prt-1', type: 'match', level: 2, rule: 'praet-irregular',
      prompt: 'Match the **Präteritum** (er / sie / es)',
      pairs: pairs(['gehen', 'kommen', 'fahren', 'fliegen', 'bleiben', 'sein'], 'prt'),
      explain: 'Verbs of moving and *sein / bleiben*: ging, kam, fuhr, flog, blieb, war — all irregular, no -te.',
    },
    {
      id: 'vl-match-prt-2', type: 'match', level: 2, rule: 'praet-irregular',
      prompt: 'Match the **Präteritum** (er / sie / es)',
      pairs: pairs(['essen', 'trinken', 'lesen', 'schreiben', 'sprechen', 'singen'], 'prt'),
      explain: 'aß, trank, las, schrieb, sprach, sang: a new vowel and no ending for er.',
    },
    {
      id: 'vl-match-prt-3', type: 'match', level: 2, rule: 'praet-irregular',
      prompt: 'Match the **Präteritum** (er / sie / es)',
      pairs: pairs(['geben', 'nehmen', 'helfen', 'bieten', 'halten', 'heißen'], 'prt'),
      explain: 'gab, nahm, half, bot, hielt, hieß. *hielt* and *hieß* get **ie**.',
    },
    {
      id: 'vl-match-prt-4', type: 'match', level: 2, rule: 'praet-irregular',
      prompt: 'Match the **Präteritum** (er / sie / es)',
      pairs: pairs(['beginnen', 'gewinnen', 'bekommen', 'vergessen', 'schlafen', 'schießen'], 'prt'),
      explain: 'begann, gewann, bekam, vergaß, schlief, schoss. The prefixes be-, ge-, ver- stay: *bekam*, not *kam*.',
    },
    {
      id: 'vl-tab-prt-1', type: 'table', level: 2, rule: ['praet-irregular', 'separable'], asksRule: true,
      prompt: 'Write the **Präteritum** (er / sie / es) of the separable verbs',
      head: ['Infinitiv', 'Präteritum (er)'],
      rows: pairs(['abschließen', 'anfangen', 'aufstehen', 'einnehmen', 'umziehen'], 'prt'),
      blanks: 4,
      explain: 'A new stem and the prefix at the end: schloss **ab**, fing **an**, stand **auf**, nahm **ein**, zog **um**.',
    },
    {
      id: 'vl-tab-pf-1', type: 'table', level: 3, rule: ['perfekt-aux', 'partizip-irregular'], asksRule: true,
      prompt: 'Write the **Perfekt** (er / sie / es) — **hat** or **ist**?',
      head: ['Infinitiv', 'Perfekt (er)'],
      rows: pairs(['fahren', 'essen', 'fliegen', 'trinken', 'kommen', 'schlafen'], 'pf'),
      blanks: 4,
      explain: '**ist** for moving from A to B: ist gefahren, ist geflogen, ist gekommen. **hat** for the rest: hat gegessen, hat getrunken, hat geschlafen.',
    },
    {
      id: 'vl-tab-pf-2', type: 'table', level: 3, rule: ['perfekt-aux', 'partizip-no-ge'], asksRule: true,
      prompt: 'Write the **Perfekt** (er / sie / es)',
      head: ['Infinitiv', 'Perfekt (er)'],
      rows: pairs(['beginnen', 'bekommen', 'vergessen', 'bleiben', 'sein', 'gehen'], 'pf'),
      blanks: 4,
      explain: 'No ge- after be- / ver-: hat begonnen, hat bekommen, hat vergessen. *sein* and *bleiben* take **ist**: ist gewesen, ist geblieben. Moving: ist gegangen.',
    },
    {
      id: 'vl-tab-pf-3', type: 'table', level: 3, rule: ['reflexive-perfekt', 'partizip'], asksRule: true,
      prompt: 'Write the **Perfekt** (er / sie / es) of the reflexive verbs',
      head: ['Infinitiv', 'Perfekt (er)'],
      rows: pairs(['sich ärgern', 'sich erinnern', 'sich freuen', 'sich streiten', 'sich unterhalten', 'sich vorstellen'], 'pf'),
      blanks: 4,
      explain: 'Always **hat sich**. Regular: geärgert, gefreut · no ge- after er-/unter-: erinnert, unterhalten · irregular: gestritten · separable: vor**ge**stellt.',
    },
    {
      id: 'vl-sort-pf-1', type: 'sort', level: 3, rule: ['vl-list-1', 'perfekt-aux'], asksRule: true, theory: true,
      prompt: 'Perfekt: **hat** or **ist**? (verb list, part 1)',
      buckets: [
        { label: 'hat', items: ['abschließen', 'anfangen', 'backen', 'bekommen', 'essen', 'gewinnen'] },
        { label: 'ist', items: ['aufstehen', 'bleiben', 'fahren', 'fliegen', 'gehen'] },
      ],
      explain: '**ist** = a change of place (fahren, fliegen, gehen) or state (aufstehen), and *bleiben*. Everything else takes **hat** — even *anfangen*, *abschließen* and *gewinnen*.',
    },
    {
      id: 'vl-sort-pf-2', type: 'sort', level: 3, rule: ['vl-list-2', 'perfekt-aux'], asksRule: true, theory: true,
      prompt: 'Perfekt: **hat** or **ist**? (verb list, part 2)',
      buckets: [
        { label: 'hat', items: ['schlafen', 'schreiben', 'singen', 'stehen', 'trinken', 'vergessen', 'nehmen'] },
        { label: 'ist', items: ['kommen', 'sein', 'umziehen'] },
      ],
      explain: '**ist**: kommen and umziehen (a change of place) and *sein* itself. *stehen* → **hat** gestanden: standing still is no change.',
    },
    {
      id: 'vl-tf-umziehen', type: 'tf', level: 1, rule: ['vl-list-3', 'reflexive-perfekt'], asksRule: true, theory: true,
      statement: 'In the verb list, *sich umziehen* (to change clothes) takes **ist** in the Perfekt, just like *umziehen* (to move house).',
      answer: false,
      explain: 'Reflexive → **hat sich**: *er hat sich umgezogen* (changed clothes). *er ist umgezogen* = he moved house (a change of place).',
    },
    {
      id: 'vl-columns-1', type: 'mc', level: 1, rule: 'vl-columns', asksRule: true, theory: true,
      prompt: 'Which column of the verb list do you use when you **talk** about the past?',
      correct: 'Perfekt', wrong: ['Präteritum', 'Präsens', 'Infinitiv'],
      explain: 'Perfekt (*er ist gefahren*) is the spoken past. Präteritum (*er fuhr*) is mostly for writing — except *war* and *hatte*.',
    },
    {
      id: 'vl-columns-2', type: 'tf', level: 2, rule: 'vl-columns', asksRule: true, theory: true,
      statement: 'In the Präteritum, the **ich**-form is the same as the **er**-form, so the list also tells you *ich fuhr, ich nahm, ich war*.',
      answer: true,
      explain: 'Right: ich = er / sie / es in the Präteritum, with no ending: *ich fuhr, er fuhr*. Only the other persons add one: *du fuhrst, wir fuhren*.',
    },
  );

  Brezel.deck.addCards('verblist', cards);

  // --- the list itself, for the Rule book (one table per part) -------------------------------------
  const row = (v) => [label(v), list(v.pr).join(' / '), v.prt, v.pf].map((x, i) => (i ? 'er ' + x : x));
  const irregular = V.filter((v) => !refl(v));
  const half = irregular.findIndex((v) => v.inf === 'kommen');
  const head = ['Infinitiv', 'Präsens', 'Präteritum', 'Perfekt'];
  Brezel.deck.addRules('verblist', [
    { id: 'vl-list-1', title: 'Verb list 1: abschließen – helfen', text: 'Irregular verbs (Begegnungen A2+, p. 32). Learn the three forms without *er*.', table: { head, rows: irregular.slice(0, half).map(row) } },
    { id: 'vl-list-2', title: 'Verb list 2: kommen – vergessen', text: 'Irregular verbs (Begegnungen A2+, p. 33). **ist** in the Perfekt: a change of place or state, *sein* and *bleiben*.', table: { head, rows: irregular.slice(half).map(row) } },
    { id: 'vl-list-3', title: 'Verb list 3: reflexive verbs', text: 'Reflexive and partly reflexive verbs (p. 33): *sich* right after the verb, and **hat sich** in the Perfekt — every one of them.', table: { head, rows: V.filter(refl).map(row) } },
  ]);
})();

  <script>/* js/games/engine.js */
/*
 * Minigames: the registry, shared content helpers and the contract between a game and the
 * game screen (js/ui/arcade.js), which draws the frame around every game: intro, 3-2-1
 * countdown, score, combo, lives, timer, results and "Another game?".
 *
 *   Brezel.games.register('haben-sein', {
 *     name: 'Haben oder sein?',            // shown on the intro and results
 *     icon: '⚖️',                          // small icon (emoji) for lists and the top bar
 *     art: '<svg viewBox="0 0 120 120">…', // optional big picture for the intro (inline SVG)
 *     color: '#58cc02',                    // accent colour of the game
 *     blurb: 'Swipe each verb to its helper for the Perfekt.',
 *     how: ['← haben · sein →', 'Swipe, tap or use the arrow keys'],   // short how-to lines
 *     topics: ['past', 'pastq', 'verblist'], // topic ids it practises ('*' = every topic)
 *     speech: true,                        // optional: needs text-to-speech (hidden without it)
 *     ready(topic, level) → bool,          // optional: is there enough content for this topic?
 *     time: 60 | (level) => seconds,       // optional: the frame runs a countdown, then calls timeUp()
 *     lives: 3 | (level) => n,             // optional: the game ends when they run out
 *     play(stage, api) → controller,       // build the game inside `stage`
 *   })
 *
 *   controller = { begin?() — the 3-2-1 countdown is over: start here (timers only run from now),
 *                  destroy?(), key?(e) → true if handled, timeUp?() (default: api.end()) }
 *   play() runs before the countdown, so build the screen there and start the action in begin().
 *
 *   api = {
 *     topic,                 'all' or a topic id
 *     level,                 1 (Low) | 2 (Medium) | 3 (High) — "Mixed" picks one per game
 *     hit({ points = 10, el, text }) → points scored   a right answer: combo, sound, "+20" near el
 *     miss({ q, a, given, el })      a mistake: sound, shake, loses a life; listed on the results
 *     end({ won, note })             finish now (won: true/false for games you can win or lose)
 *     progress(done, total)          round-based games: shows "3 / 10" instead of a timer
 *     speak(text, { rate })          German text-to-speech
 *     sfx(name)                      'tap','drop','correct','wrong','combo','complete','tick','go','flip','whoosh','boom','levelup'
 *     after(ms, fn) · every(ms, fn) · frame(fn(dt, t) → false to stop) · wait(ms) → Promise<bool>
 *                                    timers that stop by themselves when the game ends or pauses
 *     get ended, get score, get combo, get lives, get timeLeft
 *   }
 *
 * Games never change learning progress; they earn XP and are saved in Brezel.store (state.games).
 * Content helpers are in Brezel.games.lib (below). Game files must not touch the DOM when they
 * load: tools/validate.js loads them in Node to check their content.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm, shuffle } = B.util;

  const list = [];
  const map = Object.create(null);

  function register(id, def) {
    def.id = id;
    if (map[id]) list.splice(list.indexOf(map[id]), 1);
    map[id] = def;
    list.push(def);
  }

  const covers = (def, topic) => def.topics === '*' || topic === 'all' || (Array.isArray(def.topics) && def.topics.includes(topic));

  /** Games for a topic ('all' = every game) that have enough content and, if needed, speech. */
  function forTopic(topic, level) {
    return list.filter((g) => {
      if (!covers(g, topic)) return false;
      if (g.speech && !(B.audio && B.audio.canSpeak)) return false;
      try {
        return !g.ready || !!g.ready(topic || 'all', level || 2);
      } catch (e) {
        console.warn('[Brezel] game', g.id, 'ready() failed', e);
        return false;
      }
    });
  }

  const value = (x, level) => (typeof x === 'function' ? x(level) : x);

  // --- content helpers ------------------------------------------------------------------------
  const PERSONS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];
  const REFL = ['mich', 'dich', 'sich', 'uns', 'euch', 'sich'];

  /** The user's verb list (Begegnungen A2+ Kapitel 1, D2): [infinitive, reflexive?]. Topic "verblist". */
  const VERB_LIST = [
    'abschließen', 'anfangen', 'aufstehen', 'backen', 'beginnen', 'bekommen', 'bieten', 'bleiben', 'essen', 'fahren',
    'fliegen', 'geben', 'gehen', 'gewinnen', 'halten', 'heißen', 'helfen', 'kommen', 'lesen', 'nehmen', 'einnehmen',
    'schießen', 'schlafen', 'schreiben', 'sein', 'singen', 'stehen', 'sprechen', 'trinken', 'umziehen', 'vergessen',
  ].map((v) => [v, false]).concat([
    'anziehen', 'ärgern', 'bedanken', 'befinden', 'beschweren', 'beeilen', 'duschen', 'erinnern', 'erkälten', 'freuen',
    'föhnen', 'interessieren', 'kämmen', 'schminken', 'streiten', 'treffen', 'umziehen', 'unterhalten', 'verlieben', 'vorstellen',
  ].map((v) => [v, true]));

  const MODALS = ['müssen', 'können', 'möchten', 'mögen', 'wollen', 'dürfen', 'sollen'];
  const INSEPARABLE = /^(be|ver|ent|er|ge|zer|emp|miss|unter|über|hinter|wider)/;

  const verb = (inf) => B.deck.verbs[inf] || null;
  /** "sich anziehen = to get dressed" in the lexicon marks a reflexive verb. */
  const isReflexive = (v) => /^sich /.test(String(v && v.en));
  const isSeparable = (v) => !!(v && v.forms && v.forms[0].includes(' '));
  const isInseparable = (v) => !!(v && !isSeparable(v) && INSEPARABLE.test(v.inf) && v.pp && !v.pp.startsWith('ge'));
  /** English meaning without "sich … =" and "to". */
  const meaning = (v) => String((v && v.en) || '').replace(/^.*= /, '').replace(/^to /, '');

  /**
   * A full verb form with its reflexive pronoun and prefix in place:
   *   form(anziehen, 'present', 0, { reflexive: true }) → "ziehe mich an"
   *   form(anziehen, 'perfekt', 2, { reflexive: true }) → "hat sich angezogen"
   *   form(fahren, 'perfekt', 0) → "bin gefahren"
   * tense: 'present' | 'praet' | 'perfekt'. Returns null if the lexicon lacks that form.
   * Reflexive verbs always take haben in the Perfekt (sich umziehen ≠ umziehen).
   */
  function form(v, tense, person, { reflexive = false } = {}) {
    if (!v) return null;
    const pron = reflexive ? REFL[person] : null;
    if (tense === 'perfekt') {
      if (!v.pp) return null;
      const auxInf = reflexive ? 'haben' : v.aux || 'haben';
      const aux = verb(auxInf);
      if (!aux) return null;
      return [aux.forms[person], pron, v.pp].filter(Boolean).join(' ');
    }
    const forms = tense === 'praet' ? v.prt : v.forms;
    if (!forms || !forms[person]) return null;
    const [head, ...rest] = forms[person].split(' ');
    return [head, pron, ...rest].filter(Boolean).join(' ');
  }

  /**
   * Lexicon verbs that fit a topic: [{ v, reflexive }]. need: fields the game needs ('prt', 'pp').
   * verblist → the user's list; reflexive → reflexive verbs; prefix → separable + inseparable;
   * praet → verbs with a Präteritum; past / pastq / tenses → verbs with a participle; verbs → modals.
   */
  function verbsFor(topic, { need = [] } = {}) {
    const all = Object.values(B.deck.verbs);
    let out;
    switch (topic) {
      case 'verblist':
        out = VERB_LIST.map(([inf, reflexive]) => ({ v: verb(inf), reflexive })).filter((x) => x.v);
        break;
      case 'reflexive':
        out = all.filter(isReflexive).map((v) => ({ v, reflexive: true }));
        break;
      case 'prefix':
        out = all.filter((v) => isSeparable(v) || isInseparable(v)).map((v) => ({ v, reflexive: false }));
        break;
      case 'verbs':
        out = MODALS.map(verb).filter(Boolean).map((v) => ({ v, reflexive: false }));
        break;
      case 'praet':
        out = all.filter((v) => v.prt).map((v) => ({ v, reflexive: isReflexive(v) }));
        break;
      case 'past':
      case 'pastq':
      case 'tenses':
      case 'present':
      case 'all':
        out = all.map((v) => ({ v, reflexive: isReflexive(v) }));
        break;
      default:
        out = [];
    }
    return out.filter(({ v }) => need.every((k) => (k === 'prt' ? v.prt : k === 'pp' ? v.pp : v[k])));
  }

  /**
   * Cards of a topic for the game's level (falls back to every level when fewer than `min`).
   * types: allowed exercise types. Variant cards (easy copies of typed cards) are left out.
   */
  function cardsFor(topic, level, { types = null, min = 8 } = {}) {
    const inTopic = (c) => !topic || topic === 'all' || B.deck.inTopic(c, topic);
    const base = B.deck.cards.filter((c) => inTopic(c) && !c.variantOf && (!types || types.includes(c.type)));
    const fits = B.level ? base.filter((c) => B.level.of(c) === level) : base;
    return fits.length >= min ? fits : base;
  }

  /** Random order without repeats; refills (reshuffled) when used up, never repeating the last item first. */
  function deal(items) {
    let bag = [];
    let last = null;
    return function next() {
      if (!items.length) return null;
      if (!bag.length) {
        bag = shuffle(items);
        if (bag.length > 1 && bag[0] === last) bag.push(bag.shift());
      }
      last = bag.shift();
      return last;
    };
  }

  const sample = (items, n) => shuffle(items).slice(0, n);
  const same = (a, b) => norm(a) === norm(b);
  /** Unique by normalised text, without `except`. */
  const uniq = (items, except = []) => {
    const seen = new Set(except.map(norm));
    return items.filter((x) => x && !seen.has(norm(x)) && seen.add(norm(x)));
  };

  B.games = {
    register,
    get: (id) => map[id] || null,
    get list() {
      return list.slice();
    },
    forTopic,
    has: (topic, level) => forTopic(topic, level).length > 0,
    covers,
    value,
    data: {},
    lib: {
      PERSONS, REFL, VERB_LIST, MODALS,
      verb, isReflexive, isSeparable, isInseparable, meaning, form, verbsFor, cardsFor, deal, sample, same, uniq,
    },
  };
})();

</script>
  <script>/* data/games-quick.js */
/*
 * Content for the quick-fire minigames (js/games/swipe.js, rush.js, automat.js).
 * Everything here uses words from the cards and data/glossary.js; verb forms come from
 * data/lexicon.js at run time, so new verbs show up in the games by themselves.
 *
 *   nichtKein   "Nicht oder kein?": s = sentence with ___, a = the word that fills it
 *   imIns       "Im oder ins?": cue = Wo? (where: im) or Wohin? (where to: ins); neuter nouns only,
 *               because im = in dem and ins = in das (masculine "where to" would be "in den")
 *   spiegel     "Spiegel": what comes after the reflexive pronoun for each verb, so the sentences
 *               sound natural. tails = present tense, perfekt = Perfekt (default: tails);
 *               plural: the verb needs two people (sich streiten, sich begrüßen); present: no Perfekt
 *   reflMeaning English for verbs used reflexively whose lexicon entry is not reflexive
 *   homophones  pairs that sound the same: "Hör genau" never offers both
 */
Brezel.games.data.quick = {
  nichtKein: [
    // kein + noun
    { s: 'Ich habe ___ Auto.', a: 'kein' },
    { s: 'Pedro hat ___ Kinder.', a: 'keine' },
    { s: 'Wir haben heute ___ Zeit.', a: 'keine' },
    { s: 'Das ist ___ Problem.', a: 'kein' },
    { s: 'Ich trinke ___ Kaffee.', a: 'keinen' },
    { s: 'Martina hat ___ Hund.', a: 'keinen' },
    { s: 'Ich habe ___ Idee.', a: 'keine' },
    { s: 'Er hat ___ Bruder.', a: 'keinen' },
    { s: 'Ich habe heute ___ Unterricht.', a: 'keinen' },
    { s: 'Wir haben ___ Fernseher.', a: 'keinen' },

  spiegel: {

    ärgern: { tails: ['über das Computerprogramm', 'über die Chefin'] },
    bedanken: { tails: ['für die Blumen'] },
    befinden: { tails: ['in Wien', 'im Zentrum'], present: true },
    beschweren: { tails: ['über das Zimmer'] },
    beeilen: { tails: [''] },
    duschen: { tails: ['jeden Morgen'], perfekt: ['schon'] },
    erinnern: { tails: ['gern an die Schulzeit'] },
    erkälten: { tails: ['oft'], perfekt: ['gestern'] },
    freuen: { tails: ['auf das Wochenende', 'über die Blumen'], perfekt: ['über die Grüße', 'über die Blumen'] },
    föhnen: { tails: [''] },
    interessieren: { tails: ['für Kunst', 'für Fußball'] },
    kämmen: { tails: [''] },
    schminken: { tails: ['jeden Morgen'], perfekt: ['schon'] },
    streiten: { tails: ['schon wieder'], plural: true },
    treffen: { tails: ['mit Freunden', 'am Samstag mit Freunden'], perfekt: ['am Samstag mit Freunden'] },
    umziehen: { tails: ['schnell'] },
    unterhalten: { tails: ['über die Arbeitszeiten'] },
    verlieben: { tails: ['schnell'] },
    vorstellen: { tails: [''] },
    vorbereiten: { tails: ['auf die Prüfung'] },
    rasieren: { tails: ['jeden Morgen'], perfekt: ['schon'] },
    entspannen: { tails: ['am Wochenende'] },
    begrüßen: { tails: [''], plural: true },
  },

  reflMeaning: { umziehen: 'change (clothes)', treffen: 'meet' },

  homophones: [
    ['ist', 'isst'], ['seid', 'seit'], ['das', 'dass'], ['hast', 'hasst'], ['Stadt', 'statt'], ['wieder', 'wider'],
    ['Rad', 'Rat'], ['malen', 'mahlen'], ['war', 'wahr'], ['mehr', 'Meer'], ['viel', 'fiel'], ['Wal', 'Wahl'],
    ['Tod', 'tot'], ['bunt', 'Bund'], ['Lied', 'Lid'], ['Mohr', 'Moor'], ['Seite', 'Saite'], ['wird', 'Wirt'],
