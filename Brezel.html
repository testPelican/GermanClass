  align-content: center;
}

.mem-card {
  width: var(--mem-w, 80px);
  height: var(--mem-h, 100px);
  padding: 0;
  border: 0;
  background: none;
  perspective: 800px;
  border-radius: 16px;
  -webkit-tap-highlight-color: transparent;
}

.mem-inner {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1.15);
}

.mem-card.up .mem-inner,
.mem-card.matched .mem-inner,
.mem-grid.peek .mem-inner {
  transform: rotateY(180deg);
}

.mem-face {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 6px;
  border-radius: 14px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.mem-back {
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0 10%, transparent 11%) 0 0 / 22px 22px,
    linear-gradient(145deg, var(--g), color-mix(in srgb, var(--g) 65%, #2a1450));
  border-bottom: 4px solid color-mix(in srgb, var(--g) 55%, #000);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
}

.mem-logo {
  font-size: calc(var(--mem-w, 80px) * 0.34);
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25));
  transition: transform 0.2s ease;
}

.mem-front {
  transform: rotateY(180deg);
  background: var(--surface);
  border: 2px solid var(--border);
  border-bottom-width: 4px;
  color: var(--text);
  font-weight: 800;
  font-size: var(--mem-fs, 15px);
  line-height: 1.2;
  text-align: center;
  overflow-wrap: anywhere;
  hyphens: auto;
}

.mem-text.long {
  font-size: 0.86em;
}

.mem-card.matched .mem-front {
  background: var(--good-bg);
  border-color: var(--good-line);
  color: var(--good-ink);
  animation: mem-match 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.mem-card.matched {
  cursor: default;
}

.mem-card.slip .mem-front {
  background: var(--bad-bg);
  border-color: var(--bad-line);
  color: var(--bad-ink);
}

.mem-card:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

@media (hover: hover) {
  .mem-card:not(.up):not(.matched):hover .mem-inner {
    transform: translateY(-3px) rotate(-1.5deg);
  }
  .mem-card:not(.up):not(.matched):hover .mem-logo {
    transform: scale(1.12) rotate(-8deg);
  }
}

@keyframes mem-match {
  0% {
    transform: rotateY(180deg) scale(1);
  }
  45% {
    transform: rotateY(180deg) scale(1.1);
  }
  100% {
    transform: rotateY(180deg) scale(1);
  }
}

/* === Die Schere ============================================================================= */
.sch-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
  height: 100%;
  max-width: 640px;
  margin: 0 auto;
}

.sch-card {
  padding: 26px 20px 18px;
  border: 2px solid var(--border);
  border-bottom-width: 5px;
  border-radius: 24px;
  background: var(--surface);
  text-align: center;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.sch-card.enter {
  animation: sch-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.sch-card.good {
  border-color: var(--good-line);
  background: color-mix(in srgb, var(--good-bg) 55%, var(--surface));
}

.sch-card.bad {
  border-color: var(--bad-line);
  background: color-mix(in srgb, var(--bad-bg) 55%, var(--surface));
}

.sch-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 7px;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
}

.sch-end {
  margin-left: -5px;
}

.sch-verb {
  position: relative;
  display: inline-flex;
  padding: 2px 10px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--g) 18%, var(--surface));
  box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--g) 40%, transparent);
  color: var(--text);
  font-weight: 900;
}

.sch-pre {
  color: color-mix(in srgb, var(--g) 75%, var(--text));
}

.sch-pre.moved,
.sch-pre.floating {
  padding: 2px 10px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--g) 28%, var(--surface));
  font-weight: 900;
}

.sch-pre.floating {
  animation: sch-float 1.2s ease-in-out infinite;
  box-shadow: var(--lift);
}

.sch-verb.kept {
  animation: sch-kept 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
  box-shadow: inset 0 -3px 0 var(--good-line), 0 0 0 3px color-mix(in srgb, var(--good-line) 35%, transparent);
}

.sch-verb.no-cut {
  animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  box-shadow: inset 0 -3px 0 var(--bad-line), 0 0 0 3px color-mix(in srgb, var(--bad-line) 35%, transparent);
}

.sch-snip {
  position: absolute;
  left: calc(var(--snip-x, 50%) - 16px); /* set by js: the seam between prefix and verb */
  top: -30px;
  width: 32px;
  height: 32px;
  color: var(--g);
  pointer-events: none;
  animation: sch-snip 0.42s ease-in both;
}

.sch-snip svg {
  width: 100%;
  height: 100%;
}

.sch-slot {
  min-width: 34px;
  min-height: 34px;
  padding: 0 6px;
  border: 2px dashed var(--g);
  border-radius: 10px;
  background: var(--surface);
  color: var(--g);
  font-weight: 900;
  font-size: 16px;
  animation: sch-slot 1s ease-in-out infinite;
}

.sch-slot.sel {
  background: color-mix(in srgb, var(--g) 22%, var(--surface));
  border-style: solid;
}

.sch-hint {
  min-height: 22px;
  margin-top: 10px;
  color: var(--muted);
  font-weight: 800;
  font-size: 15px;
}

.sch-note {
  min-height: 24px;
  margin-top: 6px;
  font-size: 15px;
  color: var(--text-2);
}

.sch-fix {
  display: block;
  margin-top: 4px;
  font-weight: 900;
  color: var(--text);
}

.sch-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.sch-actions .btn {
  min-height: 72px;
  font-size: 19px;
  gap: 10px;
}

.sch-cut {
  --btn-bg: color-mix(in srgb, var(--g) 16%, var(--surface));
  --btn-border: var(--g);
  --btn-shadow: color-mix(in srgb, var(--g) 70%, #000);
}

.sch-keep {
  --btn-bg: color-mix(in srgb, var(--blue) 14%, var(--surface));
  --btn-border: var(--blue);
  --btn-shadow: var(--blue-shadow);
}

.sch-ico {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  font-size: 24px;
  color: var(--g);
}

.sch-ico svg {
  width: 100%;
  height: 100%;
}

@keyframes sch-in {
  from {
    opacity: 0;
    transform: translateX(40px) rotate(2deg);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes sch-snip {
  0% {
    opacity: 0;
    transform: translateY(-10px) rotate(0deg) scale(0.8);
  }
  40% {
    opacity: 1;
    transform: translateY(6px) rotate(-18deg) scale(1.1);
  }
  100% {
    opacity: 0;
    transform: translateY(24px) rotate(14deg) scale(1);
  }
}

@keyframes sch-kept {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.12);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes sch-float {
  50% {
    transform: translateY(-5px);
  }
}

@keyframes sch-slot {
  50% {
    transform: translateY(2px);
  }
}

/* === Bossfight ============================================================================== */
.g-stage:has(.boss-wrap) {
  padding-bottom: 0;
}

.boss-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 680px;
  margin: 0 auto;
}

.boss-arena {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: none;
  padding: 4px 4px 10px;
}

.boss-stage {
  position: relative;
  flex: none;
}

.boss-mon {
  width: 128px;
  height: 128px;
  transform-origin: 50% 90%;
}

.boss-mon svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.boss-mon .b-body {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: b-bob 2.4s ease-in-out infinite;
}

.boss-mon .b-lid {
  transform-box: fill-box;
  transform-origin: 50% 0;
  transform: scaleY(0);
  animation: b-blink 4.2s ease-in-out infinite;
}

.boss-mon .b-pupil {
  animation: b-look 6s ease-in-out infinite;
}

.boss-mon .b-tent {
  transform-box: fill-box;
  transform-origin: 50% 0;
  animation: b-sway 1.8s ease-in-out infinite alternate;
}

.boss-mon .b-mirror {
  animation: b-glint 2.6s ease-in-out infinite;
}

.boss-mon.hit {
  animation: b-hit 0.5s ease both;
}

.boss-mon.attack {
  animation: b-attack 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.boss-mon.roar {
  animation: b-roar 0.8s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.boss-mon.defeated {
  animation: b-defeat 1.2s ease-in forwards;
}

.boss-say {
  position: absolute;
  left: 100%;
  top: 4px;
  z-index: 2;
  margin-left: -10px;
  padding: 6px 12px;
  border: 2px solid var(--border);
  border-radius: 14px 14px 14px 4px;
  background: var(--surface);
  box-shadow: var(--lift);
  font-weight: 900;
  font-size: 14px;
  white-space: nowrap;
}

.boss-say.pop {
  animation: pop-in 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.boss-info {
  flex: 1;
  min-width: 0;
  padding-top: 26px;
}

.boss-name {
  margin-bottom: 6px;
  font-size: 18px;
  font-weight: 900;
  color: var(--g-ink);
}

.boss-hp {
  display: flex;
  gap: 4px;
}

.boss-hp-cell {
  flex: 1;
  height: 14px;
  border-radius: 6px;
  background: linear-gradient(180deg, #ff6b6b, #e5383b);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
  transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
}

.boss-hp-cell.lost {
  background: var(--track);
  box-shadow: none;
  transform: scaleY(0.6);
  opacity: 0.7;
}

.boss-dmg {
  position: absolute;
  left: 50%;
  top: 30%;
  z-index: 3;
  font-size: 26px;
  font-weight: 900;
  color: var(--red);
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 2px 0 var(--surface), 0 0 8px var(--surface);
  animation: b-dmg 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.boss-dmg.crit {
  color: var(--orange);
  font-size: 22px;
}

.boss-card {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 12px 14px 10px;
  border: 2px solid var(--border);
  border-radius: 20px 20px 0 0;
  border-bottom: 0;
  background: var(--surface);
}

.boss-card.enter {
  animation: card-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.boss-card .ex-title {
  font-size: 19px;
  margin-bottom: 10px;
}

.boss-card .mascot {
  font-size: 40px;
}

.boss-foot {
  flex: none;
  display: grid;
  gap: 10px;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  border: 2px solid var(--border);
  border-top-width: 2px;
  border-radius: 0 0 20px 20px;
  background: var(--bg);
  transition: background-color 0.2s ease;
}

.boss-foot.is-good {
  background: var(--good-bg);
  color: var(--good-ink);
}

.boss-foot.is-bad {
  background: var(--bad-bg);
}

.boss-fb:empty {
  display: none;
}

.boss-fb {
  max-height: 32vh;
  overflow-y: auto;
  font-size: 15px;
}

.boss-fb-head b,
.boss-foot.is-bad .boss-fb-head {
  color: var(--bad-ink);
}

.boss-fb-sol {
  margin-top: 2px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.boss-fb-why {
  margin-top: 4px;
  font-size: 14px;
  color: var(--text-2);
}

.boss-btn {
  width: 100%;
}

.boss-flash {
  position: absolute;
  inset: -40px -40px -40px -40px;
  z-index: 5;
  background: radial-gradient(circle at 50% 30%, rgba(255, 75, 75, 0.35), rgba(255, 75, 75, 0.15) 60%, transparent 80%);
  opacity: 0;
  pointer-events: none;
}

.boss-flash.on {
  animation: b-flash 0.5s ease-out both;
}

.boss-shot {
  position: absolute;
  z-index: 6;
  font-size: 34px;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(255, 200, 0, 0.8));
}

@media (max-width: 520px) {
  .boss-mon {
    width: 104px;
    height: 104px;
  }
  .boss-name {
    font-size: 16px;
  }
  .boss-info {
    padding-top: 22px;
  }
  .boss-say {
    left: 60%;
    font-size: 13px;
  }
  .boss-card {
    padding: 10px;
  }
}

@media (max-height: 640px) {
  .boss-mon {
    width: 84px;
    height: 84px;
  }
  .boss-info {
    padding-top: 14px;
  }
}

@keyframes b-bob {
  50% {
    transform: translateY(-4px) scaleY(1.03);
  }
}

@keyframes b-blink {
  0%,
  92%,
  100% {
    transform: scaleY(0);
  }
  95% {
    transform: scaleY(1);
  }
}

@keyframes b-look {
  0%,
  30%,
  100% {
    transform: translate(0, 0);
  }
  40%,
  55% {
    transform: translate(-3px, 1px);
  }
  65%,
  80% {
    transform: translate(3px, -1px);
  }
}

@keyframes b-sway {
  from {
    transform: rotate(-7deg);
  }
  to {
    transform: rotate(7deg);
  }
}

@keyframes b-glint {
  50% {
    opacity: 0.75;
  }
}

@keyframes b-hit {
  0% {
    filter: brightness(1);
    transform: translateX(0);
  }
  15% {
    filter: brightness(2.2) saturate(0.4);
    transform: translateX(10px) rotate(4deg);
  }
  35% {
    transform: translateX(-8px) rotate(-3deg);
  }
  55% {
    filter: brightness(1.4);
    transform: translateX(5px);
  }
  100% {
    filter: brightness(1);
    transform: translateX(0);
  }
}

@keyframes b-attack {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.28) translateY(10px);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes b-roar {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }
  60% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
  }
}

@keyframes b-defeat {
  0% {
    transform: rotate(0) scale(1);
    opacity: 1;
  }
  30% {
    transform: rotate(-12deg) scale(1.05);
    filter: brightness(1.8);
  }
  100% {
    transform: rotate(80deg) translateY(60px) scale(0.4);
    opacity: 0;
  }
}

@keyframes b-dmg {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.5);
  }
  25% {
    opacity: 1;
    transform: translate(-50%, -14px) scale(1.2);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -54px) scale(1);
  }
}

@keyframes b-flash {
  0% {
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

/* === Artikel-Regen ============================================================================== */
.arcade {
  --rg-der: #1cb0f6;
  --rg-die: #ff4b8b;
  --rg-das: #58cc02;
}

[data-theme='dark'] .arcade {
  --rg-der: #49c0f8;
  --rg-die: #ff6fa3;
  --rg-das: #93d333;
}

.g-stage:has(.rg-wrap) {
  padding-left: 0;
  padding-right: 0;
}

.rg-wrap {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.rg-sky {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 0 0 24px 24px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--g) 18%, var(--surface)) 0%, var(--surface) 75%);
}

.rg-cloud {
  position: absolute;
  top: -18px;
  width: 140px;
  height: 46px;
  border-radius: 999px;
  background: var(--surface);
  opacity: 0.9;
  box-shadow: 40px -14px 0 4px var(--surface), 84px 2px 0 -2px var(--surface);
  animation: rg-drift 18s linear infinite alternate;
}

.rg-cloud.c1 {
  left: 6%;
}

.rg-cloud.c2 {
  left: 58%;
  top: -10px;
  animation-duration: 24s;
  animation-direction: alternate-reverse;
}

.rg-ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14px;
  background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--g) 30%, transparent) 0 18px, transparent 18px 30px);
  opacity: 0.6;
}

.rg-drop {
  position: absolute;
  top: 0;
  z-index: 2;
  display: grid;
  justify-items: center;
  min-width: 96px;
  padding: 8px 14px 9px;
  border: 2px solid var(--border);
  border-bottom-width: 4px;
  border-radius: 22px 22px 22px 22px;
  background: var(--surface);
  color: var(--text);
  text-align: center;
  white-space: nowrap;
  will-change: transform;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.rg-drop::before {
  content: '';
  position: absolute;
  top: -9px;
  left: 50%;
  width: 14px;
  height: 14px;
  border-radius: 0 50% 50% 50%;
  background: color-mix(in srgb, var(--g) 50%, var(--surface));
  transform: translateX(-50%) rotate(45deg);
}

.rg-word {
  font-size: 19px;
  font-weight: 900;
}

.rg-en {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.rg-art {
  font-size: 13px;
  font-weight: 900;
  min-height: 0;
}

.rg-art:empty {
  display: none;
}

.rg-drop.active {
  z-index: 3;
  border-color: var(--g);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--g) 30%, transparent), var(--lift);
}

.rg-drop.active .rg-word::after {
  content: ' ?';
  color: var(--g);
}

.rg-drop.rg-der {
  border-color: var(--rg-der);
}
.rg-drop.rg-die {
  border-color: var(--rg-die);
}
.rg-drop.rg-das {
  border-color: var(--rg-das);
}
.rg-drop.rg-der .rg-art {
  color: var(--rg-der);
}
.rg-drop.rg-die .rg-art {
  color: var(--rg-die);
}
.rg-drop.rg-das .rg-art {
  color: var(--rg-das);
}

.rg-drop.shatter {
  animation: rg-shatter 0.45s ease-out forwards;
}

.rg-drop.splash {
  animation: rg-splash 0.5s ease-out forwards;
}

.rg-buckets {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  flex: none;
  padding: 12px max(14px, env(safe-area-inset-right)) 4px max(14px, env(safe-area-inset-left));
}

.rg-bucket {
  --c: var(--rg-der);
  position: relative;
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 84px;
  padding: 8px 6px 10px;
  border: 2px solid var(--c);
  border-bottom-width: 5px;
  border-radius: 20px;
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  color: var(--c);
  font-weight: 900;
  transition: transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}

.rg-bucket.rg-die {
  --c: var(--rg-die);
}

.rg-bucket.rg-das {
  --c: var(--rg-das);
}

.rg-bucket:active,
.rg-bucket.press {
  transform: translateY(3px);
}

.rg-bucket.gulp .rg-bucket-ico {
  animation: rg-gulp 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.rg-bucket-ico {
  width: 40px;
  height: 34px;
}

.rg-bucket-ico svg {
  width: 100%;
  height: 100%;
}

.rg-bucket-art {
  font-size: 22px;
  color: color-mix(in srgb, var(--c) 70%, var(--text));

  <script>/* js/core/util.js */
/* Shared helpers: DOM building, text normalisation, shuffling, animation. */
(function () {
  'use strict';
  const B = (window.Brezel = window.Brezel || {});

  const reducedMotion = () =>
    typeof window.matchMedia === 'function' &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /** Tiny hyperscript: h('div', {class: 'x', onClick: fn}, child, 'text') */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** Escapes, then supports **bold** and *italic* — used for explanations. */
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  /** Words joined with "_" form one tile ("St._Pölten"); show them with a space. */
  const show = (s) => String(s == null ? '' : s).replace(/_/g, ' ');

  /**
   * Normalise text for comparison: case-insensitive, punctuation-insensitive,
   * umlauts written as ae/oe/ue and ß as ss (so English keyboards work too).
   */
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFC')
      .toLowerCase()
      .replace(/_/g, ' ')
      .replace(/[„“”"'’‚‘«»]/g, '')
      .replace(/[.,!?;:…]/g, ' ')
      .replace(/ä/g, 'ae')
      .replace(/ö/g, 'oe')
      .replace(/ü/g, 'ue')
      .replace(/ß/g, 'ss')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** Shuffle, but avoid returning the original order when possible. */
  function shuffleAway(list, same = (x, y) => x === y) {
    if (list.length < 2) return list.slice();
    let out = shuffle(list);
    for (let tries = 0; tries < 12 && out.every((x, i) => same(x, list[i])); tries++) out = shuffle(list);
    return out;
  }

  const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  /**
   * FLIP animation: measure nodes, run a DOM mutation, then animate every node
   * from its old position to its new one.
   */
  function flip(nodes, mutate, { duration = 280, easing = 'cubic-bezier(.2,.8,.2,1)' } = {}) {
    const els = Array.from(nodes).filter(Boolean);
    const first = new Map(els.map((n) => [n, n.getBoundingClientRect()]));
    mutate();
    if (reducedMotion() || typeof Element.prototype.animate !== 'function') return;
    for (const n of els) {
      if (!n.isConnected) continue;
      const a = first.get(n);
      const b = n.getBoundingClientRect();
      const dx = a.left - b.left;
      const dy = a.top - b.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
      n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], {
        duration,
        easing,
      });
    }
  }

  /** Re-trigger a CSS animation class. */
  function pulse(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth; // force reflow so the animation restarts
    el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function fmtDuration(ms) {
    const s = Math.round((ms || 0) / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
  }

  const pct = (num, den) => (den ? Math.round((num / den) * 100) : 0);

  function dayKey(d = new Date()) {
    const x = d instanceof Date ? d : new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  }

  /** Split "Wohnt Julia in Salzburg?" into words + final punctuation. */
  function splitSentence(s) {
    const m = String(s).trim().match(/^(.*?)([.?!…]*)$/);
    return { words: m[1].split(/\s+/).filter(Boolean), punct: m[2] || '' };
  }

  B.util = {
    h, esc, md, show, norm, levenshtein, shuffle, shuffleAway, randInt, pick,
    flip, pulse, wait, fmtDuration, pct, dayKey, splitSentence, reducedMotion,
  };
})();

</script>
  <script>/* js/core/deck.js */
/*
 * The deck registry. Content files in /data call:
 *   Brezel.deck.addTopics([...])
 *   Brezel.deck.addVerbs({...}), addFamilies([...]), addProperNouns([...])
 *   Brezel.deck.addCards('topicId', [...])
 *   Brezel.deck.addRules('topicId', [...])   (the rules a card practises: Glossary and Rule book)
 * A card belongs to one topic. A topic with collects: 'theory' (Rules) also holds every card
 * marked theory: true: a question about a rule itself, never a translation.
 * finalize() then validates everything; broken cards are skipped and reported
 * in the console (and by tools/validate.js), so one typo never breaks the app.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm } = B.util;

  const PRONOUNS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

  const deck = {
    topics: [],
    topicMap: Object.create(null),
    rawCards: [],
    cards: [], // valid cards, after finalize()
    cardMap: Object.create(null),
    verbs: Object.create(null),
    families: [],
    properNouns: new Set(),
    rules: [],
    ruleMap: Object.create(null),
    problems: [],
    PRONOUNS,

    addTopics(list) {
      for (const t of list) {
        this.topics.push(t);
        this.topicMap[t.id] = t;
      }
    },

    addCards(topicId, list) {
      for (const c of list) this.rawCards.push(Object.assign({ topic: topicId }, c));
    },

    /** verbs: { wohnen: { en, forms: [6 present forms], prt?: [6 Präteritum forms], pp, aux } } */
    addVerbs(obj) {
      for (const [inf, v] of Object.entries(obj)) this.verbs[inf] = Object.assign({ inf }, v);
    },

    /** Groups of words that differ by one letter but are different grammar (dem/den/der). */
    addFamilies(list) {
      for (const f of list) this.families.push(f);
    },

    addProperNouns(list) {
      for (const w of list) this.properNouns.add(w);
    },

    /** rules: [{ id, title, text, table?: { head, rows }, points?: [...] }] — markdown-lite like card text. */
    addRules(topicId, list) {
      for (const r of list) {
        const rule = Object.assign({ topic: topicId }, r);
        this.rules.push(rule);
        this.ruleMap[rule.id] = rule;
      }
    },

    /** The rules a card practises (card.rule: id or [ids]); without one, the topic tip. */
    rulesFor(card) {
      const ids = Array.isArray(card.rule) ? card.rule : card.rule ? [card.rule] : [];
      const list = ids.map((id) => this.ruleMap[id]).filter(Boolean);
      if (list.length) return list;
      const t = this.topicMap[card.topic];
      return t && t.tip ? [{ id: 'topic:' + t.id, title: t.name, text: t.tip }] : [];
    },

    /** Table rows for a verb: [['ich','wohne'], ['du','wohnst'], ...] */
    verbRows(inf) {
      const v = this.verbs[inf];
      return v ? PRONOUNS.map((p, i) => [p, v.forms[i]]) : null;
    },

    /** True when a and b are different members of the same word family (e.g. wohnt/wohne). */
    sameFamily(a, b) {
      const fa = this._familyIndex.get(norm(a));
      const fb = this._familyIndex.get(norm(b));
      if (!fa || !fb) return false;
      for (const id of fa) if (fb.has(id)) return true;
      return false;
    },

    _familyIndex: new Map(),

    _buildFamilies() {
      const idx = new Map();
      const add = (words, id) => {
        for (const w of words) {
          if (!w) continue;
          const k = norm(w);
          if (!idx.has(k)) idx.set(k, new Set());
          idx.get(k).add(id);
        }
      };
      this.families.forEach((f, i) => add(f, 'f' + i));
      for (const v of Object.values(this.verbs)) {
        const forms = (v.forms || []).concat(v.prt || []);
        // separable forms ("kaufe ein", "fing an"): the conjugated part alone is a member too
        add([v.inf, v.pp, ...forms, ...forms.map((f) => f.split(' ')[0])], 'v:' + v.inf);
      }
      this._familyIndex = idx;
    },

    finalize() {
      this._buildFamilies();
      this.cards = [];
      this.cardMap = Object.create(null);
      this.problems = [];
      const seen = new Set();
      for (const c of this.rawCards) {
        const errs = [];
        if (!c.id) errs.push('missing id');
        else if (seen.has(c.id)) errs.push('duplicate id');
        if (!this.topicMap[c.topic]) errs.push(`unknown topic "${c.topic}"`);
        const type = B.ex && B.ex.get(c.type);
        if (!type) errs.push(`unknown type "${c.type}"`);
        else if (type.validate) errs.push(...type.validate(c, this));
        if (errs.length) {
          this.problems.push({ id: c.id || '(no id)', errors: errs });
          continue;
        }
        seen.add(c.id);
        this.cards.push(c);
        this.cardMap[c.id] = c;
      }
      // easier copies of some cards, one per difficulty level (js/core/level.js)
      if (B.level) {
        for (const v of B.level.variants(this.cards.slice(), this)) {
          const errs = seen.has(v.id) ? ['duplicate id'] : B.ex.get(v.type).validate(v, this);
          if (errs.length) {
            this.problems.push({ id: v.id, errors: errs.map((e) => 'copy: ' + e) });
            continue;
          }
          seen.add(v.id);
          this.cards.push(v);
          this.cardMap[v.id] = v;
        }
      }
      if (this.problems.length && typeof console !== 'undefined') {
        console.warn(`[Brezel] ${this.problems.length} card(s) skipped:`, this.problems);
      }
      return this;
    },

    /** Is the card in this topic? A collecting topic (Rules) holds every card with its flag. */
    inTopic(card, topicId) {
      if (card.topic === topicId) return true;
      const t = this.topicMap[topicId];
      return !!(t && t.collects && card[t.collects]);
    },

    byTopic(topicId) {
      return this.cards.filter((c) => this.inTopic(c, topicId));
    },
  };

  B.deck = deck;
})();

</script>
  <script>/* js/core/check.js */
/*
 * Typed-answer checking.
 * Rule: one wrong letter is forgiven (a typo) — two is wrong.
 * Exceptions, so the typo rule never accepts wrong grammar:
 *   - if the "typo" is actually another real form of the same word
 *     (wohne vs wohnt, dem vs den, meine vs meiner) it counts as wrong;
 *   - short words (3 letters or less, e.g. "ist", "dem", "im") must be exact,
 *     on their own or inside a longer answer.
 * Umlauts may be typed as ae/oe/ue and ß as ss.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm, levenshtein } = B.util;

  /** The one word that differs between two normalised answers, if exactly one does. */
  function diffWord(input, answer) {
    const x = input.split(' ');
    const y = answer.split(' ');
    if (x.length !== y.length) return null;
    const diff = [];
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) diff.push(i);
    return diff.length === 1 ? { got: x[diff[0]], want: y[diff[0]] } : null;
  }

  /** Would the single-letter difference between a and b change the grammar? */
  function isOtherForm(input, answer) {
    const d = diffWord(input, answer);
    return !!d && B.deck.sameFamily(d.got, d.want);
  }

  /**
   * @param {string} input   what the learner typed
   * @param {string[]} answers accepted answers (first = the one we show)
   * @param {{reject?: string[], strict?: boolean, nounHint?: boolean}} opts
   * @returns {{ok:boolean, exact?:boolean, typo?:boolean, reason?:string, matched:string, caseNote?:string}}
   */
  function typed(input, answers, opts = {}) {
    const raw = String(input == null ? '' : input).trim();
    const ni = norm(raw);
    const list = answers.map((a) => ({ raw: a, n: norm(a) }));
    const fallback = list[0] ? list[0].raw : '';
    if (!ni) return { ok: false, empty: true, matched: fallback };

    for (const a of list) {
      if (a.n === ni) return { ok: true, exact: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
    }

    const reject = new Set((opts.reject || []).map(norm));
    if (reject.has(ni)) return { ok: false, reason: 'form', matched: fallback };

    if (!opts.strict) {
      for (const a of list) {
        if (a.n.length <= 3) continue;
        if (levenshtein(ni, a.n) !== 1) continue;
        if (isOtherForm(ni, a.n)) return { ok: false, reason: 'form', matched: a.raw };
        // inside a longer answer, a slip in a tiny word (ist/bin, im/in) is not a typo either
        const d = diffWord(ni, a.n);
        if (d && d.want.length <= 3) return { ok: false, reason: 'short', matched: a.raw };
        return { ok: true, typo: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
      }
    }
    return { ok: false, matched: fallback };
  }

  /** Nouns (and formal Sie) are capitalised in German — remind gently when the learner didn't. */
  function caseNote(raw, answer, opts) {
    if (/\sSie\b/.test(answer) && /\ssie\b/.test(raw)) return 'Tip: formal **Sie** (you) is always written with a capital S.';
    if (!opts.nounHint) return null;
    const a = answer.trim();
    const first = a.charAt(0);
    if (first && first === first.toUpperCase() && first !== first.toLowerCase() && raw.charAt(0) === raw.charAt(0).toLowerCase()) {
      return `Remember: German nouns start with a capital letter — **${a}**.`;
    }
    return null;
  }

  B.check = { typed, isOtherForm };
})();

</script>
  <script>/* js/core/srs.js */
/*
 * Spaced repetition. A card is mastered the first time it is answered right; then it comes back
 * for review on its due day. Each right answer on a due card moves it one step up, so it comes
 * back later:
 *
 *   step    1    2    3    4    5    6
 *   days    1    3    7   14   30   90
 *
 * A wrong answer moves a mastered card two steps down (not below 1) and keeps it due today.
 * Once it is right again it comes back tomorrow, then climbs from that step.
 * Days are calendar days (days since 1 Jan 1970, local time), so a card is due from the morning.
 * Saved per card in Brezel.store: lv = step, due = day number, bad = 1 after a wrong answer.
 */
(function () {
  'use strict';
  const B = window.Brezel;

  const DAYS = [0, 1, 3, 7, 14, 30, 90]; // index = step
  const MAX = DAYS.length - 1;
  const DROP = 2; // steps lost by a wrong answer
  const PER_DAY = 25; // at most this many old cards fall due on one day when schedules are first added

  /** The calendar day of a time, as a number. */
  function day(t = Date.now()) {
    const d = new Date(t);
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  /** A mastered card that is due on or before that day. */
  const isDue = (s, today) => !!(s && s.done && (s.due == null || s.due <= today));

  /**
   * The new schedule after an answer: { lv, due, bad }, or null if nothing changes.
   * s = the card's saved state before this answer ({} for a card never answered).
   */
  function next(s, ok, today) {
    if (!s.done) return ok ? { lv: 1, due: today + DAYS[1], bad: 0 } : null;
    const lv = s.lv || 1;
    if (!ok) return { lv: Math.max(1, lv - DROP), due: today, bad: 1 };
    if (s.bad) return { lv, due: today + DAYS[1], bad: 0 };
    if (s.due > today) return null; // not due yet: an early extra answer changes nothing
    const up = Math.min(MAX, lv + 1);
    return { lv: up, due: today + DAYS[up], bad: 0 };
  }

  /**
   * Give cards mastered before spaced repetition existed a schedule. A card right on the first
   * try starts at step 2. Cards that would already be due are spread over the next days
   * (oldest first, at most PER_DAY a day), so they don't all come back at once.
   * Returns the number of cards changed.
   */
  function migrate(cards, today) {
    const old = Object.values(cards).filter((s) => s && s.done && s.lv == null);
    const late = [];
    for (const s of old) {
      s.lv = s.first === 1 ? 2 : 1;
      s.due = day(s.d || Date.now()) + DAYS[s.lv];
      if (s.due < today) late.push(s);
    }
    late.sort((a, b) => (a.d || 0) - (b.d || 0));
    const per = Math.max(PER_DAY, Math.ceil(late.length / 14));
    late.forEach((s, i) => (s.due = today + Math.floor(i / per)));
    return old.length;
  }

  /** "today", "tomorrow", "in 3 days", "in 2 weeks", "in a month", "in 3 months". */
  function when(due, today) {
    const n = due - today;
    if (n <= 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n < 14) return `in ${n} days`;
    if (n < 28) return `in ${Math.round(n / 7)} weeks`;
    const m = Math.round(n / 30);
    return m === 1 ? 'in a month' : `in ${m} months`;
  }

  /** How well a card is remembered, by step: 1–2 learning, 3–4 getting solid, 5–6 solid. */
  const GROUPS = [
    { key: 'learning', label: 'Learning', sub: 'steps 1–2: back within days', icon: '🌱', steps: [1, 2] },
    { key: 'growing', label: 'Getting solid', sub: 'steps 3–4: back in 1–2 weeks', icon: '🌿', steps: [3, 4] },
    { key: 'solid', label: 'Solid', sub: 'steps 5–6: back in 1–3 months', icon: '🌳', steps: [5, 6] },
  ];
  const group = (lv) => GROUPS.find((g) => g.steps.includes(lv || 1));

  B.srs = { DAYS, MAX, GROUPS, day, isDue, next, migrate, when, group };
})();

</script>
  <script>/* js/core/level.js */
/*
 * Difficulty. Every card is Low (1), Medium (2) or High (3):
 *   - a card may say so itself: { level: 2 } (the Verb list does: Präsens 1, Präteritum 2, Perfekt 3);
 *   - otherwise the level comes from what the card asks you to do (auto() below):
 *       recognise (true/false, multiple choice, small match)        → Low
 *       arrange with help (gaps with chips, sort, spot, short order) → Medium
 *       produce from memory (typing, tables, long sentences)         → High
 * Some cards are split into easier copies, so each level has its own version (variants()):
 *   - a typed card with a one-word answer gets a Low multiple-choice copy (id "pr-04~1"); its wrong
 *     options are other real forms of the same word from data/lexicon.js (liest → lese, lest, lesen);
 *   - a typed full sentence gets a Medium sentence-builder copy (id "pa-64~2").
 * A copy has its own progress and reviews. A session never shows a card and its copy together.
 * The session setting is low | medium | high | mixed (mixed = every level).
 * Add { split: false } to a card that should never get a copy.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm, show, levenshtein, splitSentence } = B.util;

  const SETTINGS = [
    { key: 'low', n: 1, name: 'Low', sub: 'Recognise' },
    { key: 'medium', n: 2, name: 'Medium', sub: 'Build' },
    { key: 'high', n: 3, name: 'High', sub: 'Produce' },
    { key: 'mixed', n: 0, name: 'Mixed', sub: 'Everything' },
  ];
  const NAMES = { 1: 'Low', 2: 'Medium', 3: 'High' };

  const words = (s) => splitSentence(show(String(s || '').replace(/\{[^}]*\}/g, 'x'))).words.length;
  const asList = (x) => (Array.isArray(x) ? x : x == null ? [] : [x]);
  const gapCount = (q) => (String(q).match(/\{[^}]+\}/g) || []).length;

  /** The level a card would get from its exercise type and size. */
  function auto(c) {
    switch (c.type) {
      case 'tf':
        return 1;
      case 'mc': {
        const opts = [c.correct, ...(c.wrong || [])];
        // full-sentence options need careful reading
        return opts.some((o) => words(o) >= 5) || opts.length >= 5 ? 2 : 1;
      }
      case 'match':
        return c.pairs.length <= 4 ? 1 : 2;
      case 'gap': {
        const gaps = gapCount(c.q);
        const chips = gaps + asList(c.options).length;
        if (gaps <= 1 && chips <= 3) return 1;
        return gaps >= 3 || chips >= 7 ? 3 : 2;
      }
      case 'sort': {
        const items = c.buckets.reduce((n, b) => n + b.items.length, 0);
        return items > 9 ? 3 : 2;
      }
      case 'spot':
        return 2;
      case 'order': {
        const n = words(c.answer) - (c.start ? words(c.start) : 0);
        const extra = asList(c.extra).length;
        if (n <= 4 && !extra) return 1;
        return n >= 8 || extra >= 2 || n + extra >= 9 ? 3 : 2;
      }
      case 'type': {
        const a = asList(c.answer)[0];
        return 3;
      }
      case 'table':
        return 3;
      default:
        return 2;
    }
  }

  /** 1 | 2 | 3 */
  function of(card) {
    const n = Number(card && card.level);
    return n === 1 || n === 2 || n === 3 ? n : card && card._auto ? card._auto : auto(card);
  }

  /** Does the card belong to the session setting (low | medium | high | mixed)? */
  function fits(card, setting) {
    const s = SETTINGS.find((x) => x.key === setting);
    return !s || !s.n || of(card) === s.n;
  }

  // --- easier copies ------------------------------------------------------------------------------
  const PRONOUNS = new Set(['ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr']);
  const W_WORDS = new Set(['wo', 'wer', 'wie', 'was', 'wann', 'woher', 'wohin', 'welche', 'welcher', 'welches', 'welchen', 'welchem']);

  /** Other real forms of the same word (closest first), never one of the accepted answers. */
  function distractors(card, deck, pool) {
    const answers = asList(card.answer);
    const a = answers[0];
    const na = norm(a);
    const taken = new Set(answers.map(norm));
    const out = [];
    const add = (x) => {
      const n = norm(x);
      if (!x || !n || taken.has(n)) return;
      taken.add(n);
      out.push(show(x));
    };
    // 1. the card's own list of tempting wrong answers
    asList(card.reject).forEach(add);
    // 2. other forms of the same verb: the same tense first
    for (const v of Object.values(deck.verbs)) {
      const groups = [v.forms || [], v.prt || [], [v.pp, v.inf]];
      const gi = groups.findIndex((g) => g.some((f) => f && norm(f) === na));
      if (gi < 0) continue;
      const rank = (f) => levenshtein(norm(f), na);
      groups[gi].filter(Boolean).slice().sort((x, y) => rank(x) - rank(y)).forEach(add);
      groups.filter((_, i) => i !== gi).flat().filter(Boolean).sort((x, y) => rank(x) - rank(y)).forEach(add);
      break;
    }
    // 3. word families (dem / den / der …), except where another member could also be right.
    //    A translation only takes them when the plural is asked for (Besprechung / Besprechungen).
    const translation = /^translate/i.test(card.prompt || '');
    if (out.length < 3 && !PRONOUNS.has(na) && !W_WORDS.has(na) && (!translation || /plural/i.test(card.prompt))) {
      for (const fam of deck.families) {
        if (!fam.some((w) => norm(w) === na)) continue;
        let members = fam.filter((w) => norm(w) !== na);
        // in / im / ins vs an / am / ans: "am Kino" might also be right, so stay with the same preposition
        if (fam.includes('ins')) members = members.filter((w) => w[0] === a[0].toLowerCase());
        // reflexive pronouns: the Dativ (mir, dir) isn't taught yet
        if (fam.includes('mich') && !['mir', 'dir'].includes(na)) members = members.filter((w) => w !== 'mir' && w !== 'dir');
        members.sort((x, y) => levenshtein(norm(x), na) - levenshtein(norm(y), na)).forEach(add);
      }
    }
    // 4. a translation card: the answers of other translation cards of the topic
    if (out.length < 3 && pool && translation) {
      pool.filter((o) => o !== card && o.rule === card.rule).concat(pool.filter((o) => o !== card && o.rule !== card.rule))
        .map((o) => asList(o.answer)[0]).forEach(add);
    }
    return out.slice(0, 3);
  }

  /** A typed card turned into multiple choice (Low). */
  function choiceCopy(c, deck, pool) {
    if (words(asList(c.answer)[0]) > 2) return null;
    const wrong = distractors(c, deck, pool);
    if (wrong.length < 2) return null;
    const copy = Object.assign({}, c, {
      id: c.id + '~1',
      type: 'mc',
      level: 1,
      variantOf: c.id,
      prompt: String(c.prompt || 'Choose the answer').replace(/^(Type|Write)\b/, 'Choose'),
      correct: show(asList(c.answer)[0]),
      wrong,
    });
    for (const k of ['answer', 'reject', 'strict', 'placeholder', 'sayAnswer']) delete copy[k];
    return copy;
  }

  /** A typed full sentence turned into a sentence builder (Medium). */
  function orderCopy(c) {
    const answers = asList(c.answer);
    if (words(answers[0]) < 3) return null;
    const copy = Object.assign({}, c, {
      id: c.id + '~2',
      type: 'order',
      level: 2,
      variantOf: c.id,
      answer: answers[0],
      answers: answers.slice(1),
    });
    for (const k of ['reject', 'strict', 'placeholder', 'hint']) delete copy[k];
    if (c.hint) copy.prompt = (c.prompt || 'Build the sentence') + ` (${c.hint})`;
    return copy;
  }

  /**
   * Easier copies of typed cards (called by deck.finalize() with the valid cards).
   * The original moves up a level if its copy now takes its place.
   */
  function variants(cards, deck) {
    const out = [];
    const byTopic = {};
    for (const c of cards) (byTopic[c.topic] = byTopic[c.topic] || []).push(c);
    for (const c of cards) {
      c._auto = auto(c);
      // a card with its own level (e.g. the Verb list) is already where its author wants it
      if (c.type !== 'type' || c.split === false || c.variantOf || c.level) continue;
      const pool = byTopic[c.topic].filter((o) => o.type === 'type' && words(asList(o.answer)[0]) <= 2 && !!o.noun === !!c.noun);
      const copy = choiceCopy(c, deck, pool) || orderCopy(c);
      if (!copy) continue;
      out.push(copy);
      if (of(c) <= copy.level) c._auto = Math.min(3, copy.level + 1);
    }
    for (const c of out) c._auto = c.level;
    return out;
  }

  /** The family id of a card and its copies. */
  const base = (card) => card.variantOf || card.id;

  B.level = { SETTINGS, NAMES, auto, of, fits, variants, distractors, base, name: (n) => NAMES[n] || '' };
})();

  <script>/* js/core/store.js */
/*
 * Progress persistence (localStorage). Everything is keyed by card id, so
 * adding new cards later keeps all existing progress.
 *
 * cards[id] = { a: attempts, w: wrong attempts, done: bool, first: 1|0 (first attempt right?),
 *               lw: last wrong answer given, d: time it was mastered,
 *               lv, due, bad: the review schedule (js/core/srs.js) }
 * log      = every answer: { id, ok, t, ms, s: session id, p: practice?1:0 }
 * sessions = { id, start, end, answered, correct, wrong, mastered, xp, practice,
 *              level (low|medium|high|mixed), size, total, hints, skips, reviewed, fixed, bestCombo, quit }
 *            log entries also carry h (Help me hints used) and r (1 = a review of a mastered card)
 * games    = every finished minigame: { game, topic, level (1–3), score, correct, wrong, won, perfect, ms, xp, bestCombo, at }
 * ach      = achievements earned: { id: time } (js/core/achievements.js)
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const KEY = 'brezel.progress.v1';

  const fresh = () => ({
    v: 1,
    createdAt: Date.now(),
    cards: {},
    log: [],
    sessions: [],
    xp: 0,
    streak: { count: 0, last: null, best: 0 },
    bestCombo: 0,
    games: [],
    ach: {},
    settings: { sound: true, size: 20, topic: 'all', theme: 'auto', level: 'mixed' },
  });

  let state = fresh();
  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const base = fresh();
        state = Object.assign(base, parsed, {
          settings: Object.assign(base.settings, parsed.settings || {}),
          streak: Object.assign(base.streak, parsed.streak || {}),
        });
        // progress from before spaced repetition: give mastered cards a review schedule
        if (B.srs.migrate(state.cards, B.srs.day())) save();
      }
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not load progress', e);
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not save progress', e);
    }
  }

  const cardState = (id) => state.cards[id] || null;
  const isDone = (id) => !!(state.cards[id] && state.cards[id].done);

  function touchStreak() {
    const today = B.util.dayKey();
    const s = state.streak;
    if (s.last === today) return;
    const y = new Date();
    y.setDate(y.getDate() - 1);
    s.count = s.last === B.util.dayKey(y) ? s.count + 1 : 1;
    s.last = today;
    s.best = Math.max(s.best || 0, s.count);
  }

  /** extra: { level, size, total } of the new session. */
  function beginSession(practice, extra) {
    const rec = Object.assign({
      id: (state.sessions.length ? state.sessions[state.sessions.length - 1].id : 0) + 1,
      start: Date.now(),
      end: null,
      answered: 0,
      correct: 0,
      wrong: 0,
      mastered: 0,
      xp: 0,
      practice: !!practice,
      hints: 0,
      skips: 0,
      reviewed: 0,
      fixed: 0,
    }, extra || {});
    state.sessions.push(rec);
    save();
    return rec;
  }

  function currentSession() {
    return state.sessions[state.sessions.length - 1];
  }

  /** Record one answer. Returns {newlyDone, due?} — due: the next review day, if the schedule changed. */
  function record(card, ok, given, ms, { practice = false, xp = 0, hints = 0, skipped = false } = {}) {
    const sess = currentSession();
    const before = state.cards[card.id];
    const review = !practice && !!(before && before.done);
    const entry = { id: card.id, ok: ok ? 1 : 0, t: Date.now(), ms: Math.round(ms || 0), s: sess ? sess.id : 0, p: practice ? 1 : 0 };
    if (hints) entry.h = hints;
    if (review) entry.r = 1;
    state.log.push(entry);
    touchStreak();
    state.xp += xp;
    if (sess) {
      sess.answered++;
      sess[ok ? 'correct' : 'wrong']++;
      sess.xp += xp;
      sess.hints = (sess.hints || 0) + (hints || 0);
      if (skipped) sess.skips = (sess.skips || 0) + 1;
      if (review && ok) sess.reviewed = (sess.reviewed || 0) + 1;
      sess.end = Date.now();
    }
    let newlyDone = false;
    let due = null;
    if (!practice) {
      const c = (state.cards[card.id] = state.cards[card.id] || { a: 0, w: 0, done: false, first: null });
      const plan = B.srs.next(c, ok, B.srs.day());
      if (plan) {
        c.lv = plan.lv;
        c.due = due = plan.due;
        if (plan.bad) c.bad = 1;
        else delete c.bad;
      }
      c.a++;
      if (c.first === null) c.first = ok ? 1 : 0;
      if (ok) {
        if (!c.done) {
          newlyDone = true;
          if (sess) sess.mastered++;
          c.d = Date.now();
        }
        c.done = true;
      } else {
        c.w++;
        c.lw = String(given == null ? '' : given).slice(0, 200);
      }
    }
    save();
    return { newlyDone, due };
  }

  function endSession(extra) {
    const sess = currentSession();
    if (sess) {
      sess.end = Date.now();
      Object.assign(sess, extra || {});
      // Drop sessions where nothing was answered — they add noise to the history.
      if (!sess.answered) state.sessions.pop();
    }
    save();
  }

  /** A finished minigame: saved with its XP. Games never change card progress. */
  function recordGame(rec) {
    const g = Object.assign({ at: Date.now() }, rec);
    (state.games = state.games || []).push(g);
    state.xp += g.xp || 0;
    touchStreak();
    save();
    return g;
  }

  function setBestCombo(n) {
    if (n > (state.bestCombo || 0)) {
      state.bestCombo = n;
      save();
    }
  }

  function setting(key, value) {
    if (value === undefined) return state.settings[key];
    state.settings[key] = value;
    save();
    return value;
  }

  function reset() {
    const settings = state.settings;
    state = fresh();
    state.settings = settings;
    save();
  }

  B.store = {
    load, save, reset, cardState, isDone, beginSession, record, recordGame, endSession, setBestCombo, setting,
    get state() { return state; },
    get storageOk() { return storageOk; },
  };
})();

  <script>/* js/core/stats.js */
/*
 * Progress statistics, computed from the deck + saved progress.
 * Used by the home screen, the session summary and the review report.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { pct } = B.util;

  const STRONG = 85; // first-try accuracy (%) for "Strong"
  const OKAY = 65; // … for "Getting there"
  const MIN_CARDS = 3; // attempted cards needed before we judge an area
  const MAX_MS = 120000; // cap each answer's time so an idle tab doesn't count

  function status(p, attempted) {
    if (attempted < MIN_CARDS) return { key: 'none', icon: '·', label: 'Not enough data yet' };
    if (p >= STRONG) return { key: 'good', icon: '✓', label: 'Strong' };
    if (p >= OKAY) return { key: 'warn', icon: '!', label: 'Getting there' };
    return { key: 'bad', icon: '✗', label: 'Needs work' };
  }

  /** Aggregate a list of cards. first = right on the very first try; retry = mastered later; due = to review today. */
  function summarize(cards) {
    let done = 0, first = 0, retry = 0, attempted = 0, wrong = 0, answers = 0, stillWrong = 0, due = 0;
    const today = B.srs.day();
    for (const c of cards) {
      const s = B.store.cardState(c.id);
      if (!s || !s.a) continue;
      attempted++;
      answers += s.a;
      wrong += s.w;
      if (s.done) {
        done++;
        if (s.first === 1) first++;
        else retry++;
        if (B.srs.isDue(s, today)) due++;
      } else stillWrong++;
    }
    const firstPct = pct(first, attempted);
    return {
      total: cards.length,
      done,
      first,
      retry,
      stillWrong,
      due,
      unseen: cards.length - attempted,
      notDone: cards.length - done,
      attempted,
      answers,
      wrong,
      firstPct,
      accuracy: pct(answers - wrong, answers),
      status: status(firstPct, attempted),
    };
  }

  function overview() {
    const st = B.store.state;
    const all = summarize(B.deck.cards);
    const timeMs = st.log.reduce((sum, l) => sum + Math.min(l.ms || 0, MAX_MS), 0);
    return Object.assign(all, {
      timeMs,
      sessions: st.sessions.length,
      xp: st.xp,
      streak: st.streak,
      bestCombo: st.bestCombo || 0,
      mistakes: mistakeCards().length,
      complete: B.deck.cards.length > 0 && all.done === B.deck.cards.length,
    });
  }

  const byTopic = () => B.deck.topics.map((t) => Object.assign({ topic: t }, summarize(B.deck.byTopic(t.id))));

  function byType() {
    const groups = {};
    for (const c of B.deck.cards) (groups[c.type] = groups[c.type] || []).push(c);
    return Object.entries(groups).map(([type, cards]) => Object.assign({ type, label: B.ex.label(type) }, summarize(cards)));
  }

  /** Answer accuracy per session (oldest first), practice sessions included but flagged. */
  function sessions(limit = 30) {
    return B.store.state.sessions
      .filter((s) => s.answered > 0)
      .slice(-limit)
      .map((s) => ({
        id: s.id,
        start: s.start,
        answered: s.answered,
        correct: s.correct,
        wrong: s.wrong,
        accuracy: pct(s.correct, s.answered),
        practice: !!s.practice,
      }));
  }

  /** Cards answered wrong at least once. */
  function mistakeCards() {
    return B.deck.cards.filter((c) => {
      const s = B.store.cardState(c.id);
      return s && s.w > 0;
    });
  }

  /** The most-missed cards, worst first. */
  function missed(limit = 10) {
    return mistakeCards()
      .map((card) => ({ card, state: B.store.cardState(card.id) }))
      .sort((a, b) => b.state.w - a.state.w || (a.state.done ? 1 : 0) - (b.state.done ? 1 : 0) || b.state.a - a.state.a)
      .slice(0, limit);
  }

  /** Topic ('all' = every topic) and difficulty setting (low | medium | high | mixed; none = every level). */
  const inTopic = (c, topic, level) => (topic === 'all' || !topic || B.deck.inTopic(c, topic)) && (!level || B.level.fits(c, level));

  /** Cards never mastered. */
  const fresh = (topic, level) => B.deck.cards.filter((c) => inTopic(c, topic, level) && !B.store.isDone(c.id));

  /** Mastered cards due for review today (or overdue). */
  function due(topic, level) {
    const today = B.srs.day();
    return B.deck.cards.filter((c) => inTopic(c, topic, level) && B.srs.isDue(B.store.cardState(c.id), today));
  }

  /** Everything a session can show now: reviews that are due, then new cards. */
  const pending = (topic, level) => due(topic, level).concat(fresh(topic, level));

  /** The earliest review day of the topic's mastered cards, or null if none is mastered. */
  function nextDue(topic, level) {
    let min = null;
    for (const c of B.deck.cards) {
      const s = B.store.cardState(c.id);
      if (inTopic(c, topic, level) && s && s.done && s.due != null && (min === null || s.due < min)) min = s.due;
    }
    return min;
  }

  /** Mastered cards per memory group (srs.GROUPS), and reviews due on each of the next `days` days. */
  function memory(days = 7) {
    const today = B.srs.day();
    const groups = B.srs.GROUPS.map((g) => ({ group: g, count: 0 }));
    const ahead = Array.from({ length: days }, (_, i) => ({ day: today + i, count: 0 }));
    for (const c of B.deck.cards) {
      const s = B.store.cardState(c.id);
      if (!s || !s.done) continue;
      groups[B.srs.GROUPS.indexOf(B.srs.group(s.lv))].count++;
      const i = Math.max(0, (s.due == null ? today : s.due) - today); // overdue counts as today
      if (i < days) ahead[i].count++;
    }
    return { groups, ahead };
  }

  B.stats = { STRONG, OKAY, MIN_CARDS, status, summarize, overview, byTopic, byType, sessions, missed, mistakeCards, fresh, due, pending, nextDue, memory };
})();

 *
 *   Brezel.achievements.list        [{ id, name (German), en (English subtitle), desc (how to earn it),
 *                                       color, icon (SVG string, viewBox 0 0 64 64),
 *                                       check(snap) -> bool, progress?(snap) -> [current, goal] }]
 *   Brezel.achievements.snapshot()  the facts check() and progress() read (see below)
 *   Brezel.achievements.evaluate({ silent })
 *                                    unlocks every achievement whose check() is now true, saves it in
 *                                    Brezel.store.state.ach = { id: timestamp } and, unless silent, celebrates it
 *                                    (Brezel.ui.celebrateAchievements, js/ui/achievements.js). Returns the new ones.
 *                                    Cheap enough to call after every answer: the answer log is read incrementally.
 *   Brezel.achievements.init()      once at start-up: unlocks silently what earlier progress already earned,
 *                                    with one toast if there was anything.
 *   Brezel.achievements.isUnlocked(id), unlockedAt(id), count() -> { unlocked, total }

  // --- facts ------------------------------------------------------------------------------------
  const n = (x) => Number(x) || 0;

  /** The answer log is append-only, so it is read incrementally (a reset or reload starts over). */
  let scan = null;
  function scanLog(log) {
    if (!scan || scan.log !== log || log.length < scan.seen) {
      scan = { log, seen: 0, reviews: new Set(), fixed: new Set(), hints: 0, early: false, owl: false, run: 0, runSession: null, bestRun: 0 };
    }
    for (let i = scan.seen; i < log.length; i++) {
      const l = log[i];
      if (!l) continue;
      const hr = new Date(l.t).getHours();
      if (hr >= 4 && hr < 8) scan.early = true;
      if (hr >= 22 || hr < 4) scan.owl = true;
      if (l.r && !l.p) scan.reviews.add(l.s + ':' + l.id);
      if (l.p && l.ok) scan.fixed.add(l.s + ':' + l.id);
      if (l.h) scan.hints += n(l.h);
      if (l.s !== scan.runSession) {
        scan.run = 0;
        scan.runSession = l.s;
      }
      scan.run = l.ok ? scan.run + 1 : 0;
      if (scan.run > scan.bestRun) scan.bestRun = scan.run;
    }
    scan.seen = log.length;
    return scan;
  }

  /** Which cards are in which topic (a collecting topic such as Rules included); kept until the deck changes. */
  let members = null;
  function membership() {
    const cards = B.deck.cards;
    if (members && members.cards === cards && members.n === cards.length && members.topics === B.deck.topics.length) return members.map;
    const map = {};
    for (const t of B.deck.topics) map[t.id] = [];
    for (const c of cards) for (const t of B.deck.topics) if (B.deck.inTopic(c, t.id)) map[t.id].push(c.id);
    members = { cards, n: cards.length, topics: B.deck.topics.length, map };
    return map;
  }

  /**
   * Everything the checks read:
   * { done, total, topStep, topics: { id: {done, total} }, bestTopic: {id, done, total}, xp, bestStreak, bestCombo,
   *   reviews, early, owl, helped, flawless, solo, high, snack, fixed,
   *   games, gameKinds, bossWon, perfectGame, hoerBest, schereBest }
   */
  function snapshot() {
    const st = (B.store && B.store.state) || {};
    const cards = st.cards || {};
    const deck = (B.deck && B.deck.cards) || [];

    let done = 0;
    let topStep = 0;
    for (const c of deck) {
      const s = cards[c.id];
      if (s && s.done) {
        done++;
        topStep = Math.max(topStep, n(s.lv));
      }
    }

    const topics = {};
    let bestTopic = null;
    const map = membership();
    for (const t of B.deck.topics) {
      const ids = map[t.id] || [];
      let d = 0;
      for (const id of ids) if (cards[id] && cards[id].done) d++;
      topics[t.id] = { done: d, total: ids.length };
      if (ids.length && (!bestTopic || d / ids.length > bestTopic.done / bestTopic.total)) bestTopic = { id: t.id, done: d, total: ids.length };
    }

    const log = scanLog(st.log || []);

    let helped = log.hints > 0;
    let bestCombo = Math.max(n(st.bestCombo), log.bestRun);
    let flawless = false;
    let solo = false;
    let high = false;
    let snack = false;
    let fixed = 0;
    for (const s of st.sessions || []) {
      if (!s) continue;
      if (n(s.hints) > 0) helped = true;
      bestCombo = Math.max(bestCombo, n(s.bestCombo));
      // finished = the summary was reached (endSession wrote quit: false); a closed tab leaves it undefined
      if (s.quit !== false || n(s.answered) === 0) continue;
      const big = (n(s.total) || n(s.answered)) >= 10;
      if (big && n(s.wrong) === 0) flawless = true;
      if (big && s.hints != null && s.skips != null && n(s.hints) === 0 && n(s.skips) === 0) solo = true;
      if (s.level === 'high' && !s.practice) high = true;
      if (n(s.size) === 5) snack = true;
      if (s.practice) fixed += n(s.fixed);
    }
    fixed = Math.max(fixed, log.fixed.size);

    const games = (st.games || []).filter(Boolean);
    const kinds = new Set();
    let bossWon = false;
    let perfectGame = false;
    let hoerBest = 0;
    let schereBest = 0;
    for (const g of games) {
      kinds.add(g.game);
      if (g.game === 'boss' && g.won === true) bossWon = true;
      if (g.perfect === true || (n(g.wrong) === 0 && n(g.correct) > 0)) perfectGame = true;
      if (g.game === 'hoer') hoerBest = Math.max(hoerBest, n(g.correct));
      if (g.game === 'schere') schereBest = Math.max(schereBest, n(g.correct));
    }

    const sk = st.streak || {};
    return {
      done,
      total: deck.length,
      topStep,
      topics,
      bestTopic,
      xp: n(st.xp),
      bestStreak: Math.max(n(sk.best), n(sk.count)),
      bestCombo,
      reviews: log.reviews.size,
      early: log.early,
      owl: log.owl,
      helped,
      flawless,
      solo,
      high,
      snack,
      fixed,
      games: games.length,
      gameKinds: kinds.size,
      bossWon,
      perfectGame,
      hoerBest,
      schereBest,
    };
  }

  // --- definitions ------------------------------------------------------------------------------
  const topicOf = (s, id) => s.topics[id] || { done: 0, total: 0 };
  /** "Master N cards of a topic" — the goal shrinks if the topic has fewer cards. */
  const topicGoal = (id, goal) => ({
    check: (s) => topicOf(s, id).total > 0 && topicOf(s, id).done >= Math.min(goal, topicOf(s, id).total),
    progress: (s) => [topicOf(s, id).done, Math.min(goal, topicOf(s, id).total) || goal],
  });
  const atLeast = (key, goal) => ({ check: (s) => s[key] >= goal, progress: (s) => [s[key], goal] });
  const flag = (key) => ({ check: (s) => !!s[key] });

  const DEFS = [
    // learning
    { id: 'first', name: 'Erster Schritt', en: 'First step', desc: 'Master your first card.', color: '#58cc02', ...atLeast('done', 1) },
    { id: 'm25', name: 'Fünfundzwanzig', en: 'A good start', desc: 'Master 25 cards.', color: '#00b3a1', ...atLeast('done', 25) },
    { id: 'm100', name: 'Hundertprozentig', en: 'A hundred cards', desc: 'Master 100 cards.', color: '#1cb0f6', ...atLeast('done', 100) },
    { id: 'm250', name: 'Vierteltausend', en: 'A quarter of a thousand', desc: 'Master 250 cards.', color: '#4f6bff', ...atLeast('done', 250) },
    {
      id: 'half', name: 'Halbzeit', en: 'Half-time', desc: 'Master half of all the cards in the app.', color: '#ff9600',
      check: (s) => s.total > 0 && s.done >= Math.ceil(s.total / 2),
      progress: (s) => [s.done, Math.max(1, Math.ceil(s.total / 2))],
    },
    {
      id: 'all', name: 'Alles fertig!', en: 'The whole deck', desc: 'Master every single card.', color: '#ffc800',
      check: (s) => s.total > 0 && s.done >= s.total,
      progress: (s) => [s.done, Math.max(1, s.total)],
    },
    // streaks
    { id: 'streak3', name: 'Dranbleiben', en: 'Keep at it', desc: 'Learn three days in a row.', color: '#ff7a1a', ...atLeast('bestStreak', 3) },
    { id: 'streak7', name: 'Eine ganze Woche', en: 'A whole week', desc: 'Learn seven days in a row.', color: '#ff4b4b', ...atLeast('bestStreak', 7) },
    { id: 'streak30', name: 'Eiserner Wille', en: 'Iron will', desc: 'Learn 30 days in a row.', color: '#7c3aed', ...atLeast('bestStreak', 30) },
    // skill
    { id: 'combo10', name: 'Heiße Serie', en: 'Hot streak', desc: 'Get 10 cards right in a row in one session.', color: '#ff3d71', ...atLeast('bestCombo', 10) },
    { id: 'combo25', name: 'Unaufhaltsam', en: 'Unstoppable', desc: 'Get 25 cards right in a row in one session.', color: '#1e3a8a', ...atLeast('bestCombo', 25) },
    { id: 'flawless', name: 'Fehlerfrei', en: 'Flawless', desc: 'Finish a session of 10 or more cards without a single mistake.', color: '#06b6d4', ...flag('flawless') },
    { id: 'solo', name: 'Ganz allein', en: 'All by myself', desc: 'Finish a session of 10 or more cards without “Help me” and without “I don’t know”.', color: '#10b981', ...flag('solo') },
    { id: 'helped', name: 'Hilfe!', en: 'A little help', desc: 'Use “Help me” for the first time. That’s what it’s there for!', color: '#f43f5e', ...flag('helped') },
    { id: 'high', name: 'Gipfelstürmer', en: 'Summit stormer', desc: 'Finish a learning session on High difficulty.', color: '#3b82f6', ...flag('high') },
    { id: 'snack', name: 'Brezel-Snack', en: 'Snack time', desc: 'Finish a quick 5-card session.', color: '#f59e0b', ...flag('snack') },
    { id: 'early', name: 'Frühaufsteher', en: 'Early riser', desc: 'Learn before 8 in the morning. Ich bin früh aufgestanden!', color: '#f472b6', ...flag('early') },
    { id: 'owl', name: 'Nachteule', en: 'Night owl', desc: 'Learn after 10 at night.', color: '#312e81', ...flag('owl') },
    { id: 'review50', name: 'Gutes Gedächtnis', en: 'Good memory', desc: 'Do 50 reviews of cards you had already mastered.', color: '#d946ef', ...atLeast('reviews', 50) },
    { id: 'elephant', name: 'Elefantengedächtnis', en: 'A memory like an elephant', desc: 'Bring a card to the top review step (6 of 6: back in three months).', color: '#6366f1', ...atLeast('topStep', 6) },
    { id: 'fixer', name: 'Fehlerjäger', en: 'Mistake hunter', desc: 'Get 10 cards right in “Practise mistakes”.', color: '#dc2626', ...atLeast('fixed', 10) },
    // topics
    {
      id: 'topic', name: 'Themenmeister', en: 'Topic master', desc: 'Master every card of one topic.', color: '#a855f7',
      check: (s) => !!s.bestTopic && s.bestTopic.done >= s.bestTopic.total,
      progress: (s) => (s.bestTopic ? [s.bestTopic.done, s.bestTopic.total] : [0, 1]),
    },
    { id: 'verbs', name: 'Kleines Wörterbuch', en: 'Little dictionary', desc: 'Master 50 cards of the Verb list.', color: '#0ea5e9', ...topicGoal('verblist', 50) },
    { id: 'mirror', name: 'Spieglein, Spieglein', en: 'Mirror, mirror', desc: 'Master 25 reflexive-verb cards (mich, dich, sich, uns, euch).', color: '#ec4899', ...topicGoal('reflexive', 25) },
    { id: 'rules', name: 'Regelkenner', en: 'Knows the rules', desc: 'Master 30 cards of the Rules topic.', color: '#0d9488', ...topicGoal('rules', 30) },
    { id: 'xp1000', name: 'Tausendsassa', en: 'A thousand XP', desc: 'Earn 1,000 XP.', color: '#2563eb', ...atLeast('xp', 1000) },
    // games
    { id: 'game1', name: 'Spielkind', en: 'Let’s play', desc: 'Play your first minigame.', color: '#84cc16', ...atLeast('games', 1) },
    { id: 'game5', name: 'Spielesammler', en: 'Game collector', desc: 'Play five different minigames.', color: '#f97316', ...atLeast('gameKinds', 5) },
    { id: 'boss', name: 'Drachentöter', en: 'Dragon slayer', desc: 'Defeat a boss in Bossfight.', color: '#7f1d1d', ...flag('bossWon') },
    { id: 'perfect', name: 'Makellos', en: 'Not a scratch', desc: 'Finish a minigame without a single mistake.', color: '#14b8a6', ...flag('perfectGame') },
    { id: 'hoer', name: 'Ganz Ohr', en: 'All ears', desc: 'Get 10 right in one round of Hör genau.', color: '#8b5cf6', ...atLeast('hoerBest', 10) },
    { id: 'schere', name: 'Scharfe Schere', en: 'Sharp scissors', desc: 'Get 10 right in one round of Die Schere.', color: '#22c55e', ...atLeast('schereBest', 10) },
  ];
  for (const d of DEFS) d.icon = ICONS[d.id];

  // --- unlocking -------------------------------------------------------------------------------
  function store() {
    const st = B.store && B.store.state;
    if (!st) return null;
    if (!st.ach || typeof st.ach !== 'object') st.ach = {};
    return st.ach;
  }

  const unlockedAt = (id) => {
    const a = B.store && B.store.state && B.store.state.ach;
    return (a && a[id]) || null;
  };

  function evaluate({ silent = false } = {}) {
    const ach = store();
    if (!ach || !B.deck || !B.deck.cards) return [];
    const open = DEFS.filter((d) => !ach[d.id]);
    if (!open.length) return [];
    const snap = snapshot();
    const now = Date.now();
    const fresh = [];
    for (const d of open) {
      let ok = false;
      try {
        ok = !!d.check(snap);
      } catch (e) {
        ok = false; // a broken check must never break a session
      }
      if (ok) {
        ach[d.id] = now;
        fresh.push(d);
      }
    }
    if (fresh.length) {
      B.store.save();
      if (!silent && B.ui && B.ui.celebrateAchievements) {
        try {
          B.ui.celebrateAchievements(fresh);
        } catch (e) {
          /* the celebration is decoration */
        }
      }
    }
    return fresh;
  }

  function init() {
    const got = evaluate({ silent: true });
    if (got.length && B.app && B.app.toast) {
      B.app.toast(got.length === 1 ? `🏅 You have already earned “${got[0].name}”!` : `🏅 You have already earned ${got.length} achievements!`, { ms: 4200 });
    }
    return got;
  }

  function count() {
    const a = (B.store && B.store.state && B.store.state.ach) || {};
    return { unlocked: DEFS.filter((d) => a[d.id]).length, total: DEFS.length };
  }

  B.achievements = {
    list: DEFS,
    snapshot,
    evaluate,
    init,
    count,
    unlockedAt,
    isUnlocked: (id) => !!unlockedAt(id),
  };
})();

  <script>/* js/core/audio.js */
/* Sound effects (synthesised with WebAudio — no files) and German text-to-speech. */
(function () {
  'use strict';
  const B = window.Brezel;
  let ctx = null;

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    // iOS also uses "interrupted" (after a call, locking the phone or switching apps)
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, { type = 'sine', gain = 0.15, slideTo = null } = {}) {
    const c = ac();
    if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  const sounds = {
    tap: () => tone(620, 0, 0.05, { gain: 0.05 }),
    drop: () => tone(420, 0, 0.07, { type: 'triangle', gain: 0.07 }),
    correct: () => {
      tone(784, 0, 0.12, { type: 'triangle', gain: 0.16 });
      tone(1175, 0.09, 0.26, { type: 'triangle', gain: 0.16 });
    },
    wrong: () => {
      tone(233, 0, 0.16, { type: 'sawtooth', gain: 0.05, slideTo: 190 });
      tone(185, 0.13, 0.26, { type: 'square', gain: 0.035, slideTo: 150 });
    },
    combo: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, i * 0.06, 0.14, { type: 'triangle', gain: 0.1 })),
    complete: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.32, { type: 'triangle', gain: 0.13 })),
    // games
    tick: () => tone(1046, 0, 0.05, { type: 'square', gain: 0.03 }),
    go: () => {
      tone(784, 0, 0.1, { type: 'triangle', gain: 0.14 });
      tone(1568, 0.08, 0.22, { type: 'triangle', gain: 0.12 });
    },
    flip: () => tone(520, 0, 0.08, { type: 'triangle', gain: 0.06, slideTo: 880 }),
    whoosh: () => tone(300, 0, 0.18, { type: 'sine', gain: 0.07, slideTo: 1200 }),
    boom: () => {
      tone(140, 0, 0.3, { type: 'sawtooth', gain: 0.09, slideTo: 50 });
      tone(90, 0.02, 0.35, { type: 'square', gain: 0.05, slideTo: 40 });
    },
    levelup: () => [523, 784, 1047, 1568].forEach((f, i) => tone(f, i * 0.07, 0.2, { type: 'square', gain: 0.05 })),
  };

  function play(name) {
    if (!B.store.setting('sound')) return;
    try {
      sounds[name] && sounds[name]();
    } catch (e) {
      /* audio is decoration — never let it break the app */
    }
  }

  // --- Text to speech -------------------------------------------------------
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  let voice = null;

  function pickVoice() {
    if (!canSpeak) return null;
    const voices = window.speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
    if (!voices.length) return null;
    const score = (v) =>
      (/de-DE/i.test(v.lang) ? 4 : 0) +
      (/premium|enhanced|natural|neural/i.test(v.name) ? 3 : 0) +
      (/google|anna|petra|helena|katja|markus/i.test(v.name) ? 2 : 0) +
      (v.localService ? 1 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0];
  }

  if (canSpeak) {
    voice = pickVoice();
    window.speechSynthesis.addEventListener &&
      window.speechSynthesis.addEventListener('voiceschanged', () => (voice = pickVoice()));
  }

  /** Speak German text. rate: 0.9 by default (a little slower than normal speech). */
  function speak(text, { rate = 0.9 } = {}) {
    if (!canSpeak || !text) return;
    // "…" (a blank or a split verb) becomes a short pause
    const clean = String(text).replace(/_/g, ' ').replace(/\//g, ', ').replace(/\s*…\s*/g, ', ').replace(/^[,\s]+|[,\s]+$/g, '');
    // Safari can drop an utterance queued straight after cancel(), so only cancel when needed
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'de-DE';
    if (voice) u.voice = voice;
    u.rate = rate;
    window.speechSynthesis.speak(u);
  }

  B.audio = { play, speak, canSpeak };
})();
