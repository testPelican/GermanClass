  <script>/* js/core/util.js */
/* Shared helpers: DOM building, text normalisation, shuffling, animation. */
(function () {
  'use strict';
  const B = (window.Brezel = window.Brezel || {});

  const reducedMotion = () =>
    typeof window.matchMedia === 'function' &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /** Tiny hyperscript: h('div', {class: 'x', onClick: fn}, child, 'text') */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** Escapes, then supports **bold** and *italic* — used for explanations. */
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  /** Words joined with "_" form one tile ("St._Pölten"); show them with a space. */
  const show = (s) => String(s == null ? '' : s).replace(/_/g, ' ');

  /**
   * Normalise text for comparison: case-insensitive, punctuation-insensitive,
   * umlauts written as ae/oe/ue and ß as ss (so English keyboards work too).
   */
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFC')
      .toLowerCase()
      .replace(/_/g, ' ')
      .replace(/[„“”"'’‚‘«»]/g, '')
      .replace(/[.,!?;:…]/g, ' ')
      .replace(/ä/g, 'ae')
      .replace(/ö/g, 'oe')
      .replace(/ü/g, 'ue')
      .replace(/ß/g, 'ss')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** Shuffle, but avoid returning the original order when possible. */
  function shuffleAway(list, same = (x, y) => x === y) {
    if (list.length < 2) return list.slice();
    let out = shuffle(list);
    for (let tries = 0; tries < 12 && out.every((x, i) => same(x, list[i])); tries++) out = shuffle(list);
    return out;
  }

  const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  /**
   * FLIP animation: measure nodes, run a DOM mutation, then animate every node
   * from its old position to its new one.
   */
  function flip(nodes, mutate, { duration = 280, easing = 'cubic-bezier(.2,.8,.2,1)' } = {}) {
    const els = Array.from(nodes).filter(Boolean);
    const first = new Map(els.map((n) => [n, n.getBoundingClientRect()]));
    mutate();
    if (reducedMotion() || typeof Element.prototype.animate !== 'function') return;
    for (const n of els) {
      if (!n.isConnected) continue;
      const a = first.get(n);
      const b = n.getBoundingClientRect();
      const dx = a.left - b.left;
      const dy = a.top - b.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
      n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], {
        duration,
        easing,
      });
    }
  }

  /** Re-trigger a CSS animation class. */
  function pulse(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth; // force reflow so the animation restarts
    el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function fmtDuration(ms) {
    const s = Math.round((ms || 0) / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
  }

  const pct = (num, den) => (den ? Math.round((num / den) * 100) : 0);

  function dayKey(d = new Date()) {
    const x = d instanceof Date ? d : new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  }

  /** Split "Wohnt Julia in Salzburg?" into words + final punctuation. */
  function splitSentence(s) {
    const m = String(s).trim().match(/^(.*?)([.?!…]*)$/);
    return { words: m[1].split(/\s+/).filter(Boolean), punct: m[2] || '' };
  }

  B.util = {
    h, esc, md, show, norm, levenshtein, shuffle, shuffleAway, randInt, pick,
    flip, pulse, wait, fmtDuration, pct, dayKey, splitSentence, reducedMotion,
  };
})();

</script>
  <script>/* js/core/deck.js */
/*
 * The deck registry. Content files in /data call:
 *   Brezel.deck.addTopics([...])
 *   Brezel.deck.addVerbs({...}), addFamilies([...]), addProperNouns([...])
 *   Brezel.deck.addCards('topicId', [...])
 *   Brezel.deck.addRules([...])   (the rule a card practises, shown in the Glossary)
 * finalize() then validates everything; broken cards are skipped and reported
 * in the console (and by tools/validate.js), so one typo never breaks the app.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm } = B.util;

  const PRONOUNS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

  const deck = {
    topics: [],
    topicMap: Object.create(null),
    rawCards: [],
    cards: [], // valid cards, after finalize()
    cardMap: Object.create(null),
    verbs: Object.create(null),
    families: [],
    properNouns: new Set(),
    rules: [],
    ruleMap: Object.create(null),
    problems: [],
    PRONOUNS,

    addTopics(list) {
      for (const t of list) {
        this.topics.push(t);
        this.topicMap[t.id] = t;
      }
    },

    addCards(topicId, list) {
      for (const c of list) this.rawCards.push(Object.assign({ topic: topicId }, c));
    },

    /** verbs: { wohnen: { en, forms: [6 present forms], prt?: [6 Präteritum forms], pp, aux } } */
    addVerbs(obj) {
      for (const [inf, v] of Object.entries(obj)) this.verbs[inf] = Object.assign({ inf }, v);
    },

    /** Groups of words that differ by one letter but are different grammar (dem/den/der). */
    addFamilies(list) {
      for (const f of list) this.families.push(f);
    },

    addProperNouns(list) {
      for (const w of list) this.properNouns.add(w);
    },

    /** rules: [{ id, title, text, points?: [...], examples?: [...] }] — markdown-lite like card text. */
    addRules(list) {
      for (const r of list) {
        this.rules.push(r);
        this.ruleMap[r.id] = r;
      }
    },

    /** The rules a card practises (card.rule: id or [ids]); without one, the topic tip. */
    rulesFor(card) {
      const ids = Array.isArray(card.rule) ? card.rule : card.rule ? [card.rule] : [];
      const list = ids.map((id) => this.ruleMap[id]).filter(Boolean);
      if (list.length) return list;
      const t = this.topicMap[card.topic];
      return t && t.tip ? [{ id: 'topic:' + t.id, title: t.name, text: t.tip }] : [];
    },

    /** Table rows for a verb: [['ich','wohne'], ['du','wohnst'], ...] */
    verbRows(inf) {
      const v = this.verbs[inf];
      return v ? PRONOUNS.map((p, i) => [p, v.forms[i]]) : null;
    },

    /** True when a and b are different members of the same word family (e.g. wohnt/wohne). */
    sameFamily(a, b) {
      const fa = this._familyIndex.get(norm(a));
      const fb = this._familyIndex.get(norm(b));
      if (!fa || !fb) return false;
      for (const id of fa) if (fb.has(id)) return true;
      return false;
    },

    _familyIndex: new Map(),

    _buildFamilies() {
      const idx = new Map();
      const add = (words, id) => {
        for (const w of words) {
          if (!w) continue;
          const k = norm(w);
          if (!idx.has(k)) idx.set(k, new Set());
          idx.get(k).add(id);
        }
      };
      this.families.forEach((f, i) => add(f, 'f' + i));
      for (const v of Object.values(this.verbs)) {
        const forms = (v.forms || []).concat(v.prt || []);
        // separable forms ("kaufe ein", "fing an"): the conjugated part alone is a member too
        add([v.inf, v.pp, ...forms, ...forms.map((f) => f.split(' ')[0])], 'v:' + v.inf);
      }
      this._familyIndex = idx;
    },

    finalize() {
      this._buildFamilies();
      this.cards = [];
      this.cardMap = Object.create(null);
      this.problems = [];
      const seen = new Set();
      for (const c of this.rawCards) {
        const errs = [];
        if (!c.id) errs.push('missing id');
        else if (seen.has(c.id)) errs.push('duplicate id');
        if (!this.topicMap[c.topic]) errs.push(`unknown topic "${c.topic}"`);
        const type = B.ex && B.ex.get(c.type);
        if (!type) errs.push(`unknown type "${c.type}"`);
        else if (type.validate) errs.push(...type.validate(c, this));
        if (errs.length) {
          this.problems.push({ id: c.id || '(no id)', errors: errs });
          continue;
        }
        seen.add(c.id);
        this.cards.push(c);
        this.cardMap[c.id] = c;
      }
      if (this.problems.length && typeof console !== 'undefined') {
        console.warn(`[Brezel] ${this.problems.length} card(s) skipped:`, this.problems);
      }
      return this;
    },

    byTopic(topicId) {
      return this.cards.filter((c) => c.topic === topicId);
    },
  };

  B.deck = deck;
})();

</script>
  <script>/* js/core/check.js */
/*
 * Typed-answer checking.
 * Rule: one wrong letter is forgiven (a typo) — two is wrong.
 * Exceptions, so the typo rule never accepts wrong grammar:
 *   - if the "typo" is actually another real form of the same word
 *     (wohne vs wohnt, dem vs den, meine vs meiner) it counts as wrong;
 *   - short words (3 letters or less, e.g. "ist", "dem", "im") must be exact,
 *     on their own or inside a longer answer.
 * Umlauts may be typed as ae/oe/ue and ß as ss.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm, levenshtein } = B.util;

  /** The one word that differs between two normalised answers, if exactly one does. */
  function diffWord(input, answer) {
    const x = input.split(' ');
    const y = answer.split(' ');
    if (x.length !== y.length) return null;
    const diff = [];
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) diff.push(i);
    return diff.length === 1 ? { got: x[diff[0]], want: y[diff[0]] } : null;
  }

  /** Would the single-letter difference between a and b change the grammar? */
  function isOtherForm(input, answer) {
    const d = diffWord(input, answer);
    return !!d && B.deck.sameFamily(d.got, d.want);
  }

  /**
   * @param {string} input   what the learner typed
   * @param {string[]} answers accepted answers (first = the one we show)
   * @param {{reject?: string[], strict?: boolean, nounHint?: boolean}} opts
   * @returns {{ok:boolean, exact?:boolean, typo?:boolean, reason?:string, matched:string, caseNote?:string}}
   */
  function typed(input, answers, opts = {}) {
    const raw = String(input == null ? '' : input).trim();
    const ni = norm(raw);
    const list = answers.map((a) => ({ raw: a, n: norm(a) }));
    const fallback = list[0] ? list[0].raw : '';
    if (!ni) return { ok: false, empty: true, matched: fallback };

    for (const a of list) {
      if (a.n === ni) return { ok: true, exact: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
    }

    const reject = new Set((opts.reject || []).map(norm));
    if (reject.has(ni)) return { ok: false, reason: 'form', matched: fallback };

    if (!opts.strict) {
      for (const a of list) {
        if (a.n.length <= 3) continue;
        if (levenshtein(ni, a.n) !== 1) continue;
        if (isOtherForm(ni, a.n)) return { ok: false, reason: 'form', matched: a.raw };
        // inside a longer answer, a slip in a tiny word (ist/bin, im/in) is not a typo either
        const d = diffWord(ni, a.n);
        if (d && d.want.length <= 3) return { ok: false, reason: 'short', matched: a.raw };
        return { ok: true, typo: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
      }
    }
    return { ok: false, matched: fallback };
  }

  /** Nouns (and formal Sie) are capitalised in German — remind gently when the learner didn't. */
  function caseNote(raw, answer, opts) {
    if (/\sSie\b/.test(answer) && /\ssie\b/.test(raw)) return 'Tip: formal **Sie** (you) is always written with a capital S.';
    if (!opts.nounHint) return null;
    const a = answer.trim();
    const first = a.charAt(0);
    if (first && first === first.toUpperCase() && first !== first.toLowerCase() && raw.charAt(0) === raw.charAt(0).toLowerCase()) {
      return `Remember: German nouns start with a capital letter — **${a}**.`;
    }
    return null;
  }

  B.check = { typed, isOtherForm };
})();

</script>
  <script>/* js/core/store.js */
/*
 * Progress persistence (localStorage). Everything is keyed by card id, so
 * adding new cards later keeps all existing progress.
 *
 * cards[id] = { a: attempts, w: wrong attempts, done: bool, first: 1|0 (first attempt right?),
 *               lw: last wrong answer given, d: time it was mastered }
 * log      = every answer: { id, ok, t, ms, s: session id, p: practice?1:0 }
 * sessions = { id, start, end, answered, correct, wrong, mastered, xp, practice }
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const KEY = 'brezel.progress.v1';

  const fresh = () => ({
    v: 1,
    createdAt: Date.now(),
    cards: {},
    log: [],
    sessions: [],
    xp: 0,
    streak: { count: 0, last: null, best: 0 },
    bestCombo: 0,
    settings: { sound: true, size: 20, topic: 'all', theme: 'auto' },
  });

  let state = fresh();
  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const base = fresh();
        state = Object.assign(base, parsed, {
          settings: Object.assign(base.settings, parsed.settings || {}),
          streak: Object.assign(base.streak, parsed.streak || {}),
        });
      }
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not load progress', e);
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not save progress', e);
    }
  }

  const cardState = (id) => state.cards[id] || null;
  const isDone = (id) => !!(state.cards[id] && state.cards[id].done);

  function touchStreak() {
    const today = B.util.dayKey();
    const s = state.streak;
    if (s.last === today) return;
    const y = new Date();
    y.setDate(y.getDate() - 1);
    s.count = s.last === B.util.dayKey(y) ? s.count + 1 : 1;
    s.last = today;
    s.best = Math.max(s.best || 0, s.count);
  }

  function beginSession(practice) {
    const rec = {
      id: (state.sessions.length ? state.sessions[state.sessions.length - 1].id : 0) + 1,
      start: Date.now(),
      end: null,
      answered: 0,
      correct: 0,
      wrong: 0,
      mastered: 0,
      xp: 0,
      practice: !!practice,
    };
    state.sessions.push(rec);
    save();
    return rec;
  }

  function currentSession() {
    return state.sessions[state.sessions.length - 1];
  }

  /** Record one answer. Returns {newlyDone} */
  function record(card, ok, given, ms, { practice = false, xp = 0 } = {}) {
    const sess = currentSession();
    state.log.push({ id: card.id, ok: ok ? 1 : 0, t: Date.now(), ms: Math.round(ms || 0), s: sess ? sess.id : 0, p: practice ? 1 : 0 });
    touchStreak();
    state.xp += xp;
    if (sess) {
      sess.answered++;
      sess[ok ? 'correct' : 'wrong']++;
      sess.xp += xp;
      sess.end = Date.now();
    }
    let newlyDone = false;
    if (!practice) {
      const c = (state.cards[card.id] = state.cards[card.id] || { a: 0, w: 0, done: false, first: null });
      c.a++;
      if (c.first === null) c.first = ok ? 1 : 0;
      if (ok) {
        if (!c.done) {
          newlyDone = true;
          if (sess) sess.mastered++;
        }
        c.done = true;
        c.d = Date.now();
      } else {
        c.w++;
        c.lw = String(given == null ? '' : given).slice(0, 200);
      }
    }
    save();
    return { newlyDone };
  }

  function endSession(extra) {
    const sess = currentSession();
    if (sess) {
      sess.end = Date.now();
      Object.assign(sess, extra || {});
      // Drop sessions where nothing was answered — they add noise to the history.
      if (!sess.answered) state.sessions.pop();
    }
    save();
  }

  function setBestCombo(n) {
    if (n > (state.bestCombo || 0)) {
      state.bestCombo = n;
      save();
    }
  }

  function setting(key, value) {
    if (value === undefined) return state.settings[key];
    state.settings[key] = value;
    save();
    return value;
  }

  function reset() {
    const settings = state.settings;
    state = fresh();
    state.settings = settings;
    save();
  }

  B.store = {
    load, save, reset, cardState, isDone, beginSession, record, endSession, setBestCombo, setting,
    get state() { return state; },
    get storageOk() { return storageOk; },
  };
})();

</script>
  <script>/* js/core/stats.js */
/*
 * Progress statistics, computed from the deck + saved progress.
 * Used by the home screen, the session summary and the review report.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { pct } = B.util;

  const STRONG = 85; // first-try accuracy (%) for "Strong"
  const OKAY = 65; // … for "Getting there"
  const MIN_CARDS = 3; // attempted cards needed before we judge an area
  const MAX_MS = 120000; // cap each answer's time so an idle tab doesn't count

  function status(p, attempted) {
    if (attempted < MIN_CARDS) return { key: 'none', icon: '·', label: 'Not enough data yet' };
    if (p >= STRONG) return { key: 'good', icon: '✓', label: 'Strong' };
    if (p >= OKAY) return { key: 'warn', icon: '!', label: 'Getting there' };
    return { key: 'bad', icon: '✗', label: 'Needs work' };
  }

  /** Aggregate a list of cards. first = right on the very first try; retry = mastered later. */
  function summarize(cards) {
    let done = 0, first = 0, retry = 0, attempted = 0, wrong = 0, answers = 0, stillWrong = 0;
    for (const c of cards) {
      const s = B.store.cardState(c.id);
      if (!s || !s.a) continue;
      attempted++;
      answers += s.a;
      wrong += s.w;
      if (s.done) {
        done++;
        if (s.first === 1) first++;
        else retry++;
      } else stillWrong++;
    }
    const firstPct = pct(first, attempted);
    return {
      total: cards.length,
      done,
      first,
      retry,
      stillWrong,
      unseen: cards.length - attempted,
      notDone: cards.length - done,
      attempted,
      answers,
      wrong,
      firstPct,
      accuracy: pct(answers - wrong, answers),
      status: status(firstPct, attempted),
    };
  }

  function overview() {
    const st = B.store.state;
    const all = summarize(B.deck.cards);
    const timeMs = st.log.reduce((sum, l) => sum + Math.min(l.ms || 0, MAX_MS), 0);
    return Object.assign(all, {
      timeMs,
      sessions: st.sessions.length,

/* Sound effects (synthesised with WebAudio — no files) and German text-to-speech. */
(function () {
  'use strict';
  const B = window.Brezel;
  let ctx = null;

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    // iOS also uses "interrupted" (after a call, locking the phone or switching apps)
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, { type = 'sine', gain = 0.15, slideTo = null } = {}) {
    const c = ac();
    if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  const sounds = {
    tap: () => tone(620, 0, 0.05, { gain: 0.05 }),
    drop: () => tone(420, 0, 0.07, { type: 'triangle', gain: 0.07 }),
    correct: () => {
      tone(784, 0, 0.12, { type: 'triangle', gain: 0.16 });
      tone(1175, 0.09, 0.26, { type: 'triangle', gain: 0.16 });
    },
    wrong: () => {
      tone(233, 0, 0.16, { type: 'sawtooth', gain: 0.05, slideTo: 190 });
      tone(185, 0.13, 0.26, { type: 'square', gain: 0.035, slideTo: 150 });
    },
    combo: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, i * 0.06, 0.14, { type: 'triangle', gain: 0.1 })),
    complete: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.32, { type: 'triangle', gain: 0.13 })),
  };

  function play(name) {
    if (!B.store.setting('sound')) return;
    try {
      sounds[name] && sounds[name]();
    } catch (e) {
      /* audio is decoration — never let it break the app */
    }
  }

  // --- Text to speech -------------------------------------------------------
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  let voice = null;

  function pickVoice() {
    if (!canSpeak) return null;
    const voices = window.speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
    if (!voices.length) return null;
    const score = (v) =>
      (/de-DE/i.test(v.lang) ? 4 : 0) +
      (/premium|enhanced|natural|neural/i.test(v.name) ? 3 : 0) +
      (/google|anna|petra|helena|katja|markus/i.test(v.name) ? 2 : 0) +
      (v.localService ? 1 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0];
  }

  if (canSpeak) {
    voice = pickVoice();
    window.speechSynthesis.addEventListener &&
      window.speechSynthesis.addEventListener('voiceschanged', () => (voice = pickVoice()));
  }

  function speak(text) {
    if (!canSpeak || !text) return;
    const clean = String(text).replace(/_/g, ' ').replace(/\//g, ', ').replace(/\s*…\s*/g, ' ');
    // Safari can drop an utterance queued straight after cancel(), so only cancel when needed
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'de-DE';
    if (voice) u.voice = voice;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  B.audio = { play, speak, canSpeak };
})();

/*
 * Minimal pointer-based drag helper (mouse, touch and pen share one code path).
 * A tap stays a normal click; the drag only starts after the pointer moves a
 * few pixels. While dragging, a floating clone follows the finger.
 *
 *   B.drag.attach(el, {
 *     onStart(ctx), onMove(ctx), onEnd(ctx)  // ctx: {el, ghost, x, y, over}
 *   })
 * onEnd may return a target element: the clone then glides into it before
 * disappearing; otherwise it glides back to el.
 */
(function () {
  'use strict';
  const B = window.Brezel;

  let suppressClickUntil = 0;
  window.addEventListener(
    'click',
    (e) => {
      if (Date.now() < suppressClickUntil) {
        e.stopPropagation();
        e.preventDefault();
      }
    },
    true
  );

  function attach(el, opts = {}) {
    const threshold = opts.threshold || 6;
    let start = null;
    let ctx = null;

    function under(x, y) {
      return document.elementFromPoint(x, y);
    }

    function down(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (opts.enabled && !opts.enabled()) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      // Listen on window: the element may be moved around the DOM mid-drag
      // (live re-ordering), which can drop pointer capture in some browsers.
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', cancel);
    }

    function begin(e) {
      const r = el.getBoundingClientRect();
      const ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.removeAttribute('id');
      Object.assign(ghost.style, {
        position: 'fixed',
        left: r.left + 'px',
        top: r.top + 'px',
        width: r.width + 'px',
        height: r.height + 'px',
        margin: '0',
        pointerEvents: 'none',
        zIndex: 1000,
      });
      document.body.appendChild(ghost);
      ctx = { el, ghost, dx: start.x - r.left, dy: start.y - r.top, x: e.clientX, y: e.clientY, over: null };
      el.classList.add('drag-src');
      document.body.classList.add('is-dragging');
      opts.onStart && opts.onStart(ctx);
    }

    function move(e) {
      if (!start || e.pointerId !== start.id) return;
      if (!ctx) {
        if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < threshold) return;
        begin(e);
      }
      e.preventDefault();
      ctx.x = e.clientX;
      ctx.y = e.clientY;
      ctx.ghost.style.left = e.clientX - ctx.dx + 'px';
      ctx.ghost.style.top = e.clientY - ctx.dy + 'px';
      ctx.over = under(e.clientX, e.clientY);
      opts.onMove && opts.onMove(ctx);
    }

    function finish(cancelled) {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      start = null;
      if (!ctx) return;
      const c = ctx;
      ctx = null;
      suppressClickUntil = Date.now() + 350;
      document.body.classList.remove('is-dragging');
      const dest = opts.onEnd ? opts.onEnd(Object.assign(c, { cancelled })) : null;
      settle(c, dest || el);
    }

    function up(e) {
      if (start && e.pointerId === start.id) finish(false);
    }
    function cancel(e) {
      if (start && e.pointerId === start.id) finish(true);
    }

    /** Glide the clone to where the real element ended up, then remove it. */
    function settle(c, target) {
      const done = () => {
        c.ghost.remove();
        c.el.classList.remove('drag-src');
      };
      // Let layout update (FLIP moves etc.) before measuring the destination.
      requestAnimationFrame(() => {
        const to = (target.isConnected ? target : c.el).getBoundingClientRect();
        if (B.util.reducedMotion() || typeof c.ghost.animate !== 'function') return done();
        const from = c.ghost.getBoundingClientRect();
        const anim = c.ghost.animate(
          [
            { transform: 'translate(0,0) scale(1.06)' },
            { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(1)` },
          ],
          { duration: 180, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
        );
        anim.onfinish = done;
        anim.oncancel = done;
      });
    }

    el.addEventListener('pointerdown', down);
    return () => el.removeEventListener('pointerdown', down);
  }

  /**
   * Index at which to insert a dragged item into a wrapping row of items,
   * based on the pointer position. `exclude` is the item being dragged.
   */
  function insertIndex(container, x, y, exclude, selector) {
    const kids = Array.from(container.children).filter(
      (k) => k !== exclude && !k.classList.contains('drag-ghost') && (!selector || k.matches(selector))
    );
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (y < r.top - 4) return i;
      if (y <= r.bottom + 4 && x < r.left + r.width / 2) return i;
    }
    return kids.length;
  }

  B.drag = { attach, insertIndex };
})();

  <script>/* js/core/gloss.js */
/*
 * Word translations: the dotted words in the speech bubble and the Glossary.
 *
 *   data/glossary.js   Brezel.gloss.addWords({ wohnt: 'live(s)', aß: 'ate | essen', 'es gibt': 'there is / there are',
 *                                           'stehe … auf': 'get up | aufstehen' })
 *                      "meaning | base form" shows the base form in the Glossary. A key with spaces is a
 *                      phrase; "a … b" is a split verb (b comes later in the same sentence).
 *                      Split forms of separable verbs in data/lexicon.js are added automatically.
 *   card.gloss         false: no translations at all (cards that ask what a word or sentence means)
 *                      { word: false }: hide that word ("that's what this card asks")
 *                      { word: 'text' }: a different meaning for this card only
 *
 * Only question text is translated (see Brezel.ex.questionTexts); answer choices never are,
 * so a translation can't give the answer away. Names (data/lexicon.js proper nouns) get none.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h } = B.util;

  const WORD = /\p{L}+(?:[-'’]\p{L}+)*/gu;
  const SPLIT = ' … ';
  const STOP = /[.!?;→–—]/; // ends the search for the second half of a split verb
  const OPEN = /[\s„“"'‚‘«»(\[]/;
  const MAX_PHRASE = 4;

  const words = Object.create(null); // form → {en, base}
  const phrases = Object.create(null); // "es gibt" → {en, base}
  const splits = Object.create(null); // "stehe … auf" → {en, base}
  const names = new Set();
  const baseOf = Object.create(null); // "wohnt" → "wohnen", from data/lexicon.js
  const lower = (s) => s.toLocaleLowerCase('de');

  function parse(v) {
    if (v === false) return { hidden: true };
    const [en, base] = String(v).split(' | ');
    return { en: en.trim(), base: base ? base.trim() : null };
  }

  function addWords(obj) {
    for (const [k, v] of Object.entries(obj)) {
      if (k.includes(SPLIT)) splits[lower(k)] = parse(v);
      else if (k.includes(' ')) phrases[lower(k)] = parse(v);
      else words[k] = parse(v);
    }
  }

  function addNames(list) {
    for (const n of list) names.add(lower(String(n).replace(/_/g, ' ')));
  }

  let ready = false;
  /** Lexicon facts are read lazily: data files load after this one. */
  function prepare() {
    if (ready) return;
    ready = true;
    addNames(B.deck.properNouns);
    for (const v of Object.values(B.deck.verbs)) {
      const meaning = String(v.en || '').replace(/^.*= /, '').replace(/^to /, '').replace(/ \/ to /g, ' / '); // "sich anziehen = to get dressed" → "get dressed"
      for (const f of [...(v.forms || []), ...(v.prt || [])]) {
        const [stem, prefix] = f.split(' ');
        if (prefix) {
          const key = lower(stem + SPLIT + prefix);
          if (!splits[key]) splits[key] = { en: meaning, base: v.inf };
        } else if (lower(f) !== lower(v.inf)) baseOf[lower(f)] = v.inf;
      }
      if (v.pp && lower(v.pp) !== lower(v.inf)) baseOf[lower(v.pp)] = v.inf;
    }
  }

  function cardOverride(card, key) {
    const o = card && card.gloss && typeof card.gloss === 'object' ? card.gloss : null;
    if (!o) return null;
    if (Object.prototype.hasOwnProperty.call(o, key)) return parse(o[key]);
    const k = lower(key);
    for (const ok of Object.keys(o)) if (lower(ok) === k) return parse(o[ok]);
    return null;
  }

  function lookupWord(w, initial, card) {
    const own = cardOverride(card, w);
    if (own) return own;
    const exact = words[w];
    const low = words[lower(w)];
    // "Sie" at the start of a sentence may be she, they or formal you
    if (initial && exact && low && exact !== low) return { en: `${low.en} / ${exact.en}`, base: low.base || exact.base };
    // verb: found under its lower-case entry, so a base form from the lexicon applies
    // ("Hast" → haben), but not to a noun with the same letters ("Frage" ≠ ich frage)
    if (exact || low) return Object.assign({ verb: !!(low && (low === exact || !exact)) }, exact || low);
    return words[w.charAt(0).toUpperCase() + w.slice(1)] || null;

   * {text, start, end, en, base, hidden, name, group, label}

   */
  function tokens(text, card) {
    prepare();
    const toks = [];
    for (const m of String(text).matchAll(WORD)) toks.push({ text: m[0], start: m.index, end: m.index + m[0].length });
    const gap = (a, b) => text.slice(toks[a].end, toks[b].start);
    let group = 0;

    // phrases and multi-word names, longest first
    for (let i = 0; i < toks.length; i++) {
      for (let n = Math.min(MAX_PHRASE, toks.length - i); n >= 2; n--) {
        const run = toks.slice(i, i + n);
        // words next to each other; a dot is allowed for abbreviations ("St. Pölten")
        if (run.some((t) => t.group) || run.slice(1).some((t, k) => !/^\.?\s+$/.test(gap(i + k, i + k + 1)))) continue;

        if (hit || names.has(lower(key))) {
          group++;
          for (const t of run) Object.assign(t, hit || { name: true }, { group, label: key });

          break;
        }
      }
    }

    // split verbs: "Heute stehe ich um 7:30 auf."

      if (toks[i].group) continue;
      for (let k = i + 1; k < toks.length; k++) {
        if (STOP.test(gap(k - 1, k))) break;
        if (toks[k].group) continue;
        const key = toks[i].text + SPLIT + toks[k].text;
        const hit = cardOverride(card, key) || splits[lower(key)];
        if (hit) {
          group++;
          const label = k === i + 1 ? toks[i].text + ' ' + toks[k].text : key; // "schloss ab" in a table cell
          for (const t of [toks[i], toks[k]]) Object.assign(t, hit, { group, label });
          break;
        }
      }
    }

    for (const t of toks) {
      if (t.group) continue;
      const hit = lookupWord(t.text, isInitial(text, t.start), card);
      if (hit) Object.assign(t, hit);
      else if (names.has(lower(t.text))) t.name = true;
    }
    return toks;
  }

  const known = (t) => t.en || t.hidden;

  /**
   * Glossary rows for a card: [{de, en, base, hidden}] in reading order, without repeats.
   * texts: [{text, loose?}]; a loose text (from the instructions) is used only if every word is known,
   * so English or Polish words in an instruction are left out.
   */
  function entries(card, texts) {
    if (card && card.gloss === false) return [];
    const rows = [];
    const seen = new Set();
    for (const { text, loose } of texts) {
      const toks = tokens(text, card);
      if (loose && toks.some((t) => !known(t) && !t.name)) continue;
      const done = new Set();
      for (const t of toks) {
        if (!known(t) || done.has(t.group || t)) continue;
        done.add(t.group || t);
        const de = t.label || t.text;
        const base = t.base || (t.verb && baseOf[lower(de)]) || null;
        const key = lower(de) + '=' + (t.en || '');
        if (seen.has(key)) continue;
        seen.add(key);
        rows.push({ de, en: t.en || '', base: base && lower(base) !== lower(de) ? base : null, hidden: !!t.hidden });
      }
    }
    return rows;
  }

  /** Words in non-loose texts that have no translation (used by tools/validate.js). */
  function missing(card, texts) {
    const out = [];
    for (const { text, loose } of texts) {
      if (loose) continue;
      for (const t of tokens(text, card)) if (!known(t) && !t.name) out.push(t.text);
    }
    return out;
  }

  // --- dotted words + tooltip ------------------------------------------------------------
  const SKIP = '.blank-inline, .gap-slot, button';
  let tip = null;
  let tipWord = null;
  let pinned = false;

  /** Wrap every translated word inside el in a dotted span. Blanks and buttons are left alone. */

          else walk(n);
        }
      }

    if (!toks.length) return;
    el._gloss = toks;

      const mine = toks.filter((t) => t.start < end && t.end > at);
      if (!mine.length) continue;
      const frag = document.createDocumentFragment();
      let pos = at;
      for (const t of mine) {
        const s = Math.max(t.start, at);
        const e = Math.min(t.end, end);
        if (s > pos) frag.append(text.slice(pos, s));
        frag.append(h('span', { class: 'gw', dataset: { t: String(toks.indexOf(t)), g: String(t.group || '') } }, text.slice(s, e)));
        pos = e;
      }
      if (pos < end) frag.append(text.slice(pos, end));
      n.replaceWith(frag);

    el.addEventListener('pointerover', (e) => {
      const w = e.pointerType === 'mouse' && wordAt(e.target, el);
      if (w && !pinned) showTip(w, el);

      const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.gw') : null;
      if (!to || to.dataset.t !== tipWord.dataset.t) hideTip();
    });
    el.addEventListener('click', (e) => {
      const w = wordAt(e.target, el);
      if (!w) return;
      if (pinned && tipWord && tipWord.dataset.t === w.dataset.t) return hideTip();
      showTip(w, el);
      pinned = true;
    });

  function wordAt(node, root) {
    const w = node && node.closest ? node.closest('.gw') : null;
    return w && root.contains(w) ? w : null;

    if (!tip) {

      document.body.append(tip);
      document.addEventListener('pointerdown', (e) => {
        if (tip.hidden || (e.target.closest && (e.target.closest('.gw') || e.target.closest('.gloss-tip')))) return;
        hideTip();
      }, true);
      window.addEventListener('resize', hideTip);
      window.addEventListener('scroll', hideTip, true);

    hideTip();
    tipWord = w;
    // light up the whole phrase or split verb, and both halves of a word split by **bold** markup
    root.querySelectorAll(t.group ? `.gw[data-g="${t.group}"]` : `.gw[data-t="${w.dataset.t}"]`).forEach((x) => x.classList.add('on'));
    w.setAttribute('aria-describedby', 'gloss-tip');
    tip.replaceChildren(...[
      t.group && !t.name && t.label.includes(' ') ? h('span', { class: 'gloss-tip-de' }, t.label) : null,
      t.hidden ? h('span', { class: 'gloss-tip-en is-hidden' }, '🤫 That’s what this card asks!') : h('span', { class: 'gloss-tip-en' }, t.en),
    ].filter(Boolean));
    tip.hidden = false;
    place(w);

  function place(w) {

    const left = Math.max(8, Math.min(cx - tw / 2, vw - tw - 8));

    if (top + th > window.innerHeight - 8) {
      top = r.top - th - 10;
      tip.classList.add('above');
    }
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.setProperty('--arrow', Math.round(cx - left) + 'px');
  }

  function hideTip() {
    pinned = false;
    if (tipWord) {
      document.querySelectorAll('.gw.on').forEach((x) => x.classList.remove('on'));
      tipWord.removeAttribute('aria-describedby');
      tipWord = null;
    }
    if (tip) tip.hidden = true;
  }

  B.gloss = {
    addWords,
    addNames,
    tokens,
    entries,
    missing,
    decorate,
    hideTip,
    tipOpen: () => !!(tip && !tip.hidden),
  };
})();

</script>

  <script>/* js/exercises/base.js */
/*
 * Exercise registry. Every exercise type is a plugin:
 *
 *   Brezel.ex.register('mc', {
 *     label: 'Multiple choice',
 *     validate(card, deck) -> [error strings]        // run once at start-up
 *     describe(card)       -> {q, a}                 // plain text for the review screen
 *     render(card, root, api) -> controller
 *   })
 *
 * controller = {
 *   check()    -> {ok, given, note?, typo?}  // given = what the learner answered (text)
 *   solution() -> {html, say?}               // the correct answer, shown when wrong
 *   lock(res)  -> void                       // freeze + colour the answer after checking
 *   key?(e)    -> true if the key was handled
 *   focus?()   -> focus the main input
 *   glossTexts?() -> question text for the Glossary, if more than questionTexts(card) is shown
 * }
 * api = { changed(ready), submit(), sfx(name), speak(text), card }
 *
 * Common card fields: id, type, prompt (instruction), q (German text shown in the
 * speech bubble, "___" marks a blank), say (text for the speaker button),
 * en (English meaning, shown small), explain (the "why", shown after answering),
 * rule (id from data/rules.js, shown in the Glossary), asksRule (the rule gives the answer away),
 * gloss (word translations: see js/core/gloss.js).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm } = B.util;

  const types = Object.create(null);
  const BLANK = /_{3,}/;

  function register(name, def) {
    def.name = name;
    types[name] = def;
  }

  /** Markdown-lite + "___" blanks (done before show(), which turns _ into spaces). */
  function richText(text) {
    return String(text == null ? '' : text)
      .split(BLANK)
      .map((part) => md(show(part)))
      .join('<span class="blank-inline">&nbsp;</span>');
  }

  function speakButton(say) {
    if (!say || !B.audio.canSpeak) return null;
    return h('button', {
      class: 'speak-btn',
      type: 'button',
      'aria-label': 'Listen',
      title: 'Listen',
      onClick: (e) => {
        e.stopPropagation();
        B.audio.speak(say);
      },
    }, '🔊');
  }

  /** Mascot + speech bubble. */
  function bubble(text, { say, big } = {}) {
    return h('div', { class: 'bubble-row' },
      h('div', { class: 'mascot', 'aria-hidden': 'true' }, '🥨'),
      h('div', { class: 'bubble' + (big ? ' bubble-big' : '') },
        speakButton(say),
        h('span', { class: 'bubble-text', html: richText(text) }))
    );
  }

  /** Title + optional bubble — the standard top of every exercise. */
  function header(card, fallback, opts = {}) {
    const wrap = h('div', { class: 'ex-head' });
    wrap.append(h('h2', { class: 'ex-title', html: md(card.prompt || fallback) }));
    if (card.q && !opts.noBubble) {
      const b = bubble(card.q, { say: card.say, big: opts.big });
      B.gloss.decorate(b.querySelector('.bubble-text'), card);
      wrap.append(b);
    }
    if (card.en && !opts.noEn) wrap.append(h('p', { class: 'ex-en' }, '“' + card.en + '”'));
    if (card.hint) wrap.append(h('p', { class: 'ex-hint' }, h('span', { 'aria-hidden': 'true' }, '💡 '), show(card.hint)));
    return wrap;
  }

  /** The question sentence with its blank filled in (for speech and solutions). */
  function filled(card, answer) {
    if (card.sayAnswer) return card.sayAnswer;
    if (card.q && BLANK.test(card.q)) return show(card.q.replace(BLANK, answer));
    return card.say || null;
  }

  /** Put text into the bubble's blank after checking. */
  function fillBlank(root, text, cls) {
    const b = root.querySelector('.blank-inline');
    if (!b) return;
    b.textContent = show(text);
    b.classList.add('filled');
    if (cls) b.classList.add(cls);
  }

  /** Buttons for ä ö ü ß; inserts into whichever input is active. */
  function umlautBar(getInput) {
    const chars = ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'];
    return h('div', { class: 'umlauts', role: 'group', 'aria-label': 'Special letters' },
      chars.map((ch) =>
        h('button', {
          type: 'button',
          class: 'umlaut',
          tabindex: '-1',
          // pointerdown + preventDefault keeps the keyboard open on phones
          onPointerdown: (e) => e.preventDefault(),
          onClick: () => {
            const input = getInput();
            if (!input || input.disabled) return;
            const s = input.selectionStart ?? input.value.length;
            const t = input.selectionEnd ?? input.value.length;
            input.value = input.value.slice(0, s) + ch + input.value.slice(t);
            input.focus();
            input.setSelectionRange(s + 1, s + 1);
            input.dispatchEvent(new Event('input', { bubbles: true }));
          },
        }, ch)
      )
    );
  }

  /** Typed-answer feedback note (typo accepted / wrong form / capital letter). */
  function typedNote(res, given) {
    if (res.ok && res.typo) return `Small typo — accepted! Exact spelling: **${show(res.matched)}**.`;
    if (res.ok && res.caseNote) return res.caseNote;
    if (!res.ok && res.reason === 'form') {
      return `Close, but “${given}” is a different grammatical form — one letter changes the grammar here, so it counts as wrong.`;
    }
    if (!res.ok && res.reason === 'short') {
      return 'Close — but short words like *ist, bin, im, ins, dem* must be spelled exactly: one letter changes the word.';
    }
    return null;
  }

  const asList = (x) => (Array.isArray(x) ? x : x == null ? [] : [x]);

  /** Every answer option and accepted answer of a card. */
  function choices(c) {
    const gaps = c.type === 'gap' && c.q ? [...c.q.matchAll(/\{([^}]+)\}/g)].flatMap((m) => m[1].split('|')) : [];
    return [
      c.correct, ...asList(c.wrong), ...asList(c.options), ...asList(c.extra), c.fix,
      ...(typeof c.answer === 'string' || Array.isArray(c.answer) ? asList(c.answer) : []), ...asList(c.answers),
      ...(c.pairs || []).flat(), ...(c.buckets || []).flatMap((b) => b.items || []), ...gaps,
    ].filter((x) => typeof x === 'string');
  }

  /**
   * The German the learner sees before answering — the only text the Glossary translates:
   * emphasised words in the instruction (unless they are answer options), the bubble with
   * its blanks and gaps left empty, the hint and a fixed sentence start.
   */
  function questionTexts(card) {
    // a blank stays as "_", so the word after it doesn't count as the start of a sentence
    const plain = (s) => String(s).split(BLANK).map(show).join(' _ ');
    const out = [];
    // short options ("ist", "hat gelesen") must not be translated; a full answer sentence may repeat prompt words
    const opts = choices(card).map(norm).filter((o) => o.split(' ').length <= 3).map((o) => ` ${o} `);
    for (const m of String(card.prompt || '').matchAll(/\*\*(.+?)\*\*|\*(.+?)\*/g)) {
      const seg = m[1] || m[2];
      const n = norm(seg.replace(BLANK, ' '));
      if (n && !opts.some((o) => o.includes(` ${n} `))) out.push({ text: plain(seg), loose: true });
    }
    if (card.q) out.push({ text: plain(card.q.replace(/\{[^}]+\}/g, '___')) });
    // a hint may be English ("as") or carry a translation: "aufhören (to stop / finish)"
    if (card.hint) out.push({ text: plain(String(card.hint).replace(/\s*\([^)]*\)/g, '')), loose: true });
    if (card.start) out.push({ text: plain(card.start) });
    return out;
  }

  /** Validation helper: collect messages when conditions fail. */
  function need(errs, cond, msg) {
    if (!cond) errs.push(msg);
    return !!cond;
  }

  B.ex = {
    register,
    get: (name) => types[name],
    names: () => Object.keys(types),
    label: (name) => (types[name] ? types[name].label : name),
    BLANK,
    richText,
    speakButton,
    bubble,
    header,
    filled,
    fillBlank,
    umlautBar,
    typedNote,
    asList,
    choices,
    questionTexts,
    need,
  };
})();

</script>
  <script>/* js/exercises/mc.js */
/*
 * Multiple choice.
 *   { type: 'mc', prompt, q?, correct: 'gearbeitet', wrong: ['arbeitet', 'arbeite'] }
 * Options are shuffled every time the card is shown. Keys 1–4 pick an option.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  B.ex.register('mc', {
    label: 'Multiple choice',

    validate(c) {
      const e = [];
      B.ex.need(e, typeof c.correct === 'string' && c.correct.length, 'mc needs "correct"');
      if (B.ex.need(e, Array.isArray(c.wrong) && c.wrong.length >= 1, 'mc needs a "wrong" list')) {
        B.ex.need(e, !c.wrong.includes(c.correct), 'the correct answer is also listed in "wrong"');
        B.ex.need(e, new Set(c.wrong).size === c.wrong.length, 'duplicate wrong options');
        B.ex.need(e, c.wrong.length <= 5, 'at most 6 options');
      }
      return e;
    },

    describe: (c) => ({ q: c.q ? c.q : c.prompt, a: show(c.correct) }),

    render(card, root, api) {
      const opts = shuffle([card.correct, ...card.wrong]);
      const long = opts.some((o) => show(o).length > 16);
      let sel = -1;
      let locked = false;

      const list = h('div', { class: 'choices ' + (long ? 'choices-col' : 'choices-grid'), role: 'radiogroup' });
      const btns = opts.map((o, i) => {
        const b = h('button', {
          class: 'choice',
          type: 'button',
          role: 'radio',
          'aria-checked': 'false',
          onClick: () => choose(i),
        },
          h('span', { class: 'key', 'aria-hidden': 'true' }, String(i + 1)),
          h('span', { class: 'choice-text', html: md(show(o)) })
        );
        list.append(b);
        return b;
      });

      function choose(i) {
        if (locked) return;
        sel = i;
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === i);
          b.setAttribute('aria-checked', String(j === i));
        });
        api.sfx('tap');
        api.changed(true);
      }

      root.append(B.ex.header(card, 'Choose the correct answer'), list);

      return {
        check: () => ({ ok: opts[sel] === card.correct, given: show(opts[sel]) }),
        solution: () => ({ html: md(show(card.correct)), say: B.ex.filled(card, card.correct) }),
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (opts[j] === card.correct) b.classList.add('good');
            else if (j === sel) b.classList.add('bad');
            else b.classList.add('dim');
          });
          B.ex.fillBlank(root, card.correct, res.ok ? 'good' : 'bad');
        },
        key(e) {
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= opts.length) {
            choose(n - 1);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/tf.js */
/*
 * True / false.
 *   { type: 'tf', prompt?, q?: 'German sentence', statement?: 'English claim',
 *     answer: true|false, fix?: 'the corrected sentence', labels?: ['Correct', 'Wrong'] }
 * Keys: 1 / T = first button, 2 / F = second.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show } = B.util;

  B.ex.register('tf', {
    label: 'True / false',

    validate(c) {
      const e = [];
      B.ex.need(e, typeof c.answer === 'boolean', 'tf needs "answer": true or false');
      B.ex.need(e, c.q || c.statement, 'tf needs "q" or "statement"');
      return e;
    },

    describe: (c) => ({
      q: [c.statement, c.q].filter(Boolean).join(' — ') || c.prompt,
      a: (c.answer ? (c.labels ? c.labels[0] : 'True') : c.labels ? c.labels[1] : 'False') + (c.fix ? ` → ${show(c.fix)}` : ''),
    }),

    render(card, root, api) {
      const labels = card.labels || ['True', 'False'];
      let sel = null;
      let locked = false;

      const head = B.ex.header(card, card.q ? 'Is this sentence correct?' : 'True or false?');
      if (card.statement) head.append(h('div', { class: 'tf-statement', html: md(show(card.statement)) }));

      const mk = (val, icon, label) =>
        h('button', {
          type: 'button',
          class: 'tf-btn ' + (val ? 'tf-yes' : 'tf-no'),
          'aria-pressed': 'false',
          onClick: () => choose(val),
        },
          h('span', { class: 'tf-icon', 'aria-hidden': 'true' }, icon),
          h('span', {}, label)
        );
      const yes = mk(true, '✓', labels[0]);
      const no = mk(false, '✗', labels[1]);

      function choose(val) {
        if (locked) return;
        sel = val;
        yes.classList.toggle('sel', val === true);
        no.classList.toggle('sel', val === false);
        yes.setAttribute('aria-pressed', String(val === true));
        no.setAttribute('aria-pressed', String(val === false));
        api.sfx('tap');
        api.changed(true);
      }

      root.append(head, h('div', { class: 'tf-row' }, yes, no));

      const answerLabel = card.answer ? labels[0] : labels[1];
      return {
        check: () => ({ ok: sel === card.answer, given: sel ? labels[0] : labels[1] }),
        solution: () => ({
          html: md(answerLabel) + (card.fix ? `<div class="sol-fix">✔ ${md(show(card.fix))}</div>` : ''),
          say: card.fix || (card.answer ? card.say || card.q : null),
        }),
        lock() {
          locked = true;
          for (const [btn, val] of [[yes, true], [no, false]]) {
            btn.disabled = true;
            if (val === card.answer) btn.classList.add('good');
            else if (val === sel) btn.classList.add('bad');
            else btn.classList.add('dim');
          }
        },
        key(e) {
          const k = e.key.toLowerCase();
          if (k === '1' || k === 't' || k === 'r' || k === 'y') return choose(true), true;
          if (k === '2' || k === 'f' || k === 'w' || k === 'n') return choose(false), true;
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/type.js */
/*
 * Typed answer. One wrong letter is forgiven as a typo (see core/check.js).
 *   { type: 'type', prompt, q?: 'Julia ___ in Salzburg.', hint?: 'wohnen',
 *     answer: 'wohnt' | ['alt 1', 'alt 2'], reject?: [...], strict?: true, noun?: true }
 * If q has a ___ the typed text appears live inside the sentence.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show } = B.util;

  B.ex.register('type', {
    label: 'Typed answer',

    validate(c) {
      const e = [];
      const answers = B.ex.asList(c.answer);
      B.ex.need(e, answers.length && answers.every((a) => typeof a === 'string' && a.trim()), 'type needs "answer"');
      if (c.reject) B.ex.need(e, !answers.some((a) => c.reject.includes(a)), 'an answer is also in "reject"');
      return e;
    },

    describe: (c) => ({ q: c.q || c.prompt, a: show(B.ex.asList(c.answer)[0]) }),

    render(card, root, api) {
      const answers = B.ex.asList(card.answer);
      const head = B.ex.header(card, 'Type the answer');
      const blank = head.querySelector('.blank-inline');
      const input = h('input', {
        class: 'type-input',
        type: 'text',
        autocomplete: 'off',
        autocorrect: 'off',
        autocapitalize: 'off',
        spellcheck: 'false',
        enterkeyhint: 'done',
        'aria-label': 'Your answer',
        placeholder: card.placeholder || (blank ? 'Type the missing word(s)' : 'Type your answer in German'),
      });
      input.addEventListener('input', () => {
        const v = input.value;
        if (blank) {
          blank.textContent = v || ' ';
          blank.classList.toggle('typing', !!v);
        }
        api.changed(v.trim().length > 0);
      });

      root.append(head, h('div', { class: 'type-box' }, input), B.ex.umlautBar(() => input));

      let res = null;
      return {
        focus: () => input.focus({ preventScroll: true }),
        check() {
          const given = input.value.trim();
          res = B.check.typed(given, answers, { reject: card.reject, strict: card.strict, nounHint: card.noun });
          return { ok: res.ok, given, typo: !!res.typo, note: B.ex.typedNote(res, given) };
        },
        solution() {
          const a = (res && res.matched) || answers[0];
          const say = card.sayAnswer || (card.q && B.ex.BLANK.test(card.q) ? B.ex.filled(card, a) : a);
          const alts = answers.filter((x) => x !== a);
          return {
            html: md(show(a)) + (alts.length ? `<div class="sol-alt">Also accepted: ${alts.map((x) => md(show(x))).join(', ')}</div>` : ''),
            say,
          };
        },
        lock(r) {
          input.disabled = true;
          input.classList.add(r.ok ? 'good' : 'bad');
          if (blank) blank.classList.add('filled', r.ok ? 'good' : 'bad');
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/table.js */
/*
 * Fill-in table (conjugation, participles …). Typed cells use the same typo rule.
 *   { type: 'table', verb: 'sein', blanks?: 4 }                  // rows from the verb list
 *   { type: 'table', head: ['Infinitiv', 'Perfekt'], rows: [['gehen', 'ist gegangen'], ...], blanks?: [0, 2] }
 * blanks: a number = that many random rows (default: up to 4), or explicit row indices.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  function rowsOf(card) {
    if (card.verb) return B.deck.verbRows(card.verb);
    return card.rows;
  }

  B.ex.register('table', {
    label: 'Fill-in table',

    validate(c, deck) {
      const e = [];
      if (c.verb) B.ex.need(e, deck.verbs[c.verb], `unknown verb "${c.verb}" (add it to data/lexicon.js)`);
      else B.ex.need(e, Array.isArray(c.rows) && c.rows.length >= 2 && c.rows.every((r) => r.length === 2), 'table needs "verb" or "rows" [[left, right], …]');
      if (Array.isArray(c.blanks)) {
        const n = c.verb ? 6 : (c.rows || []).length;
        B.ex.need(e, c.blanks.every((i) => i >= 0 && i < n), 'blank index out of range');
      }
      return e;
    },

    describe(c) {
      const rows = rowsOf(c) || [];
      return { q: c.prompt || (c.verb ? `Conjugate “${c.verb}”` : 'Fill in the table'), a: rows.map((r) => `${show(r[0])} ${show(r[1])}`).join(', ') };
    },

    render(card, root, api) {
      const rows = rowsOf(card);
      let blankIdx;
      if (Array.isArray(card.blanks)) blankIdx = card.blanks;
      else {
        const n = Math.min(rows.length, card.blanks || 4);
        blankIdx = shuffle(rows.map((_, i) => i)).slice(0, n);
      }
      const blanks = new Set(blankIdx);
      const head = card.head || ['', card.verb];
      const verb = card.verb && B.deck.verbs[card.verb];

      const inputs = [];
      let active = null;
      const tbody = h('tbody');
      rows.forEach((r, i) => {
        let cell;
        if (blanks.has(i)) {
          const input = h('input', {
            class: 'cell-input',
            type: 'text',
            autocomplete: 'off',
            autocorrect: 'off',
            autocapitalize: 'off',
            spellcheck: 'false',
            enterkeyhint: 'next',
            'aria-label': `${show(r[0])}`,
          });
          input.addEventListener('focus', () => (active = input));
          input.addEventListener('input', () => api.changed(inputs.every((x) => x.el.value.trim())));
          inputs.push({ el: input, row: i, answer: r[1] });
          cell = h('td', { class: 'cell-in' }, input, h('div', { class: 'cell-fix' }));
        } else {
          cell = h('td', { class: 'cell-given' }, show(r[1]));
        }
        tbody.append(h('tr', {}, h('th', { scope: 'row' }, show(r[0])), cell));
      });

      const title = card.prompt || (verb ? `Conjugate **${card.verb}**${verb.en ? ` (${verb.en})` : ''} in the present tense` : 'Fill in the table');
      const table = h('table', { class: 'fill-table' },
        head.some(Boolean) ? h('thead', {}, h('tr', {}, head.map((x) => h('th', { scope: 'col' }, show(x || ''))))) : null,
        tbody);

      root.append(B.ex.header(Object.assign({}, card, { prompt: title }), ''), h('div', { class: 'table-wrap' }, table), B.ex.umlautBar(() => active || inputs[0].el));

      let results = [];
      return {
        focus: () => inputs[0] && inputs[0].el.focus({ preventScroll: true }),
        glossTexts: () => B.ex.questionTexts(card).concat(
          card.verb ? [{ text: card.verb }] : [],
          rows.flatMap((r, i) => [{ text: show(r[0]) }].concat(blanks.has(i) ? [] : [{ text: show(r[1]) }]))),
        check() {
          results = inputs.map((x) => {
            const given = x.el.value.trim();
            const res = B.check.typed(given, [x.answer], { strict: card.strict });
            return Object.assign({ given }, x, { res });
          });
          const ok = results.every((r) => r.res.ok);
          const wrong = results.filter((r) => !r.res.ok);
          const typos = results.filter((r) => r.res.typo);
          const formErr = wrong.find((r) => r.res.reason === 'form');
          let note = null;
          if (ok && typos.length) note = `Small typo — accepted! Exact spelling: ${typos.map((t) => `**${show(t.answer)}**`).join(', ')}.`;
          else if (formErr) note = `“${formErr.given}” is a different form of the verb — the ending decides who is doing it, so it counts as wrong.`;
          const given = (wrong.length ? wrong : results).map((r) => `${show(rows[r.row][0])} → ${r.given || '—'}`).join(', ');
          return { ok, given, typo: typos.length > 0, note };
        },
        solution() {
          const list = rows.map((r, i) =>
            `<div class="sol-row${blanks.has(i) ? ' is-blank' : ''}"><span>${md(show(r[0]))}</span> <strong>${md(show(r[1]))}</strong></div>`
          ).join('');
          const say = verb ? rows.map((r) => `${r[0].split('/')[0]} ${r[1]}`).join(', ') : rows.map((r) => r[1]).join(', ');
          return { html: `<div class="sol-table">${list}</div>`, say };
        },
        lock() {
          for (const r of results) {
            r.el.disabled = true;
            r.el.classList.add(r.res.ok ? 'good' : 'bad');
            if (!r.res.ok || r.res.typo) r.el.parentNode.querySelector('.cell-fix').textContent = show(r.answer);
          }
        },
        key(e) {
          if (e.key !== 'Enter' || !e.target || !e.target.classList.contains('cell-input')) return false;
          // Enter jumps to the next empty cell; on the last one it falls through to "Check".
          const idx = inputs.findIndex((x) => x.el === e.target);
          const next = inputs.slice(idx + 1).concat(inputs.slice(0, idx)).find((x) => !x.el.value.trim());
          if (next) {
            next.el.focus();
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/order.js */
/*
 * Sentence builder: tap or drag word tiles into the right order.
 *   { type: 'order', en: 'I live in Vienna.', answer: 'Ich wohne in Wien.',
 *     start?: 'In meiner Freizeit',   // fixed beginning (practise the inversion)
 *     extra?: ['wohnt'],              // distractor tiles that don't belong
 *     answers?: ['…'],                // other correct orders
 *     keepCase?: true }               // keep the first word capitalised (nouns)
 * Words joined with "_" stay together on one tile: "St._Pölten".
 * The first tile is shown in lower case so capitals don't give the start away.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffleAway, splitSentence } = B.util;

  function lowerFirst(word, card) {
    const bare = word.replace(/[,;:]+$/, '');
    if (card.keepCase || B.deck.properNouns.has(bare) || B.deck.properNouns.has(show(bare))) return show(word);
    return show(word.charAt(0).toLowerCase() + word.slice(1));
  }

  function sentenceCase(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  B.ex.register('order', {
    label: 'Sentence builder',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.answer === 'string' && c.answer.trim(), 'order needs "answer"')) return e;
      const { words } = splitSentence(c.answer);
      B.ex.need(e, words.length >= 2, 'order needs at least 2 words');
      if (c.start) {
        const sw = splitSentence(c.start).words;
        B.ex.need(e, sw.length < words.length && sw.every((w, i) => norm(w) === norm(words[i])), '"start" must be the beginning of "answer"');
      }
      return e;
    },

    describe: (c) => ({ q: c.en ? `“${c.en}”` : c.prompt || 'Build the sentence', a: show(c.answer) }),

    render(card, root, api) {
      const { words, punct } = splitSentence(card.answer);
      const startWords = card.start ? splitSentence(card.start).words : [];
      const body = words.slice(startWords.length);
      const tiles = body
        .map((w, i) => ({ w, label: i === 0 && !startWords.length ? lowerFirst(w, card) : show(w) }))
        .concat((card.extra || []).map((w) => ({ w, label: show(w), extra: true })));
      const bankOrder = shuffleAway(tiles.map((_, i) => i));

      let locked = false;
      const answerEl = h('div', { class: 'order-answer', 'aria-label': 'Your sentence', role: 'list' });
      if (startWords.length) answerEl.append(h('span', { class: 'tile locked', title: 'Fixed start' }, show(card.start)));
      const bankEl = h('div', { class: 'order-bank', 'aria-label': 'Word bank' });
      const all = [];

      const placed = () => Array.from(answerEl.querySelectorAll('.tile:not(.locked)'));
      const moveAll = (mutate) => flip(all, mutate);
      const update = () => api.changed(placed().length > 0);

      function toAnswer(el) {
        moveAll(() => answerEl.append(el));
        el.setAttribute('aria-label', `${el.textContent} (tap to remove)`);
      }
      function toBank(el) {
        moveAll(() => el._slot.append(el));
        el.setAttribute('aria-label', el.textContent);
      }

      for (const i of bankOrder) {
        const t = tiles[i];
        const el = h('button', { class: 'tile', type: 'button', role: 'listitem' }, t.label);
        el._t = t;
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow', 'aria-hidden': 'true' }, t.label), el);
        el._slot = slot;
        all.push(el);
        bankEl.append(slot);

        el.addEventListener('click', () => {
          if (locked) return;
          if (el.parentNode === answerEl) toBank(el);
          else toAnswer(el);
          api.sfx('tap');
          update();
        });

        let lastMove = 0;
        B.drag.attach(el, {
          enabled: () => !locked,
          onMove(ctx) {
            const now = performance.now();
            if (now - lastMove < 60) return; // don't thrash while tiles are still gliding
            const r = answerEl.getBoundingClientRect();
            const inside = ctx.x > r.left - 16 && ctx.x < r.right + 16 && ctx.y > r.top - 20 && ctx.y < r.bottom + 20;
            if (inside) {
              const others = placed().filter((k) => k !== el);
              const idx = B.drag.insertIndex(answerEl, ctx.x, ctx.y, el, '.tile:not(.locked)');
              const cur = el.parentNode === answerEl ? others.filter((k) => k.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING).length : -1;
              if (cur !== idx) {
                lastMove = now;
                moveAll(() => answerEl.insertBefore(el, others[idx] || null));
              }
            } else if (el.parentNode === answerEl) {
              lastMove = now;
              moveAll(() => el._slot.append(el));
            }
          },
          onEnd() {
            api.sfx('drop');
            update();
            return el;
          },
        });
      }

      root.append(...[
        B.ex.header(card, 'Put the words in the right order', { noEn: true }),
        card.en ? h('div', { class: 'order-en' }, h('span', { class: 'order-en-label' }, 'Translate'), ' “' + card.en + '”') : null,
        h('div', { class: 'order-stage' }, answerEl),
        bankEl,
      ].filter(Boolean)); // append() would print a null as the text "null"

      function built() {
        return startWords.concat(placed().map((el) => el._t.w));
      }
      function display(list) {
        return list.length ? sentenceCase(show(list.join(' '))) + punct : '—';
      }

      return {
        check() {
          const got = norm(built().join(' '));
          const ok = [card.answer, ...(card.answers || [])].some((a) => norm(a) === got);
          return { ok, given: display(built()) };
        },
        solution: () => ({ html: md(show(card.answer)), say: show(card.answer) }),
        lock(res) {
          locked = true;
          all.forEach((el) => (el.disabled = true));
          answerEl.classList.add(res.ok ? 'good' : 'bad');
        },
        key(e) {
          if (e.key === 'Backspace' && !locked) {
            const last = placed().pop();
            if (last) {
              toBank(last);
              update();
            }
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/match.js */
/*
 * Match pairs: tap an item on the left, then its partner on the right.
 *   { type: 'match', prompt, pairs: [['wohnen', 'to live'], ['kommen', 'to come'], …] }
 * Pairs are only marked right/wrong after pressing Check. Tap a paired item to undo it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, shuffleAway } = B.util;
  const MAX = 6;

  B.ex.register('match', {
    label: 'Match pairs',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.pairs) && c.pairs.length >= 2, 'match needs at least 2 "pairs"')) return e;
      B.ex.need(e, c.pairs.length <= MAX, `at most ${MAX} pairs`);
      B.ex.need(e, c.pairs.every((p) => Array.isArray(p) && p.length === 2), 'each pair is [left, right]');
      B.ex.need(e, new Set(c.pairs.map((p) => p[0])).size === c.pairs.length, 'duplicate left items');
      B.ex.need(e, new Set(c.pairs.map((p) => p[1])).size === c.pairs.length, 'duplicate right items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Match the pairs', a: c.pairs.map((p) => `${show(p[0])} = ${show(p[1])}`).join(' · ') }),

    render(card, root, api) {
      const n = card.pairs.length;
      const leftOrder = shuffle(card.pairs.map((_, i) => i));
      const rightOrder = shuffleAway(leftOrder.slice());
      const link = new Map(); // left index -> right index
      const colorOf = new Map(); // left index -> colour slot
      let sel = null; // {side, i}
      let locked = false;

      const mk = (side, i) => {
        const text = card.pairs[i][side === 'L' ? 0 : 1];
        return h('button', { type: 'button', class: 'm-item', dataset: { side, i }, onClick: () => tap(side, i) },
          h('span', { class: 'm-badge', 'aria-hidden': 'true' }),
          h('span', { class: 'm-text', html: md(show(text)) }));
      };
      const L = leftOrder.map((i) => mk('L', i));
      const R = rightOrder.map((i) => mk('R', i));
      const elOf = (side, i) => (side === 'L' ? L[leftOrder.indexOf(i)] : R[rightOrder.indexOf(i)]);
      const partnerOf = (side, i) => {
        if (side === 'L') return link.has(i) ? link.get(i) : null;
        for (const [l, r] of link) if (r === i) return l;
        return null;
      };

      function freeColor() {
        const used = new Set(colorOf.values());
        for (let c = 0; c < MAX; c++) if (!used.has(c)) return c;
        return 0;
      }

      function unpair(l) {
        link.delete(l);
        colorOf.delete(l);
      }

      function tap(side, i) {
        if (locked) return;
        api.sfx('tap');
        const p = partnerOf(side, i);
        if (p !== null) {
          unpair(side === 'L' ? i : p);
          sel = { side, i };
        } else if (sel && sel.side !== side) {
          const l = side === 'L' ? i : sel.i;
          const r = side === 'R' ? i : sel.i;
          link.set(l, r);
          colorOf.set(l, freeColor());
          sel = null;
          paint();
          B.util.pulse(elOf('L', l), 'pop');
          B.util.pulse(elOf('R', r), 'pop');
          api.changed(link.size === n);
          return;
        } else if (sel && sel.side === side && sel.i === i) {
          sel = null;
        } else {
          sel = { side, i };
        }
        paint();
        api.changed(link.size === n);
      }

      function paint() {
        const order = [...link.keys()];
        for (const side of ['L', 'R']) {
          for (let i = 0; i < n; i++) {
            const el = elOf(side, i);
            const l = side === 'L' ? i : partnerOf('R', i);
            const paired = l !== null && link.has(l);
            el.classList.remove('paired', 'sel', ...Array.from({ length: MAX }, (_, c) => 'pc' + c));
            if (paired) el.classList.add('paired', 'pc' + colorOf.get(l));
            if (sel && sel.side === side && sel.i === i) el.classList.add('sel');
            el.querySelector('.m-badge').textContent = paired ? String(order.indexOf(l) + 1) : '';
            el.setAttribute('aria-pressed', String(!!(sel && sel.side === side && sel.i === i)));
          }
        }
      }

      root.append(
        B.ex.header(card, 'Match the pairs'),
        h('div', { class: 'match-grid', lang: 'de' }, h('div', { class: 'm-col' }, L), h('div', { class: 'm-col' }, R))
      );

      return {
        check() {
          const wrong = [...link].filter(([l, r]) => l !== r);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map(([l, r]) => `${show(card.pairs[l][0])} → ${show(card.pairs[r][1])}`).join(', ') : 'all pairs',
          };
        },
        solution: () => ({
          html: `<div class="sol-pairs">${card.pairs.map((p) => `<div><strong>${md(show(p[0]))}</strong> = ${md(show(p[1]))}</div>`).join('')}</div>`,
        }),
        lock() {
          locked = true;
          for (const [l, r] of link) {
            const cls = l === r ? 'good' : 'bad';
            elOf('L', l).classList.add(cls);
            elOf('R', r).classList.add(cls);
          }
          [...L, ...R].forEach((el) => (el.disabled = true));
        },
      };
    },
  });
})();
