  <script>/* js/core/drag.js */
/*
 * Minimal pointer-based drag helper (mouse, touch and pen share one code path).
 * A tap stays a normal click; the drag only starts after the pointer moves a
 * few pixels. While dragging, a floating clone follows the finger.
 *
 *   B.drag.attach(el, {
 *     onStart(ctx), onMove(ctx), onEnd(ctx)  // ctx: {el, ghost, x, y, over}
 *   })
 * onEnd may return a target element: the clone then glides into it before
 * disappearing; otherwise it glides back to el.
 */
(function () {
  'use strict';
  const B = window.Brezel;

  let suppressClickUntil = 0;
  window.addEventListener(
    'click',
    (e) => {
      if (Date.now() < suppressClickUntil) {
        e.stopPropagation();
        e.preventDefault();
      }
    },
    true
  );

  function attach(el, opts = {}) {
    const threshold = opts.threshold || 6;
    let start = null;
    let ctx = null;

    function under(x, y) {
      return document.elementFromPoint(x, y);
    }

    function down(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (opts.enabled && !opts.enabled()) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      // Listen on window: the element may be moved around the DOM mid-drag
      // (live re-ordering), which can drop pointer capture in some browsers.
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', cancel);
    }

    function begin(e) {
      const r = el.getBoundingClientRect();
      const ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.removeAttribute('id');
      Object.assign(ghost.style, {
        position: 'fixed',
        left: r.left + 'px',
        top: r.top + 'px',
        width: r.width + 'px',
        height: r.height + 'px',
        margin: '0',
        pointerEvents: 'none',
        zIndex: 1000,
      });
      document.body.appendChild(ghost);
      ctx = { el, ghost, dx: start.x - r.left, dy: start.y - r.top, x: e.clientX, y: e.clientY, over: null };
      el.classList.add('drag-src');
      document.body.classList.add('is-dragging');
      opts.onStart && opts.onStart(ctx);
    }

    function move(e) {
      if (!start || e.pointerId !== start.id) return;
      if (!ctx) {
        if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < threshold) return;
        begin(e);
      }
      e.preventDefault();
      ctx.x = e.clientX;
      ctx.y = e.clientY;
      ctx.ghost.style.left = e.clientX - ctx.dx + 'px';
      ctx.ghost.style.top = e.clientY - ctx.dy + 'px';
      ctx.over = under(e.clientX, e.clientY);
      opts.onMove && opts.onMove(ctx);
    }

    function finish(cancelled) {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      start = null;
      if (!ctx) return;
      const c = ctx;
      ctx = null;
      suppressClickUntil = Date.now() + 350;
      document.body.classList.remove('is-dragging');
      const dest = opts.onEnd ? opts.onEnd(Object.assign(c, { cancelled })) : null;
      settle(c, dest || el);
    }

    function up(e) {
      if (start && e.pointerId === start.id) finish(false);
    }
    function cancel(e) {
      if (start && e.pointerId === start.id) finish(true);
    }

    /** Glide the clone to where the real element ended up, then remove it. */
    function settle(c, target) {
      const done = () => {
        c.ghost.remove();
        c.el.classList.remove('drag-src');
      };
      // Let layout update (FLIP moves etc.) before measuring the destination.
      requestAnimationFrame(() => {
        const to = (target.isConnected ? target : c.el).getBoundingClientRect();
        if (B.util.reducedMotion() || typeof c.ghost.animate !== 'function') return done();
        const from = c.ghost.getBoundingClientRect();
        const anim = c.ghost.animate(
          [
            { transform: 'translate(0,0) scale(1.06)' },
            { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(1)` },
          ],
          { duration: 180, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
        );
        anim.onfinish = done;
        anim.oncancel = done;
      });
    }

    el.addEventListener('pointerdown', down);
    return () => el.removeEventListener('pointerdown', down);
  }

  /**
   * Index at which to insert a dragged item into a wrapping row of items,
   * based on the pointer position. `exclude` is the item being dragged.
   */
  function insertIndex(container, x, y, exclude, selector) {
    const kids = Array.from(container.children).filter(
      (k) => k !== exclude && !k.classList.contains('drag-ghost') && (!selector || k.matches(selector))
    );
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (y < r.top - 4) return i;
      if (y <= r.bottom + 4 && x < r.left + r.width / 2) return i;
    }
    return kids.length;
  }

  B.drag = { attach, insertIndex };
})();

  <script>/* js/core/gloss.js */
/*
 * Word translations: the dotted words in the speech bubble and the Glossary.
 *
 *   data/glossary.js   Brezel.gloss.addWords({ wohnt: 'live(s)', aß: 'ate | essen', 'es gibt': 'there is / there are',
 *                                           'stehe … auf': 'get up | aufstehen' })
 *                      "meaning | base form" shows the base form in the Glossary. A key with spaces is a
 *                      phrase; "a … b" is a split verb (b comes later in the same sentence).
 *                      Split forms of separable verbs in data/lexicon.js are added automatically.
 *   card.gloss         false: no translations at all (cards that ask what a word or sentence means)
 *                      { word: false }: hide that word ("that's what this card asks")
 *                      { word: 'text' }: a different meaning for this card only
 *
 * Only question text is translated (see Brezel.ex.questionTexts); answer choices never are,
 * so a translation can't give the answer away. Names (data/lexicon.js proper nouns) get none.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h } = B.util;

  const WORD = /\p{L}+(?:[-'’]\p{L}+)*/gu;
  const SPLIT = ' … ';
  const STOP = /[.!?;→–—]/; // ends the search for the second half of a split verb
  const OPEN = /[\s„“"'‚‘«»(\[]/;
  const MAX_PHRASE = 4;

  const words = Object.create(null); // form → {en, base}
  const phrases = Object.create(null); // "es gibt" → {en, base}
  const splits = Object.create(null); // "stehe … auf" → {en, base}
  const names = new Set();
  const baseOf = Object.create(null); // "wohnt" → "wohnen", from data/lexicon.js
  const lower = (s) => s.toLocaleLowerCase('de');

  function parse(v) {
    if (v === false) return { hidden: true };
    const [en, base] = String(v).split(' | ');
    return { en: en.trim(), base: base ? base.trim() : null };
  }

  function addWords(obj) {
    for (const [k, v] of Object.entries(obj)) {
      if (k.includes(SPLIT)) splits[lower(k)] = parse(v);
      else if (k.includes(' ')) phrases[lower(k)] = parse(v);
      else words[k] = parse(v);
    }
  }

  function addNames(list) {
    for (const n of list) names.add(lower(String(n).replace(/_/g, ' ')));
  }

  let ready = false;
  /** Lexicon facts are read lazily: data files load after this one. */
  function prepare() {
    if (ready) return;
    ready = true;
    addNames(B.deck.properNouns);
    for (const v of Object.values(B.deck.verbs)) {
      const meaning = String(v.en || '').replace(/^.*= /, '').replace(/^to /, '').replace(/ \/ to /g, ' / '); // "sich anziehen = to get dressed" → "get dressed"
      for (const f of [...(v.forms || []), ...(v.prt || [])]) {
        const [stem, prefix] = f.split(' ');
        if (prefix) {
          const key = lower(stem + SPLIT + prefix);
          if (!splits[key]) splits[key] = { en: meaning, base: v.inf };
        } else if (lower(f) !== lower(v.inf)) baseOf[lower(f)] = v.inf;
      }
      if (v.pp && lower(v.pp) !== lower(v.inf)) baseOf[lower(v.pp)] = v.inf;
    }
  }

  function cardOverride(card, key) {
    const o = card && card.gloss && typeof card.gloss === 'object' ? card.gloss : null;
    if (!o) return null;
    if (Object.prototype.hasOwnProperty.call(o, key)) return parse(o[key]);
    const k = lower(key);
    for (const ok of Object.keys(o)) if (lower(ok) === k) return parse(o[ok]);
    return null;
  }

  function lookupWord(w, initial, card) {
    const own = cardOverride(card, w);
    if (own) return own;
    const exact = words[w];
    const low = words[lower(w)];
    // "Sie" at the start of a sentence may be she, they or formal you
    if (initial && exact && low && exact !== low) return { en: `${low.en} / ${exact.en}`, base: low.base || exact.base };
    // verb: found under its lower-case entry, so a base form from the lexicon applies
    // ("Hast" → haben), but not to a noun with the same letters ("Frage" ≠ ich frage)
    if (exact || low) return Object.assign({ verb: !!(low && (low === exact || !exact)) }, exact || low);
    return words[w.charAt(0).toUpperCase() + w.slice(1)] || null;
  }

  function isInitial(text, at) {
    let i = at - 1;
    while (i >= 0 && OPEN.test(text[i])) i--;
    return i < 0 || /[.!?:…→–—]/.test(text[i]);
  }

  /**
   * Split text into word tokens with their translation:
   * {text, start, end, en, base, hidden, name, group, label}
   * Words in one phrase or split verb share a group number and a label ("stehe … auf").
   */
  function tokens(text, card) {
    prepare();
    const toks = [];
    for (const m of String(text).matchAll(WORD)) toks.push({ text: m[0], start: m.index, end: m.index + m[0].length });
    const gap = (a, b) => text.slice(toks[a].end, toks[b].start);
    let group = 0;

    // phrases and multi-word names, longest first
    for (let i = 0; i < toks.length; i++) {
      for (let n = Math.min(MAX_PHRASE, toks.length - i); n >= 2; n--) {
        const run = toks.slice(i, i + n);
        // words next to each other; a dot is allowed for abbreviations ("St. Pölten")
        if (run.some((t) => t.group) || run.slice(1).some((t, k) => !/^\.?\s+$/.test(gap(i + k, i + k + 1)))) continue;
        const key = text.slice(run[0].start, run[n - 1].end).replace(/\s+/g, ' ');
        const hit = cardOverride(card, key) || phrases[lower(key)];
        if (hit || names.has(lower(key))) {
          group++;
          for (const t of run) Object.assign(t, hit || { name: true }, { group, label: key });
          i += n - 1;
          break;
        }
      }
    }

    // split verbs: "Heute stehe ich um 7:30 auf."
    for (let i = 0; i < toks.length; i++) {
      if (toks[i].group) continue;
      for (let k = i + 1; k < toks.length; k++) {
        if (STOP.test(gap(k - 1, k))) break;
        if (toks[k].group) continue;
        const key = toks[i].text + SPLIT + toks[k].text;
        const hit = cardOverride(card, key) || splits[lower(key)];
        if (hit) {
          group++;
          const label = k === i + 1 ? toks[i].text + ' ' + toks[k].text : key; // "schloss ab" in a table cell
          for (const t of [toks[i], toks[k]]) Object.assign(t, hit, { group, label });
          break;
        }
      }
    }

    for (const t of toks) {
      if (t.group) continue;
      const hit = lookupWord(t.text, isInitial(text, t.start), card);
      if (hit) Object.assign(t, hit);
      else if (names.has(lower(t.text))) t.name = true;
    }
    return toks;
  }

  const known = (t) => t.en || t.hidden;

  // --- is this German? (for reading answer choices aloud) -------------------------------------------
  const POLISH = /[ąćęłńśźżĄĆĘŁŃŚŹŻ]/;
  let germanWords = null;
  /** Every German word the app knows: glossary, lexicon forms, word families, names. */
  function germanIndex() {
    if (germanWords) return germanWords;
    prepare();
    germanWords = new Set();
    const add = (w) => String(w || '').split(/[\s…]+/).forEach((x) => x && germanWords.add(lower(x)));
    Object.keys(words).forEach(add);
    Object.keys(phrases).forEach(add);
    Object.keys(splits).forEach(add);
    Object.keys(baseOf).forEach(add);
    for (const v of Object.values(B.deck.verbs)) [v.inf, v.pp, ...(v.forms || []), ...(v.prt || [])].forEach(add);
    B.deck.families.flat().forEach(add);
    names.forEach(add);
    return germanWords;
  }

  /** True when most words of the text are German (an umlaut or ß is enough; Polish letters are not). */
  function isGerman(text) {
    const s = String(text == null ? '' : text).replace(/_/g, ' ');
    if (!s.trim() || POLISH.test(s)) return false;
    const toks = [...s.matchAll(WORD)].map((m) => m[0]);
    if (!toks.length) return false;
    if (/[äöüßÄÖÜ]/.test(s)) return true;
    const idx = germanIndex();
    const hits = toks.filter((w) => idx.has(lower(w))).length;
    return hits * 2 > toks.length;
  }

  /**
   * Glossary rows for a card: [{de, en, base, hidden}] in reading order, without repeats.
   * texts: [{text, loose?}]; a loose text (from the instructions) is used only if every word is known,
   * so English or Polish words in an instruction are left out.
   */
  function entries(card, texts) {
    if (card && card.gloss === false) return [];
    const rows = [];
    const seen = new Set();
    for (const { text, loose } of texts) {
      const toks = tokens(text, card);
      if (loose && toks.some((t) => !known(t) && !t.name)) continue;
      const done = new Set();
      for (const t of toks) {
        if (!known(t) || done.has(t.group || t)) continue;
        done.add(t.group || t);
        const de = t.label || t.text;
        const base = t.base || (t.verb && baseOf[lower(de)]) || null;
        const key = lower(de) + '=' + (t.en || '');
        if (seen.has(key)) continue;
        seen.add(key);
        rows.push({ de, en: t.en || '', base: base && lower(base) !== lower(de) ? base : null, hidden: !!t.hidden });
      }
    }
    return rows;
  }

  /** Words in non-loose texts that have no translation (used by tools/validate.js). */
  function missing(card, texts) {
    const out = [];
    for (const { text, loose } of texts) {
      if (loose) continue;
      for (const t of tokens(text, card)) if (!known(t) && !t.name) out.push(t.text);
    }
    return out;
  }

  // --- dotted words + tooltip ------------------------------------------------------------
  const SKIP = '.blank-inline, .gap-slot, button';
  let tip = null;
  let tipWord = null;
  let pinned = false;

  /** Wrap every translated word inside el in a dotted span. Blanks and buttons are left alone. */
  function decorate(el, card) {
    if (!el || (card && card.gloss === false)) return;
    const parts = [];
    let text = '';
    (function walk(node) {
      for (const n of Array.from(node.childNodes)) {
        if (n.nodeType === 3) {
          parts.push({ n, at: text.length });
          text += n.nodeValue;
        } else if (n.nodeType === 1) {
          if (n.matches(SKIP)) text += ' _ ';
          else walk(n);
        }
      }
    })(el);
    const toks = tokens(text, card).filter(known);
    if (!toks.length) return;
    el._gloss = toks;

    for (const { n, at } of parts) {
      const end = at + n.nodeValue.length;
      const mine = toks.filter((t) => t.start < end && t.end > at);
      if (!mine.length) continue;
      const frag = document.createDocumentFragment();
      let pos = at;
      for (const t of mine) {
        const s = Math.max(t.start, at);
        const e = Math.min(t.end, end);
        if (s > pos) frag.append(text.slice(pos, s));
        frag.append(h('span', { class: 'gw', dataset: { t: String(toks.indexOf(t)), g: String(t.group || '') } }, text.slice(s, e)));
        pos = e;
      }
      if (pos < end) frag.append(text.slice(pos, end));
      n.replaceWith(frag);
    }

    el.addEventListener('pointerover', (e) => {
      const w = e.pointerType === 'mouse' && wordAt(e.target, el);
      if (w && !pinned) showTip(w, el);
    });
    el.addEventListener('pointerout', (e) => {
      if (e.pointerType !== 'mouse' || pinned || !tipWord) return;
      const rel = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget : null;
      if (rel && rel.closest('.gloss-tip')) return; // moving onto the tip (its 🔊 button)
      const to = rel ? rel.closest('.gw') : null;
      if (!to || to.dataset.t !== tipWord.dataset.t) hideTip();
    });
    el.addEventListener('click', (e) => {
      const w = wordAt(e.target, el);
      if (!w) return;
      if (pinned && tipWord && tipWord.dataset.t === w.dataset.t) return hideTip();
      showTip(w, el);
      pinned = true;
    });
  }

  function wordAt(node, root) {
    const w = node && node.closest ? node.closest('.gw') : null;
    return w && root.contains(w) ? w : null;
  }

  function showTip(w, root) {
    const t = root._gloss[+w.dataset.t];
    if (!t) return;
    if (!tip) {
      tip = h('div', { class: 'gloss-tip', role: 'tooltip', id: 'gloss-tip', hidden: true });
      tip.addEventListener('pointerleave', (e) => {
        if (e.pointerType === 'mouse' && !pinned) hideTip();
      });
      document.body.append(tip);
      document.addEventListener('pointerdown', (e) => {
        if (tip.hidden || (e.target.closest && (e.target.closest('.gw') || e.target.closest('.gloss-tip')))) return;
        hideTip();
      }, true);
      window.addEventListener('resize', hideTip);
      window.addEventListener('scroll', hideTip, true);
    }
    hideTip();
    tipWord = w;
    // light up the whole phrase or split verb, and both halves of a word split by **bold** markup
    root.querySelectorAll(t.group ? `.gw[data-g="${t.group}"]` : `.gw[data-t="${w.dataset.t}"]`).forEach((x) => x.classList.add('on'));
    w.setAttribute('aria-describedby', 'gloss-tip');
    const say = (t.label || t.text).replace(/ … /g, ' ');
    const sayBtn = B.audio && B.audio.canSpeak
      ? h('button', { type: 'button', class: 'gloss-tip-say', 'aria-label': 'Listen to ' + say, title: 'Listen' }, '🔊')
      : null;
    if (sayBtn) {
      sayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        B.audio.speak(say);
      });
    }
    tip.replaceChildren(...[
      t.group && !t.name && t.label.includes(' ') ? h('span', { class: 'gloss-tip-de' }, t.label) : null,
      t.hidden ? h('span', { class: 'gloss-tip-en is-hidden' }, '🤫 That’s what this card asks!') : h('span', { class: 'gloss-tip-en' }, t.en),
      sayBtn,
    ].filter(Boolean));
    tip.hidden = false;
    place(w);
  }

  function place(w) {
    const r = w.getClientRects()[0] || w.getBoundingClientRect();
    tip.classList.remove('above');
    tip.style.left = '0px';
    tip.style.top = '0px';
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    const vw = document.documentElement.clientWidth;
    const cx = r.left + r.width / 2;
    const left = Math.max(8, Math.min(cx - tw / 2, vw - tw - 8));
    let top = r.bottom + 10;
    if (top + th > window.innerHeight - 8) {
      top = r.top - th - 10;
      tip.classList.add('above');
    }
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.setProperty('--arrow', Math.round(cx - left) + 'px');
  }

  function hideTip() {
    pinned = false;
    if (tipWord) {
      document.querySelectorAll('.gw.on').forEach((x) => x.classList.remove('on'));
      tipWord.removeAttribute('aria-describedby');
      tipWord = null;
    }
    if (tip) tip.hidden = true;
  }

  B.gloss = {
    addWords,
    addNames,
    tokens,
    entries,
    missing,
    decorate,
    hideTip,
    isGerman,
    tipOpen: () => !!(tip && !tip.hidden),
  };
})();

</script>

  <!-- exercise types (plugins) -->
  <script>/* js/exercises/base.js */
/*
 * Exercise registry. Every exercise type is a plugin:
 *
 *   Brezel.ex.register('mc', {
 *     label: 'Multiple choice',
 *     validate(card, deck) -> [error strings]        // run once at start-up
 *     describe(card)       -> {q, a}                 // plain text for the review screen
 *     render(card, root, api) -> controller
 *   })
 *
 * controller = {
 *   check()    -> {ok, given, note?, typo?}  // given = what the learner answered (text)
 *   solution() -> {html, say?}               // the correct answer, shown when wrong
 *   lock(res)  -> void                       // freeze + colour the answer after checking
 *   key?(e)    -> true if the key was handled
 *   focus?()   -> focus the main input
 *   glossTexts?() -> question text for the Glossary, if more than questionTexts(card) is shown
 *   hints?     -> how many 💡 Help me steps this card offers (0 or missing = none)
 *   hint?(step) -> give hint number `step` (1, 2 …): change the card (remove options, place a
 *                  word …) and return { note? } (markdown-lite shown under the card) or { html? }
 *                  (ready, escaped markup), or null when there is nothing more to give
 * }
 * api = { changed(ready), submit(), sfx(name), speak(text), say?(text), card }
 *   say(text): read a German word aloud the moment the learner picks it (only with sound on);
 *   other screens (games) may leave it out, so call it as api.say && api.say(x).
 *
 * Common card fields: id, type, prompt (instruction), q (German text shown in the
 * speech bubble, "___" marks a blank), say (text for the speaker button),
 * en (English meaning, shown small), explain (the "why", shown after answering),
 * rule (id from data/rules.js, shown in the Glossary), asksRule (the rule gives the answer away),
 * theory (a question about the rule itself, so it is in the Rules topic too),
 * gloss (word translations: see js/core/gloss.js), say (what the bubble's 🔊 reads; default: the
 * German question with blanks as pauses), sayChoices (true/false: read the options aloud when picked;
 * default: when they are German).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm } = B.util;

  const types = Object.create(null);
  const BLANK = /_{3,}/;

  function register(name, def) {
    def.name = name;
    types[name] = def;
  }

  /** Markdown-lite + "___" blanks (done before show(), which turns _ into spaces). */
  function richText(text) {
    return String(text == null ? '' : text)
      .split(BLANK)
      .map((part) => md(show(part)))
      .join('<span class="blank-inline">&nbsp;</span>');
  }

  function speakButton(say) {
    if (!say || !B.audio.canSpeak) return null;
    return h('button', {
      class: 'speak-btn',
      type: 'button',
      'aria-label': 'Listen',
      title: 'Listen',
      onClick: (e) => {
        e.stopPropagation();
        B.audio.speak(say);
      },
    }, '🔊');
  }

  /** Mascot + speech bubble. */
  function bubble(text, { say, big } = {}) {
    return h('div', { class: 'bubble-row' },
      h('div', { class: 'mascot', 'aria-hidden': 'true' }, '🥨'),
      h('div', { class: 'bubble' + (big ? ' bubble-big' : '') },
        speakButton(say),
        h('span', { class: 'bubble-text', html: richText(text) }))
    );
  }

  /**
   * What the bubble's 🔊 reads: card.say, or the German question with blanks and gaps as pauses.
   * Not for true/false and spot-the-mistake: their sentence may be wrong, and hearing it would teach it.
   */
  function questionSay(card) {
    if (card.say) return card.say;
    if (!card.q || card.type === 'tf' || card.type === 'spot') return null;
    const text = show(String(card.q).replace(/\{[^}]*\}/g, ' … ').replace(new RegExp(BLANK.source, 'g'), ' … '));
    return B.gloss.isGerman(text) ? text : null;
  }

  /** Are these answer choices German (so they are read aloud when picked)? */
  function germanChoices(card, list) {
    if (card.sayChoices != null) return !!card.sayChoices;
    if (card.q && BLANK.test(card.q) && B.gloss.isGerman(card.q.replace(BLANK, ' '))) return true;
    if (card.correct && B.gloss.isGerman(card.correct)) return true;
    return list.filter((x) => B.gloss.isGerman(x)).length * 2 > list.length;
  }

  /** "l _ _ _ _" (step 1: first letters) or "li e _ _" (step 2: half of each word), for typed hints. */
  function letterHint(answer, step) {
    return show(answer).split(/\s+/).map((w) => {
      const keep = step <= 1 ? 1 : Math.ceil(w.length / 2);
      return Array.from(w).map((ch, i) => (i < keep || /[^\p{L}]/u.test(ch) ? ch : '_')).join(' ');
    }).join('   ');
  }

  /** Title + optional bubble — the standard top of every exercise. */
  function header(card, fallback, opts = {}) {
    const wrap = h('div', { class: 'ex-head' });
    wrap.append(h('h2', { class: 'ex-title', html: md(card.prompt || fallback) }));
    if (card.q && !opts.noBubble) {
      const b = bubble(card.q, { say: questionSay(card), big: opts.big });
      B.gloss.decorate(b.querySelector('.bubble-text'), card);
      wrap.append(b);
    }
    if (card.en && !opts.noEn) wrap.append(h('p', { class: 'ex-en' }, '“' + card.en + '”'));
    if (card.hint) wrap.append(h('p', { class: 'ex-hint' }, h('span', { 'aria-hidden': 'true' }, '💡 '), show(card.hint)));
    return wrap;
  }

  /** The question sentence with its blank filled in (for speech and solutions). */
  function filled(card, answer) {
    if (card.sayAnswer) return card.sayAnswer;
    if (card.q && BLANK.test(card.q)) return show(card.q.replace(BLANK, answer));
    return card.say || null;
  }

  /** Put text into the bubble's blank after checking. */
  function fillBlank(root, text, cls) {
    const b = root.querySelector('.blank-inline');
    if (!b) return;
    b.textContent = show(text);
    b.classList.add('filled');
    if (cls) b.classList.add(cls);
  }

  /** Buttons for ä ö ü ß; inserts into whichever input is active. */
  function umlautBar(getInput) {
    const chars = ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'];
    return h('div', { class: 'umlauts', role: 'group', 'aria-label': 'Special letters' },
      chars.map((ch) =>
        h('button', {
          type: 'button',
          class: 'umlaut',
          tabindex: '-1',
          // pointerdown + preventDefault keeps the keyboard open on phones
          onPointerdown: (e) => e.preventDefault(),
          onClick: () => {
            const input = getInput();
            if (!input || input.disabled) return;
            const s = input.selectionStart ?? input.value.length;
            const t = input.selectionEnd ?? input.value.length;
            input.value = input.value.slice(0, s) + ch + input.value.slice(t);
            input.focus();
            input.setSelectionRange(s + 1, s + 1);
            input.dispatchEvent(new Event('input', { bubbles: true }));
          },
        }, ch)
      )
    );
  }

  /** Typed-answer feedback note (typo accepted / wrong form / capital letter). */
  function typedNote(res, given) {
    if (res.ok && res.typo) return `Small typo — accepted! Exact spelling: **${show(res.matched)}**.`;
    if (res.ok && res.caseNote) return res.caseNote;
    if (!res.ok && res.reason === 'form') {
      return `Close, but “${given}” is a different grammatical form — one letter changes the grammar here, so it counts as wrong.`;
    }
    if (!res.ok && res.reason === 'short') {
      return 'Close — but short words like *ist, bin, im, ins, dem* must be spelled exactly: one letter changes the word.';
    }
    return null;
  }

  const asList = (x) => (Array.isArray(x) ? x : x == null ? [] : [x]);

  /** Every answer option and accepted answer of a card. */
  function choices(c) {
    const gaps = c.type === 'gap' && c.q ? [...c.q.matchAll(/\{([^}]+)\}/g)].flatMap((m) => m[1].split('|')) : [];
    return [
      c.correct, ...asList(c.wrong), ...asList(c.options), ...asList(c.extra), c.fix,
      ...(typeof c.answer === 'string' || Array.isArray(c.answer) ? asList(c.answer) : []), ...asList(c.answers),
      ...(c.pairs || []).flat(), ...(c.buckets || []).flatMap((b) => b.items || []), ...gaps,
    ].filter((x) => typeof x === 'string');
  }

  /**
   * The German the learner sees before answering — the only text the Glossary translates:
   * emphasised words in the instruction (unless they are answer options), the bubble with
   * its blanks and gaps left empty, the hint and a fixed sentence start.
   */
  function questionTexts(card) {
    // a blank stays as "_", so the word after it doesn't count as the start of a sentence
    const plain = (s) => String(s).split(BLANK).map(show).join(' _ ');
    const out = [];
    // short options ("ist", "hat gelesen") must not be translated; a full answer sentence may repeat prompt words
    const opts = choices(card).map(norm).filter((o) => o.split(' ').length <= 3).map((o) => ` ${o} `);
    for (const m of String(card.prompt || '').matchAll(/\*\*(.+?)\*\*|\*(.+?)\*/g)) {
      const seg = m[1] || m[2];
      const n = norm(seg.replace(BLANK, ' '));
      if (n && !opts.some((o) => o.includes(` ${n} `))) out.push({ text: plain(seg), loose: true });
    }
    if (card.q) out.push({ text: plain(card.q.replace(/\{[^}]+\}/g, '___')) });
    // a hint may be English ("as") or carry a translation: "aufhören (to stop / finish)"
    if (card.hint) out.push({ text: plain(String(card.hint).replace(/\s*\([^)]*\)/g, '')), loose: true });
    if (card.start) out.push({ text: plain(card.start) });
    return out;
  }

  /** Validation helper: collect messages when conditions fail. */
  function need(errs, cond, msg) {
    if (!cond) errs.push(msg);
    return !!cond;
  }

  B.ex = {
    register,
    get: (name) => types[name],
    names: () => Object.keys(types),
    label: (name) => (types[name] ? types[name].label : name),
    BLANK,
    richText,
    speakButton,
    questionSay,
    germanChoices,
    letterHint,
    bubble,
    header,
    filled,
    fillBlank,
    umlautBar,
    typedNote,
    asList,
    choices,
    questionTexts,
    need,
  };
})();

  <script>/* js/exercises/mc.js */
/*
 * Multiple choice.
 *   { type: 'mc', prompt, q?, correct: 'gearbeitet', wrong: ['arbeitet', 'arbeite'] }
 * Options are shuffled every time the card is shown. Keys 1–4 pick an option.
 * A German option is read aloud the moment it is picked. 💡 Help me removes wrong options until two are left.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  B.ex.register('mc', {
    label: 'Multiple choice',

    validate(c) {
      const e = [];
      B.ex.need(e, typeof c.correct === 'string' && c.correct.length, 'mc needs "correct"');
      if (B.ex.need(e, Array.isArray(c.wrong) && c.wrong.length >= 1, 'mc needs a "wrong" list')) {
        B.ex.need(e, !c.wrong.includes(c.correct), 'the correct answer is also listed in "wrong"');
        B.ex.need(e, new Set(c.wrong).size === c.wrong.length, 'duplicate wrong options');
        B.ex.need(e, c.wrong.length <= 5, 'at most 6 options');
      }
      return e;
    },

    describe: (c) => ({ q: c.q ? c.q : c.prompt, a: show(c.correct) }),

    render(card, root, api) {
      const opts = shuffle([card.correct, ...card.wrong]);
      const long = opts.some((o) => show(o).length > 16);
      const german = B.ex.germanChoices(card, opts);
      const gone = new Set(); // options removed by Help me
      let sel = -1;
      let locked = false;

      const list = h('div', { class: 'choices ' + (long ? 'choices-col' : 'choices-grid'), role: 'radiogroup' });
      const btns = opts.map((o, i) => {
        const b = h('button', {
          class: 'choice',
          type: 'button',
          role: 'radio',
          'aria-checked': 'false',
          onClick: () => choose(i),
        },
          h('span', { class: 'key', 'aria-hidden': 'true' }, String(i + 1)),
          h('span', { class: 'choice-text', html: md(show(o)) })
        );
        list.append(b);
        return b;
      });

      function choose(i) {
        if (locked || gone.has(i)) return;
        const again = sel === i;
        sel = i;
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === i);
          b.setAttribute('aria-checked', String(j === i));
        });
        api.sfx('tap');
        if (german && api.say && !again) api.say(opts[i]);
        api.changed(true);
      }

      root.append(B.ex.header(card, 'Choose the correct answer'), list);

      return {
        check: () => ({ ok: opts[sel] === card.correct, given: show(opts[sel]) }),
        solution: () => ({ html: md(show(card.correct)), say: B.ex.filled(card, card.correct) }),
        hints: opts.length > 2 ? 1 : 0,
        hint() {
          if (gone.size || opts.length <= 2) return null;
          // leave the right answer and one wrong one
          const wrong = shuffle(opts.map((_, i) => i).filter((i) => opts[i] !== card.correct));
          wrong.slice(0, opts.length - 2).forEach((i) => {
            gone.add(i);
            btns[i].disabled = true;
            btns[i].classList.add('gone');
            btns[i].classList.remove('sel');
          });
          if (gone.has(sel)) {
            sel = -1;
            api.changed(false);
          }
          const n = gone.size;
          return { note: n === 1 ? 'One wrong answer is gone.' : `${n === 2 ? 'Two' : n} wrong answers are gone — it’s one of these two.` };
        },
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (opts[j] === card.correct) b.classList.add('good');
            else if (j === sel) b.classList.add('bad');
            else b.classList.add('dim');
          });
          B.ex.fillBlank(root, card.correct, res.ok ? 'good' : 'bad');
        },
        key(e) {
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= opts.length) {
            choose(n - 1);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

 * Typed answer. One wrong letter is forgiven as a typo (see core/check.js).
 *   { type: 'type', prompt, q?: 'Julia ___ in Salzburg.', hint?: 'wohnen',
 *     answer: 'wohnt' | ['alt 1', 'alt 2'], reject?: [...], strict?: true, noun?: true }
 * If q has a ___ the typed text appears live inside the sentence.

(function () {

          blank.textContent = v || ' ';
          blank.classList.toggle('typing', !!v);

      });

      root.append(head, h('div', { class: 'type-box' }, input), B.ex.umlautBar(() => input));

      let res = null;

  <script>/* js/exercises/table.js */
/*
 * Fill-in table (conjugation, participles …). Typed cells use the same typo rule.
 *   { type: 'table', verb: 'sein', blanks?: 4 }                  // rows from the verb list
 *   { type: 'table', head: ['Infinitiv', 'Perfekt'], rows: [['gehen', 'ist gegangen'], ...], blanks?: [0, 2] }
 * blanks: a number = that many random rows (default: up to 4), or explicit row indices.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  function rowsOf(card) {
    if (card.verb) return B.deck.verbRows(card.verb);
    return card.rows;
  }

  B.ex.register('table', {
    label: 'Fill-in table',

    validate(c, deck) {
      const e = [];
      if (c.verb) B.ex.need(e, deck.verbs[c.verb], `unknown verb "${c.verb}" (add it to data/lexicon.js)`);
      else B.ex.need(e, Array.isArray(c.rows) && c.rows.length >= 2 && c.rows.every((r) => r.length === 2), 'table needs "verb" or "rows" [[left, right], …]');
      if (Array.isArray(c.blanks)) {
        const n = c.verb ? 6 : (c.rows || []).length;
        B.ex.need(e, c.blanks.every((i) => i >= 0 && i < n), 'blank index out of range');
      }
      return e;
    },

    describe(c) {
      const rows = rowsOf(c) || [];
      return { q: c.prompt || (c.verb ? `Conjugate “${c.verb}”` : 'Fill in the table'), a: rows.map((r) => `${show(r[0])} ${show(r[1])}`).join(', ') };
    },

    render(card, root, api) {
      const rows = rowsOf(card);
      let blankIdx;
      if (Array.isArray(card.blanks)) blankIdx = card.blanks;
      else {
        const n = Math.min(rows.length, card.blanks || 4);
        blankIdx = shuffle(rows.map((_, i) => i)).slice(0, n);
      }
      const blanks = new Set(blankIdx);
      const head = card.head || ['', card.verb];
      const verb = card.verb && B.deck.verbs[card.verb];

      const inputs = [];
      let active = null;
      const tbody = h('tbody');
      rows.forEach((r, i) => {
        let cell;
        if (blanks.has(i)) {
          const input = h('input', {
            class: 'cell-input',
            type: 'text',
            autocomplete: 'off',
            autocorrect: 'off',
            autocapitalize: 'off',
            spellcheck: 'false',
            enterkeyhint: 'next',
            'aria-label': `${show(r[0])}`,
          });
          input.addEventListener('focus', () => (active = input));
          input.addEventListener('input', () => api.changed(inputs.every((x) => x.el.value.trim())));
          inputs.push({ el: input, row: i, answer: r[1] });
          cell = h('td', { class: 'cell-in' }, input, h('div', { class: 'cell-fix' }));
        } else {
          cell = h('td', { class: 'cell-given' }, show(r[1]));
        }
        tbody.append(h('tr', {}, h('th', { scope: 'row' }, show(r[0])), cell));
      });

      const title = card.prompt || (verb ? `Conjugate **${card.verb}**${verb.en ? ` (${verb.en})` : ''} in the present tense` : 'Fill in the table');
      const table = h('table', { class: 'fill-table' },
        head.some(Boolean) ? h('thead', {}, h('tr', {}, head.map((x) => h('th', { scope: 'col' }, show(x || ''))))) : null,
        tbody);

      root.append(B.ex.header(Object.assign({}, card, { prompt: title }), ''), h('div', { class: 'table-wrap' }, table), B.ex.umlautBar(() => active || inputs[0].el));

      let results = [];
      const hinted = new Set(); // inputs filled in by Help me
      return {
        focus: () => inputs[0] && inputs[0].el.focus({ preventScroll: true }),
        // 1. the first letter of every blank, then one blank filled in at a time (never the last one)
        hints: inputs.length > 1 ? inputs.length : 1,
        hint(step) {
          if (step === 1) {
            inputs.forEach((x) => (x.el.placeholder = B.ex.letterHint(x.answer, 1).replace(/ (?=_)|(?<=_) /g, '')));
            return { note: 'Each blank now shows its first letter.' };
          }
          const next = inputs.find((x) => !hinted.has(x) && B.util.norm(x.el.value) !== B.util.norm(x.answer));
          if (!next || hinted.size >= inputs.length - 1) return null;
          hinted.add(next);
          next.el.value = show(next.answer);
          next.el.readOnly = true;
          next.el.classList.add('hinted');
          api.changed(inputs.every((x) => x.el.value.trim()));
          return { note: `Filled in for you: **${show(rows[next.row][0])} → ${show(next.answer)}**.` };
        },
        glossTexts: () => B.ex.questionTexts(card).concat(
          card.verb ? [{ text: card.verb }] : [],
          rows.flatMap((r, i) => [{ text: show(r[0]) }].concat(blanks.has(i) ? [] : [{ text: show(r[1]) }]))),
        check() {
          results = inputs.map((x) => {
            const given = x.el.value.trim();
            const res = B.check.typed(given, [x.answer], { strict: card.strict });
            return Object.assign({ given }, x, { res });
          });
          const ok = results.every((r) => r.res.ok);
          const wrong = results.filter((r) => !r.res.ok);
          const typos = results.filter((r) => r.res.typo);
          const formErr = wrong.find((r) => r.res.reason === 'form');
          let note = null;
          if (ok && typos.length) note = `Small typo — accepted! Exact spelling: ${typos.map((t) => `**${show(t.answer)}**`).join(', ')}.`;
          else if (formErr) note = `“${formErr.given}” is a different form of the verb — the ending decides who is doing it, so it counts as wrong.`;
          const given = (wrong.length ? wrong : results).map((r) => `${show(rows[r.row][0])} → ${r.given || '—'}`).join(', ');
          return { ok, given, typo: typos.length > 0, note };
        },
        solution() {
          const list = rows.map((r, i) =>
            `<div class="sol-row${blanks.has(i) ? ' is-blank' : ''}"><span>${md(show(r[0]))}</span> <strong>${md(show(r[1]))}</strong></div>`
          ).join('');
          const say = verb ? rows.map((r) => `${r[0].split('/')[0]} ${r[1]}`).join(', ') : rows.map((r) => r[1]).join(', ');
          return { html: `<div class="sol-table">${list}</div>`, say };
        },
        lock() {
          for (const r of results) {
            r.el.disabled = true;
            r.el.classList.add(r.res.ok ? 'good' : 'bad');
            if (!r.res.ok || r.res.typo) r.el.parentNode.querySelector('.cell-fix').textContent = show(r.answer);
          }
        },
        key(e) {
          if (e.key !== 'Enter' || !e.target || !e.target.classList.contains('cell-input')) return false;
          // Enter jumps to the next empty cell; on the last one it falls through to "Check".
          const idx = inputs.findIndex((x) => x.el === e.target);
          const next = inputs.slice(idx + 1).concat(inputs.slice(0, idx)).find((x) => !x.el.value.trim());
          if (next) {
            next.el.focus();
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/order.js */
/*
 * Sentence builder: tap or drag word tiles into the right order.
 *   { type: 'order', en: 'I live in Vienna.', answer: 'Ich wohne in Wien.',
 *     start?: 'In meiner Freizeit',   // fixed beginning (practise the inversion)
 *     extra?: ['wohnt'],              // distractor tiles that don't belong
 *     answers?: ['…'],                // other correct orders
 *     keepCase?: true }               // keep the first word capitalised (nouns)
 * Words joined with "_" stay together on one tile: "St._Pölten".
 * The first tile is shown in lower case so capitals don't give the start away.
 * A tile is read aloud when it goes into the sentence. 💡 Help me: the extra tiles disappear, then the
 * right words are placed one by one from the start (never the whole sentence).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffleAway, splitSentence } = B.util;

  function lowerFirst(word, card) {
    const bare = word.replace(/[,;:]+$/, '');
    if (card.keepCase || B.deck.properNouns.has(bare) || B.deck.properNouns.has(show(bare))) return show(word);
    return show(word.charAt(0).toLowerCase() + word.slice(1));
  }

  function sentenceCase(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  B.ex.register('order', {
    label: 'Sentence builder',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.answer === 'string' && c.answer.trim(), 'order needs "answer"')) return e;
      const { words } = splitSentence(c.answer);
      B.ex.need(e, words.length >= 2, 'order needs at least 2 words');
      if (c.start) {
        const sw = splitSentence(c.start).words;
        B.ex.need(e, sw.length < words.length && sw.every((w, i) => norm(w) === norm(words[i])), '"start" must be the beginning of "answer"');
      }
      return e;
    },

    describe: (c) => ({ q: c.en ? `“${c.en}”` : c.prompt || 'Build the sentence', a: show(c.answer) }),

    render(card, root, api) {
      const { words, punct } = splitSentence(card.answer);
      const startWords = card.start ? splitSentence(card.start).words : [];
      const body = words.slice(startWords.length);
      const tiles = body
        .map((w, i) => ({ w, label: i === 0 && !startWords.length ? lowerFirst(w, card) : show(w) }))
        .concat((card.extra || []).map((w) => ({ w, label: show(w), extra: true })));
      const bankOrder = shuffleAway(tiles.map((_, i) => i));

      let locked = false;
      const answerEl = h('div', { class: 'order-answer', 'aria-label': 'Your sentence', role: 'list' });
      if (startWords.length) answerEl.append(h('span', { class: 'tile locked', title: 'Fixed start' }, show(card.start)));
      const bankEl = h('div', { class: 'order-bank', 'aria-label': 'Word bank' });
      const all = [];

      const placed = () => Array.from(answerEl.querySelectorAll('.tile:not(.locked)'));
      const moveAll = (mutate) => flip(all, mutate);
      const update = () => api.changed(placed().length > 0);
      const fixedCount = () => all.filter((el) => el._fixed).length; // words placed by Help me

      function toAnswer(el) {
        moveAll(() => answerEl.append(el));
        el.setAttribute('aria-label', `${el.textContent} (tap to remove)`);
        if (api.say) api.say(el._t.w);
      }
      function toBank(el) {
        moveAll(() => el._slot.append(el));
        el.setAttribute('aria-label', el.textContent);
      }

      for (const i of bankOrder) {
        const t = tiles[i];
        const el = h('button', { class: 'tile', type: 'button', role: 'listitem' }, t.label);
        el._t = t;
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow', 'aria-hidden': 'true' }, t.label), el);
        el._slot = slot;
        all.push(el);
        bankEl.append(slot);

        el.addEventListener('click', () => {
          if (locked || el._fixed) return;
          if (el.parentNode === answerEl) toBank(el);
          else toAnswer(el);
          api.sfx('tap');
          update();
        });

        let lastMove = 0;
        B.drag.attach(el, {
          enabled: () => !locked && !el._fixed,
          onMove(ctx) {
            const now = performance.now();
            if (now - lastMove < 60) return; // don't thrash while tiles are still gliding
            const r = answerEl.getBoundingClientRect();
            const inside = ctx.x > r.left - 16 && ctx.x < r.right + 16 && ctx.y > r.top - 20 && ctx.y < r.bottom + 20;
            if (inside) {
              const others = placed().filter((k) => k !== el);
              // never in front of the words Help me placed
              const idx = Math.max(fixedCount(), B.drag.insertIndex(answerEl, ctx.x, ctx.y, el, '.tile:not(.locked)'));
              const cur = el.parentNode === answerEl ? others.filter((k) => k.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING).length : -1;
              if (cur !== idx) {
                lastMove = now;
                moveAll(() => answerEl.insertBefore(el, others[idx] || null));
              }
            } else if (el.parentNode === answerEl) {
              lastMove = now;
              moveAll(() => el._slot.append(el));
            }
          },
          onEnd() {
            api.sfx('drop');
            update();
            return el;
          },
        });
      }

      root.append(...[
        B.ex.header(card, 'Put the words in the right order', { noEn: true }),
        card.en ? h('div', { class: 'order-en' }, h('span', { class: 'order-en-label' }, 'Translate'), ' “' + card.en + '”') : null,
        h('div', { class: 'order-stage' }, answerEl),
        bankEl,
      ].filter(Boolean)); // append() would print a null as the text "null"

      function built() {
        return startWords.concat(placed().map((el) => el._t.w));
      }
      function display(list) {
        return list.length ? sentenceCase(show(list.join(' '))) + punct : '—';
      }

      const extras = all.filter((el) => el._t.extra);
      let extrasGone = false;
      return {
        hints: (extras.length ? 1 : 0) + Math.max(0, body.length - 1),
        hint() {
          if (extras.length && !extrasGone) {
            extrasGone = true;
            moveAll(() => extras.forEach((el) => {
              if (el.parentNode === answerEl) el._slot.append(el);
              el._slot.classList.add('gone');
              el.disabled = true;
            }));
            update();
            return { note: extras.length === 1 ? 'The tile that doesn’t belong is gone.' : `The ${extras.length} tiles that don’t belong are gone.` };
          }
          const k = fixedCount();
          if (k >= body.length - 1) return null;
          // the next word of the sentence: a free tile with that word
          const want = body[k];
          const el = all.find((x) => !x._fixed && !x._t.extra && x._t.w === want);
          if (!el) return null;
          moveAll(() => {
            // take back what doesn't fit behind the fixed words, then put the word in its place
            placed().filter((x) => !x._fixed).forEach((x) => x._slot.append(x));
            const fixedEls = placed().filter((x) => x._fixed);
            answerEl.insertBefore(el, fixedEls.length ? fixedEls[fixedEls.length - 1].nextSibling : answerEl.querySelector('.tile:not(.locked)'));
          });
          el._fixed = true;
          el.classList.add('hinted');
          el.setAttribute('aria-label', `${el.textContent} (placed by Help me)`);
          update();
          return { note: k === 0 ? `The sentence starts with **${el.textContent}**.` : `Word ${k + 1} is **${el.textContent}**.` };
        },
        check() {
          const got = norm(built().join(' '));
          const ok = [card.answer, ...(card.answers || [])].some((a) => norm(a) === got);
          return { ok, given: display(built()) };
        },
        solution: () => ({ html: md(show(card.answer)), say: show(card.answer) }),
        lock(res) {
          locked = true;
          all.forEach((el) => (el.disabled = true));
          answerEl.classList.add(res.ok ? 'good' : 'bad');
        },
        key(e) {
          if (e.key === 'Backspace' && !locked) {
            const last = placed().pop();
            if (last && !last._fixed) {
              toBank(last);
              update();
            }
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/match.js */
/*
 * Match pairs: tap an item on the left, then its partner on the right.
 *   { type: 'match', prompt, pairs: [['wohnen', 'to live'], ['kommen', 'to come'], …] }
 * Pairs are only marked right/wrong after pressing Check. Tap a paired item to undo it.
 * A German item is read aloud when tapped. 💡 Help me joins one right pair per step (two always stay open).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, shuffleAway } = B.util;
  const MAX = 6;

  B.ex.register('match', {
    label: 'Match pairs',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.pairs) && c.pairs.length >= 2, 'match needs at least 2 "pairs"')) return e;
      B.ex.need(e, c.pairs.length <= MAX, `at most ${MAX} pairs`);
      B.ex.need(e, c.pairs.every((p) => Array.isArray(p) && p.length === 2), 'each pair is [left, right]');
      B.ex.need(e, new Set(c.pairs.map((p) => p[0])).size === c.pairs.length, 'duplicate left items');
      B.ex.need(e, new Set(c.pairs.map((p) => p[1])).size === c.pairs.length, 'duplicate right items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Match the pairs', a: c.pairs.map((p) => `${show(p[0])} = ${show(p[1])}`).join(' · ') }),

    render(card, root, api) {
      const n = card.pairs.length;
      const leftOrder = shuffle(card.pairs.map((_, i) => i));
      const rightOrder = shuffleAway(leftOrder.slice());
      const link = new Map(); // left index -> right index
      const colorOf = new Map(); // left index -> colour slot
      let sel = null; // {side, i}
      let locked = false;
      const fixed = new Set(); // left indices joined by Help me
      const german = { L: B.ex.germanChoices({}, card.pairs.map((p) => p[0])), R: B.ex.germanChoices({}, card.pairs.map((p) => p[1])) };

      const mk = (side, i) => {
        const text = card.pairs[i][side === 'L' ? 0 : 1];
        return h('button', { type: 'button', class: 'm-item', dataset: { side, i }, onClick: () => tap(side, i) },
          h('span', { class: 'm-badge', 'aria-hidden': 'true' }),
          h('span', { class: 'm-text', html: md(show(text)) }));
      };
      const L = leftOrder.map((i) => mk('L', i));
      const R = rightOrder.map((i) => mk('R', i));
      const elOf = (side, i) => (side === 'L' ? L[leftOrder.indexOf(i)] : R[rightOrder.indexOf(i)]);
      const partnerOf = (side, i) => {
        if (side === 'L') return link.has(i) ? link.get(i) : null;
        for (const [l, r] of link) if (r === i) return l;
        return null;
      };

      function freeColor() {
        const used = new Set(colorOf.values());
        for (let c = 0; c < MAX; c++) if (!used.has(c)) return c;
        return 0;
      }

      function unpair(l) {
        link.delete(l);
        colorOf.delete(l);
      }

      function tap(side, i) {
        if (locked) return;
        const p = partnerOf(side, i);
        if (fixed.has(side === 'L' ? i : p)) return;
        api.sfx('tap');
        if (api.say && german[side]) api.say(card.pairs[i][side === 'L' ? 0 : 1]);
        if (p !== null) {
          unpair(side === 'L' ? i : p);
          sel = { side, i };
        } else if (sel && sel.side !== side) {
          const l = side === 'L' ? i : sel.i;
          const r = side === 'R' ? i : sel.i;
          link.set(l, r);
          colorOf.set(l, freeColor());
          sel = null;
          paint();
          B.util.pulse(elOf('L', l), 'pop');
          B.util.pulse(elOf('R', r), 'pop');
          api.changed(link.size === n);
          return;
        } else if (sel && sel.side === side && sel.i === i) {
          sel = null;
        } else {
          sel = { side, i };
        }
        paint();
        api.changed(link.size === n);
      }

      function paint() {
        const order = [...link.keys()];
        for (const side of ['L', 'R']) {
          for (let i = 0; i < n; i++) {
            const el = elOf(side, i);
            const l = side === 'L' ? i : partnerOf('R', i);
            const paired = l !== null && link.has(l);
            el.classList.remove('paired', 'sel', ...Array.from({ length: MAX }, (_, c) => 'pc' + c));
            if (paired) el.classList.add('paired', 'pc' + colorOf.get(l));
            if (sel && sel.side === side && sel.i === i) el.classList.add('sel');
            el.querySelector('.m-badge').textContent = paired ? String(order.indexOf(l) + 1) : '';
            el.setAttribute('aria-pressed', String(!!(sel && sel.side === side && sel.i === i)));
          }
        }
      }

      root.append(
        B.ex.header(card, 'Match the pairs'),
        h('div', { class: 'match-grid', lang: 'de' }, h('div', { class: 'm-col' }, L), h('div', { class: 'm-col' }, R))
      );

      return {
        hints: Math.max(0, n - 2),
        hint() {
          if (fixed.size >= n - 2) return null;
          const l = shuffle([...Array(n).keys()].filter((i) => !fixed.has(i) && link.get(i) !== i))[0];
          if (l == null) return null;
          // free both items, then join the right pair
          unpair(l);
          const other = partnerOf('R', l);
          if (other !== null) unpair(other);
          link.set(l, l);
          colorOf.set(l, freeColor());
          fixed.add(l);
          elOf('L', l).classList.add('hinted');
          elOf('R', l).classList.add('hinted');
          if (sel && (sel.i === l)) sel = null;
          paint();
          B.util.pulse(elOf('L', l), 'pop');
          B.util.pulse(elOf('R', l), 'pop');
          api.changed(link.size === n);
          return { note: `Joined for you: **${show(card.pairs[l][0])} = ${show(card.pairs[l][1])}**.` };
        },
        check() {
          const wrong = [...link].filter(([l, r]) => l !== r);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map(([l, r]) => `${show(card.pairs[l][0])} → ${show(card.pairs[r][1])}`).join(', ') : 'all pairs',
          };
        },
        solution: () => ({
          html: `<div class="sol-pairs">${card.pairs.map((p) => `<div><strong>${md(show(p[0]))}</strong> = ${md(show(p[1]))}</div>`).join('')}</div>`,
        }),
        lock() {
          locked = true;
          for (const [l, r] of link) {
            const cls = l === r ? 'good' : 'bad';
            elOf('L', l).classList.add(cls);
            elOf('R', r).classList.add(cls);
          }
          [...L, ...R].forEach((el) => (el.disabled = true));
        },
      };
    },
  });
})();

  <script>/* js/exercises/gap.js */
/*
 * Fill the gaps with word chips.
 *   { type: 'gap', q: 'Ich {bin} 1990 in Polen {geboren}.', options: ['habe', 'gebären'] }
 * {…} marks a gap; "{ins|in das}" accepts either. options = extra wrong chips.
 * Tap a chip to drop it into the highlighted gap; tap a filled gap to empty it.
 * A chip is read aloud when it goes into a gap. 💡 Help me: half of the wrong chips disappear, then the
 * gaps are filled one by one (never the last one).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffle } = B.util;
  const GAP = /\{([^}]+)\}/g;

  function parse(q) {
    const parts = [];
    let last = 0;
    let m;
    GAP.lastIndex = 0;
    while ((m = GAP.exec(q))) {
      if (m.index > last) parts.push({ text: q.slice(last, m.index) });
      parts.push({ gap: m[1].split('|').map((s) => s.trim()) });
      last = m.index + m[0].length;
    }
    if (last < q.length) parts.push({ text: q.slice(last) });
    return parts;
  }

  const fill = (card, get) => parse(card.q).map((p, i) => (p.gap ? get(p, i) : p.text)).join('');

  B.ex.register('gap', {
    label: 'Fill the gaps',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string', 'gap needs "q" with {gaps}')) return e;
      B.ex.need(e, parse(c.q).some((p) => p.gap), 'gap needs at least one {gap} in "q"');
      return e;
    },

    describe: (c) => ({ q: show(c.q.replace(GAP, '___')), a: show(fill(c, (p) => p.gap[0])) }),

    render(card, root, api) {
      const parts = parse(card.q);
      const gaps = [];
      let locked = false;
      let active = 0;

      const sentence = h('div', { class: 'gap-sentence' });
      parts.forEach((p) => {
        if (!p.gap) {
          sentence.append(h('span', { html: md(show(p.text)) }));
          return;
        }
        const g = { answers: p.gap, chip: null };
        g.el = h('button', { type: 'button', class: 'gap-slot', 'aria-label': 'Empty gap', onClick: () => tapGap(g) });
        gaps.push(g);
        sentence.append(g.el);
      });

      const chipWords = shuffle(gaps.map((g) => g.answers[0]).concat(card.options || []));
      const bank = h('div', { class: 'chip-bank' });
      const chips = chipWords.map((w) => {
        const el = h('button', { type: 'button', class: 'chip', onClick: () => tapChip(c) }, show(w));
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow chip-shadow', 'aria-hidden': 'true' }, show(w)), el);
        const c = { w, el, slot, gap: null };
        bank.append(slot);
        return c;
      });
      const allEls = () => chips.map((c) => c.el);

      function paint() {
        const firstEmpty = gaps.findIndex((g) => !g.chip);
        if (gaps[active] && gaps[active].chip && firstEmpty >= 0) active = firstEmpty;
        gaps.forEach((g, i) => {
          g.el.classList.toggle('active', !locked && i === active && !g.chip);
          g.el.classList.toggle('has-chip', !!g.chip);
          g.el.setAttribute('aria-label', g.chip ? `Gap: ${show(g.chip.w)} (tap to remove)` : 'Empty gap');
        });
        api.changed(gaps.every((g) => g.chip));
      }

      function tapChip(c) {
        if (locked || c.gone) return;
        api.sfx('tap');
        if (c.gap) return tapGap(c.gap);
        if (api.say) api.say(c.w);
        let g = gaps[active] && !gaps[active].chip ? gaps[active] : gaps.find((x) => !x.chip);
        if (!g) {
          // every gap is full: swap with the active gap's chip (not one placed by Help me)
          g = gaps[active] && !gaps[active].fixed ? gaps[active] : gaps.find((x) => !x.fixed);
          if (!g) return;
          unplace(g);
        }
        flip(allEls(), () => {
          g.el.append(c.el);
          g.chip = c;
          c.gap = g;
        });
        active = gaps.indexOf(g) + 1;
        if (active >= gaps.length || gaps[active].chip) active = Math.max(0, gaps.findIndex((x) => !x.chip));
        paint();
      }

      function unplace(g) {
        const c = g.chip;
        if (!c) return;
        c.slot.append(c.el);
        c.gap = null;
        g.chip = null;
      }

      function tapGap(g) {
        if (locked || g.fixed) return;
        if (g.chip) {
          api.sfx('tap');
          flip(allEls(), () => unplace(g));
        }
        active = gaps.indexOf(g);
        paint();
      }

      B.gloss.decorate(sentence, card);
      const speak = B.ex.speakButton(B.ex.questionSay(card));
      root.append(B.ex.header(card, 'Fill in the gaps', { noBubble: true }), h('div', { class: 'gap-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), sentence, speak), bank);
      paint();

      const filledWith = () => fill(card, (p, i) => {
        const g = gaps[parts.slice(0, i).filter((x) => x.gap).length];
        return g.chip ? g.chip.w : '___';
      });

      const wrongChips = chips.filter((c) => !gaps.some((g) => g.answers.some((a) => norm(a) === norm(c.w))));
      let trimmed = false;
      const fits = (g, c) => g.answers.some((a) => norm(a) === norm(c.w));
      return {
        hints: (wrongChips.length ? 1 : 0) + Math.max(0, gaps.length - 1),
        hint() {
          if (wrongChips.length && !trimmed) {
            trimmed = true;
            const out = shuffle(wrongChips).slice(0, Math.max(1, Math.ceil(wrongChips.length / 2)));
            flip(allEls(), () => out.forEach((c) => {
              if (c.gap) unplace(c.gap);
              c.gone = true;
              c.el.disabled = true;
              c.slot.classList.add('gone');
            }));
            paint();
            return { note: out.length === 1 ? 'One wrong chip is gone.' : `${out.length} wrong chips are gone.` };
          }
          const open = gaps.filter((g) => !g.fixed);
          if (open.length <= 1) return null;
          const g = open[0];
          const c = chips.find((x) => !x.gone && !(x.gap && x.gap.fixed) && fits(g, x));
          if (!c) return null;
          flip(allEls(), () => {
            if (g.chip && g.chip !== c) unplace(g);
            if (c.gap && c.gap !== g) unplace(c.gap);
            g.el.append(c.el);
            g.chip = c;
            c.gap = g;
          });
          g.fixed = true;
          g.el.classList.add('hinted');
          active = Math.max(0, gaps.findIndex((x) => !x.chip));
          paint();
          return { note: `Gap ${gaps.indexOf(g) + 1}: **${show(c.w)}**.` };
        },
        check() {
          const ok = gaps.every((g) => g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w)));
          return { ok, given: show(filledWith()) };
        },
        solution() {
          const html = parts.map((p) => (p.gap ? `<strong class="sol-mark">${md(show(p.gap[0]))}</strong>` : md(show(p.text)))).join('');
          return { html, say: show(fill(card, (p) => p.gap[0])) };
        },
        lock() {
          locked = true;
          gaps.forEach((g) => {
            const ok = g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w));
            g.el.classList.add(ok ? 'good' : 'bad');
            g.el.disabled = true;
          });
          chips.forEach((c) => (c.el.disabled = true));
          paint();
        },
        key(e) {
          const n = parseInt(e.key, 10);
          const free = chips.filter((c) => !c.gap && !c.gone);
          if (n >= 1 && n <= free.length) {
            tapChip(free[n - 1]);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/sort.js */
/*
 * Sort words into groups (der / die / das, haben / sein, present / past …).
 *   { type: 'sort', prompt, buckets: [{ label: 'der', sub: 'masculine', items: ['Zug', 'Bus'] }, …] }
 * Tap a word, then tap a group — or drag the word onto the group. A German word is read aloud when picked.
 * 💡 Help me puts one word in its right group per step (half of the words at most).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, flip, shuffle } = B.util;

  B.ex.register('sort', {
    label: 'Sort into groups',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.buckets) && c.buckets.length >= 2 && c.buckets.length <= 4, 'sort needs 2–4 "buckets"')) return e;
      B.ex.need(e, c.buckets.every((b) => b.label && Array.isArray(b.items) && b.items.length), 'each bucket needs a label and items');
      const items = c.buckets.flatMap((b) => b.items || []);
      B.ex.need(e, new Set(items).size === items.length, 'an item appears twice');
      B.ex.need(e, items.length <= 12, 'at most 12 items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Sort into groups', a: c.buckets.map((b) => `${show(b.label)}: ${b.items.map(show).join(', ')}`).join(' | ') }),

    render(card, root, api) {
      let locked = false;
      let sel = null;
      const pool = h('div', { class: 'sort-pool', 'aria-label': 'Words to sort', onClick: () => dropInto(-1) });
      const zones = card.buckets.map((b, bi) => {
        const items = h('div', { class: 'bucket-items' });
        const el = h('div', { class: 'bucket', role: 'button', tabindex: '0', 'aria-label': `Group ${show(b.label)}`, onClick: () => dropInto(bi) },
          h('div', { class: 'bucket-head' }, h('span', { class: 'bucket-label', html: md(show(b.label)) }), b.sub ? h('span', { class: 'bucket-sub' }, show(b.sub)) : null),
          items);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            dropInto(bi);
          }
        });
        return { el, items };
      });

      const chips = shuffle(card.buckets.flatMap((b, bi) => b.items.map((text) => ({ text, correct: bi, where: -1 }))));
      const german = B.ex.germanChoices(card, chips.map((c) => c.text));
      chips.forEach((c) => {
        c.el = h('button', { type: 'button', class: 'chip sort-chip' }, show(c.text));
        c.el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (locked || c.fixed) return;
          api.sfx('tap');
          sel = sel === c ? null : c;
          if (sel && german && api.say) api.say(c.text);
          paint();
        });
        B.drag.attach(c.el, {
          enabled: () => !locked && !c.fixed,
          onStart: () => {
            sel = null;
            paint();
          },
          onMove(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz, i) => zz.el.classList.toggle('hover', z === i));
            pool.classList.toggle('hover', z === -1 && c.where !== -1);
          },
          onEnd(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz) => zz.el.classList.remove('hover'));
            pool.classList.remove('hover');
            if (z !== null) place(c, z);
            api.sfx('drop');
            return c.el;
          },
        });
        pool.append(c.el);
      });

      function zoneAt(node) {
        if (!node || !node.closest) return null;
        const b = node.closest('.bucket');
        if (b) return zones.findIndex((z) => z.el === b);
        if (node.closest('.sort-pool')) return -1;
        return null;
      }

      function place(c, where) {
        if (c.where === where) return;
        flip(chips.map((x) => x.el), () => {
          (where === -1 ? pool : zones[where].items).append(c.el);
          c.where = where;
        });
      }

      function dropInto(where) {
        if (locked || !sel) return;
        api.sfx('drop');
        place(sel, where);
        sel = null;
        paint();
      }

      function paint() {
        chips.forEach((c) => {
          c.el.classList.toggle('sel', sel === c);
          c.el.setAttribute('aria-pressed', String(sel === c));
        });
        zones.forEach((z) => z.el.classList.toggle('target', !!sel));
        pool.classList.toggle('empty', chips.every((c) => c.where !== -1));
        api.changed(chips.every((c) => c.where !== -1));
      }

      // keep the "ready" state in sync after drags too
      const obs = new MutationObserver(paint);
      obs.observe(pool, { childList: true });

      root.append(
        B.ex.header(card, 'Sort the words into the right group'),
        pool,
        h('div', { class: 'buckets buckets-' + zones.length }, zones.map((z) => z.el))
      );
      paint();

      return {
        hints: Math.floor(chips.length / 2),
        hint() {
          const todo = chips.filter((c) => !c.fixed && c.where !== c.correct);
          if (!todo.length || chips.filter((c) => c.fixed).length >= Math.floor(chips.length / 2)) return null;
          const c = shuffle(todo)[0];
          if (sel === c) sel = null;
          place(c, c.correct);
          c.fixed = true;
          c.el.classList.add('hinted');
          paint();
          return { note: `**${show(c.text)}** → ${show(card.buckets[c.correct].label)}.` };
        },
        check() {
          const wrong = chips.filter((c) => c.where !== c.correct);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map((c) => `${show(c.text)} → ${show(card.buckets[c.where] ? card.buckets[c.where].label : '?')}`).join(', ') : 'all correct',
          };
        },
        solution: () => ({
          html: `<div class="sol-buckets">${card.buckets.map((b) => `<div><strong>${md(show(b.label))}:</strong> ${b.items.map((x) => md(show(x))).join(', ')}</div>`).join('')}</div>`,
        }),
        lock() {
          locked = true;
          sel = null;
          obs.disconnect();
          paint();
          zones.forEach((z) => z.el.classList.remove('target'));
          chips.forEach((c) => {
            c.el.disabled = true;
            const ok = c.where === c.correct;
            c.el.classList.add(ok ? 'good' : 'bad');
            if (!ok) c.el.append(h('span', { class: 'chip-fix' }, '→ ' + show(card.buckets[c.correct].label)));
          });
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/spot.js */
/*
 * Spot the mistake: tap the one wrong word in the sentence.
 *   { type: 'spot', q: 'Ich habe nach München umgezogen.', wrong: 'habe', correct: 'bin' }
 * Optional: at (word index, if the wrong word appears twice), fixed (full corrected sentence).
 * A tapped word is read aloud. 💡 Help me greys out words that are right (1. half of them, 2. all but three).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, shuffle } = B.util;

  const bare = (t) => t.replace(/[.,!?;:…]+$/, '');
  const tokens = (q) => q.trim().split(/\s+/);
  const wrongIndex = (c) => (Number.isInteger(c.at) ? c.at : tokens(c.q).findIndex((t) => norm(bare(t)) === norm(c.wrong)));

  function corrected(c) {
    if (c.fixed) return c.fixed;
    const t = tokens(c.q);
    const i = wrongIndex(c);
    t[i] = c.correct + t[i].slice(bare(t[i]).length);
    return t.join(' ');
  }

  B.ex.register('spot', {
    label: 'Spot the mistake',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string' && c.wrong && c.correct, 'spot needs "q", "wrong" and "correct"')) return e;
      B.ex.need(e, wrongIndex(c) >= 0, `"${c.wrong}" is not a word in the sentence`);
      return e;
    },

    describe: (c) => ({ q: c.q, a: `${show(c.wrong)} → ${show(c.correct)}: ${show(corrected(c))}` }),

    render(card, root, api) {
      const words = tokens(card.q);
      const wi = wrongIndex(card);
      let sel = -1;
      let locked = false;

      const line = h('div', { class: 'spot-line' });
      const btns = words.map((w, i) => {
        const b = h('button', { type: 'button', class: 'spot-word', 'aria-pressed': 'false', onClick: () => choose(i) }, show(w));
        line.append(b);
        return b;
      });

      const cleared = new Set(); // words Help me marked as right
      function choose(i) {
        if (locked || cleared.has(i)) return;
        sel = sel === i ? -1 : i;
        if (sel >= 0 && api.say) api.say(bare(words[i]));
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === sel);
          b.setAttribute('aria-pressed', String(j === sel));
        });
        api.sfx('tap');
        api.changed(sel >= 0);
      }

      root.append(
        B.ex.header(card, 'Tap the word that is **wrong**', { noBubble: true }),
        h('div', { class: 'spot-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), line)
      );

      const fix = corrected(card);
      const clear = (keep) => {
        const others = shuffle(words.map((_, i) => i).filter((i) => i !== wi && !cleared.has(i)));
        const n = Math.max(0, others.length - keep);
        others.slice(0, n).forEach((i) => {
          cleared.add(i);
          btns[i].disabled = true;
          btns[i].classList.add('cleared');
          if (sel === i) {
            sel = -1;
            btns[i].classList.remove('sel');
            api.changed(false);
          }
        });
        return n;
      };
      return {
        hints: words.length > 5 ? 2 : words.length > 3 ? 1 : 0,
        hint(step) {
          const left = words.length - cleared.size - 1;
          const n = clear(step === 1 && words.length > 5 ? Math.ceil(left / 2) : 2);
          return n ? { note: `${n} word${n === 1 ? ' is' : 's are'} certainly right — they’re greyed out.` } : null;
        },
        check: () => ({ ok: sel === wi, given: sel >= 0 ? `“${show(bare(words[sel]))}”` : '—' }),
        solution: () => ({
          html: `<span class="sol-strike">${md(show(bare(words[wi])))}</span> → <strong>${md(show(card.correct))}</strong><div class="sol-fix">✔ ${md(show(fix))}</div>`,
          say: show(fix),
        }),
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (j === wi) {
              b.classList.add(res.ok ? 'good' : 'was-wrong');
              b.after(h('span', { class: 'spot-fix' }, show(card.correct) + words[wi].slice(bare(words[wi]).length)));
              b.classList.add('struck');
            } else if (j === sel) b.classList.add('bad');
          });
        },
      };
    },
  });
})();

</script>

    { inf: 'gewinnen', pr: 'gewinnt', prt: 'gewann', pf: 'hat gewonnen',

    { inf: 'sich anziehen', pr: 'zieht sich an', prt: 'zog sich an', pf: 'hat sich angezogen', sep: 'an' },

    { inf: 'sich verlieben', pr: 'verliebt sich', prt: 'verliebte sich', pf: 'hat sich verliebt' },

  const refl = (v) => v.inf.startsWith('sich ');

  function ruleWords(ids) {

      const r = Brezel.deck.ruleMap[id];

  function prWhy(v) {
