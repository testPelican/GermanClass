  <script>/* js/exercises/gap.js */
/*
 * Fill the gaps with word chips.
 *   { type: 'gap', q: 'Ich {bin} 1990 in Polen {geboren}.', options: ['habe', 'gebären'] }
 * {…} marks a gap; "{ins|in das}" accepts either. options = extra wrong chips.
 * Tap a chip to drop it into the highlighted gap; tap a filled gap to empty it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffle } = B.util;
  const GAP = /\{([^}]+)\}/g;

  function parse(q) {
    const parts = [];
    let last = 0;
    let m;
    GAP.lastIndex = 0;
    while ((m = GAP.exec(q))) {
      if (m.index > last) parts.push({ text: q.slice(last, m.index) });
      parts.push({ gap: m[1].split('|').map((s) => s.trim()) });
      last = m.index + m[0].length;
    }
    if (last < q.length) parts.push({ text: q.slice(last) });
    return parts;
  }

  const fill = (card, get) => parse(card.q).map((p, i) => (p.gap ? get(p, i) : p.text)).join('');

  B.ex.register('gap', {
    label: 'Fill the gaps',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string', 'gap needs "q" with {gaps}')) return e;
      B.ex.need(e, parse(c.q).some((p) => p.gap), 'gap needs at least one {gap} in "q"');
      return e;
    },

    describe: (c) => ({ q: show(c.q.replace(GAP, '___')), a: show(fill(c, (p) => p.gap[0])) }),

    render(card, root, api) {
      const parts = parse(card.q);
      const gaps = [];
      let locked = false;
      let active = 0;

      const sentence = h('div', { class: 'gap-sentence' });
      parts.forEach((p) => {
        if (!p.gap) {
          sentence.append(h('span', { html: md(show(p.text)) }));
          return;
        }
        const g = { answers: p.gap, chip: null };
        g.el = h('button', { type: 'button', class: 'gap-slot', 'aria-label': 'Empty gap', onClick: () => tapGap(g) });
        gaps.push(g);
        sentence.append(g.el);
      });

      const chipWords = shuffle(gaps.map((g) => g.answers[0]).concat(card.options || []));
      const bank = h('div', { class: 'chip-bank' });
      const chips = chipWords.map((w) => {
        const el = h('button', { type: 'button', class: 'chip', onClick: () => tapChip(c) }, show(w));
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow chip-shadow', 'aria-hidden': 'true' }, show(w)), el);
        const c = { w, el, slot, gap: null };
        bank.append(slot);
        return c;
      });
      const allEls = () => chips.map((c) => c.el);

      function paint() {
        const firstEmpty = gaps.findIndex((g) => !g.chip);
        if (gaps[active] && gaps[active].chip && firstEmpty >= 0) active = firstEmpty;
        gaps.forEach((g, i) => {
          g.el.classList.toggle('active', !locked && i === active && !g.chip);
          g.el.classList.toggle('has-chip', !!g.chip);
          g.el.setAttribute('aria-label', g.chip ? `Gap: ${show(g.chip.w)} (tap to remove)` : 'Empty gap');
        });
        api.changed(gaps.every((g) => g.chip));
      }

      function tapChip(c) {
        if (locked) return;
        api.sfx('tap');
        if (c.gap) return tapGap(c.gap);
        let g = gaps[active] && !gaps[active].chip ? gaps[active] : gaps.find((x) => !x.chip);
        if (!g) {
          // every gap is full: swap with the active gap's chip
          g = gaps[active] || gaps[0];
          unplace(g);
        }
        flip(allEls(), () => {
          g.el.append(c.el);
          g.chip = c;
          c.gap = g;
        });
        active = gaps.indexOf(g) + 1;
        if (active >= gaps.length || gaps[active].chip) active = Math.max(0, gaps.findIndex((x) => !x.chip));
        paint();
      }

      function unplace(g) {
        const c = g.chip;
        if (!c) return;
        c.slot.append(c.el);
        c.gap = null;
        g.chip = null;
      }

      function tapGap(g) {
        if (locked) return;
        if (g.chip) {
          api.sfx('tap');
          flip(allEls(), () => unplace(g));
        }
        active = gaps.indexOf(g);
        paint();
      }

      B.gloss.decorate(sentence, card);
      root.append(B.ex.header(card, 'Fill in the gaps', { noBubble: true }), h('div', { class: 'gap-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), sentence), bank);
      paint();

      const filledWith = () => fill(card, (p, i) => {
        const g = gaps[parts.slice(0, i).filter((x) => x.gap).length];
        return g.chip ? g.chip.w : '___';
      });

      return {
        check() {
          const ok = gaps.every((g) => g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w)));
          return { ok, given: show(filledWith()) };
        },
        solution() {
          const html = parts.map((p) => (p.gap ? `<strong class="sol-mark">${md(show(p.gap[0]))}</strong>` : md(show(p.text)))).join('');
          return { html, say: show(fill(card, (p) => p.gap[0])) };
        },
        lock() {
          locked = true;
          gaps.forEach((g) => {
            const ok = g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w));
            g.el.classList.add(ok ? 'good' : 'bad');
            g.el.disabled = true;
          });
          chips.forEach((c) => (c.el.disabled = true));
          paint();
        },
        key(e) {
          const n = parseInt(e.key, 10);
          const free = chips.filter((c) => !c.gap);
          if (n >= 1 && n <= free.length) {
            tapChip(free[n - 1]);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/sort.js */
/*
 * Sort words into groups (der / die / das, haben / sein, present / past …).
 *   { type: 'sort', prompt, buckets: [{ label: 'der', sub: 'masculine', items: ['Zug', 'Bus'] }, …] }
 * Tap a word, then tap a group — or drag the word onto the group.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, flip, shuffle } = B.util;

  B.ex.register('sort', {
    label: 'Sort into groups',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.buckets) && c.buckets.length >= 2 && c.buckets.length <= 4, 'sort needs 2–4 "buckets"')) return e;
      B.ex.need(e, c.buckets.every((b) => b.label && Array.isArray(b.items) && b.items.length), 'each bucket needs a label and items');
      const items = c.buckets.flatMap((b) => b.items || []);
      B.ex.need(e, new Set(items).size === items.length, 'an item appears twice');
      B.ex.need(e, items.length <= 12, 'at most 12 items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Sort into groups', a: c.buckets.map((b) => `${show(b.label)}: ${b.items.map(show).join(', ')}`).join(' | ') }),

    render(card, root, api) {
      let locked = false;
      let sel = null;
      const pool = h('div', { class: 'sort-pool', 'aria-label': 'Words to sort', onClick: () => dropInto(-1) });
      const zones = card.buckets.map((b, bi) => {
        const items = h('div', { class: 'bucket-items' });
        const el = h('div', { class: 'bucket', role: 'button', tabindex: '0', 'aria-label': `Group ${show(b.label)}`, onClick: () => dropInto(bi) },
          h('div', { class: 'bucket-head' }, h('span', { class: 'bucket-label', html: md(show(b.label)) }), b.sub ? h('span', { class: 'bucket-sub' }, show(b.sub)) : null),
          items);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            dropInto(bi);
          }
        });
        return { el, items };
      });

      const chips = shuffle(card.buckets.flatMap((b, bi) => b.items.map((text) => ({ text, correct: bi, where: -1 }))));
      chips.forEach((c) => {
        c.el = h('button', { type: 'button', class: 'chip sort-chip' }, show(c.text));
        c.el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (locked) return;
          api.sfx('tap');
          sel = sel === c ? null : c;
          paint();
        });
        B.drag.attach(c.el, {
          enabled: () => !locked,
          onStart: () => {
            sel = null;
            paint();
          },
          onMove(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz, i) => zz.el.classList.toggle('hover', z === i));
            pool.classList.toggle('hover', z === -1 && c.where !== -1);
          },
          onEnd(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz) => zz.el.classList.remove('hover'));
            pool.classList.remove('hover');
            if (z !== null) place(c, z);
            api.sfx('drop');
            return c.el;
          },
        });
        pool.append(c.el);
      });

      function zoneAt(node) {
        if (!node || !node.closest) return null;
        const b = node.closest('.bucket');
        if (b) return zones.findIndex((z) => z.el === b);
        if (node.closest('.sort-pool')) return -1;
        return null;
      }

      function place(c, where) {
        if (c.where === where) return;
        flip(chips.map((x) => x.el), () => {
          (where === -1 ? pool : zones[where].items).append(c.el);
          c.where = where;
        });
      }

      function dropInto(where) {
        if (locked || !sel) return;
        api.sfx('drop');
        place(sel, where);
        sel = null;
        paint();
      }

      function paint() {
        chips.forEach((c) => {
          c.el.classList.toggle('sel', sel === c);
          c.el.setAttribute('aria-pressed', String(sel === c));
        });
        zones.forEach((z) => z.el.classList.toggle('target', !!sel));
        pool.classList.toggle('empty', chips.every((c) => c.where !== -1));
        api.changed(chips.every((c) => c.where !== -1));
      }

      // keep the "ready" state in sync after drags too
      const obs = new MutationObserver(paint);
      obs.observe(pool, { childList: true });

      root.append(
        B.ex.header(card, 'Sort the words into the right group'),
        pool,
        h('div', { class: 'buckets buckets-' + zones.length }, zones.map((z) => z.el))
      );
      paint();

      return {
        check() {
          const wrong = chips.filter((c) => c.where !== c.correct);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map((c) => `${show(c.text)} → ${show(card.buckets[c.where] ? card.buckets[c.where].label : '?')}`).join(', ') : 'all correct',
          };

  <script>/* js/exercises/spot.js */
/*
 * Spot the mistake: tap the one wrong word in the sentence.
 *   { type: 'spot', q: 'Ich habe nach München umgezogen.', wrong: 'habe', correct: 'bin' }
 * Optional: at (word index, if the wrong word appears twice), fixed (full corrected sentence).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm } = B.util;

  const bare = (t) => t.replace(/[.,!?;:…]+$/, '');
  const tokens = (q) => q.trim().split(/\s+/);
  const wrongIndex = (c) => (Number.isInteger(c.at) ? c.at : tokens(c.q).findIndex((t) => norm(bare(t)) === norm(c.wrong)));

  function corrected(c) {
    if (c.fixed) return c.fixed;
    const t = tokens(c.q);
    const i = wrongIndex(c);
    t[i] = c.correct + t[i].slice(bare(t[i]).length);
    return t.join(' ');
  }

  B.ex.register('spot', {
    label: 'Spot the mistake',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string' && c.wrong && c.correct, 'spot needs "q", "wrong" and "correct"')) return e;
      B.ex.need(e, wrongIndex(c) >= 0, `"${c.wrong}" is not a word in the sentence`);
      return e;
    },

    describe: (c) => ({ q: c.q, a: `${show(c.wrong)} → ${show(c.correct)}: ${show(corrected(c))}` }),

    render(card, root, api) {
      const words = tokens(card.q);
      const wi = wrongIndex(card);
      let sel = -1;
      let locked = false;

      const line = h('div', { class: 'spot-line' });
      const btns = words.map((w, i) => {
        const b = h('button', { type: 'button', class: 'spot-word', 'aria-pressed': 'false', onClick: () => choose(i) }, show(w));
        line.append(b);
        return b;
      });

      function choose(i) {
        if (locked) return;
        sel = sel === i ? -1 : i;
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === sel);
          b.setAttribute('aria-pressed', String(j === sel));
        });
        api.sfx('tap');
        api.changed(sel >= 0);
      }

      root.append(
        B.ex.header(card, 'Tap the word that is **wrong**', { noBubble: true }),
        h('div', { class: 'spot-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), line)
      );

      const fix = corrected(card);
      return {
        check: () => ({ ok: sel === wi, given: sel >= 0 ? `“${show(bare(words[sel]))}”` : '—' }),
        solution: () => ({
          html: `<span class="sol-strike">${md(show(bare(words[wi])))}</span> → <strong>${md(show(card.correct))}</strong><div class="sol-fix">✔ ${md(show(fix))}</div>`,
          say: show(fix),
        }),
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (j === wi) {
              b.classList.add(res.ok ? 'good' : 'was-wrong');
              b.after(h('span', { class: 'spot-fix' }, show(card.correct) + words[wi].slice(bare(words[wi]).length)));
              b.classList.add('struck');
            } else if (j === sel) b.classList.add('bad');
          });
        },
      };
    },
  });
})();

</script>

  <script>/* js/ui/charts.js */
/*
 * Small dependency-free charts for the review screen.
 *   card({title, sub, legend, body, table})  – chart frame with legend + "Table" toggle
 *   stacked(rows, series)                    – horizontal stacked bars (HTML)
 *   bars(rows)                               – single-series horizontal bars (HTML)
 *   line(points)                             – line chart with crosshair (SVG)
 *   meter(value)                             – one-value progress meter
 * Colours come from CSS variables (--s1, --s2, --track, --grid) so dark mode
 * gets its own validated steps. Every mark has a hover/focus tooltip.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, pct } = B.util;
  const SVG = 'http://www.w3.org/2000/svg';

  // --- tooltip -------------------------------------------------------------
  let tipEl = null;
  function tipNode() {
    if (!tipEl) {
      tipEl = h('div', { class: 'chart-tip', role: 'tooltip' });
      document.body.append(tipEl);
    }
    return tipEl;
  }

  function showTip(lines, x, y) {
    const t = tipNode();
    t.replaceChildren(...lines.filter(Boolean).map((l, i) => h('div', { class: i === 0 ? 'tip-title' : 'tip-line' }, l)));
    t.classList.add('show');
    const r = t.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2));
    let top = y - r.height - 10;
    if (top < 8) top = y + 24;
    t.style.left = left + 'px';
    t.style.top = top + 'px';
  }

  function hideTip() {
    if (tipEl) tipEl.classList.remove('show');
  }
  window.addEventListener('scroll', hideTip, { passive: true, capture: true });
  window.addEventListener('pointerdown', (e) => {
    if (!e.target.closest || !e.target.closest('[data-tip]')) hideTip();
  });

  /** Attach a tooltip to an element (mouse hover, touch tap, keyboard focus). */
  function hover(el, lines) {
    el.dataset.tip = '1';
    const at = (e) => {
      const r = el.getBoundingClientRect();
      const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2;
      showTip(typeof lines === 'function' ? lines() : lines, x, r.top);
    };
    el.addEventListener('pointerenter', at);
    el.addEventListener('pointermove', (e) => e.pointerType === 'mouse' && at(e));
    el.addEventListener('pointerdown', at);
    el.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && hideTip());
    el.addEventListener('focus', () => at());
    el.addEventListener('blur', hideTip);
  }

  // --- frame -----------------------------------------------------------------
  function legendRow(items) {
    return h('ul', { class: 'legend' }, items.map((it) => h('li', {}, h('span', { class: 'sw ' + it.cls, 'aria-hidden': 'true' }), it.label)));
  }

  function dataTable({ head, rows }) {
    const numeric = (v) => typeof v === 'number' || /^[\d.,%/ —–-]+$/.test(String(v));
    return h('div', { class: 'table-scroll' },
      h('table', { class: 'data-table' },
        h('thead', {}, h('tr', {}, head.map((x, i) => h('th', { scope: 'col', class: i ? 'num' : null }, x)))),
        h('tbody', {}, rows.map((r) => h('tr', {}, r.map((v, i) => (i ? h('td', { class: numeric(v) ? 'num' : null }, String(v)) : h('th', { scope: 'row' }, String(v)))))))));
  }

  function card({ title, sub, legend, body, table, extra }) {
    const legendEl = legend && legend.length > 1 ? legendRow(legend) : null;
    const tableEl = table ? dataTable(table) : null;
    let toggle = null;
    if (tableEl) {
      tableEl.hidden = true;
      toggle = h('button', { class: 'chart-toggle', type: 'button', 'aria-pressed': 'false' }, 'Table');
      toggle.addEventListener('click', () => {
        const on = toggle.getAttribute('aria-pressed') !== 'true';
        toggle.setAttribute('aria-pressed', String(on));
        toggle.textContent = on ? 'Chart' : 'Table';
        tableEl.hidden = !on;
        body.hidden = on;
        if (legendEl) legendEl.hidden = on;
        hideTip();
      });
    }
    return h('section', { class: 'chart-card card' },
      h('div', { class: 'chart-head' },
        h('div', {}, h('h3', { class: 'chart-title' }, title), sub ? h('p', { class: 'chart-sub' }, sub) : null),
        toggle),
      legendEl, body, tableEl, extra || null);
  }

  // --- stacked horizontal bars ------------------------------------------------
  /**
   * rows:   [{label, icon?, total, parts: [n, n], value: '24/38', badge?: Element}]
   * series: [{label, cls}] — one per part; the rest of the bar is the grey track.
   */
  function stacked(rows, series, { restLabel = 'Not mastered yet', unit = 'cards' } = {}) {
    const wrap = h('div', { class: 'hbars' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      const used = r.parts.reduce((a, b) => a + b, 0);
      r.parts.forEach((n, i) => {
        if (!n) return;
        const seg = h('div', { class: 'hbar-seg ' + series[i].cls, style: { width: (n / r.total) * 100 + '%' } });
        hover(seg, [r.label, `${series[i].label}: ${n} of ${r.total} ${unit} (${pct(n, r.total)}%)`]);
        track.append(seg);
      });
      const rest = r.total - used;
      if (rest > 0) {
        const seg = h('div', { class: 'hbar-seg hbar-rest' });
        hover(seg, [r.label, `${restLabel}: ${rest} of ${r.total} ${unit}`]);
        track.append(seg);
      }
      const aria = `${r.label}: ` + series.map((s, i) => `${s.label} ${r.parts[i]}`).join(', ') + `, ${restLabel.toLowerCase()} ${rest}, of ${r.total}` + (r.badgeText ? `. ${r.badgeText}` : '');
      wrap.append(
        h('div', { class: 'hbar-row', role: 'group', 'aria-label': aria },
          h('div', { class: 'hbar-label' },
            r.icon ? h('span', { class: 'hbar-icon', 'aria-hidden': 'true' }, r.icon) : null,
            h('span', { class: 'hbar-name', title: r.label }, r.label)),
          r.badge ? h('div', { class: 'hbar-badge' }, r.badge) : h('div', { class: 'hbar-badge' }),
          h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.value)))
      );
    }
    return wrap;
  }

  // --- single-series bars ------------------------------------------------------
  /** rows: [{label, value (0–100 or null), text: '82%', tip: [lines]}] */
  function bars(rows) {
    const wrap = h('div', { class: 'hbars hbars-single' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      if (r.value) track.append(h('div', { class: 'hbar-seg s1', style: { width: r.value + '%' } }));
      if (r.value < 100) track.append(h('div', { class: 'hbar-seg hbar-rest' }));
      const row = h('div', { class: 'hbar-row', tabindex: '0', 'aria-label': `${r.label}: ${r.text}` },
        h('div', { class: 'hbar-label' }, h('span', { class: 'hbar-name', title: r.label }, r.label)),
        h('div', { class: 'hbar-badge' }),
        h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.text)));
      hover(row, r.tip || [r.label, r.text]);
      wrap.append(row);
    }
    return wrap;
  }

  // --- line chart -------------------------------------------------------------
  const svg = (tag, attrs) => {
    const el = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    return el;
  };

  /**
   * points: [{x: 'label under the axis', y: 0–100, tip: [lines]}]
   * Re-draws itself when its container is resized.
   */
  function line(points, { yMax = 100, yFmt = (v) => v + '%', height = 210, ariaLabel = 'Line chart' } = {}) {
    const box = h('div', { class: 'line-chart', tabindex: '0', role: 'img', 'aria-label': ariaLabel });
    let active = -1;
    let geom = null;

    function draw() {
      const W = Math.max(260, Math.round(box.clientWidth || 600));
      const H = height;
      const m = { l: 40, r: 14, t: 14, b: 30 };
      const iw = W - m.l - m.r;
      const ih = H - m.t - m.b;
      const n = points.length;
      const xAt = (i) => m.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      const yAt = (v) => m.t + ih - (v / yMax) * ih;
      geom = { xAt, yAt, m, W, H };

      const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
      for (const v of [0, 25, 50, 75, 100]) {
        root.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: yAt(v), y2: yAt(v) }));
        const t = svg('text', { class: 'axis', x: m.l - 8, y: yAt(v) + 4, 'text-anchor': 'end' });
        t.textContent = yFmt(v);
        root.append(t);
      }
      // x labels: first, last and a few in between
      const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 56))));
      points.forEach((p, i) => {
        if (i % every && i !== n - 1) return;
        if (i !== n - 1 && n - 1 - i < every / 2 && i !== 0) return;
        const t = svg('text', { class: 'axis', x: xAt(i), y: H - 8, 'text-anchor': 'middle' });
        t.textContent = p.x;
        root.append(t);
      });
      const cross = svg('line', { class: 'crosshair', x1: 0, x2: 0, y1: m.t, y2: m.t + ih, visibility: 'hidden' });
      root.append(cross);
      if (n > 1) {
        const d = points.map((p, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
        root.append(svg('path', { class: 'series s1-stroke', d }));
      }
      const dots = points.map((p, i) => {
        const c = svg('circle', { class: 'dot s1-fill' + (p.hollow ? ' hollow' : ''), cx: xAt(i), cy: yAt(p.y), r: n > 24 ? 3 : 4 });
        root.append(c);
        return c;
      });
      geom.cross = cross;
      geom.dots = dots;
      box.replaceChildren(root);
      if (active >= 0) focusPoint(active, false);
    }

    function focusPoint(i, showTooltip = true) {
      if (!geom || !points.length) return;
      active = Math.max(0, Math.min(points.length - 1, i));
      const x = geom.xAt(active);
      geom.cross.setAttribute('x1', x);
      geom.cross.setAttribute('x2', x);
      geom.cross.setAttribute('visibility', 'visible');
      geom.dots.forEach((d, j) => d.classList.toggle('on', j === active));
      if (showTooltip) {
        const r = box.getBoundingClientRect();
        showTip(points[active].tip, r.left + x, r.top + geom.yAt(points[active].y));
      }
    }

    function clear() {
      if (!geom) return;
      geom.cross.setAttribute('visibility', 'hidden');
      geom.dots.forEach((d) => d.classList.remove('on'));
      active = -1;
      hideTip();
    }

    function nearest(clientX) {
      const r = box.getBoundingClientRect();
      const x = clientX - r.left;
      let best = 0;
      points.forEach((_, i) => {
        if (Math.abs(geom.xAt(i) - x) < Math.abs(geom.xAt(best) - x)) best = i;
      });
      return best;
    }

    box.dataset.tip = '1';
    box.addEventListener('pointermove', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerdown', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && clear());
    box.addEventListener('focus', () => focusPoint(active >= 0 ? active : points.length - 1));
    box.addEventListener('blur', clear);
    box.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        focusPoint((active < 0 ? points.length - 1 : active) + (e.key === 'ArrowLeft' ? -1 : 1));
      }
    });

    if (typeof ResizeObserver === 'function') {
      let lastW = 0;
      new ResizeObserver(() => {
        const w = Math.round(box.clientWidth);
        if (w && w !== lastW) {
          lastW = w;
          draw();
        }
      }).observe(box);
    }
    requestAnimationFrame(draw);
    return box;
  }

  // --- meter -------------------------------------------------------------------
  function meter(value, label) {
    return h('div', { class: 'meter', role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(value), 'aria-label': label },
      h('div', { class: 'meter-fill s1', style: { width: value + '%' } }));
  }

  B.charts = { card, stacked, bars, line, meter, hover, hideTip, legendRow };
})();

</script>
  <script>/* js/ui/home.js */
/* Home screen: overall progress, session setup, topics with their grammar rules. */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, pct } = B.util;
  const SIZES = [10, 20, 50, 0]; // 0 = every remaining card

  B.ui = B.ui || {};

  function greeting() {
    const hr = new Date().getHours();
    if (hr < 11) return 'Guten Morgen!';
    if (hr < 18) return 'Guten Tag!';
    return 'Guten Abend!';
  }

  /** Progress ring (a meter for one value — the number is printed inside it). */
  function ring(done, total) {
    const r = 52;
    const C = 2 * Math.PI * r;
    const off = C * (1 - (total ? done / total : 0));
    const el = h('div', { class: 'ring', role: 'img', 'aria-label': `${done} of ${total} cards mastered` });
    el.innerHTML =
      `<svg viewBox="0 0 128 128" aria-hidden="true"><circle class="ring-track" cx="64" cy="64" r="${r}"/>` +
      `<circle class="ring-fill" cx="64" cy="64" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg>` +
      `<div class="ring-text"><b>${done}</b><span>/ ${total}</span></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const f = el.querySelector('.ring-fill');
      if (f) f.style.strokeDashoffset = off.toFixed(2);
    }));
    return el;
  }

  function statusBadge(s, extra) {
    if (!s || s.key === 'none') return null;
    return h('span', { class: 'badge badge-' + s.key }, h('span', { class: 'badge-icon', 'aria-hidden': 'true' }, s.icon), s.label + (extra ? ' · ' + extra : ''));
  }

  function currentStreak(st) {
    if (!st.last) return 0;
    const today = B.util.dayKey();
    const y = new Date();
    y.setDate(y.getDate() - 1);
    return st.last === today || st.last === B.util.dayKey(y) ? st.count : 0;
  }

  B.ui.statusBadge = statusBadge;

  B.ui.home = function (root) {
    const ov = B.stats.overview();
    const topics = B.stats.byTopic();
    let size = B.store.setting('size');
    if (!SIZES.includes(size)) size = 20;
    let topic = B.store.setting('topic');
    if (topic !== 'all' && !B.deck.topicMap[topic]) topic = 'all';

    // --- top bar -----------------------------------------------------------------
    const soundBtn = h('button', { class: 'icon-btn', type: 'button' });
    const paintSound = () => {
      const on = B.store.setting('sound');
      soundBtn.textContent = on ? '🔊' : '🔇';
      soundBtn.setAttribute('aria-label', on ? 'Sound on (tap to mute)' : 'Sound off (tap to unmute)');
      soundBtn.setAttribute('aria-pressed', String(!!on));
    };
    soundBtn.addEventListener('click', () => {
      B.store.setting('sound', !B.store.setting('sound'));
      paintSound();
      B.audio.play('tap');
    });
    paintSound();

    const themeBtn = h('button', { class: 'icon-btn', type: 'button' });
    const paintTheme = () => {
      const dark = B.app.isDark();
      themeBtn.textContent = dark ? '☀️' : '🌙';
      themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    };
    themeBtn.addEventListener('click', () => {
      B.app.toggleTheme();
      paintTheme();
    });
    paintTheme();

    const streak = currentStreak(ov.streak);
    const top = h('header', { class: 'home-top' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-logo', 'aria-hidden': 'true' }, '🥨'), h('span', { class: 'brand-name' }, 'Brezel')),
      h('div', { class: 'top-pills' },
        h('span', { class: 'pill pill-streak' + (streak ? '' : ' off'), title: 'Day streak' }, h('span', { 'aria-hidden': 'true' }, '🔥'), ' ', String(streak), h('span', { class: 'sr-only' }, ' day streak')),
        h('span', { class: 'pill pill-xp', title: 'Total XP' }, h('span', { 'aria-hidden': 'true' }, '⚡'), ' ', String(ov.xp), h('span', { class: 'sr-only' }, ' XP'))),
      h('div', { class: 'top-actions' }, soundBtn, themeBtn));

    // --- hero ---------------------------------------------------------------------
    const heroText = ov.complete
      ? h('div', { class: 'hero-text' },
        h('h1', {}, 'Alles fertig! 🎉'),
        h('p', {}, `You’ve mastered all ${ov.total} cards.`),
        h('p', { class: 'muted' }, 'Your detailed review is ready.'))
      : h('div', { class: 'hero-text' },
        h('h1', {}, greeting()),
        h('p', {}, ov.done ? `You’ve mastered ${ov.done} of ${ov.total} cards.` : `${ov.total} cards are waiting for you.`),
        h('p', { class: 'muted' },
          ov.done
            ? `${ov.total - ov.done} to go` + (ov.stillWrong ? ` · ${ov.stillWrong} need another try` : '')
            : 'Grammar first: word order, verbs, tenses, articles and more.'));
    const hero = h('section', { class: 'card hero' }, ring(ov.done, ov.total), heroText);

    // --- session setup --------------------------------------------------------------
    const startBtn = h('button', { class: 'btn btn-primary btn-big start-btn', type: 'button' });
    const startSub = h('p', { class: 'start-sub' });
    const sizeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Cards per session' });
    const sizeBtns = SIZES.map((n) => {
      const b = h('button', { type: 'button', class: 'seg-btn' }, n ? String(n) : 'All');
      b.addEventListener('click', () => {
        size = B.store.setting('size', n);
        B.audio.play('tap');
        paintSetup();
      });
      sizeSeg.append(b);
      return { n, b };
    });

    const chipRow = h('div', { class: 'topic-chips', role: 'group', 'aria-label': 'Topic' });
    const chipBtns = [{ id: 'all', icon: '✨', name: 'All topics' }].concat(B.deck.topics).map((t) => {
      const b = h('button', { type: 'button', class: 'topic-chip' }, h('span', { 'aria-hidden': 'true' }, t.icon), ' ', t.name);
      b.addEventListener('click', () => selectTopic(t.id));
      chipRow.append(b);
      return { id: t.id, b };
    });

    function selectTopic(id, scroll) {
      topic = B.store.setting('topic', id);
      B.audio.play('tap');
      paintSetup();
      const chip = chipBtns.find((c) => c.id === id);
      if (chip && chip.b.scrollIntoView) chip.b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: B.util.reducedMotion() ? 'auto' : 'smooth' });
      if (scroll) setup.scrollIntoView({ block: 'start', behavior: B.util.reducedMotion() ? 'auto' : 'smooth' });
    }

    function paintSetup() {
      const pending = B.stats.pending(topic).length;
      const n = size ? Math.min(size, pending) : pending;
      sizeBtns.forEach(({ n: k, b }) => b.setAttribute('aria-pressed', String(k === size)));
      chipBtns.forEach(({ id, b }) => b.setAttribute('aria-pressed', String(id === topic)));
      topicCards.forEach(({ id, el }) => el.classList.toggle('is-selected', id === topic));
      const tName = topic === 'all' ? 'all topics' : B.deck.topicMap[topic].name;
      if (!pending) {
        startBtn.disabled = true;
        startBtn.textContent = 'Topic complete ✓';
        startSub.textContent = 'Every card here is mastered — pick another topic.';
      } else {
        startBtn.disabled = false;
        startBtn.textContent = 'Start';
        startSub.textContent = `${n} card${n === 1 ? '' : 's'} · ${tName} · ${pending} left to master`;
      }
    }

    startBtn.addEventListener('click', () => B.app.go('session', { topic, size }));

    const mistakes = ov.mistakes;
    const practiseBtn = h('button', { class: 'btn btn-outline', type: 'button', disabled: !mistakes },
      h('span', { 'aria-hidden': 'true' }, '🔁 '), `Practise mistakes${mistakes ? ` (${mistakes})` : ''}`);
    practiseBtn.addEventListener('click', () => B.app.go('session', { practice: true, size }));
    const reportBtn = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '📊 '), ov.complete ? 'Detailed review' : 'Progress report');
    reportBtn.addEventListener('click', () => B.app.go('review'));

    let setup;
    if (ov.complete) {
      const reviewBtn = h('button', { class: 'btn btn-primary btn-big', type: 'button' }, 'See my detailed review');
      reviewBtn.addEventListener('click', () => B.app.go('review'));
      const againBtn = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '↺ '), 'Start over');
      againBtn.addEventListener('click', resetAll);
      setup = h('section', { class: 'card setup' },
        h('h2', { class: 'section-title' }, 'What next?'),
        reviewBtn,
        h('div', { class: 'home-links' }, practiseBtn, againBtn));
    } else {
      setup = h('section', { class: 'card setup' },
        h('h2', { class: 'section-title' }, 'New session'),
        h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Cards'), sizeSeg),
        h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Topic'), chipRow),
        startBtn,
        startSub,
        h('div', { class: 'home-links' }, practiseBtn, reportBtn));

    const topicCards = topics.map((t) => {
      const tipId = 'tip-' + t.topic.id;
      const tip = h('div', { class: 'topic-tip', id: tipId, hidden: true, html: md(t.topic.tip || '') });
      const ruleBtn = h('button', { class: 'link-btn rule-btn', type: 'button', 'aria-expanded': 'false', 'aria-controls': tipId }, h('span', { 'aria-hidden': 'true' }, '📖 '), 'Rule');
      ruleBtn.addEventListener('click', () => {

        tip.hidden = !open;
        ruleBtn.setAttribute('aria-expanded', String(open));
        if (open) B.util.pulse(tip, 'reveal');
      });
      const main = h('button', { class: 'topic-main', type: 'button', 'aria-label': `${t.topic.name}: ${t.done} of ${t.total} mastered. Select topic.` },
        h('span', { class: 'topic-icon', 'aria-hidden': 'true' }, t.topic.icon),
        h('span', { class: 'topic-text' }, h('b', {}, t.topic.name), h('small', {}, t.topic.de)),
        h('span', { class: 'topic-count' }, t.done === t.total ? '✓' : `${t.done}/${t.total}`));
      main.addEventListener('click', () => selectTopic(t.topic.id, true));
      const bar = h('div', { class: 'mini-bar', 'aria-hidden': 'true' }, h('span', { style: { width: pct(t.done, t.total) + '%' } }));
      const el = h('article', { class: 'topic-card' + (t.done === t.total ? ' is-complete' : '') },
        main, bar,
        h('div', { class: 'topic-foot' }, statusBadge(t.status, t.attempted >= B.stats.MIN_CARDS ? `${t.firstPct}% first try` : '') || h('span', { class: 'muted small' }, t.attempted ? `${t.attempted} tried` : 'Not started'), ruleBtn),
        tip);
      return { id: t.topic.id, el };
    });

    async function resetAll() {
      const ok = await B.app.confirm({
        title: 'Start over?',
        text: 'This deletes all your progress, XP and statistics. The cards stay the same.',
        ok: 'Delete progress',
        cancel: 'Cancel',
        danger: true,
      });
      if (!ok) return;
      B.store.reset();
      B.app.toast('Progress reset — viel Erfolg! 🍀');
      B.app.go('home');
    }

    const resetBtn = h('button', { class: 'link-btn danger', type: 'button' }, 'Reset progress');
    resetBtn.addEventListener('click', resetAll);

    root.append(
      top,
      h('main', { class: 'home' },
        hero,
        setup,
        h('section', { class: 'topics' },
          h('h2', { class: 'section-title' }, 'Topics'),
          h('p', { class: 'muted small topics-help' }, 'Tap a topic to practise only that. Open 📖 Rule for a quick reminder.'),
          h('div', { class: 'topic-grid' }, topicCards.map((t) => t.el))),
        h('footer', { class: 'home-foot' }, resetBtn, h('p', { class: 'muted small' }, 'Progress is saved in this browser on this device.')))
    );
    if (!ov.complete) paintSetup();
    else topicCards.forEach(({ el }) => el.querySelector('.topic-main').setAttribute('disabled', ''));

    return {
      onKey(e) {
        if (e.key === 'Enter' && e.target === document.body && !ov.complete && !startBtn.disabled) {
          e.preventDefault();
          startBtn.click();
        }
      },
    };
  };
})();

  <script>/* js/ui/glossary.js */
/*
 * The 📖 Glossary of the card on screen: every German word in the question with its English
 * meaning (data/glossary.js), and the rule the card practises (data/rules.js).
 * Answer choices are never translated (see Brezel.ex.questionTexts). A card whose rule would
 * give the answer away (card.asksRule) keeps the rule folded until the learner opens it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md } = B.util;

  function words(card, texts) {
    if (card.gloss === false) {
      return h('p', { class: 'gl-note' }, '🤫 This card asks what the words mean, so their translations stay hidden.');
    }
    const rows = B.gloss.entries(card, texts);
    if (!rows.length) {
      return h('p', { class: 'gl-note' }, 'Nothing to translate here: the answer choices aren’t translated, so they can’t give the answer away.');
    }
    return h('dl', { class: 'gl-words' },
      rows.map((r) => h('div', { class: 'gl-row' },
        h('dt', { lang: 'de' }, r.de),
        h('dd', {},
          r.hidden ? h('span', { class: 'gl-hidden' }, '🤫 that’s what this card asks') : r.en,
          r.base ? h('span', { class: 'gl-base', lang: 'de', title: 'Dictionary form' }, r.base) : null))));
  }

  function rule(r) {
    return h('div', { class: 'gl-rule' },
      h('h4', { class: 'gl-rule-title', html: md(r.title) }),
      r.text ? h('p', { class: 'gl-rule-text', html: md(r.text) }) : null,
      r.points ? h('ul', { class: 'gl-points' }, r.points.map((p) => h('li', { html: md(p) }))) : null);
  }

  function rules(card) {
    const list = B.deck.rulesFor(card);
    if (!list.length) return null;
    const body = h('div', { class: 'gl-rules', tabindex: '-1' }, list.map(rule));
    const parts = [h('h3', { class: 'gl-h' }, list.length > 1 ? 'The rules' : 'The rule'), body];
    if (card.asksRule) {
      body.hidden = true;
      const show = h('button', { type: 'button', class: 'btn btn-outline gl-reveal' }, 'Show the rule anyway');
      const fold = h('div', { class: 'gl-fold' },
        h('p', {}, '🤫 This card asks about the rule itself, so reading it now gives the answer away.'),
        show);
      show.addEventListener('click', () => {
        fold.remove();
        body.hidden = false;
        body.focus({ preventScroll: true });
      });
      parts.splice(1, 0, fold);
    }
    return h('section', { class: 'gl-section' }, parts);
  }

  /** texts: [{text, loose?}] — the question text on screen (Brezel.ex.questionTexts or the card's glossTexts()). */
  function open(card, texts) {
    B.gloss.hideTip();
    return B.app.sheet((close) => {
      const done = h('button', { type: 'button', class: 'btn btn-primary btn-big', 'data-autofocus': '', onClick: () => close() }, 'Got it');
      return h('div', { class: 'modal sheet glossary', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gl-title' },
        h('header', { class: 'sheet-head' },
          h('h2', { id: 'gl-title', class: 'sheet-title' }, h('span', { 'aria-hidden': 'true' }, '📖 '), 'Glossary'),
          h('button', { type: 'button', class: 'icon-btn sheet-x', 'aria-label': 'Close', onClick: () => close() }, '✕')),
        h('div', { class: 'sheet-body', tabindex: '0' },
          h('section', { class: 'gl-section' }, h('h3', { class: 'gl-h' }, 'Words in this question'), words(card, texts)),
          rules(card)),
        h('footer', { class: 'sheet-foot' }, done));
    });
  }

  B.glossary = { open };
})();

  <script>/* js/ui/session.js */
/*
 * A learning session.
 *  - The queue is every not-yet-mastered card (optionally one topic), shuffled, cut to the session size.
 *  - A wrong answer shows the correct one and puts the card back at a random later position.
 *  - Only correct answers count as mastered (practice mode never changes mastery).
 * The 📖 Glossary button (or G) shows the question's words in English and the card's rule.
 * Keys: Enter = check / continue, 1–6 = choose, G = Glossary, Esc = quit.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, randInt, pick, wait, pulse, reducedMotion } = B.util;

  const PRAISE = ['Richtig!', 'Super!', 'Sehr gut!', 'Genau!', 'Perfekt!', 'Toll!', 'Klasse!', 'Prima!'];
  const OOPS = ['Not quite', 'Almost!', 'Oops!', 'Not this time'];
  const COMBOS = { 3: '3 in a row!', 5: '5 in a row! +5 XP per card', 10: '10 in a row — unstoppable!', 15: '15 in a row!', 20: '20 in a row — Wahnsinn!', 30: '30 in a row!!' };
  const XP_CORRECT = 10;
  const XP_COMBO = 5; // bonus per card while on a streak of 5+

  function buildQueue({ topic, size, practice }) {
    const pool = practice ? B.stats.mistakeCards() : B.stats.pending(topic);
    const list = shuffle(pool);
    return size ? list.slice(0, size) : list;
  }

  B.ui.session = function (root, opts) {
    const practice = !!opts.practice;
    const queue = buildQueue(opts);
    if (!queue.length) {
      setTimeout(() => {
        B.app.toast(practice ? 'No mistakes to practise 🎉' : 'Nothing left to learn here 🎉');
        B.app.go('home');
      });
      return {};
    }

    const total = queue.length;
    const deckTotal = B.deck.cards.length;
    const cleared = new Set(); // answered correctly in this session
    const missed = new Set(); // answered wrong at least once in this session
    let idx = 0;
    let combo = 0;
    let bestCombo = 0;
    let xp = 0;
    let answered = 0;
    let correct = 0;
    let mastered = 0;
    let firstTry = 0;
    let card = null;
    let ctrl = null;
    let ready = false;
    let phase = 'answer'; // answer → feedback → (busy) → answer … → done
    let shownAt = 0;
    let comeBackGap = 0;
    let introEl = null;
    let introTimer = 0;
    const startedAt = Date.now();
    B.store.beginSession(practice);

    const doneCount = () => B.deck.cards.reduce((n, c) => n + (B.store.isDone(c.id) ? 1 : 0), 0);

    // --- layout -----------------------------------------------------------------
    const quitBtn = h('button', { class: 'icon-btn quit-btn', type: 'button', 'aria-label': 'Quit session', title: 'Quit (Esc)' }, '✕');
    quitBtn.addEventListener('click', () => quit());
    const fill = h('div', { class: 'progress-fill' });
    const bar = h('div', { class: 'progress', role: 'progressbar', 'aria-label': 'Session progress', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': '0' }, fill);
    const doneNum = h('b', {}, String(doneCount()));
    const totalPill = h('div', { class: 'pill total-pill', title: practice ? 'Practice — mastery is not changed' : 'Cards mastered overall' },
      h('span', { 'aria-hidden': 'true' }, practice ? '🔁' : '⭐'), ' ', doneNum, h('span', { class: 'of' }, '/' + deckTotal));
    const comboEl = h('div', { class: 'combo-flag', 'aria-live': 'polite' });
    const stage = h('main', { class: 's-stage' });
    const skipBtn = h('button', { class: 'btn btn-ghost skip-btn', type: 'button' }, 'I don’t know');
    skipBtn.addEventListener('click', () => check(true));
    const glossBtn = h('button', { class: 'btn btn-outline gloss-btn', type: 'button', title: 'Words and rule (G)' },
      h('span', { 'aria-hidden': 'true' }, '📖'), h('span', { class: 'gloss-btn-label' }, 'Glossary'));
    glossBtn.addEventListener('click', () => openGlossary());
    const mainBtn = h('button', { class: 'btn btn-primary main-btn', type: 'button' }, 'Check');
    mainBtn.addEventListener('click', () => (phase === 'feedback' ? next() : check(false)));
    const feedback = h('div', { class: 'feedback', 'aria-live': 'polite' });
    const foot = h('footer', { class: 's-foot' }, feedback, h('div', { class: 's-foot-inner' }, skipBtn, glossBtn, mainBtn));

    root.append(h('div', { class: 'session' + (practice ? ' is-practice' : '') },
      h('header', { class: 's-top' }, quitBtn, bar, totalPill),
      comboEl,
      stage,
      foot));

    const api = {
      changed(r) {
        if (phase !== 'answer') return;
        ready = !!r;
        mainBtn.disabled = !ready;
      },
      submit() {
        if (ready) check(false);
      },
      sfx: (name) => B.audio.play(name),
      speak: (text) => B.audio.speak(text),
      get card() {
        return card;
      },
    };

    // --- flow ------------------------------------------------------------------------
    function showCard(animate) {
      B.gloss.hideTip();
      card = queue[idx];
      const def = B.ex.get(card.type);
      const topic = B.deck.topicMap[card.topic];
      const prev = B.store.cardState(card.id);
      const tag = missed.has(card.id)
        ? h('span', { class: 'again-tag' }, '↻ Try again')
        : prev && prev.w
          ? h('span', { class: 'again-tag old' }, '↻ Missed before')
          : null;
      const exRoot = h('div', { class: 'ex ex-' + card.type });
      const wrap = h('div', { class: 's-card' + (animate ? ' enter' : '') },
        h('div', { class: 'card-meta' }, h('span', { class: 'topic-tag' }, h('span', { 'aria-hidden': 'true' }, topic.icon + ' '), topic.name), tag),
        exRoot);
      // Drop the entrance class once it has played, otherwise removing a later
      // .shake would let card-in run a second time.
      if (animate) {
        wrap.addEventListener('animationend', function done(e) {
          if (e.target !== wrap) return;
          wrap.classList.remove('enter');
          wrap.removeEventListener('animationend', done);
        });
      }
      ready = false;
      phase = 'answer';
      setFooter('check');
      stage.replaceChildren(wrap);
      stage.scrollTop = 0;
      try {
        ctrl = def.render(card, exRoot, api);
      } catch (err) {
        // A broken card must never block the session: log it and move on.
        console.error('[Brezel] card failed to render', card.id, err);
        queue.splice(idx, 1);
        if (idx >= queue.length) return finish(false);
        return showCard(animate);
      }
      shownAt = performance.now();
      if (!introEl) focusCard();
    }

    function focusCard() {
      if (ctrl && ctrl.focus) ctrl.focus();
      else if (document.activeElement && document.activeElement !== document.body && !stage.contains(document.activeElement)) document.activeElement.blur();
    }

    function openGlossary() {
      if (phase !== 'answer' || introEl) return;
      B.glossary.open(card, ctrl && ctrl.glossTexts ? ctrl.glossTexts() : B.ex.questionTexts(card));
    }

    function check(skipped) {
      if (phase !== 'answer' || introEl) return;
      if (!skipped && !ready) return;
      phase = 'feedback';
      B.gloss.hideTip();
      const ms = performance.now() - shownAt;
      let res = ctrl.check() || { ok: false };
      if (skipped) res = { ok: false, given: '', skipped: true };
      try {
        ctrl.lock(res);
      } catch (err) {
        console.error('[Brezel] lock failed', card.id, err);
      }
      const ok = !!res.ok;
      const firstSeen = !cleared.has(card.id) && !missed.has(card.id);
      answered++;
      let gained = 0;
      if (ok) {
        correct++;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        gained = XP_CORRECT + (combo >= 5 ? XP_COMBO : 0);
        cleared.add(card.id);
        if (firstSeen) firstTry++;
      } else {
        combo = 0;
        missed.add(card.id);
        requeue();
      }
      xp += gained;
      const { newlyDone } = B.store.record(card, ok, res.skipped ? '(skipped)' : res.given, ms, { practice, xp: gained });
      if (newlyDone) {
        mastered++;
        doneNum.textContent = String(doneCount());
        pulse(totalPill, 'bump');
      }
      B.store.setBestCombo(bestCombo);
      paintProgress();
      B.audio.play(ok ? 'correct' : 'wrong');
      if (ok && COMBOS[combo]) showCombo(combo);
      if (!ok) pulse(stage.firstElementChild, 'shake');
      renderFeedback(res, ok, gained);
      setFooter(ok ? 'good' : 'bad');
    }

    /** Wrong → back into the pile, at a random later spot (at least two cards later when possible). */
    function requeue() {
      const rest = queue.length - (idx + 1);
      const pos = randInt(idx + 1 + Math.min(2, rest), queue.length);
      queue.splice(pos, 0, card);
      comeBackGap = pos - idx - 1;
    }

    function paintProgress() {
      const p = (cleared.size / total) * 100;
      fill.style.width = p + '%';
      bar.setAttribute('aria-valuenow', String(cleared.size));
      bar.classList.toggle('has-progress', cleared.size > 0);
    }

    function showCombo(n) {
      comboEl.textContent = '🔥 ' + COMBOS[n];
      pulse(comboEl, 'show');
      setTimeout(() => B.audio.play('combo'), 260);
    }

    function renderFeedback(res, ok, gained) {
      let sol = null;
      try {
        sol = ctrl.solution ? ctrl.solution() : null;
      } catch (err) {
        console.error('[Brezel] solution failed', card.id, err);
      }
      const say = sol && sol.say;
      const title = ok ? (res.typo ? 'Correct — small typo' : pick(PRAISE)) : res.skipped ? 'Here’s the answer' : pick(OOPS);
      const speak = say && B.audio.canSpeak
        ? h('button', { class: 'speak-btn fb-speak', type: 'button', 'aria-label': 'Listen to the answer', title: 'Listen' }, '🔊')
        : null;
      if (speak) speak.addEventListener('click', () => B.audio.speak(say));

      const body = [];
      if (!ok && sol) body.push(h('div', { class: 'fb-label' }, 'Correct answer:'), h('div', { class: 'fb-answer', html: sol.html }));
      if (!ok && res.given && !res.skipped) {
        body.push(h('div', { class: 'fb-given' }, h('span', { class: 'fb-given-label' }, 'You answered: '), h('span', { class: 'fb-given-text' }, show(res.given))));
      }
      if (res.note) body.push(h('div', { class: 'fb-note', html: md(res.note) }));
      if (card.explain) body.push(h('div', { class: 'fb-explain' }, h('span', { class: 'fb-why' }, 'Why? '), h('span', { html: md(card.explain) })));
      if (!ok) {
        body.push(h('div', { class: 'fb-again' }, comeBackGap === 0
          ? '↻ This card comes straight back — try it again.'
          : '↻ This card goes back into the pile — you’ll see it again later.'));
      }

      feedback.replaceChildren(h('div', { class: 'fb-inner' },
        h('div', { class: 'fb-head' },
          h('span', { class: 'fb-icon', 'aria-hidden': 'true' }, ok ? '✓' : '✗'),
          h('h3', { class: 'fb-title' }, title),
          gained ? h('span', { class: 'fb-xp' }, `+${gained} XP`) : null,
          speak),
        h('div', { class: 'fb-body' }, body)));
    }

    function setFooter(mode) {
      foot.classList.remove('is-good', 'is-bad', 'has-feedback');
      if (mode === 'check') {
        feedback.replaceChildren();
        mainBtn.textContent = 'Check';
        mainBtn.className = 'btn btn-primary main-btn';
        mainBtn.disabled = !ready;
        skipBtn.hidden = false;
        glossBtn.hidden = false;
        return;
      }
      foot.classList.add('has-feedback', mode === 'good' ? 'is-good' : 'is-bad');
      mainBtn.textContent = 'Continue';
      mainBtn.className = 'btn main-btn ' + (mode === 'good' ? 'btn-primary' : 'btn-danger');
      mainBtn.disabled = false;
      skipBtn.hidden = true;
      glossBtn.hidden = true;
      mainBtn.focus({ preventScroll: true });
    }

    async function next() {
      if (phase !== 'feedback') return;
      phase = 'busy';
      B.charts && B.charts.hideTip();
      idx++;
      if (idx >= queue.length) return finish(false);
      const old = stage.firstElementChild;
      if (old && !reducedMotion()) {
        old.classList.add('leave');
        foot.classList.add('leaving');
        await wait(170);
        foot.classList.remove('leaving');
      }
      if (phase === 'busy') showCard(true);
    }

    function finish(quitEarly) {
      if (phase === 'done') return;
      phase = 'done';
      B.store.endSession({ bestCombo, quit: !!quitEarly });
      B.app.go('summary', {
        practice,
        opts,
        total,
        answered,
        correct,
        wrong: answered - correct,
        firstTry,
        cleared: cleared.size,
        missed: [...missed],
        mastered,
        xp,
        bestCombo,
        ms: Date.now() - startedAt,
        quit: !!quitEarly,
      });
    }

    async function quit() {
      if (phase === 'done') return;
      if (!answered) {
        phase = 'done';
        B.store.endSession();
        B.app.go('home');
        return;
      }
      const yes = await B.app.confirm({
        title: 'Quit this session?',
        text: 'Everything you answered is saved. Cards you haven’t got right yet stay in the pile for next time.',
        ok: 'Quit',
        cancel: 'Keep learning',
      });
      if (yes) finish(true);
    }

    // --- intro: "23 / 300" ------------------------------------------------------------
    function intro() {
      const done = doneCount();
      const topicName = opts.topic && opts.topic !== 'all' && B.deck.topicMap[opts.topic] ? ' · ' + B.deck.topicMap[opts.topic].name : '';
      const num = h('span', { class: 'intro-done' }, reducedMotion() ? String(done) : '0');
      const barFill = h('span', { class: 'intro-fill' });
      introEl = h('div', { class: 'intro', role: 'dialog', 'aria-label': `${done} of ${deckTotal} cards mastered` },
        h('div', { class: 'intro-inner' },
          h('div', { class: 'intro-mascot', 'aria-hidden': 'true' }, '🥨'),
          h('div', { class: 'intro-count' }, num, h('span', { class: 'intro-total' }, ' / ' + deckTotal)),
          h('div', { class: 'intro-label' }, 'cards mastered so far'),
          h('div', { class: 'intro-bar', 'aria-hidden': 'true' }, barFill),
          h('div', { class: 'intro-session' }, practice
            ? `Practising ${total} card${total === 1 ? '' : 's'} you got wrong before`
            : `This session: ${total} card${total === 1 ? '' : 's'}${topicName}`),
          h('div', { class: 'intro-tap' }, 'Tap anywhere to start')));
      introEl.addEventListener('click', dismissIntro);
      root.append(introEl);

      requestAnimationFrame(() => requestAnimationFrame(() => (barFill.style.width = (done / deckTotal) * 100 + '%')));
      if (!reducedMotion() && done > 0) {
        const t0 = performance.now();
        const step = (t) => {
          if (!introEl) return;
          const k = Math.min(1, (t - t0) / 900);
          num.textContent = String(Math.round(done * (1 - Math.pow(1 - k, 3))));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      introTimer = setTimeout(dismissIntro, 2600);
    }

    function dismissIntro() {
      if (!introEl) return;
      clearTimeout(introTimer);
      const el = introEl;
      introEl = null;
      el.classList.add('out');
      setTimeout(() => el.remove(), 260);
      focusCard();
    }

    // --- start ---------------------------------------------------------------------------
    showCard(false);
    paintProgress();
    intro();

    return {
      onKey(e) {
        if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
        if (introEl) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
            e.preventDefault();
            dismissIntro();
          }
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          if (B.gloss.tipOpen()) B.gloss.hideTip();
          else quit();
          return;
        }
        if (e.key === 'Enter' && e.repeat) {
          e.preventDefault();
          return;
        }
        if (phase === 'feedback') {
          if (e.key === 'Enter') {
            e.preventDefault();
            next();
          }
          return;
        }
        if (phase !== 'answer') return;
        if ((e.key === 'g' || e.key === 'G') && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
          e.preventDefault();
          openGlossary();
          return;
        }
        if (ctrl && ctrl.key && ctrl.key(e)) {
          e.preventDefault();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          check(false);
        }
      },
      onBack: () => (introEl ? dismissIntro() : quit()),
      destroy() {
        clearTimeout(introTimer);
        B.gloss.hideTip();
        if (B.audio.canSpeak) window.speechSynthesis.cancel();
      },
    };
  };
})();

  <script>/* js/ui/summary.js */
/* End-of-session summary: XP, accuracy, time, newly mastered cards and the cards that were missed. */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, pct, fmtDuration } = B.util;

  function tile(icon, value, label, cls) {
    return h('div', { class: 'stat-tile ' + (cls || '') },
      h('div', { class: 'stat-icon', 'aria-hidden': 'true' }, icon),
      h('div', { class: 'stat-value' }, value),
      h('div', { class: 'stat-label' }, label));
  }

  /** Question + answer of a card for lists (summary and review). */
  function cardLine(card, extra) {
    const d = B.ex.get(card.type).describe(card);
    const topic = B.deck.topicMap[card.topic];
    const showPrompt = card.prompt && d.q !== card.prompt;
    return h('li', { class: 'miss-item' },
      h('div', { class: 'miss-top' },
        h('span', { class: 'topic-tag' }, h('span', { 'aria-hidden': 'true' }, topic.icon + ' '), topic.name),
        h('span', { class: 'type-tag' }, B.ex.label(card.type)),
        extra && extra.count ? h('span', { class: 'miss-count', title: 'Times answered wrong' }, `✗ ${extra.count}×`) : null,
        extra && extra.done != null ? h('span', { class: 'miss-state ' + (extra.done ? 'ok' : 'todo') }, extra.done ? '✓ mastered' : '… not yet') : null),
      showPrompt ? h('div', { class: 'miss-prompt', html: md(card.prompt) }) : null,
      h('div', { class: 'miss-q', html: B.ex.richText(d.q) }),
      extra && extra.given ? h('div', { class: 'miss-given' }, h('span', { class: 'miss-k' }, 'You wrote: '), h('s', {}, show(extra.given))) : null,
      h('div', { class: 'miss-a' }, h('span', { class: 'miss-k' }, 'Answer: '), h('span', { html: md(d.a) })),
      card.explain ? h('div', { class: 'miss-why', html: md(card.explain) }) : null);
  }

  B.ui.cardLine = cardLine;
  B.ui.tile = tile;

  B.ui.summary = function (root, r) {
    const ov = B.stats.overview();
    const acc = pct(r.correct, r.answered);
    const complete = ov.complete && !r.practice;
    const title = complete
      ? `You mastered all ${ov.total} cards!`
      : r.quit
        ? 'Session saved'
        : acc >= 90
          ? 'Ausgezeichnet!'
          : acc >= 70
            ? 'Gut gemacht!'
            : 'Session complete!';
    const subtitle = complete
      ? 'Wunderbar! Your detailed review with charts is ready.'
      : r.practice
        ? `You practised ${r.total} card${r.total === 1 ? '' : 's'} you had got wrong before.`
        : r.quit
          ? `You mastered ${r.mastered} new card${r.mastered === 1 ? '' : 's'} before stopping.`
          : `You mastered ${r.mastered} new card${r.mastered === 1 ? '' : 's'}.`;

    const tiles = h('div', { class: 'stat-grid' },
      tile('⚡', '+' + r.xp, 'XP earned', 't-xp'),
      tile('🎯', acc + '%', `accuracy (${r.correct}/${r.answered})`, 't-acc'),
      tile('⏱️', fmtDuration(r.ms), 'time', 't-time'),
      tile(r.practice ? '🔁' : '⭐', r.practice ? String(r.cleared) : '+' + r.mastered, r.practice ? 'fixed' : 'mastered', 't-new'));

    const overall = h('div', { class: 'card overall' },
      h('div', { class: 'overall-row' }, h('b', {}, 'Overall'), h('span', {}, h('b', {}, String(ov.done)), ` / ${ov.total} mastered`)),
      h('div', { class: 'progress big', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(ov.total), 'aria-valuenow': String(ov.done), 'aria-label': 'Overall progress' },
        h('div', { class: 'progress-fill', style: { width: pct(ov.done, ov.total) + '%' } })),
      h('p', { class: 'muted small' }, complete ? 'Every card is done.' : `${ov.total - ov.done} cards left${r.bestCombo >= 3 ? ` · best combo this session: 🔥 ${r.bestCombo}` : ''}`));

    const missedCards = r.missed.map((id) => B.deck.cardMap[id]).filter(Boolean);
    const missedList = missedCards.length
      ? h('section', { class: 'card missed' },
        h('h2', { class: 'section-title' }, `Cards you missed (${missedCards.length})`),
        h('p', { class: 'muted small' }, r.practice
          ? 'Practice doesn’t change your progress — it’s just extra training.'
          : r.quit
            ? 'Cards marked “not yet” stay in the pile for your next session.'
            : 'Each one went back into the pile until you got it right. They stay in your review, so you can practise them again.'),
        h('ul', { class: 'miss-list' }, missedCards.map((c) => {
          const s = B.store.cardState(c.id);
          return cardLine(c, { done: B.store.isDone(c.id), given: !r.practice && s ? s.lw : null });
        })))
      : r.answered
        ? h('section', { class: 'card perfect' }, h('span', { 'aria-hidden': 'true' }, '💯 '), 'No mistakes this session!')
        : null;

    const primary = h('button', { class: 'btn btn-primary btn-big', type: 'button' }, complete ? 'See my detailed review' : 'Continue');
    primary.addEventListener('click', () => B.app.go(complete ? 'review' : 'home'));
    const pendingLeft = r.practice ? B.stats.mistakeCards().length : B.stats.pending(r.opts.topic).length;
    const again = !complete && pendingLeft
      ? h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '▶ '), r.practice ? 'Practise again' : 'Keep going')
      : null;
    if (again) again.addEventListener('click', () => B.app.go('session', r.opts));
    const report = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '📊 '), 'Progress report');
    report.addEventListener('click', () => B.app.go('review'));

    root.append(h('main', { class: 'summary' },
      h('div', { class: 'summary-hero' },
        h('div', { class: 'summary-mascot' + (complete ? ' big' : ''), 'aria-hidden': 'true' }, complete ? '🏆' : acc >= 70 ? '🥨' : '💪'),
        h('h1', {}, title),
        h('p', { class: 'muted' }, subtitle)),
      tiles,
      overall,
      missedList,
      h('div', { class: 'summary-actions' }, primary, h('div', { class: 'home-links' }, again, complete ? null : report))));

    B.audio.play('complete');
    if (!r.quit && (acc >= 60 || complete)) setTimeout(() => B.app.confetti(complete ? 200 : 110), 150);
    primary.focus({ preventScroll: true });

    return {
      onKey(e) {
        if (e.key === 'Enter' && (e.target === document.body || e.target === primary)) {
          e.preventDefault();
          primary.click();
        }
      },
    };
  };
})();
