</script>
  <script>/* js/games/swipe.js */
/*
 * Swipe games: one card at a time. Swipe or drag it left or right, tap one of the two big
 * buttons, or press ← / → (or 1 / 2). Four games share the engine below:
 *   haben-sein   Haben oder sein?   the Perfekt helper of a verb
 *   tuersteher   Der Türsteher      is the word order of the sentence right? (verb in position 2 …)
 *   nicht-kein   Nicht oder kein?   negate a noun with kein, everything else with nicht
 *   im-ins       Im oder ins?       Wo? → im, Wohin? → ins
 * Each definition has gen(topic, level) → next(), which makes the cards without a DOM, so tools
 * can test the content in Node. The helpers in Brezel.games.quick are shared with rush.js and automat.js.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, pick, pulse, reducedMotion, splitSentence } = B.util;
  const L = B.games.lib;
  const data = () => B.games.data.quick || {};

  // --- helpers shared by the quick-fire games ----------------------------------------------------
  const Q = (B.games.quick = B.games.quick || {});

  Q.soundOn = () => !B.store || B.store.setting('sound') !== false;
  /** Speak German, but only while sound is on. */
  Q.say = (api, text, opts) => {
    if (text && Q.soundOn()) api.speak(text, opts);
  };
  /** Markdown-lite with a "___" gap: an empty box, or `word` filled in. */
  Q.gapHtml = (s, word, cls) =>
    String(s).split('___').map((p) => md(show(p))).join(word ? `<b class="q-fill ${cls || ''}">${md(show(word))}</b>` : '<span class="q-gap" aria-label="gap">&nbsp;</span>');
  /** Fill the "___" of a sentence. */
  Q.fill = (s, word) => String(s).replace('___', word);
  /**
   * A bar that shrinks on game time (so it pauses with the game). bar = an element with one
   * child; calls onTimeout once when it runs out. Returns stop().
   */
  Q.itemTimer = function (api, bar, ms, onTimeout) {
    let t = 0;
    let stopped = false;
    const fill = bar.firstElementChild;
    bar.hidden = false;
    const off = api.frame((dt) => {
      if (stopped) return false;
      t += dt;
      const k = Math.max(0, 1 - t / ms);
      fill.style.transform = `scaleX(${k})`;
      bar.classList.toggle('low', k < 0.3);
      if (t >= ms) {
        stopped = true;
        onTimeout();
        return false;
      }
      return true;
    });
    return () => {
      stopped = true;
      off();
    };
  };
  /** Points for an answer given in `ms`: 10, plus up to 10 for speed. */
  Q.speedPoints = (ms, fast = 2500, slow = 9000) => 10 + Math.round(10 * Math.max(0, Math.min(1, (slow - ms) / (slow - fast))));

  // --- the swipe engine --------------------------------------------------------------------------
  /**
   * cfg = {
   *   theme: css class, decor?: () → Node drawn behind the cards,
   *   labels(level) → [{ label, sub? }, { label, sub? }]   left and right,
   *   perCard?(level) → ms per card (0 = no limit),
   *   gen(topic, level) → next() → item { side: 0 | 1, q, a },
   *   face(item, level) → Node, explain(item, ok) → { html, say? }
   * }
   */
  function swipeGame(cfg) {
    return function play(stage, api) {
      const level = api.level;
      const [left, right] = cfg.labels(level);
      const next = cfg.gen(api.topic, level);
      const perCard = cfg.perCard ? cfg.perCard(level) : 0;

      const zone = (side, l) => h('div', { class: 'sw-zone sw-zone-' + side },
        h('span', { class: 'sw-zone-arrow' }, side === 'l' ? '◄' : '►'),
        h('b', {}, l.label));
      const zl = zone('l', left);
      const zr = zone('r', right);
      const button = (side, l) => h('button', { type: 'button', class: 'btn g-btn sw-btn sw-btn-' + side, 'aria-label': l.label + (l.sub ? ` (${l.sub})` : '') + (side === 'l' ? ', left arrow' : ', right arrow') },
        side === 'l' ? h('span', { class: 'sw-btn-arrow', 'aria-hidden': 'true' }, '◄') : null,
        h('span', { class: 'sw-btn-text' }, h('span', {}, l.label), l.sub ? h('small', { class: 'sw-btn-sub' }, l.sub) : null),
        side === 'r' ? h('span', { class: 'sw-btn-arrow', 'aria-hidden': 'true' }, '►') : null);
      const bl = button('l', left);
      const br = button('r', right);
      bl.addEventListener('click', () => answer(0));
      br.addEventListener('click', () => answer(1));
      const deck = h('div', { class: 'sw-deck' });
      const flash = h('div', { class: 'sw-flash', 'aria-live': 'polite' });
      stage.append(h('div', { class: 'swipe ' + (cfg.theme || '') },
        cfg.decor ? cfg.decor() : null,
        h('div', { class: 'sw-zones', 'aria-hidden': 'true' }, zl, zr),
        deck,
        flash,
        h('div', { class: 'sw-btns' }, bl, br)));

      // a waiting card behind the countdown
      deck.append(h('div', { class: 'sw-card is-ready' }, h('div', { class: 'sw-face' }, h('div', { class: 'sw-word' }, 'Bereit?'), h('div', { class: 'sw-en' }, 'Get ready…'))));

      let item = null;
      let card = null;
      let busy = true;
      let stopTimer = null;
      let drag = null;
      const threshold = () => Math.max(70, deck.clientWidth * 0.22);
      const hot = (side) => {
        zl.classList.toggle('hot', side === 0);
        zr.classList.toggle('hot', side === 1);
      };

      function showCard() {
        if (api.ended) return;
        item = next();
        flash.className = 'sw-flash';
        flash.replaceChildren();
        const timer = h('div', { class: 'g-itimer sw-ctimer', hidden: true }, h('span'));
        card = h('div', { class: 'sw-card', role: 'group', 'aria-label': item.q || 'card' }, cfg.face(item, level), timer);
        deck.querySelectorAll('.sw-card.is-ready').forEach((x) => x.remove());
        deck.append(card);
        attachDrag(card);
        if (!reducedMotion()) pulse(card, 'sw-in');
        busy = false;
        if (perCard) stopTimer = Q.itemTimer(api, timer, perCard, () => answer(null));
      }

      function answer(side) {
        if (busy || !item || api.ended) return;
        busy = true;
        if (stopTimer) stopTimer();
        stopTimer = null;
        const it = item;
        const ok = side === it.side;
        card.classList.add(ok ? 'is-good' : 'is-bad');
        fly(card, side === 0 ? -1 : side === 1 ? 1 : 0);
        hot(side);
        const ex = cfg.explain(it, ok);
        flash.className = 'sw-flash show ' + (ok ? 'good' : 'bad');
        flash.innerHTML = `<span class="sw-flash-icon">${ok ? '✓' : side == null ? '⏱' : '✗'}</span> <span>${side == null && !ok ? 'Too slow! ' : ''}${ex.html}</span>`;
        if (ok) api.hit({ el: side === 0 ? bl : br });
        else {
          api.miss({ q: it.q, a: it.a, given: side == null ? 'too slow' : (side === 0 ? left : right).label, el: deck });
          Q.say(api, ex.say);
        }
        api.wait(ok ? 560 : 1900).then((go) => {
          hot(null);
          if (go) showCard();
        });
      }

      function fly(el, dir) {
        el.classList.add('gone');
        if (reducedMotion()) return el.remove();
        el.style.transition = 'transform .36s cubic-bezier(.45,.05,.8,.45), opacity .36s ease';
        el.style.transform = dir ? `translate(${dir * (deck.clientWidth * 0.8 + 180)}px, -24px) rotate(${dir * 30}deg)` : 'translateY(70px) scale(.85)';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400); // cosmetic only
      }

      function attachDrag(el) {
        el.addEventListener('pointerdown', (e) => {
          if (busy || (e.button !== undefined && e.button !== 0)) return;
          drag = { id: e.pointerId, x0: e.clientX, dx: 0 };
          if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
          el.style.transition = 'none';
          el.classList.add('dragging');
        });
        el.addEventListener('pointermove', (e) => {
          if (!drag || e.pointerId !== drag.id || busy) return;
          drag.dx = e.clientX - drag.x0;
          el.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 16}deg)`;
          const lean = Math.abs(drag.dx) > threshold() * 0.45 ? (drag.dx < 0 ? 0 : 1) : null;
          hot(lean);
          el.classList.toggle('lean-l', lean === 0);
          el.classList.toggle('lean-r', lean === 1);
        });
        const up = (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const dx = drag.dx;
          drag = null;
          el.classList.remove('dragging', 'lean-l', 'lean-r');
          hot(null);
          if (!busy && Math.abs(dx) >= threshold()) return answer(dx < 0 ? 0 : 1);
          el.style.transition = 'transform .28s cubic-bezier(.3,1.5,.5,1)';
          el.style.transform = '';
        };
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
      }

      return {
        begin: showCard,
        key(e) {
          if (e.key === 'ArrowLeft' || e.key === '1') return answer(0), true;
          if (e.key === 'ArrowRight' || e.key === '2') return answer(1), true;
          return false;
        },
        destroy() {
          if (stopTimer) stopTimer();
        },
      };
    };
  }

  Q.swipeGame = swipeGame;

  const face = (main, sub, extra) => h('div', { class: 'sw-face' }, extra || null, h('div', { class: 'sw-word', lang: 'de', html: main }), sub ? h('div', { class: 'sw-en' }, sub) : null);

  // --- 1. Haben oder sein? ---------------------------------------------------------------------------
  const TRAP_TOPICS = ['reflexive', 'verblist', 'past', 'pastq', 'tenses', 'prefix', 'all'];

  /** [{ v, reflexive, aux }] for the topic; borrows sein verbs from the whole lexicon when there are few. */
  function habenItems(topic, level) {
    const items = [];
    const seen = new Set();
    const add = (v, reflexive) => {
      const key = v.inf + (reflexive ? '+sich' : '');
      if (!v.pp || seen.has(key)) return;
      seen.add(key);
      items.push({ v, reflexive, aux: reflexive ? 'haben' : v.aux || 'haben' });
    };
    for (const { v, reflexive } of L.verbsFor(topic, { need: ['pp'] })) {
      if (level === 1 && reflexive && topic !== 'reflexive' && topic !== 'verblist') continue;
      add(v, reflexive);
    }
    // the trap: sich umziehen (clothes) takes haben, umziehen (house) takes sein
    const um = L.verb('umziehen');
    if (um && level >= 2 && TRAP_TOPICS.includes(topic)) {
      add(um, true);
      add(um, false);
    }
    if (items.filter((x) => x.aux === 'sein').length < 3) {
      for (const { v } of L.verbsFor('all', { need: ['pp'] })) if (v.aux === 'sein') add(v, false);
    }
    return items;
  }

  const reflMeaning = (v) => (data().reflMeaning || {})[v.inf] || L.meaning(v);

  function habenCard(x) {
    const word = (x.reflexive ? 'sich ' : '') + x.v.inf;
    const perfekt = 'er ' + L.form(x.v, 'perfekt', 2, { reflexive: x.reflexive });
    const why = x.reflexive
      ? 'reflexive verbs always take *haben*'
      : x.aux === 'sein'
        ? (['sein', 'bleiben'].includes(x.v.inf) ? `*${x.v.inf}* takes *sein*` : 'a change of place or state → *sein*')
        : 'no change of place or state → *haben*';
    return { side: x.aux === 'sein' ? 1 : 0, word, en: x.reflexive && !L.isReflexive(x.v) ? reflMeaning(x.v) : L.meaning(x.v), q: word, a: perfekt, why, trap: x.reflexive && x.v.aux === 'sein' };
  }

  function habenGen(topic, level) {
    const items = habenItems(topic, level);
    const haben = L.deal(items.filter((x) => x.aux === 'haben'));
    const sein = L.deal(items.filter((x) => x.aux === 'sein'));
    const traps = L.deal(items.filter((x) => x.reflexive && x.v.aux === 'sein'));
    return () => {
      const r = Math.random();
      const x = (level === 3 && r < 0.15 && traps()) || (r < 0.5 ? sein() : haben()) || haben() || sein();
      return habenCard(x);
    };
  }

  B.games.register('haben-sein', {
    name: 'Haben oder sein?',
    icon: '⚖️',
    color: '#1cb0f6',
    blurb: 'Which helper does the verb take in the **Perfekt**? Swipe it to the right side.',
    how: ['◄ **haben** · **sein** ►', 'Swipe or drag the card, tap a button, or press ← / →', 'Watch out for reflexive verbs!'],
    topics: ['past', 'pastq', 'tenses', 'verblist', 'reflexive', 'prefix'],
    time: (level) => [75, 60, 45][level - 1],
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><circle cx="60" cy="60" r="56" fill="#dff3ff"/><path d="M38 100h44l-7-12H45z" fill="#7a4b1e"/><rect x="56" y="30" width="8" height="62" rx="4" fill="#8f5a26"/><g transform="rotate(-9 60 34)"><rect x="14" y="30" width="92" height="8" rx="4" fill="#a8692c"/><path d="M24 38 14 62M24 38l10 24M96 38 86 62M96 38l10 24" stroke="#a8692c" stroke-width="2.5"/><path d="M8 62h32a16 8 0 0 1-32 0z" fill="#1cb0f6"/><path d="M80 62h32a16 8 0 0 1-32 0z" fill="#ff9600"/><text x="24" y="58" text-anchor="middle" font-size="13" fill="#0b6699">hat</text><text x="96" y="58" text-anchor="middle" font-size="13" fill="#a35a00">ist</text></g><circle cx="60" cy="33" r="7" fill="#ffc800" stroke="#e0a800" stroke-width="2"/></svg>',
    ready: (topic, level) => {
      const items = habenItems(topic, level);
      return items.length >= 6 && items.some((x) => x.aux === 'sein') && items.some((x) => x.aux === 'haben');
    },
    gen: habenGen,
    play: swipeGame({
      theme: 'sw-haben',
      labels: () => [{ label: 'haben', sub: 'hat …' }, { label: 'sein', sub: 'ist …' }],
      perCard: (level) => (level === 3 ? 3200 : 0),
      gen: habenGen,
      face: (it, level) => face(md(it.word), it.en, it.trap && level < 3 ? h('span', { class: 'sw-tag' }, 'careful!') : null),
      explain: (it) => ({ html: `<b>${md(it.a)}</b> <small>— ${md(it.why)}</small>`, say: it.a }),
    }),
  });

  // --- 2. Der Türsteher (word order) ------------------------------------------------------------------
  const ADVERBS = new Set(['gern', 'heute', 'oft', 'gestern', 'schon', 'nicht', 'morgen', 'jetzt', 'immer', 'auch', 'sehr', 'noch', 'manchmal', 'abends', 'morgens', 'gleich', 'bald', 'wieder', 'lieber', 'nie']);
  const JOINERS = new Set(['weil', 'dass', 'ob', 'wenn', 'als', 'denn', 'aber', 'oder', 'sondern', 'damit', 'bevor', 'nachdem']);

  let setsCache = null;
  let setsKey = 0;
  /** Finite verb forms, infinitives/participles and separable "verb prefix" pairs from the lexicon. */
  function verbSets() {
    const n = Object.keys(B.deck.verbs).length;
    if (setsCache && setsKey === n) return setsCache;
    const finite = new Set();
    const nonfinite = new Set();
    const sep = new Set();
    for (const v of Object.values(B.deck.verbs)) {
      for (const f of [...(v.forms || []), ...(v.prt || [])]) {
        const [hd, pre] = f.split(' ');
        finite.add(norm(hd));
        if (pre) sep.add(norm(hd) + ' ' + norm(pre));
      }
      nonfinite.add(norm(v.inf));
      if (v.pp) nonfinite.add(norm(v.pp));
    }
    setsKey = n;
    setsCache = { finite, nonfinite, sep };
    return setsCache;
  }

  /**
   * A statement we can safely rearrange: { words, punct, vi } with vi = index of the one
   * conjugated verb (position 2). null for questions, commands, clauses with commas or joiners.
   */
  function analyse(sentence) {
    const { words, punct } = splitSentence(sentence);
    if (punct !== '.' && punct !== '!') return null;
    if (words.length < 3 || words.length > 12) return null;
    if (words.some((w) => /[,;:„“"()/…]/.test(w) || /_/.test(w))) return null;
    const low = words.map((w) => norm(w));
    if (low.some((w) => JOINERS.has(w))) return null;
    const { finite, nonfinite } = verbSets();
    const last = words.length - 1;
    const cands = [];
    low.forEach((w, i) => {
      if (!finite.has(w)) return;
      if (i > 0 && /^[A-ZÄÖÜ]/.test(words[i])) return; // a noun (Essen, Leben …), not a verb
      if (i === last && nonfinite.has(w)) return; // infinitive or participle at the end
      cands.push(i);
    });
    if (cands.length !== 1 || cands[0] === 0) return null;
    return { words, punct, vi: cands[0], low };
  }

  /** Does the sentence end with the second part of the verb bracket (participle, infinitive, prefix)? */
  function bracketEnd(an) {
    const { nonfinite, sep } = verbSets();
    const lastW = an.low[an.low.length - 1];
    return nonfinite.has(lastW) || sep.has(an.low[an.vi] + ' ' + lastW);
  }

  /** Wrong word orders made from a right one; never equal to the original. */
  function wrongVariants(an) {
    const W = an.words;
    const n = W.length;
    const vi = an.vi;
    const join = (arr) => arr.join(' ') + an.punct;
    const out = [];
    // after a fronted phrase the subject jumps in front of the verb: "Am Sonntag ich fahre …"
    if (vi >= 2 && vi + 1 < n) out.push({ kind: 'swap', text: join([...W.slice(0, vi), W[vi + 1], W[vi], ...W.slice(vi + 2)]) });
    // the verb at the very end (that's the order of a weil/dass clause) — not with a split-off prefix
    const { sep } = verbSets();
    if (vi + 1 < n && !sep.has(an.low[vi] + ' ' + an.low[n - 1])) out.push({ kind: 'end', text: join([...W.slice(0, vi), ...W.slice(vi + 1), W[vi]]) });
    // an adverb squeezed in before the verb: "Ich gern spiele Fußball."
    if (vi === 1 && n - vi > 2 && ADVERBS.has(an.low[2])) out.push({ kind: 'third', text: join([W[0], W[2], W[1], ...W.slice(3)]) });
    // the participle / infinitive / prefix pulled forward: "Ich habe gemacht meine Hausaufgaben."
    if (n - 1 - vi >= 2 && bracketEnd(an)) out.push({ kind: 'bracket', text: join([...W.slice(0, vi + 1), W[n - 1], ...W.slice(vi + 1, n - 1)]) });
    const seen = new Set([norm(join(W))]);
    return out.filter((x) => !seen.has(norm(x.text)) && seen.add(norm(x.text)));
  }

  function spotFixed(c) {
    if (c.fixed) return c.fixed;
    const t = c.q.trim().split(/\s+/);
    const bare = (x) => x.replace(/[.,!?;:…]+$/, '');
    const i = Number.isInteger(c.at) ? c.at : t.findIndex((x) => norm(bare(x)) === norm(c.wrong));
    if (i < 0) return null;
    t[i] = c.correct + t[i].slice(bare(t[i]).length);
    return t.join(' ');
  }

  /** The right sentences of a topic's cards that we can rearrange: [{ s, an, wrongs, accepted }]. */
  function sentencesFor(topic, level, { allLevels = false } = {}) {
    const cards = L.cardsFor(topic, level, { types: ['order', 'gap', 'type', 'mc', 'spot'], min: allLevels ? Infinity : 12 });
    const out = [];
    const seen = new Set();
    for (const c of cards) {
      let list = [];
      if (c.type === 'order') list = [c.answer, ...(c.answers || [])];
      else if (c.type === 'gap' && c.q) list = [c.q.replace(/\{([^}]+)\}/g, (_, m) => m.split('|')[0])];
      else if ((c.type === 'type' || c.type === 'mc') && c.q && B.ex.BLANK.test(c.q)) list = [c.q.replace(B.ex.BLANK, c.type === 'mc' ? c.correct : B.ex.asList(c.answer)[0])];
      else if (c.type === 'spot' && c.q) list = [spotFixed(c)];
      list = list.filter((s) => typeof s === 'string' && s.trim()).map((s) => show(s).replace(/\*+/g, '').replace(/\s+/g, ' ').trim());
      if (!list.length || seen.has(norm(list[0]))) continue;
      const an = analyse(list[0]);
      if (!an) continue;
      const accepted = new Set(list.map(norm));
      const wrongs = wrongVariants(an).filter((w) => !accepted.has(norm(w.text)));
      if (!wrongs.length) continue;
      seen.add(norm(list[0]));
      out.push({ s: list[0], an, wrongs, accepted });
    }
    return out;
  }

  function usableSentences(topic, level) {
    const at = sentencesFor(topic, level);
    return at.length >= 8 ? at : sentencesFor(topic, level, { allLevels: true });
  }

  const boldVerb = (an) => an.words.map((w, i) => (i === an.vi ? `**${w}**` : w)).join(' ') + an.punct;
  const WHY = {
    swap: 'the conjugated verb comes right after the first part (position 2), then the subject',
    end: 'in a main clause the conjugated verb is in position 2, not at the end',
    third: 'the conjugated verb is in position 2',
    bracket: 'the participle, infinitive or prefix goes to the very end',
  };

  function doorGen(topic, level) {
    const pool = usableSentences(topic, level);
    const nextS = L.deal(pool);
    const easy = (w) => w.kind === 'swap' || w.kind === 'end';
    return () => {
      const s = nextS();
      if (Math.random() < 0.5) return { side: 1, text: s.s, q: s.s, a: s.s + ' ✓', why: null, fix: boldVerb(s.an), say: s.s };
      const ws = level === 1 && s.wrongs.some(easy) ? s.wrongs.filter(easy) : s.wrongs;
      const w = pick(ws);
      return { side: 0, text: w.text, q: w.text, a: s.s, why: WHY[w.kind], fix: boldVerb(s.an), say: s.s };
    };
  }

  B.games.register('tuersteher', {
    name: 'Der Türsteher',
    icon: '🚪',
    color: '#8a63d2',
    blurb: 'You’re the bouncer at Club Satzbau. Only sentences with the **right word order** get in.',
    how: ['◄ **Raus!** wrong order · **Rein!** correct ►', 'Swipe, tap or press ← / →', 'Three wrong calls and the club closes'],
    topics: '*',
    time: 60,
    lives: 3,
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><rect width="120" height="120" rx="28" fill="#2b1d4e"/><circle cx="98" cy="20" r="7" fill="#ffd84d"/><circle cx="18" cy="16" r="1.8" fill="#fff"/><circle cx="30" cy="30" r="1.4" fill="#fff"/><circle cx="84" cy="36" r="1.4" fill="#fff"/><rect y="98" width="120" height="22" fill="#1c1236"/><text x="60" y="22" text-anchor="middle" font-size="12" fill="#ff86d0" letter-spacing="2">CLUB</text><rect x="36" y="28" width="48" height="72" rx="24" fill="#5b3fa0"/><rect x="43" y="36" width="34" height="64" rx="17" fill="#8a63d2"/><circle cx="70" cy="70" r="3.5" fill="#ffc800"/><rect x="10" y="70" width="7" height="30" rx="3.5" fill="#ffc800"/><rect x="103" y="70" width="7" height="30" rx="3.5" fill="#ffc800"/><path d="M14 74q16 18 30 4M106 74q-16 18-30 4" stroke="#ff4b4b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M52 52l5 5 10-11" stroke="#58cc02" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    ready: (topic, level) => usableSentences(topic, level).length >= 8,
    gen: doorGen,
    play: swipeGame({
      theme: 'sw-door',
      decor: () => h('div', { class: 'sw-door-art', 'aria-hidden': 'true', html: '<svg viewBox="0 0 200 160" preserveAspectRatio="xMidYMax meet"><rect x="56" y="10" width="88" height="150" rx="44" fill="currentColor" opacity=".18"/><rect x="68" y="24" width="64" height="136" rx="32" fill="currentColor" opacity=".14"/><rect x="14" y="104" width="9" height="56" rx="4.5" fill="#ffc800"/><rect x="177" y="104" width="9" height="56" rx="4.5" fill="#ffc800"/><path d="M19 110q34 30 62 8M181 110q-34 30-62 8" stroke="#ff4b4b" stroke-width="7" fill="none" stroke-linecap="round"/></svg>' }),
      labels: () => [{ label: 'Raus!', sub: 'wrong order' }, { label: 'Rein!', sub: 'correct' }],
      perCard: (level) => (level === 3 ? 6500 : 0),
      gen: doorGen,
      face: (it) => h('div', { class: 'sw-face sw-ticket' }, h('div', { class: 'sw-sentence', lang: 'de' }, show(it.text))),
      explain: (it, ok) =>
        it.side === 1
          ? { html: ok ? 'Correct order — come in!' : `That one was right: <b>${md(it.fix)}</b>`, say: ok ? null : it.say }
          : { html: ok ? `Raus! It’s <b>${md(it.fix)}</b>` : `Wrong order: <b>${md(it.fix)}</b> <small>— ${md(it.why)}</small>`, say: ok ? null : it.say },
    }),
  });

  // --- 3. Nicht oder kein? ------------------------------------------------------------------------------
  function negGen() {
    const next = L.deal(data().nichtKein || []);
    return () => {
      const x = next();
      const isNicht = x.a === 'nicht';
      return { side: isNicht ? 0 : 1, s: x.s, word: x.a, q: x.s.replace('___', '…'), a: Q.fill(x.s, x.a), why: isNicht ? '*nicht* for verbs, adjectives, adverbs and nouns with an article like *mein*' : '*kein* replaces *ein* or no article before a noun' };
    };
  }

  B.games.register('nicht-kein', {
    name: 'Nicht oder kein?',
    icon: '🚫',
    color: '#ff4b4b',
    blurb: '**kein** for a noun, **nicht** for everything else. Swipe each sentence to the right word.',
    how: ['◄ **nicht** · **kein…** ►', 'Swipe, tap or press ← / →'],
    topics: ['questions'],
    time: (level) => [75, 60, 45][level - 1],
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><circle cx="60" cy="60" r="56" fill="#ffe8e8"/><path d="M16 22h54a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10H38l-14 12V62h-8A10 10 0 0 1 6 52V32a10 10 0 0 1 10-10z" fill="#ff4b4b"/><text x="43" y="48" text-anchor="middle" font-size="17" fill="#fff">nicht</text><path d="M50 56h54a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10h-8v12L82 96H50a10 10 0 0 1-10-10V66a10 10 0 0 1 10-10z" fill="#1cb0f6"/><text x="77" y="82" text-anchor="middle" font-size="17" fill="#fff">kein</text></svg>',
    ready: () => (data().nichtKein || []).length >= 8,
    gen: negGen,
    play: swipeGame({
      theme: 'sw-neg',
      labels: (level) => [{ label: 'nicht', sub: level === 1 ? 'not a noun' : '' }, { label: 'kein…', sub: level === 1 ? '+ noun' : '' }],
      perCard: (level) => (level === 3 ? 4000 : 0),
      gen: negGen,
      face: (it) => h('div', { class: 'sw-face' }, h('div', { class: 'sw-sentence', lang: 'de', html: Q.gapHtml(it.s) })),
      explain: (it) => ({ html: `${Q.gapHtml(it.s, it.word)} <small>— ${md(it.why)}</small>`, say: it.a }),
    }),
  });

  // --- 4. Im oder ins? -------------------------------------------------------------------------------------
  function placeGen() {
    const im = L.deal((data().imIns || []).filter((x) => x.a === 'im'));
    const ins = L.deal((data().imIns || []).filter((x) => x.a === 'ins'));
    return () => {
      const x = (Math.random() < 0.5 ? im() : ins()) || im() || ins();
      return { side: x.a === 'im' ? 0 : 1, s: x.s, word: x.a, cue: x.cue, q: x.s.replace('___', '…'), a: Q.fill(x.s, x.a), why: x.a === 'im' ? 'Wo? → *im* (in dem)' : 'Wohin? → *ins* (in das)' };
    };
  }

  B.games.register('im-ins', {
    name: 'Im oder ins?',
    icon: '🏠',
    color: '#58cc02',
    blurb: '**Wo?** you are somewhere → **im**. **Wohin?** you go somewhere → **ins**.',
    how: ['◄ **im** (in dem) · **ins** (in das) ►', 'Swipe, tap or press ← / →'],
    topics: ['prepositions'],
    time: (level) => [75, 60, 45][level - 1],
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><circle cx="60" cy="60" r="56" fill="#e7fbe0"/><path d="M20 58 58 26l38 32v40H20z" fill="#58cc02"/><path d="M14 60 58 22l44 38" stroke="#2b7a00" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="56" text-anchor="middle" font-size="12" fill="#fff" letter-spacing="1">KINO</text><rect x="28" y="64" width="16" height="14" rx="3" fill="#fff"/><circle cx="36" cy="71" r="4" fill="#ff9600"/><rect x="52" y="68" width="18" height="30" rx="3" fill="#2b7a00"/><path d="M112 84H84" stroke="#ff9600" stroke-width="7" stroke-linecap="round"/><path d="M92 74l-10 10 10 10" stroke="#ff9600" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    ready: () => (data().imIns || []).length >= 8,
    gen: placeGen,
    play: swipeGame({
      theme: 'sw-place',
      labels: (level) => [{ label: 'im', sub: level === 1 ? 'Wo?' : '' }, { label: 'ins', sub: level === 1 ? 'Wohin?' : '' }],
      perCard: (level) => (level === 3 ? 3500 : 0),
      gen: placeGen,
      face: (it, level) => h('div', { class: 'sw-face' },
        level === 1 ? h('span', { class: 'sw-tag sw-cue' }, it.cue) : null,
        h('div', { class: 'sw-sentence', lang: 'de', html: Q.gapHtml(it.s) })),
      explain: (it) => ({ html: `${Q.gapHtml(it.s, it.word)} <small>— ${md(it.why)}</small>`, say: it.a }),
    }),
  });

  // for tests and other games
  Q.analyse = analyse;
  Q.wrongVariants = wrongVariants;
  Q.sentencesFor = usableSentences;
  Q.habenItems = habenItems;
})();

</script>
  <script>/* js/games/rush.js */
/*
 * Rapid-choice games: a prompt, 2–4 answer buttons (keys 1–4) or, on High, a typed answer
 * (checked with the app's typo rule), instant feedback, next item. Four games share the engine:
 *   partizip      Partizip-Blitz   infinitive → Partizip II
 *   spiegel       Spiegel          the reflexive pronoun: mich, dich, sich, uns, euch
 *   zeitmaschine  Zeitmaschine     Präsens, Präteritum or Perfekt?
 *   hoer          Hör genau        listen, then tap the word you heard
 * Each definition has gen(topic, level) → next() (no DOM), so tools can test the content in Node.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, shuffle, pick, pulse, reducedMotion, levenshtein } = B.util;
  const L = B.games.lib;
  const Q = (B.games.quick = B.games.quick || {});
  const data = () => B.games.data.quick || {};
  const LABEL = { present: 'Präsens', praet: 'Präteritum', perfekt: 'Perfekt' };

  // --- the rapid-choice engine ------------------------------------------------------------------
  /**
   * cfg = {
   *   theme, gen(topic, level) → next() → item { options, answer, accept?, reject?, q, a, fixed? },
   *   prompt(item, level) → Node, explain(item, ok, given) → { html, say? },
   *   typed?(level) → bool, placeholder?, perItem?(level) → ms, rounds?(level) → n,
   *   visual?(api) → { el, show?(item), right?(item, given), wrong?(item, given) },
   *   onShow?(item, api, level), onWrong?(item, api, level), key?(e, api, item, busy, visual) → bool,
   *   points?(ms, level) → points
   * }
   */
  function rushGame(cfg) {
    return function play(stage, api) {
      const level = api.level;
      const next = cfg.gen(api.topic, level);
      const perItem = cfg.perItem ? cfg.perItem(level) : 0;
      const typed = cfg.typed ? cfg.typed(level) : false;
      const rounds = cfg.rounds ? cfg.rounds(level) : 0;
      const vis = cfg.visual ? cfg.visual(api, level) : null;

      const promptEl = h('div', { class: 'rs-prompt' });
      const timer = h('div', { class: 'g-itimer rs-itimer', hidden: true }, h('span'));
      const opts = h('div', { class: 'rs-opts', role: 'group', 'aria-label': 'Answers' });
      const fb = h('div', { class: 'rs-fb', 'aria-live': 'polite' });
      let input = null;
      let body = opts;
      if (typed) {
        input = h('input', {
          class: 'type-input rs-input', type: 'text', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off',
          spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Your answer', placeholder: cfg.placeholder || 'Type the answer', lang: 'de',
        });
        const okBtn = h('button', { type: 'button', class: 'btn btn-primary rs-ok' }, 'OK');
        okBtn.addEventListener('click', () => submitTyped());
        body = h('div', { class: 'rs-type' }, h('div', { class: 'rs-type-row' }, input, okBtn), B.ex.umlautBar(() => input));
      }
      stage.append(h('div', { class: 'rs ' + (cfg.theme || '') + (typed ? ' is-typed' : '') }, vis ? vis.el : null, promptEl, timer, body, fb));
      promptEl.append(h('div', { class: 'rs-wait' }, 'Bereit?'));

      let item = null;
      let busy = true;
      let stopTimer = null;
      let done = 0;
      let elapsed = 0;
      let btns = [];

      function present() {
        if (api.ended) return;
        item = next();
        promptEl.replaceChildren(cfg.prompt(item, level));
        if (!reducedMotion()) pulse(promptEl, 'rs-in');
        fb.className = 'rs-fb';
        fb.replaceChildren();
        if (vis && vis.show) vis.show(item);
        if (typed) {
          input.value = '';
          input.disabled = false;
          input.classList.remove('good', 'bad');
          input.focus({ preventScroll: true });
        } else {
          const list = item.fixed ? item.options : shuffle(item.options);
          btns = list.map((o, i) => {
            const b = h('button', { type: 'button', class: 'btn g-btn rs-opt', 'aria-label': `${i + 1}: ${show(o)}` },
              h('span', { class: 'rs-key', 'aria-hidden': 'true' }, String(i + 1)),
              h('span', { class: 'rs-opt-text', lang: 'de', html: md(show(o)) }));
            b._val = o;
            b.addEventListener('click', () => resolve(o));
            return b;
          });
          opts.className = 'rs-opts n' + btns.length;
          opts.replaceChildren(...btns);
        }
        elapsed = 0;
        busy = false;
        api.frame((dt) => {
          if (busy) return false;
          elapsed += dt;
          return true;
        });
        timer.hidden = true;
        if (perItem) stopTimer = Q.itemTimer(api, timer, perItem, () => resolve(null));
        if (cfg.onShow) cfg.onShow(item, api, level);
      }

      function checkTyped(it, given) {
        const r = B.check.typed(given, it.accept || [it.answer], { reject: it.reject });
        let note = null;
        if (r.ok && r.typo) note = `Small typo — it’s **${show(r.matched)}**.`;
        return { ok: r.ok, note };
      }

      function resolve(given) {
        if (busy || !item || api.ended) return;
        busy = true;
        if (stopTimer) stopTimer();
        stopTimer = null;
        const it = item;
        let ok = false;
        let note = null;
        if (given != null && typed) ({ ok, note } = checkTyped(it, given));
        else if (given != null) ok = L.same(given, it.answer);
        if (typed) {
          input.disabled = true;
          input.classList.add(ok ? 'good' : 'bad');
        } else {
          btns.forEach((b) => {
            b.disabled = true;
            if (L.same(b._val, it.answer)) b.classList.add('good');
            else if (given != null && b._val === given) b.classList.add('bad');
            else b.classList.add('dim');
          });
        }
        // fill the gap of the prompt with the right word
        const gap = promptEl.querySelector('.q-gap');
        if (gap) gap.replaceWith(h('b', { class: 'q-fill ' + (ok ? 'good' : 'bad') }, show(it.answer)));
        const ex = cfg.explain(it, ok, given);
        fb.className = 'rs-fb show ' + (ok ? 'good' : 'bad');
        fb.innerHTML = `<span class="rs-fb-icon">${ok ? '✓' : given == null ? '⏱' : '✗'}</span> <span>${given == null ? 'Too slow! ' : ''}${ex.html}${note ? ` <small>${md(note)}</small>` : ''}</span>`;
        const el = typed ? input : btns.find((b) => b._val === given) || promptEl;
        if (ok) {
          api.hit({ el, points: cfg.points ? cfg.points(elapsed, level) : Q.speedPoints(elapsed) });
          if (vis && vis.right) vis.right(it, given);
        } else {
          api.miss({ q: it.q, a: it.a, given: given == null ? 'too slow' : given, el: promptEl });
          if (vis && vis.wrong) vis.wrong(it, given);
          if (cfg.onWrong) cfg.onWrong(it, api, level);
          else Q.say(api, ex.say);
        }
        done++;
        if (rounds) api.progress(done, rounds);
        api.wait(ok ? 560 : 1900).then((go) => {
          if (!go) return;
          if (rounds && done >= rounds) return api.end({});
          present();
        });
      }

      function submitTyped() {
        if (busy || !input) return;
        const v = input.value.trim();
        if (!v) return input.focus();
        resolve(v);
      }

      if (rounds) api.progress(0, rounds);
      return {
        begin: present,
        key(e) {
          if (cfg.key && cfg.key(e, api, item, busy, vis)) return true;
          if (typed) {
            if (e.key === 'Enter') return submitTyped(), true;
            return false; // letters go into the input
          }
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= btns.length) {
            if (!busy) resolve(btns[n - 1]._val);
            return true;
          }
          return false;
        },
        destroy() {
          if (stopTimer) stopTimer();
        },
      };
    };
  }

  Q.rushGame = rushGame;

  /** n options: the answer plus others, without repeats. */
  function options(answer, others, n) {
    return [answer].concat(L.uniq(others, [answer]).slice(0, n - 1));
  }

  const promptBox = (main, sub, label) => h('div', { class: 'rs-q' },
    label ? h('div', { class: 'rs-label' }, label) : null,
    h('div', { class: 'rs-main', lang: 'de', html: main }),
    sub ? h('div', { class: 'rs-sub' }, sub) : null);

  // --- 5. Partizip-Blitz --------------------------------------------------------------------------------
  function partizipPool(topic) {
    const seen = new Set();
    return L.verbsFor(topic, { need: ['pp'] }).filter(({ v, reflexive }) => v.pp && v.inf !== 'möchten' && !seen.has(v.inf + reflexive) && seen.add(v.inf + reflexive));
  }
  const stemOf = (inf) => (inf.endsWith('en') ? inf.slice(0, -2) : inf.endsWith('n') ? inf.slice(0, -1) : inf);

  /** Wrong but plausible participles, the trickiest first: gefliegt, gebekommen, geaufstanden … */
  function fakeParticiples(v) {
    const pre = L.isSeparable(v) ? v.forms[0].split(' ')[1] : '';
    const base = pre && v.inf.startsWith(pre) ? v.inf.slice(pre.length) : v.inf;
    const st = stemOf(base);
    const t = /[td]$/.test(st) ? 'et' : 't';
    const rest = pre && v.pp.startsWith(pre + 'ge') ? v.pp.slice(pre.length + 2) : null;
    const list = [
      pre + 'ge' + st + t,
      pre + 'ge' + base,
      !v.pp.startsWith(pre + 'ge') ? pre + 'ge' + v.pp.slice(pre.length) : null,
      rest ? 'ge' + pre + rest : null,
      rest ? pre + rest : null,
    ];
    return L.uniq(list, [v.pp]);
  }
  function realOthers(v) {
    return L.uniq([v.inf, v.prt ? v.prt[2].split(' ')[0] : null, v.forms[2].split(' ')[0]], [v.pp]);
  }
  function partizipWhy(v) {
    const pre = L.isSeparable(v) ? v.forms[0].split(' ')[1] : '';
    if (pre) return `separable: *ge* goes in the middle (${pre}**ge**…)`;
    if (!v.pp.startsWith('ge')) return 'no *ge-* after be-/ver-/ent-/er- and in -ieren verbs';
    return v.pp.endsWith('en') ? 'irregular: ge…**en**' : 'regular: ge…**t**';
  }

  function partizipGen(topic, level) {
    const next = L.deal(partizipPool(topic));
    return () => {
      const { v, reflexive } = next();
      const fakes = fakeParticiples(v);
      const real = realOthers(v);
      const aux = reflexive || v.aux !== 'sein' ? 'hat' : 'ist';
      const other = aux === 'hat' ? 'ist' : 'hat';
      const word = (reflexive ? 'sich ' : '') + v.inf;
      const opts = level === 1 ? options(v.pp, [pick(real), fakes[0] || real[1]], 3) : options(v.pp, fakes.slice(0, 3).concat(real), 4);
      const perfekt = 'er ' + L.form(v, 'perfekt', 2, { reflexive });
      return {
        v, word, en: L.isReflexive(v) || !reflexive ? L.meaning(v) : (data().reflMeaning || {})[v.inf] || L.meaning(v),
        options: opts, answer: v.pp,
        accept: [v.pp, `${aux} ${v.pp}`].concat(reflexive ? [`${aux} sich ${v.pp}`] : []),
        reject: [`${other} ${v.pp}`].concat(fakes, real),
        q: word, a: v.pp, perfekt, why: partizipWhy(v),
      };
    };
  }

  B.games.register('partizip', {
    name: 'Partizip-Blitz',
    icon: '⚡',
    color: '#ffb700',
    blurb: 'Lightning round: give the **Partizip II** of each verb — as fast as you can.',
    how: ['Pick the participle (keys 1–4)', 'High: type it (e.g. *gemacht*)', 'Faster answers score more'],
    topics: ['past', 'pastq', 'prefix', 'verblist', 'tenses'],
    time: 60,
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><circle cx="60" cy="60" r="56" fill="#fff4d6"/><path d="M68 8 30 66h26l-10 46 44-64H62z" fill="#ffc800" stroke="#e09a00" stroke-width="4" stroke-linejoin="round"/><path d="M60 22 42 56" stroke="#fff6c2" stroke-width="5" stroke-linecap="round"/><text x="96" y="40" text-anchor="middle" font-size="19" fill="#ff9600">ge-</text><text x="22" y="98" text-anchor="middle" font-size="17" fill="#ff9600">-t</text><text x="100" y="98" text-anchor="middle" font-size="17" fill="#ff9600">-en</text></svg>',
    ready: (topic) => partizipPool(topic).length >= 6,
    gen: partizipGen,
    play: rushGame({
      theme: 'rs-blitz',
      gen: partizipGen,
      typed: (level) => level === 3,
      placeholder: 'Partizip II, e.g. gemacht',
      prompt: (it, level) => promptBox(md(it.word), it.en, level === 3 ? 'Type the Partizip II' : 'Partizip II?'),
      explain: (it) => ({ html: `<b>${md(it.perfekt)}</b> <small>— ${md(it.why)}</small>`, say: it.perfekt }),
      visual: () => {
        const el = h('div', { class: 'rs-bolt', 'aria-hidden': 'true', html: '<svg viewBox="0 0 40 60"><path d="M24 2 6 34h12l-6 24 22-34H22z" fill="#ffc800" stroke="#e09a00" stroke-width="2.5" stroke-linejoin="round"/></svg>' });
        return { el, right: () => pulse(el, 'zap'), wrong: () => pulse(el, 'fizzle') };
      },
    }),
  });

  // --- 6. Spiegel (reflexive pronouns) ----------------------------------------------------------------------
  const PRON = [['ich', 0], ['du', 1], ['er', 2], ['sie', 2], ['wir', 3], ['ihr', 4], ['sie', 5], ['Sie', 5]];
  const NAMES_SG = ['Luise', 'Knut', 'Sabine', 'Klaus', 'Felix', 'Leon', 'Mia', 'Julian', 'Herr Huber', 'Frau Weber'];
  const NAMES_PL = ['Peter und Paul', 'Kathrin und Max', 'die Kollegen', 'Frau Weber und Herr Schneider'];
  const PRONOUNS = ['mich', 'dich', 'sich', 'uns', 'euch'];
  const TIMES = ['jeden Morgen', 'am Wochenende', 'am Samstag', 'gestern', 'oft'];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function spiegelPool(topic) {
    const frames = data().spiegel || {};
    const want = topic === 'verblist'
      ? L.VERB_LIST.filter(([, r]) => r).map(([inf]) => inf)
      : Object.keys(frames).concat(Object.values(B.deck.verbs).filter(L.isReflexive).map((v) => v.inf));
    const seen = new Set();
    return want.map(L.verb).filter((v) => v && v.forms && v.pp && !seen.has(v.inf) && seen.add(v.inf)).map((v) => ({ v, frame: frames[v.inf] || { tails: [''] } }));
  }

  function spiegelGen(topic, level) {
    const next = L.deal(spiegelPool(topic));
    const haben = () => L.verb('haben');
    const modes = level === 1 ? ['present'] : level === 2 ? ['present', 'present', 'inversion'] : ['present', 'inversion', 'perfekt', 'perfekt', 'question'];
    return () => {
      const { v, frame } = next();
      const mode = pick(modes);
      const plural = !!frame.plural;
      // the subject: [text, person]
      let subj;
      if (mode === 'question') subj = pick(PRON.filter(([s, p]) => (plural ? p >= 3 : true) && ['du', 'ihr', 'Sie', 'er', 'sie'].includes(s)));
      else if (level === 1) subj = pick(PRON.filter(([, p]) => (plural ? p >= 3 : true)));
      else {
        const r = Math.random();
        if (r < 0.2 && !plural) subj = [pick(NAMES_SG), 2];
        else if (r < 0.4) subj = [pick(NAMES_PL), 5];
        else subj = pick(PRON.filter(([, p]) => (plural ? p >= 3 : true)));
      }
      const [who, p] = subj;
      const isPerf = !frame.present && (mode === 'perfekt' || (mode === 'question' && level === 3 && Math.random() < 0.5));
      const tail = pick(isPerf ? frame.perfekt || frame.tails : frame.tails) || '';
      const [head, ...rest] = v.forms[p].split(' ');
      const aux = haben().forms[p];
      const GAP = '___';
      let words;
      let end = '.';
      if (mode === 'question') {
        words = isPerf ? [cap(aux), who, GAP, tail, v.pp] : [cap(head), who, GAP, tail, ...rest];
        end = '?';
      } else if (mode === 'inversion') {
        // a time phrase in the tail goes to the front ("Jeden Morgen dusche ich mich"); otherwise add one
        const t = TIMES.find((x) => norm(tail).startsWith(norm(x)));
        if (t) words = [cap(t), head, who, GAP, tail.slice(t.length).trim(), ...rest];
        else if (TIMES.some((x) => norm(tail).includes(norm(x))) || /schon/.test(tail)) words = [who, head, GAP, tail, ...rest];
        else words = [pick(['Heute', 'Morgen', 'Am Samstag', 'Jetzt']), head, who, GAP, tail, ...rest];
      } else if (isPerf) {
        const quiet = !TIMES.some((x) => norm(tail).includes(norm(x))) && !/schon/.test(tail);
        words = level === 3 && quiet && Math.random() < 0.4 ? [pick(['Gestern', 'Am Samstag']), aux, who, GAP, tail, v.pp] : [who, aux, GAP, tail, v.pp];
      } else words = [who, head, GAP, tail, ...rest];
      const s = cap(words.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim()) + end;
      const answer = L.REFL[p];
      let others = shuffle(PRONOUNS.filter((x) => x !== answer));
      // the Polish trap: się is sich for everyone in Polish, so always offer sich
      if (level >= 2 && answer !== 'sich') others = ['sich'].concat(others.filter((x) => x !== 'sich'));
      const filled = Q.fill(s, answer);
      return {
        s, answer, options: [answer].concat(others.slice(0, level === 1 ? 2 : 3)), who,
        q: s.replace('___', '…'), a: filled, say: filled, inf: v.inf, p,
      };
    };
  }

  const MIRROR = '<svg viewBox="0 0 220 150" aria-hidden="true"><defs><linearGradient id="mi-g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#cfe9f7"/></linearGradient></defs><ellipse cx="110" cy="75" rx="104" ry="70" fill="#c58cf5"/><ellipse cx="110" cy="75" rx="104" ry="70" fill="none" stroke="#9b5de5" stroke-width="5"/><ellipse cx="110" cy="75" rx="90" ry="58" fill="url(#mi-g)"/><path d="M48 52q14-22 40-30M44 70q8-20 22-30" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".85"/><circle cx="110" cy="8" r="7" fill="#ffc800"/><circle cx="12" cy="75" r="5" fill="#ffc800"/><circle cx="208" cy="75" r="5" fill="#ffc800"/><line x1="110" y1="22" x2="110" y2="128" stroke="#9b5de5" stroke-width="2" stroke-dasharray="4 5" opacity=".45"/></svg>';

  B.games.register('spiegel', {
    name: 'Spiegel',
    icon: '🪞',
    color: '#9b5de5',
    blurb: 'Mirror, mirror: the action goes back to the subject. Pick **mich, dich, sich, uns** or **euch**.',
    how: ['Tap the pronoun or press 1–4', 'Polish says *się* for everyone — German doesn’t!', 'High: Perfekt and questions too'],
    topics: ['reflexive', 'verblist'],
    time: 60,
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><circle cx="60" cy="60" r="56" fill="#f3e8ff"/><rect x="55" y="88" width="10" height="16" fill="#9b5de5"/><rect x="38" y="102" width="44" height="8" rx="4" fill="#9b5de5"/><ellipse cx="60" cy="52" rx="32" ry="40" fill="#c58cf5"/><ellipse cx="60" cy="52" rx="25" ry="33" fill="#e9f7ff"/><path d="M44 34q6-10 16-14M42 46q3-8 9-12" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/><text x="60" y="64" text-anchor="middle" font-size="17" fill="#7b3fc4" transform="translate(120 0) scale(-1 1)">sich</text></svg>',
    ready: (topic) => spiegelPool(topic).length >= 3,
    gen: spiegelGen,
    play: rushGame({
      theme: 'rs-mirror',
      gen: spiegelGen,
      prompt: (it) => promptBox(Q.gapHtml(it.s), null, null),
      explain: (it) => ({ html: `${Q.gapHtml(it.s, it.answer)}`, say: it.say }),
      visual: () => {
        const subj = h('span', { class: 'mi-subj', lang: 'de' });
        const refl = h('span', { class: 'mi-refl', lang: 'de' });
        const el = h('div', { class: 'mi' }, h('div', { class: 'mi-frame', html: MIRROR }), h('div', { class: 'mi-glass' }, subj, h('span', { class: 'mi-eq', 'aria-hidden': 'true' }, '↔'), refl));
        return {
          el,
          show(it) {
            subj.textContent = it.who;
            refl.textContent = '?';
            el.classList.remove('is-right', 'is-wrong');
          },
          // the class stays until the next sentence, so the reflection stays readable
          right(it) {
            refl.textContent = it.answer;
            el.classList.add('is-right');
          },
          wrong(it) {
            refl.textContent = it.answer;
            el.classList.add('is-wrong');
          },
        };
      },
    }),
  });

  // --- 7. Zeitmaschine (which tense?) ------------------------------------------------------------------------
  function zeitPool(topic) {
    const seen = new Set();
    return L.verbsFor(topic, { need: ['prt', 'pp'] }).filter(({ v, reflexive }) => v.forms && !seen.has(v.inf + reflexive) && seen.add(v.inf + reflexive));
  }

  function zeitGen(topic, level) {
    const pool = zeitPool(topic);
    const plain = pool.filter((x) => !x.reflexive);
    const tricky = pool.filter((x) => x.reflexive || L.isSeparable(x.v));
    const nextAll = L.deal(level === 1 && plain.length >= 6 ? plain : pool);
    const nextTricky = L.deal(tricky.length ? tricky : pool);
    return function make(tries = 0) {
      const { v, reflexive } = level === 3 && Math.random() < 0.5 ? nextTricky() : nextAll();
      const p = level === 1 ? 2 : Math.floor(Math.random() * 6);
      const who = p === 2 ? pick(['er', 'sie']) : p === 5 ? pick(['sie', 'Sie']) : L.PERSONS[p];
      const forms = { present: L.form(v, 'present', p, { reflexive }), praet: L.form(v, 'praet', p, { reflexive }), perfekt: L.form(v, 'perfekt', p, { reflexive }) };
      const clear = forms.present && forms.praet && forms.perfekt && !L.same(forms.present, forms.praet);
      if (!clear && tries < 30) return make(tries + 1);
      // the Perfekt (with its helper) is never mistaken for another tense
      const tense = clear ? pick(['present', 'praet', 'perfekt']) : 'perfekt';
      const text = who + ' ' + forms[tense];
      return {
        text, tense, answer: LABEL[tense], options: [LABEL.praet, LABEL.perfekt, LABEL.present], fixed: true,
        word: (reflexive ? 'sich ' : '') + v.inf, all: forms, who,
        q: text, a: LABEL[tense], say: text,
      };
    };
  }

  const DIAL = '<svg viewBox="0 0 220 142" aria-hidden="true"><path d="M110 120 30 120A80 80 0 0 1 70 50.7Z" class="zm-s zm-praet"/><path d="M110 120 70 50.7A80 80 0 0 1 150 50.7Z" class="zm-s zm-perfekt"/><path d="M110 120 150 50.7A80 80 0 0 1 190 120Z" class="zm-s zm-present"/><path d="M30 120A80 80 0 0 1 190 120" fill="none" stroke="currentColor" stroke-width="4" opacity=".25"/><text x="38" y="138" class="zm-t zm-t-praet">Präteritum</text><text x="110" y="31" class="zm-t zm-t-perfekt">Perfekt</text><text x="182" y="138" class="zm-t zm-t-present">Präsens</text><g class="zm-needle"><path d="M110 120 110 52" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="110" cy="120" r="11" fill="currentColor"/><circle cx="110" cy="120" r="4" fill="#ffc800"/></g></svg>';
  const ANGLE = { praet: -60, perfekt: 0, present: 60 };
  const tenseOf = (label) => Object.keys(LABEL).find((k) => LABEL[k] === label);

  B.games.register('zeitmaschine', {
    name: 'Zeitmaschine',
    icon: '🕰️',
    color: '#00a6a0',
    blurb: 'Set the dial! Is the verb form **Präsens**, **Präteritum** or **Perfekt**?',
    how: ['1 Präteritum · 2 Perfekt · 3 Präsens', 'Medium: every person · High: reflexive and separable verbs, against the clock'],
    topics: ['tenses', 'praet', 'past', 'verblist'],
    time: 60,
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" fill="#e3f6f5"/><path d="M60 80 16 80A44 44 0 0 1 38 41.9Z" fill="#ce82ff"/><path d="M60 80 38 41.9A44 44 0 0 1 82 41.9Z" fill="#1cb0f6"/><path d="M60 80 82 41.9A44 44 0 0 1 104 80Z" fill="#58cc02"/><path d="M60 80 90 58" stroke="#2b3a40" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="80" r="8" fill="#2b3a40"/><circle cx="60" cy="80" r="3" fill="#ffc800"/><rect x="20" y="88" width="80" height="16" rx="8" fill="#00a6a0"/><circle cx="34" cy="96" r="3" fill="#fff"/><circle cx="46" cy="96" r="3" fill="#fff"/><circle cx="58" cy="96" r="3" fill="#ffc800"/></svg>',
    ready: (topic) => zeitPool(topic).length >= 4,
    gen: zeitGen,
    play: rushGame({
      theme: 'rs-zeit',
      gen: zeitGen,
      perItem: (level) => (level === 3 ? 4200 : 0),
      prompt: (it) => promptBox(md(it.text), it.word, 'Which tense?'),
      explain: (it) => ({
        html: `<b>${md(it.text)}</b> = ${it.answer} <small>· ${['present', 'praet', 'perfekt'].map((t) => `${LABEL[t]}: ${it.who} ${it.all[t]}`).join(' · ')}</small>`,
        say: it.say,
      }),
      visual: (api) => {
        const el = h('div', { class: 'zm', html: DIAL });
        const needle = () => el.querySelector('.zm-needle');
        const point = (t) => {
          needle().style.transform = `rotate(${ANGLE[t] || 0}deg)`;
          el.querySelectorAll('.zm-s, .zm-t').forEach((s) => s.classList.toggle('on', s.classList.contains('zm-' + t) || s.classList.contains('zm-t-' + t)));
        };
        return {
          el,
          show() {
            el.classList.remove('is-right', 'is-wrong');
            el.querySelectorAll('.zm-s, .zm-t').forEach((s) => s.classList.remove('on'));
            needle().style.transform = 'rotate(0deg)';
            el.classList.add('is-idle');
          },
          right(it) {
            el.classList.remove('is-idle');
            point(it.tense);
            el.classList.add('is-right');
          },
          wrong(it, given) {
            el.classList.remove('is-idle');
            el.classList.add('is-wrong');
            if (given) point(tenseOf(given));
            api.after(550, () => point(it.tense)); // swing to the right era
          },
        };
      },
    }),
  });

  // --- 8. Hör genau (listening) ------------------------------------------------------------------------------
  const RATE = [0.75, 0.9, 1];

  function soundsSame(a, b) {
    if (norm(a) === norm(b)) return true;
    return (data().homophones || []).some(([x, y]) => (norm(x) === norm(a) && norm(y) === norm(b)) || (norm(x) === norm(b) && norm(y) === norm(a)));
  }
  /** Keep words that sound different from every word kept before them. */
  function audible(words) {
    const out = [];
    for (const w of words) if (w && !out.some((o) => soundsSame(o, w))) out.push(w);
    return out;
  }

  function hoerSets(topic) {
    const fams = (pred) => B.deck.families.filter(pred).map((f) => f.filter((w) => w !== 'mir' && w !== 'dir'));
    const verbs = (t, need) => L.verbsFor(t, { need });
    let sets = [];
    const add = (list) => sets.push(audible(list));
    if (topic === 'present' || topic === 'all') for (const { v } of verbs('present', [])) if (v.forms) add(v.forms);
    if (topic === 'praet' || topic === 'all') for (const { v } of verbs('praet', ['prt'])) add(v.prt.concat([v.forms[0], v.forms[2]]));
    if (topic === 'cases' || topic === 'all') fams((f) => ['der', 'ein', 'kein'].includes(f[0])).forEach(add);
    if (topic === 'possessive' || topic === 'all') fams((f) => ['mein', 'dein', 'sein', 'ihr'].includes(f[0])).forEach(add);
    if (topic === 'reflexive' || topic === 'all') {
      fams((f) => f.includes('mich')).forEach(add);
      for (const { v } of verbs('reflexive', [])) add([0, 1, 2, 3, 4, 5].map((p) => L.form(v, 'present', p, { reflexive: true })));
    }
    if (topic === 'verblist' || topic === 'all') for (const { v } of verbs('verblist', ['pp'])) add([v.forms[2], v.prt && v.prt[2], v.pp, v.inf, v.forms[1]]);
    if (topic === 'all') B.deck.families.filter((f) => f.length <= 3).forEach(add);
    sets = sets.filter((s) => s.length >= 2);
    return sets;
  }

  function hoerGen(topic, level) {
    const next = L.deal(hoerSets(topic));
    const n = level === 1 ? 3 : 4;
    return () => {
      const set = next();
      const target = pick(set);
      let others = set.filter((w) => w !== target);
      const dist = (w) => levenshtein(norm(w), norm(target));
      if (level === 1) others.sort((a, b) => dist(b) - dist(a));
      else if (level === 3) others.sort((a, b) => dist(a) - dist(b));
      else others = shuffle(others);
      return { target, answer: target, options: [target].concat(others.slice(0, n - 1)), q: '🔊 heard: ' + target, a: target };
    };
  }

  const SPEAKER = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor"/><path d="M42 22q6 10 0 20M48 16q11 16 0 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>';

  B.games.register('hoer', {
    name: 'Hör genau',
    icon: '👂',
    color: '#ff4fa3',
    speech: true,
    blurb: 'Listen carefully, then tap the word you **heard**. They look alike — they don’t sound alike!',
    how: ['Tap 🔊 or press R / Space to hear it again', 'Answer with a tap or keys 1–4', '12 rounds'],
    topics: ['present', 'praet', 'cases', 'possessive', 'reflexive', 'verblist'],
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" fill="#ffe9f6"/><path d="M22 48h16l22-18v60L38 72H22z" fill="#ff4fa3"/><path d="M72 44q10 16 0 32M82 34q18 26 0 52M92 26q26 34 0 68" fill="none" stroke="#ff86d0" stroke-width="6" stroke-linecap="round"/></svg>',
    ready: (topic) => hoerSets(topic).length >= 3,
    gen: hoerGen,
    play: rushGame({
      theme: 'rs-hoer',
      gen: hoerGen,
      rounds: () => 12,
      points: (ms) => Q.speedPoints(ms, 3000, 10000),
      prompt: (it) => h('div', { class: 'rs-q' }, h('div', { class: 'rs-label' }, 'Which one did you hear?')),
      explain: (it, ok) => ({ html: ok ? `<b>${md(it.target)}</b>` : `You heard <b>${md(it.target)}</b>` }),
      visual: (api, level) => {
        let current = null;
        const btn = h('button', { type: 'button', class: 'hg-play', 'aria-label': 'Play the word again (R)', html: SPEAKER });
        const play = () => {
          if (!current) return;
          api.speak(current, { rate: RATE[level - 1] });
          pulse(btn, 'hg-ring');
        };
        btn.addEventListener('click', play);
        const el = h('div', { class: 'hg' }, btn, h('div', { class: 'hg-hint' }, 'Tap to hear it again'));
        el._play = play;
        return {
          el,
          show(it) {
            current = it.target;
            play();
          },
          wrong() {
            api.after(350, play);
          },
        };
      },
      onWrong: () => {},
      key(e, api, item, busy, vis) {
        if (e.key === 'r' || e.key === 'R' || e.key === ' ') {
          if (vis && vis.el._play) vis.el._play();
          return true;
        }
        return false;
      },
    }),
  });

  Q.fakeParticiples = fakeParticiples;
  Q.hoerSets = hoerSets;
  Q.audible = audible;
})();

</script>
  <script>/* js/games/automat.js */
/*
 * Verb-Automat: a slot machine with three reels (person · verb · tense). Pull the lever, the reels
 * stop one after another, then give the verb form: Low picks from 4 (Präsens), Medium 4 tricky
 * options (Präsens + Präteritum), High types it (+ Perfekt). Reflexive verbs come with their
 * pronoun (ich ziehe mich an). 10 spins; quick answers score more.
 * gen(topic, level) → next() makes the spins without a DOM, for tests.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, pick, pulse, reducedMotion } = B.util;
  const L = B.games.lib;
  const Q = B.games.quick;
  const LABEL = { present: 'Präsens', praet: 'Präteritum', perfekt: 'Perfekt' };
  const TENSES = { 1: ['present'], 2: ['present', 'praet'], 3: ['present', 'praet', 'perfekt'] };
  const SHOWN = [['ich'], ['du'], ['er', 'sie', 'es'], ['wir'], ['ihr'], ['sie', 'Sie']];
  const ENDINGS = { present: ['e', 'st', 't', 'en', 't', 'en'], praet: ['te', 'test', 'te', 'ten', 'tet', 'ten'] };
  const SPINS = 10;

  function automatPool(topic) {
    const seen = new Set();
    return L.verbsFor(topic).filter(({ v, reflexive }) => v.forms && !seen.has(v.inf + reflexive) && seen.add(v.inf + reflexive));
  }

  /** "kauf" + "ein" + pronoun → "kaufe mich ein"-style assembly, like lib.form. */
  function assemble(head, prefix, pron) {
    return [head, pron, prefix].filter(Boolean).join(' ');
  }

  /** Wrong but believable forms: no vowel change (er fahrt), a weak Präteritum (er fahrte), the wrong helper (er ist gelesen). */
  function fakeForms(v, tense, p, reflexive) {
    const pron = reflexive ? L.REFL[p] : null;
    const prefix = L.isSeparable(v) ? v.forms[0].split(' ')[1] : '';
    const base = prefix && v.inf.startsWith(prefix) ? v.inf.slice(prefix.length) : v.inf;
    const stem = base.endsWith('en') ? base.slice(0, -2) : base.replace(/n$/, '');
    if (tense === 'perfekt') {
      if (!v.pp) return [];
      const wrongAux = L.verb(reflexive || v.aux !== 'sein' ? 'sein' : 'haben');
      return wrongAux ? [[wrongAux.forms[p], pron, v.pp].filter(Boolean).join(' ')] : [];
    }
    const e = /[td]$/.test(stem) && (p === 1 || p === 2 || p === 4) ? 'e' : '';
    let end = ENDINGS[tense][p];
    if (end === 'st' && /[sßzx]$/.test(stem)) end = 't'; // du vergesst, not "vergessst"
    return [assemble(stem + e + end, prefix, pron)];
  }

  function automatGen(topic, level) {
    const pool = automatPool(topic);
    const tenses = TENSES[level];
    return function make(tries = 0) {
      let tense = pick(tenses);
      let cands = pool.filter(({ v }) => (tense === 'present' ? v.forms : tense === 'praet' ? v.prt : v.pp));
      if (!cands.length) {
        tense = 'present';
        cands = pool;
      }
      const { v, reflexive } = pick(cands);
      const p = Math.floor(Math.random() * 6);
      const who = pick(SHOWN[p]);
      const answer = L.form(v, tense, p, { reflexive });
      if (!answer) return tries < 30 ? make(tries + 1) : null;
      const sameTense = [0, 1, 2, 3, 4, 5].map((q) => L.form(v, tense, q, { reflexive }));
      const otherTense = Object.keys(LABEL).filter((t) => t !== tense).map((t) => L.form(v, t, p, { reflexive }));
      const fakes = level >= 2 ? fakeForms(v, tense, p, reflexive) : [];
      const others = level === 1 ? shuffle(sameTense) : [...fakes, ...shuffle(otherTense), ...shuffle(sameTense)];
      const word = (reflexive ? 'sich ' : '') + v.inf;
      return {
        p, who, v, reflexive, tense, word, answer,
        options: [answer].concat(L.uniq(others, [answer]).slice(0, 3)),
        accept: [answer, `${who} ${answer}`],
        reject: L.uniq([...sameTense, ...otherTense, ...fakes], [answer]),
        en: L.meaning(v),
        q: `${who} + ${word} + ${LABEL[tense]}`,
        a: `${who} ${answer}`,
      };
    };
  }

  const LEVER = '<svg viewBox="0 0 40 120" aria-hidden="true"><rect x="16" y="20" width="8" height="78" rx="4" fill="#9aa5ab"/><rect x="17.5" y="22" width="2.5" height="74" rx="1.2" fill="#fff" opacity=".5"/><circle cx="20" cy="18" r="15" fill="#ff4b4b"/><circle cx="15" cy="13" r="5" fill="#fff" opacity=".55"/><rect x="6" y="94" width="28" height="22" rx="7" fill="#c62f2f"/></svg>';

  function play(stage, api) {
    const level = api.level;
    const next = automatGen(api.topic, level);
    const typed = level === 3;
    const pool = automatPool(api.topic);
    const reelVals = [
      SHOWN.flat(),
      pool.map(({ v, reflexive }) => (reflexive ? 'sich ' : '') + v.inf),
      TENSES[level].map((t) => LABEL[t]),
    ];

    const strips = [0, 1, 2].map(() => h('div', { class: 'am-strip' }));
    const reels = strips.map((s, i) => h('div', { class: 'am-reel am-reel-' + i }, s));
    const lever = h('button', { type: 'button', class: 'am-lever', 'aria-label': 'Pull the lever (Space)', html: LEVER });
    lever.addEventListener('click', () => spin());
    const bulbs = h('div', { class: 'am-bulbs', 'aria-hidden': 'true' }, Array.from({ length: 9 }, () => h('i')));
    const machine = h('div', { class: 'am-machine' },
      h('div', { class: 'am-marquee' }, bulbs, h('span', {}, 'VERB-AUTOMAT')),
      h('div', { class: 'am-window', role: 'img', 'aria-label': 'Reels' }, reels),
      h('div', { class: 'am-labels', 'aria-hidden': 'true' }, h('span', {}, 'Person'), h('span', {}, 'Verb'), h('span', {}, 'Zeit')),
      lever);
    const ask = h('div', { class: 'am-ask', 'aria-live': 'polite' });
    const opts = h('div', { class: 'rs-opts am-opts', role: 'group', 'aria-label': 'Answers' });
    const fb = h('div', { class: 'rs-fb am-fb', 'aria-live': 'polite' });
    let input = null;
    let typeBox = null;
    if (typed) {
      input = h('input', { class: 'type-input rs-input', type: 'text', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Your answer', placeholder: 'Type the verb form', lang: 'de', disabled: true });
      const okBtn = h('button', { type: 'button', class: 'btn btn-primary rs-ok' }, 'OK');
      okBtn.addEventListener('click', () => submitTyped());
      typeBox = h('div', { class: 'rs-type', hidden: true }, h('div', { class: 'rs-type-row' }, input, okBtn), B.ex.umlautBar(() => input));
    }
    stage.append(h('div', { class: 'am' + (typed ? ' is-typed' : '') }, machine, ask, typed ? typeBox : opts, fb));

    // the reels show something before the first spin
    strips.forEach((s, i) => s.replaceChildren(h('div', { class: 'am-cell' }, reelVals[i][0] || '?')));

    let state = 'idle'; // idle → spinning → answer → feedback → idle …
    let item = null;
    let done = 0;
    let elapsed = 0;
    let btns = [];
    api.progress(0, SPINS);

    function idle() {
      state = 'idle';
      machine.classList.add('is-idle');
      lever.disabled = false;
      ask.replaceChildren(h('div', { class: 'am-pull' }, 'Pull the lever!', h('small', {}, ' Space / Enter')));
      opts.replaceChildren();
      if (typeBox) typeBox.hidden = true;
    }

    async function spin() {
      if (state !== 'idle' || api.ended) return;
      state = 'spinning';
      item = next();
      if (!item) return api.end({});
      machine.classList.remove('is-idle');
      lever.disabled = true;
      pulse(lever, 'pull');
      api.sfx('whoosh');
      fb.className = 'rs-fb am-fb';
      fb.replaceChildren();
      ask.replaceChildren(h('div', { class: 'am-pull spinning' }, 'Rrrrr…'));
      const finals = [item.who, item.word, LABEL[item.tense]];
      const durs = reducedMotion() ? [0, 0, 0] : [900, 1300, 1700];
      strips.forEach((strip, i) => {
        const vals = Array.from({ length: 12 }, () => pick(reelVals[i]));
        vals.push(finals[i]);
        strip.replaceChildren(...vals.map((x) => h('div', { class: 'am-cell', lang: 'de' }, x)));
        const cell = strip.firstElementChild.offsetHeight || 56;
        const to = `translateY(${-(vals.length - 1) * cell}px)`;
        if (!durs[i] || typeof strip.animate !== 'function') strip.style.transform = to;
        else strip.animate([{ transform: 'translateY(0)' }, { transform: to }], { duration: durs[i], easing: 'cubic-bezier(.12,.75,.3,1.06)', fill: 'forwards' });
      });
      for (let i = 0; i < 3; i++) {
        const prev = i ? durs[i - 1] : 0;
        if (!(await api.wait(durs[i] - prev))) return;
        api.sfx('drop');
        pulse(reels[i], 'stop');
      }
      if (!(await api.wait(150))) return;
      ask.replaceChildren(h('div', { class: 'am-q' },
        h('span', { class: 'am-chip' }, item.who), h('span', { class: 'am-plus' }, '+'),
        h('span', { class: 'am-chip' }, item.word), h('span', { class: 'am-plus' }, '+'),
        h('span', { class: 'am-chip am-chip-t' }, LABEL[item.tense])),
      h('div', { class: 'am-en' }, item.en));
      state = 'answer';
      elapsed = 0;
      api.frame((dt) => {
        if (state !== 'answer') return false;
        elapsed += dt;
        return true;
      });
      if (typed) {
        typeBox.hidden = false;
        input.disabled = false;
        input.value = '';
        input.classList.remove('good', 'bad');
        input.focus({ preventScroll: true });
      } else {
        btns = shuffle(item.options).map((o, i) => {
          const b = h('button', { type: 'button', class: 'btn g-btn rs-opt', 'aria-label': `${i + 1}: ${o}` }, h('span', { class: 'rs-key', 'aria-hidden': 'true' }, String(i + 1)), h('span', { class: 'rs-opt-text', lang: 'de' }, o));
          b._val = o;
          b.addEventListener('click', () => resolve(o));
          return b;
        });
        opts.className = 'rs-opts am-opts n' + btns.length;
        opts.replaceChildren(...btns);
      }
    }

    function resolve(given) {
      if (state !== 'answer' || api.ended) return;
      state = 'feedback';
      const it = item;
      let ok;
      let note = null;
      if (typed) {
        const r = B.check.typed(given, it.accept, { reject: it.reject });
        ok = r.ok;
        if (r.ok && r.typo) note = `Small typo — it’s **${r.matched}**.`;
        input.disabled = true;
        input.classList.add(ok ? 'good' : 'bad');
      } else {
        ok = L.same(given, it.answer);
        btns.forEach((b) => {
          b.disabled = true;
          if (L.same(b._val, it.answer)) b.classList.add('good');
          else if (b._val === given) b.classList.add('bad');
          else b.classList.add('dim');
        });
      }
      fb.className = 'rs-fb am-fb show ' + (ok ? 'good' : 'bad');
      fb.innerHTML = `<span class="rs-fb-icon">${ok ? '✓' : '✗'}</span> <span><b>${md(show(it.a))}</b>${note ? ` <small>${md(note)}</small>` : ''}</span>`;
      const el = typed ? input : btns.find((b) => b._val === given) || ask;
      if (ok) {
        api.hit({ el, points: Q.speedPoints(elapsed, 2500, 10000) });
        machine.classList.add('jackpot');
        api.after(700, () => machine.classList.remove('jackpot'));
      } else {
        api.miss({ q: it.q, a: it.a, given, el: ask });
        Q.say(api, it.a);
      }
      done++;
      api.progress(done, SPINS);
      api.wait(ok ? 700 : 2000).then((go) => {
        if (!go) return;
        if (done >= SPINS) return api.end({});
        idle();
      });
    }

    function submitTyped() {
      if (state !== 'answer' || !input) return;
      const v = input.value.trim();
      if (!v) return input.focus();
      resolve(v);
    }

    idle();
    lever.disabled = true; // until the countdown is over

    return {
      begin() {
        lever.disabled = false;
        lever.focus({ preventScroll: true });
      },
      key(e) {
        if (state === 'idle' && (e.key === ' ' || e.key === 'Enter')) return spin(), true;
        if (state !== 'answer') return e.key === ' ' || e.key === 'Enter';
        if (typed) {
          if (e.key === 'Enter') return submitTyped(), true;
          return false;
        }
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= btns.length) return resolve(btns[n - 1]._val), true;
        return false;
      },
    };
  }

  B.games.register('automat', {
    name: 'Verb-Automat',
    icon: '🎰',
    color: '#ff4b4b',
    blurb: 'Pull the lever! Person, verb and tense spin — then hit the right **verb form** for the jackpot.',
    how: ['Pull the lever (Space / Enter), answer with 1–4', 'Medium adds the Präteritum · High: type it, Perfekt too', '10 spins — quick answers score more'],
    topics: ['present', 'praet', 'verbs', 'verblist', 'reflexive', 'tenses'],
    art: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-weight="900"><rect width="120" height="120" rx="28" fill="#fff1dc"/><rect x="12" y="22" width="80" height="84" rx="14" fill="#ff4b4b"/><rect x="20" y="12" width="64" height="18" rx="9" fill="#ffc800"/><circle cx="30" cy="21" r="3" fill="#fff"/><circle cx="42" cy="21" r="3" fill="#fff"/><circle cx="54" cy="21" r="3" fill="#fff"/><circle cx="66" cy="21" r="3" fill="#fff"/><circle cx="78" cy="21" r="3" fill="#fff"/><rect x="20" y="40" width="64" height="32" rx="7" fill="#fff"/><path d="M41.3 40v32M62.6 40v32" stroke="#ffd1d1" stroke-width="2"/><text x="31" y="61" text-anchor="middle" font-size="12" fill="#3c3c3c">ich</text><text x="52" y="61" text-anchor="middle" font-size="12" fill="#3c3c3c">bin</text><text x="73" y="62" text-anchor="middle" font-size="14" fill="#58cc02">✓</text><rect x="26" y="82" width="52" height="14" rx="7" fill="#c62f2f"/><rect x="99" y="44" width="6" height="40" rx="3" fill="#9aa5ab"/><circle cx="102" cy="40" r="9" fill="#ff9600"/><rect x="94" y="80" width="16" height="12" rx="4" fill="#c62f2f"/></svg>',
    ready: (topic) => automatPool(topic).length >= 4,
    gen: automatGen,
    play,
  });

  Q.fakeForms = fakeForms;
})();

</script>

    prefix: { name: 'Der Trennbar-Troll', color: '#6aa84f', shape: 'tall', eyes: 2, horns: 1, fangs: true, extra: 'ears' },
    tenses: { name: 'Der Zeiten-Zauberer', color: '#5b6cff', shape: 'ghost', eyes: 2, horns: 0, fangs: false, extra: 'hat' },
    praet: { name: 'Die Präteritum-Mumie', color: '#c9b48a', shape: 'tall', eyes: 2, horns: 0, fangs: false, extra: 'bandages' },
    reflexive: { name: 'Der Spiegel-Geist', color: '#58b6e8', shape: 'ghost', eyes: 2, horns: 0, fangs: false, extra: 'mirror' },
    pastq: { name: 'Der Gestern-Vampir', color: '#5d4a8a', shape: 'tall', eyes: 2, horns: 0, fangs: true, extra: 'wings' },
    vocab: { name: 'Der Wortschatz-Wurm', color: '#e5007d', shape: 'worm', eyes: 2, horns: 0, fangs: false, extra: 'antennae' },
  };

  // --- generators (no DOM) ---------------------------------------------------------------------

  /** A Schere sentence split into parts: { before, verb, between, prefix, end, sep, glued, correct }. */
  function parseSchere(item) {
    const m = item.s.match(/^(.*?)\[([^\]]+)\](.*?)(?:\[([^\]]+)\])?([.?!]*)$/);
    if (!m) return null;
    const [, before, verb, between, prefix, end] = m;
    const sep = !!prefix;
    const glue = (p, v) => {
      // a sentence-initial verb keeps its capital on the glued word: "Aufpasst du …?"
      if (!before.trim() && /^[A-ZÄÖÜ]/.test(v)) return p.charAt(0).toUpperCase() + p.slice(1) + v.charAt(0).toLowerCase() + v.slice(1);
      return p + v;
    };
    return {
      inf: item.inf,
      before: before.trim(),
      verb,
      between: between.trim(),
      prefix: prefix || null,
      end: end || '',
      sep,
      glued: sep ? glue(prefix, verb) : verb,
      correct: item.s.replace(/[[\]]/g, ''),
    };
  }

  /** Is a word known from the user's material (it has a glossary translation)? */
  function meaningOf(word) {
    if (!B.gloss || !B.gloss.tokens) return null;
    const toks = B.gloss.tokens(word);
    return toks.length === 1 && toks[0].en ? toks[0].en : null;
  }

  /** Artikel-Regen nouns: [{ art, noun, en }], only nouns with a glossary meaning. */
  function regenNouns() {
    const out = [];
    for (const art of ['der', 'die', 'das']) {
      for (const noun of nouns[art]) {
        const en = meaningOf(noun);
        if (en) out.push({ art, noun, en });
      }
    }
    return out;
  }

  // Memory: German detection for speech (match cards mix German, English and Polish)
  let germanForms = null;
  function isGerman(text) {
    if (B.gloss && typeof B.gloss.isGerman === 'function') return B.gloss.isGerman(text); // the app's shared check
    if (B.audio && typeof B.audio.isGerman === 'function') return B.audio.isGerman(text);
    if (!germanForms) {
      germanForms = new Set();
      for (const v of Object.values(B.deck.verbs)) {
        for (const f of [v.inf, v.pp, ...(v.forms || []), ...(v.prt || [])]) if (f) f.split(' ').forEach((w) => germanForms.add(norm(w)));
      }
      for (const f of B.deck.families) f.forEach((w) => germanForms.add(norm(w)));
    }
    const toks = B.gloss.tokens(String(text));
    if (!toks.length) return false;
    const known = toks.filter((t) => t.en || t.name || germanForms.has(norm(t.text)) || /[äöüß]/i.test(t.text)).length;
    return known / toks.length >= 0.6;
  }

  const L = () => B.games.lib;
  const reflexiveInf = (x) => (x.reflexive ? 'sich ' + x.v.inf : x.v.inf);
  const TENSE_BY_LEVEL = { 1: 'present', 2: 'praet', 3: 'perfekt' };

  /** Pairs from the topic's match cards: [{ a, b, sayA, sayB }]. */
  function matchPairs(topic) {
    const cards = B.deck.cards.filter((c) => c.type === 'match' && !c.variantOf && (topic === 'all' || B.deck.inTopic(c, topic)));
    return cards.flatMap((c) => c.pairs.map(([a, b]) => ({ a, b, sayA: isGerman(a), sayB: isGerman(b) })));
  }

  /** Generated pairs for a topic and level, from the lexicon. */
  function generatedPairs(topic, level) {
    const lib = L();
    const pairs = [];
    const add = (a, b, sayA = true, sayB = true) => a && b && pairs.push({ a, b, sayA, sayB });
    if (topic === 'verblist') {
      const tense = TENSE_BY_LEVEL[level] || 'praet';
      for (const x of lib.verbsFor('verblist')) add(reflexiveInf(x), lib.form(x.v, tense, 2, { reflexive: x.reflexive }));
    } else if (topic === 'praet') {
      for (const x of lib.verbsFor('praet', { need: ['prt'] })) add(reflexiveInf(x), lib.form(x.v, 'praet', 2, { reflexive: x.reflexive }));
    } else if (topic === 'past' || topic === 'pastq') {
      for (const x of lib.verbsFor('past', { need: ['pp'] })) {
        if (x.v.inf === 'sein' || x.v.inf === 'haben') continue;
        add(reflexiveInf(x), lib.form(x.v, 'perfekt', 2, { reflexive: x.reflexive }));
      }
    } else if (topic === 'present') {
      // only verbs whose er-form is not regular (fahren → fährt, nehmen → nimmt, sein → ist)
      for (const x of lib.verbsFor('present')) {
        const er = x.v.forms && x.v.forms[2];
        if (!er) continue;
        const [head, prefix] = er.split(' ');
        const base = prefix && x.v.inf.startsWith(prefix) ? x.v.inf.slice(prefix.length) : x.v.inf;
        const stem = base.replace(/e?n$/, '');
        if (head !== stem + 't' && head !== stem + 'et') add(x.v.inf, 'er ' + er);
      }
    } else if (topic === 'gender') {
      for (const [m, f] of jobs) add(m, f);
    } else if (topic === 'reflexive') {
      for (const x of lib.verbsFor('reflexive')) add('sich ' + x.v.inf, lib.meaning(x.v), true, false);
    } else if (topic === 'prefix') {
      for (const x of lib.verbsFor('prefix')) add((lib.isReflexive(x.v) ? 'sich ' : '') + x.v.inf, lib.meaning(x.v), true, false);
    }
    return pairs;
  }

  /**
   * Pairs for a Memory game: generated ones first (they follow the level), then match-card pairs;
   * every text appears once, so each card has exactly one partner. null if fewer than 6 pairs.
   */
  function memoryPairs(topic, level, want) {
    const gen = generatedPairs(topic, level);
    const fromCards = matchPairs(topic);
    const seen = new Set();
    const pick = [];
    const take = (list) => {
      for (const p of B.util.shuffle(list)) {
        const ka = norm(p.a);
        const kb = norm(p.b);
        if (!ka || !kb || ka === kb || seen.has(ka) || seen.has(kb)) continue;
        if (String(p.a).length > 34 || String(p.b).length > 34) continue; // must fit on a small card
        seen.add(ka);
        seen.add(kb);
        pick.push(p);
      }
    };
    take(gen);
    take(fromCards);
    if (pick.length < 6) return null;
    // keep generated pairs in front so the level shows, then mix
    return B.util.shuffle(pick.slice(0, Math.max(6, Math.min(want || pick.length, pick.length))));
  }

  B.games.data.play = {
    schere,
    nouns,
    jobs,
    bosses,
    _gen: { parseSchere, regenNouns, meaningOf, isGerman, matchPairs, generatedPairs, memoryPairs },
  };
})();
