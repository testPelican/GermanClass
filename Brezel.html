  <script>/* js/games/memory.js */
/*
 * Memory: turn over two cards at a time and find the pairs that belong together
 * (kommen ↔ kam, der Lehrer ↔ die Lehrerin, sich beeilen ↔ hurry …).
 * Decks come from Brezel.games.data.play._gen.memoryPairs: generated from the lexicon for the
 * topic and level (Verb list: Low = Präsens, Medium = Präteritum, High = Perfekt) plus the
 * pairs of the topic's match cards.
 *   Low: 6 pairs, everything shown for 3 s at the start · Medium: 8 pairs, a 1.5 s peek ·
 *   High: 10 pairs, no peek, 90 seconds.
 * A wrong pair only counts as a mistake when both cards had been seen before — a real memory slip.
 * The German side is spoken when it is turned over (if sound is on).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, shuffle } = B.util;

  const PAIRS = { 1: 6, 2: 8, 3: 10 };
  const PEEK = { 1: 3000, 2: 1500, 3: 0 };
  const ASPECT = 0.8; // card width : height
  const gen = () => B.games.data.play._gen;

  const ART =
    '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    '<g transform="rotate(-14 44 64)"><rect x="18" y="28" width="52" height="70" rx="11" fill="#7b3fd0"/>' +
    '<rect x="24.5" y="34.5" width="39" height="57" rx="7" fill="none" stroke="#c9a6ff" stroke-width="3" stroke-dasharray="5 5"/>' +
    '<circle cx="44" cy="63" r="10" fill="#c9a6ff"/><circle cx="44" cy="63" r="4" fill="#7b3fd0"/></g>' +
    '<g transform="rotate(11 80 60)"><rect x="54" y="24" width="52" height="70" rx="11" fill="#ffffff" stroke="#e3d3fb" stroke-width="3"/>' +
    '<text x="80" y="69" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="900" font-size="28" fill="#a560e8">kam</text></g>' +
    '<path d="M98 8l3.2 7.3 7.3 3.2-7.3 3.2L98 29l-3.2-7.3-7.3-3.2 7.3-3.2z" fill="#ffc800"/>' +
    '<path d="M16 96l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z" fill="#ff86d0"/>' +
    '<circle cx="104" cy="100" r="4" fill="#58cc02"/></svg>';

  B.games.register('memory', {
    name: 'Memory',
    icon: '🃏',
    art: ART,
    color: '#a560e8',
    blurb: 'Turn over two cards at a time and find the pairs that belong together.',
    how: ['Tap a card to turn it over, then find its partner', 'Wrong pair? Remember where the words were', 'Keys: arrows move, Enter turns a card'],
    topics: '*',
    ready: (topic, level) => !!gen().memoryPairs(topic, level, PAIRS[level] || 8),
    time: (level) => (level === 3 ? 90 : 0),

    play(stage, api) {
      const level = api.level;
      const pairs = gen().memoryPairs(api.topic, level, PAIRS[level] || 8);
      if (!pairs) {
        api.after(0, () => api.end({ note: 'Not enough pairs for this topic.' }));
        return {};
      }
      const total = pairs.length;
      const soundOn = () => B.store.setting('sound') !== false;
      const cards = shuffle(pairs.flatMap((p, i) => [
        { pair: i, text: p.a, partner: p.b, say: p.sayA },
        { pair: i, text: p.b, partner: p.a, say: p.sayB },
      ]));

      let open = []; // indices turned up, not yet matched
      let found = 0;
      let locked = true; // until the peek is over
      let turn = 0; // ignores stale "turn back" timers
      const seen = new Set();

      const grid = h('div', { class: 'mem-grid', role: 'grid', 'aria-label': `Memory: ${total} pairs` });
      cards.forEach((c, i) => {
        c.el = h('button', { type: 'button', class: 'mem-card', 'aria-label': `Card ${i + 1}, face down`, onClick: () => tap(i) },
          h('span', { class: 'mem-inner' },
            h('span', { class: 'mem-face mem-back', 'aria-hidden': 'true' }, h('span', { class: 'mem-logo' }, '🥨')),
            h('span', { class: 'mem-face mem-front', lang: c.say ? 'de' : null }, h('span', { class: 'mem-text' + (c.text.length > 13 ? ' long' : '') }, c.text))));
        grid.append(c.el);
      });
      const wrap = h('div', { class: 'mem-wrap' }, grid);
      stage.append(wrap);

      // --- layout: the grid fills the stage, cards keep their shape --------------------------
      let cols = 4;
      function fit() {
        const W = wrap.clientWidth;
        const H = wrap.clientHeight;
        if (!W || !H) return;
        const n = cards.length;
        const gap = W < 420 ? 7 : 10;
        let best = null;
        for (let c = 3; c <= 7; c++) {
          const r = Math.ceil(n / c);
          const cw = (W - gap * (c - 1)) / c;
          const ch = Math.min(cw / ASPECT, (H - gap * (r - 1)) / r);
          const w = ch * ASPECT;
          const area = w * ch * (n / (r * c)); // empty cells in the last row count against a layout
          if (!best || area > best.area) best = { c, w, ch, area };
        }
        cols = best.c;
        grid.style.setProperty('--mem-cols', String(best.c));
        grid.style.setProperty('--mem-w', Math.floor(best.w) + 'px');
        grid.style.setProperty('--mem-h', Math.floor(best.ch) + 'px');
        grid.style.setProperty('--mem-gap', gap + 'px');
        grid.style.setProperty('--mem-fs', Math.max(11, Math.min(19, best.w / 6.2)).toFixed(1) + 'px');
      }
      const onResize = () => fit();
      window.addEventListener('resize', onResize);
      requestAnimationFrame(fit);
      fit();
      api.progress(0, total); // before play() returns, or the frame hides the progress bar

      function faceUp(c, up) {
        c.el.classList.toggle('up', up);
        c.el.setAttribute('aria-label', up || c.done ? `${c.text}${c.done ? ' (pair found)' : ''}` : `Card ${cards.indexOf(c) + 1}, face down`);
      }

      function closeOpen() {
        for (const i of open) {
          faceUp(cards[i], false);
          cards[i].el.classList.remove('slip');
        }
        open = [];
      }

      function tap(i) {
        const c = cards[i];
        if (api.ended || locked || c.done || open.includes(i)) return;
        if (open.length === 2) closeOpen(); // a third card: turn the wrong pair back at once
        c.seenBefore = seen.has(i);
        seen.add(i);
        faceUp(c, true);
        api.sfx('flip');
        if (c.say && soundOn()) api.speak(c.text);
        open.push(i);
        if (open.length < 2) return;

        const [a, b] = open.map((k) => cards[k]);
        const myTurn = ++turn;
        if (a.pair === b.pair) {
          a.done = b.done = true;
          open = [];
          for (const x of [a, b]) {
            x.el.classList.add('matched');
            x.el.disabled = true;
            faceUp(x, true);
          }
          found++;
          api.hit({ el: b.el });
          api.progress(found, total); // ignored by the frame while a timer runs (High)
          if (found === total) {
            locked = true;
            api.after(700, () => api.end({ won: true, note: `All ${total} pairs found!` }));
          }
          return;
        }
        // not a pair
        if (a.seenBefore && b.seenBefore) {
          a.el.classList.add('slip');
          b.el.classList.add('slip');
          api.miss({ q: a.text, a: a.partner, given: b.text, el: b.el });
        } else api.sfx('drop');
        api.after(1000, () => {
          if (myTurn === turn && open.length === 2) closeOpen();
        });
      }

      // --- keyboard: arrows move between cards; Enter / Space turn the focused card (it is a button)
      function key(e) {
        const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols };
        if (!(e.key in moves)) return false;
        const at = cards.findIndex((c) => c.el === document.activeElement);
        let next = at < 0 ? 0 : at + moves[e.key];
        next = Math.max(0, Math.min(cards.length - 1, next));
        cards[next].el.focus({ preventScroll: true });
        return true;
      }

      return {
        begin() {
          const peek = PEEK[level];
          if (!peek) {
            locked = false;
            return;
          }
          grid.classList.add('peek');
          api.after(peek, () => {
            grid.classList.remove('peek');
            locked = false;
            api.progress(0, total);
          });
        },
        key,
        timeUp() {
          api.end({ won: false, note: `Time’s up! ${found} of ${total} pairs found.` });
        },
        destroy() {
          window.removeEventListener('resize', onResize);
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/schere.js */
/*
 * Die Schere: a sentence arrives with its verb glued together in position 2
 * ("Helga aufsteht jeden Tag um sieben Uhr."). Separable verb → ✂ cut: the prefix flies to the
 * end. Inseparable verb (be-, ver-, ent-, er-, ge-, unter-, über- …) → 🔗 keep it together.
 * Sentences: Brezel.games.data.play.schere.
 *   Low: 75 s, 5 lives, the infinitive is shown as a hint · Medium: 60 s, 3 lives ·
 *   High: 60 s, 3 lives, and after cutting you also put the prefix in its place yourself.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, flip, reducedMotion } = B.util;

  const INSEP = /^(be|ver|ent|er|ge|zer|emp|miss|unter|über)/;
  const data = () => B.games.data.play;

  const ART =
    '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="8" y="74" width="44" height="30" rx="9" fill="#ffffff" stroke="#ffc58f" stroke-width="3"/>' +
    '<text x="30" y="95" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="900" font-size="16" fill="#ff8a1f">auf</text>' +
    '<rect x="64" y="74" width="50" height="30" rx="9" fill="#ffffff" stroke="#ffc58f" stroke-width="3"/>' +
    '<text x="89" y="95" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="900" font-size="16" fill="#3c3c3c">steht</text>' +
    '<path d="M58 66v46" stroke="#ff4b4b" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>' +
    '<path d="M50 30L64 66l-5 2z" fill="#9aa7b0"/><path d="M66 30L52 66l5 2z" fill="#cfd8dd"/>' +
    '<circle cx="58" cy="47" r="3.6" fill="#3c3c3c"/>' +
    '<circle cx="42" cy="18" r="10" fill="none" stroke="#ff8a1f" stroke-width="6"/>' +
    '<circle cx="74" cy="18" r="10" fill="none" stroke="#ff8a1f" stroke-width="6"/>' +
    '<path d="M98 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffc800"/></svg>';

  const SCISSORS =
    '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/>' +
    '<circle cx="29" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/>' +
    '<path class="sch-blade-a" d="M15 14l9 24 3-1z" fill="#9aa7b0"/><path class="sch-blade-b" d="M25 14l-9 24-3-1z" fill="#cfd8dd"/></svg>';

  /** Parsed sentences for a topic: Verb list → only verbs from the list. */
  function items(topic) {
    const parsed = data().schere.map(data()._gen.parseSchere).filter(Boolean);
    if (topic !== 'verblist') return parsed;
    const list = new Set(B.games.lib.VERB_LIST.map(([inf]) => inf));
    return parsed.filter((x) => list.has(x.inf));
  }

  /** Why an inseparable verb stays together: "be- can't stand alone". */
  function whyKeep(inf) {
    const m = inf.match(INSEP);
    if (!m) return `*${inf}* is not separable, so it stays one word.`;
    if (m[1] === 'unter' || m[1] === 'über') return `**${m[1]}-** is inseparable here: *${inf}* stays one word.`;
    return `**${m[1]}-** can’t stand alone, so *${inf}* stays one word.`;
  }

  const words = (s) => (s ? s.split(/\s+/).filter(Boolean) : []);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const low = (s) => s.charAt(0).toLowerCase() + s.slice(1);

  B.games.register('schere', {
    name: 'Die Schere',
    icon: '✂️',
    art: ART,
    color: '#ff8a1f',
    blurb: 'Separable or not? Cut the prefix off — or keep the verb in one piece.',
    how: ['✂ **Cut** a separable verb: *aufsteht* → *steht … auf*', '🔗 **Keep** an inseparable one: *beantworte*', 'Keys: ← cut · → keep'],
    topics: ['prefix', 'verblist', 'order'],
    ready: (topic) => items(topic).length >= 10,
    time: (level) => (level === 1 ? 75 : 60),
    lives: (level) => (level === 1 ? 5 : 3),

    play(stage, api) {
      const level = api.level;
      const next = B.games.lib.deal(items(api.topic));
      const soundOn = () => B.store.setting('sound') !== false;
      let cur = null; // { it, els… }
      let phase = 'wait'; // wait → decide → (place) → show → …
      let slotSel = 0;

      const line = h('div', { class: 'sch-line', lang: 'de', 'aria-live': 'polite' });
      const hint = h('div', { class: 'sch-hint' });
      const note = h('div', { class: 'sch-note', 'aria-live': 'polite' });
      const cutBtn = h('button', { type: 'button', class: 'btn g-btn sch-cut' }, h('span', { class: 'sch-ico', html: SCISSORS }), 'Cut');
      const keepBtn = h('button', { type: 'button', class: 'btn g-btn sch-keep' }, h('span', { class: 'sch-ico', 'aria-hidden': 'true' }, '🔗'), 'Keep');
      cutBtn.addEventListener('click', () => decide(true));
      keepBtn.addEventListener('click', () => decide(false));
      const card = h('div', { class: 'sch-card' }, line, hint, note);
      stage.append(h('div', { class: 'sch-wrap' }, card, h('div', { class: 'sch-actions' }, cutBtn, keepBtn)));

      function setButtons(on) {
        cutBtn.disabled = keepBtn.disabled = !on;
      }

      function show() {
        if (api.ended) return;
        const it = next();
        const initial = !it.before; // verb first: "Passt du …?"
        const pre = it.sep ? h('span', { class: 'sch-pre' }, initial ? cap(it.prefix) : it.prefix) : null;
        const stem = h('span', { class: 'sch-stem' }, it.sep && initial ? low(it.verb) : it.verb);
        const pill = h('span', { class: 'sch-verb' }, pre, stem);
        const before = words(it.before).map((w) => h('span', { class: 'sch-w' }, w));
        const between = words(it.between).map((w) => h('span', { class: 'sch-w' }, w));
        const end = h('span', { class: 'sch-end' }, it.end);
        line.replaceChildren(...before, pill, ...between, end);
        hint.textContent = level === 1 ? `(${it.inf})` : '';
        note.replaceChildren();
        card.classList.remove('good', 'bad', 'enter');
        void card.offsetWidth;
        card.classList.add('enter');
        cur = { it, pre, stem, pill, between, end, initial };
        phase = 'decide';
        setButtons(true);
      }

      /** Move the prefix to slot k (0 = right after the verb … between.length = the end). */
      function placePrefix(k) {
        const { pre, stem, between, end, initial, it } = cur;
        flip([pre, stem, ...between, end], () => {
          pre.textContent = it.prefix;
          if (initial) stem.textContent = it.verb;
          pre.classList.add('moved');
          if (k >= between.length) line.insertBefore(pre, end);
          else line.insertBefore(pre, between[k]);
        }, { duration: 420 });
      }

      function snip() {
        const s = h('span', { class: 'sch-snip', html: SCISSORS, 'aria-hidden': 'true' });
        if (cur.pre) s.style.setProperty('--snip-x', cur.pre.offsetLeft + cur.pre.offsetWidth + 'px');
        cur.pill.append(s);
        api.sfx('whoosh');
        api.after(reducedMotion() ? 0 : 420, () => s.remove());
      }

      function result(ok, given) {
        const { it } = cur;
        card.classList.add(ok ? 'good' : 'bad');
        if (ok) {
          api.hit({ el: cur.pill, points: level === 3 && it.sep ? 15 : 10 });
          note.innerHTML = it.sep ? `✂ <b>${it.inf}</b> is separable.` : `🔗 ${md(whyKeep(it.inf))}`;
        } else {
          note.innerHTML = (it.sep ? `<b>${it.inf}</b> is separable: ` : md(whyKeep(it.inf)) + ' ') + `<span class="sch-fix">${md(it.correct)}</span>`;
          api.miss({ q: `${it.before} ${it.glued} ${it.between}`.replace(/\s+/g, ' ').trim() + it.end, a: it.correct, given, el: cur.pill });
          if (soundOn()) api.speak(it.correct);
        }
        phase = 'show';
        setButtons(false);
        api.after(ok ? 950 : 2100, show);
      }

      function decide(cut) {
        if (phase !== 'decide' || api.ended) return;
        const { it } = cur;
        phase = 'busy';
        setButtons(false);
        api.sfx('tap');
        if (cut && it.sep) {
          snip();
          if (level === 3 && cur.between.length) return startPlacing();
          api.after(reducedMotion() ? 0 : 260, () => {
            placePrefix(cur.between.length);
            result(true);
          });
        } else if (!cut && !it.sep) {
          cur.pill.classList.add('kept');
          result(true);
        } else if (!cut && it.sep) {
          // kept a separable verb: show the cut anyway
          placePrefix(cur.between.length);
          result(false, 'kept together');
        } else {
          cur.pill.classList.add('no-cut');
          result(false, 'cut');
        }
      }

      // --- High: put the prefix in its place -------------------------------------------------
      let slots = [];
      function startPlacing() {
        phase = 'place';
        setButtons(false);
        const { pre, stem, between, end, initial, it } = cur;
        pre.textContent = it.prefix;
        if (initial) stem.textContent = it.verb;
        pre.classList.add('floating');
        cur.pill.after(pre); // lift it out of the verb
        slots = [];
        const anchors = between.concat(end);
        anchors.forEach((a, k) => {
          const s = h('button', { type: 'button', class: 'sch-slot', 'aria-label': k === between.length ? 'Put it at the end' : `Put it before “${a.textContent}”`, onClick: () => drop(k) }, '▾');
          line.insertBefore(s, a);
          slots.push(s);
        });
        slotSel = 0;
        paintSlots();
        note.textContent = 'Where does the prefix go? Tap a ▾';
      }

      function paintSlots() {
        slots.forEach((s, k) => s.classList.toggle('sel', k === slotSel));
      }

      function drop(k) {
        if (phase !== 'place') return;
        slots.forEach((s) => s.remove());
        slots = [];
        const { pre, between, it } = cur;
        pre.classList.remove('floating');
        const right = k >= between.length;
        placePrefix(right ? between.length : k);
        if (right) result(true);
        else {
          const built = [it.before, it.verb, ...between.slice(0, k).map((x) => x.textContent), it.prefix, ...between.slice(k).map((x) => x.textContent)].filter(Boolean).join(' ') + it.end;
          api.after(reducedMotion() ? 0 : 450, () => {
            placePrefix(between.length);
            result(false, built);
          });
        }
      }

      return {
        begin: show,
        key(e) {
          if (phase === 'decide') {
            if (e.key === 'ArrowLeft' || e.key === '1' || e.key === 'c') return decide(true), true;
            if (e.key === 'ArrowRight' || e.key === '2' || e.key === 'k') return decide(false), true;
          } else if (phase === 'place') {
            if (e.key === 'ArrowLeft') return (slotSel = Math.max(0, slotSel - 1)), paintSlots(), true;
            if (e.key === 'ArrowRight') return (slotSel = Math.min(slots.length - 1, slotSel + 1)), paintSlots(), true;
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') return drop(slotSel), true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/games/boss.js */
/*
 * Bossfight: every topic has its monster (Brezel.games.data.play.bosses: Der Akkusativ-Drache,
 * Die Perfekt-Krake …). Answer real cards of the topic with the normal exercise screens:
 * a right answer hits the boss, a wrong one lets it strike back (you have 3 hearts).
 * Every 4th right answer in a row is a critical hit (2 damage).
 *   Low: 5 HP, quick card types · Medium: 7 HP · High: 9 HP, typed answers and tables too.
 * Games never change learning progress, so nothing here calls Brezel.store.record.
 * The monster is drawn by monster() from a few features (shape, eyes, horns, fangs, extra).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, pick, reducedMotion } = B.util;

  const HP = { 1: 5, 2: 7, 3: 9 };
  const QUICK = ['mc', 'tf', 'gap', 'match', 'sort', 'spot', 'order'];
  const TYPES = { 1: QUICK, 2: QUICK, 3: QUICK.concat(['type', 'table']) };
  const MIN_CARDS = 8;
  const TAUNT = {
    start: ['Ha! Das schaffst du nie!', 'Komm nur her!', 'Ich bin unbesiegbar!', 'Na, bist du bereit?'],
    hurt: ['Autsch!', 'Au! Das tat weh!', 'Nein, nein, nein!', 'Grrr …', 'Nicht schlecht …', 'Hilfe!'],
    laugh: ['Hahaha!', 'Falsch! Hehe.', 'Das war nix!', 'Noch einmal?', 'Hehehe …'],
  };

  // --- the monster -------------------------------------------------------------------------------
  let uid = 0;

  function shade(hex, amt) {
    const n = parseInt(String(hex).slice(1), 16);
    const t = amt < 0 ? 0 : 255;
    const p = Math.abs(amt);
    const mix = (c) => Math.round((t - c) * p + c);
    const r = mix(n >> 16);
    const g = mix((n >> 8) & 255);
    const b = mix(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  const SHAPES = {
    blob: { d: 'M100 38C150 38 172 88 170 132C168 168 32 168 30 132C28 88 50 38 100 38Z', face: [100, 98], top: 40, spread: 34, feet: 160, belly: true },
    tall: { d: 'M55 70a45 42 0 0 1 90 0V150a18 18 0 0 1-18 18H73a18 18 0 0 1-18-18Z', face: [100, 82], top: 30, spread: 26, feet: 166, belly: true },
    square: { d: 'M58 46H142a20 20 0 0 1 20 20V146a20 20 0 0 1-20 20H58a20 20 0 0 1-20-20V66a20 20 0 0 1 20-20Z', face: [100, 96], top: 46, spread: 40, feet: 164, belly: true, cracks: true },
    wide: { d: 'M22 116a78 54 0 1 0 156 0a78 54 0 1 0-156 0Z', face: [100, 106], top: 64, spread: 40, feet: 166, belly: true },
    ghost: { d: 'M44 168V96C44 48 156 48 156 96V168q-9.33-12-18.67 0t-18.67 0t-18.67 0t-18.67 0t-18.67 0t-18.67 0Z', face: [100, 100], top: 54, spread: 30, feet: 0, belly: false },
    worm: { d: 'M28 150a24 24 0 1 0 48 0a24 24 0 1 0-48 0ZM58 138a28 28 0 1 0 56 0a28 28 0 1 0-56 0ZM90 110a40 40 0 1 0 80 0a40 40 0 1 0-80 0Z', face: [130, 104], top: 72, spread: 22, feet: 0, belly: false },
  };

  /** SVG markup (no outer <svg>) for a boss config, in a 200 × 200 box. */
  function monsterParts(cfg) {
    const id = 'bm' + ++uid;
    const S = SHAPES[cfg.shape] || SHAPES.blob;
    const c = cfg.color || '#7c5cff';
    const dark = shade(c, -0.42);
    const light = shade(c, 0.55);
    const [fx, fy] = S.face;
    const top = S.top;
    const sp = S.spread;
    const ink = '#26212e';
    const behind = [];
    const front = [];
    const over = [];

    // extras drawn behind the body
    if (cfg.extra === 'wings') {
      const wing = `M62 104C22 70 6 112 12 136C24 124 32 130 38 144C44 132 52 132 62 140Z`;
      behind.push(`<path d="${wing}" fill="${dark}"/><path d="${wing}" fill="${dark}" transform="translate(200 0) scale(-1 1)"/>`);
    }
    if (cfg.extra === 'tentacles') {
      for (let i = 0; i < 5; i++) {
        const x = 52 + i * 24;
        behind.push(`<path class="b-tent" style="animation-delay:${-i * 0.35}s" d="M${x} 148q-12 22 4 34q10 8-2 14" fill="none" stroke="${shade(c, -0.15)}" stroke-width="13" stroke-linecap="round"/>`);
      }
    }
    if (cfg.extra === 'ears') {
      behind.push(`<path d="M${fx - sp - 22} ${top + 34}L${fx - sp - 6} ${top - 26}L${fx - sp + 22} ${top + 14}Z" fill="${c}"/>` +
        `<path d="M${fx + sp + 22} ${top + 34}L${fx + sp + 6} ${top - 26}L${fx + sp - 22} ${top + 14}Z" fill="${c}"/>` +
        `<path d="M${fx - sp - 12} ${top + 22}L${fx - sp - 4} ${top - 10}L${fx - sp + 10} ${top + 12}Z" fill="#ffb3c7"/>` +
        `<path d="M${fx + sp + 12} ${top + 22}L${fx + sp + 4} ${top - 10}L${fx + sp - 10} ${top + 12}Z" fill="#ffb3c7"/>`);
    }
    if (cfg.horns) {
      const xs = cfg.horns === 1 ? [0] : cfg.horns === 2 ? [-sp, sp] : [-sp, 0, sp];
      for (const dx of xs) {
        const x = fx + dx;
        const lean = dx < 0 ? -6 : dx > 0 ? 6 : 0;
        behind.push(`<path d="M${x - 11} ${top + 14}Q${x - 6} ${top - 8} ${x + lean} ${top - 26}Q${x + 6} ${top - 6} ${x + 11} ${top + 14}Z" fill="#f6e7c1" stroke="${shade('#f6e7c1', -0.25)}" stroke-width="2.5"/>`);
      }
    }
    if (cfg.extra === 'feathers') {
      const cols = ['#ff4b4b', '#ffc800', '#1cb0f6'];
      cols.forEach((col, i) => behind.push(`<ellipse cx="${fx - 16 + i * 16}" cy="${top - 10}" rx="7" ry="22" fill="${col}" transform="rotate(${-24 + i * 24} ${fx - 16 + i * 16} ${top + 8})"/>`));
    }
    if (cfg.extra === 'spikes') {
      for (let dx = -40; dx <= 40; dx += 20) {
        const x = fx + dx;
        const y = cfg.shape === 'square' ? top : top + (dx * dx) / 95;
        behind.push(`<path d="M${x - 9} ${y + 10}L${x} ${y - 14}L${x + 9} ${y + 10}Z" fill="${dark}"/>`);
      }
    }
    if (cfg.extra === 'antennae') {
      behind.push(`<path d="M${fx - 14} ${top + 6}Q${fx - 22} ${top - 18} ${fx - 30} ${top - 30}M${fx + 14} ${top + 6}Q${fx + 22} ${top - 18} ${fx + 30} ${top - 30}" fill="none" stroke="${dark}" stroke-width="5" stroke-linecap="round"/>` +
        `<circle cx="${fx - 31}" cy="${top - 32}" r="7" fill="#ffc800"/><circle cx="${fx + 31}" cy="${top - 32}" r="7" fill="#ffc800"/>`);
    }

    // feet + body + belly
    const feet = S.feet ? `<ellipse cx="${fx - 30}" cy="${S.feet}" rx="19" ry="10" fill="${dark}"/><ellipse cx="${fx + 30}" cy="${S.feet}" rx="19" ry="10" fill="${dark}"/>` : '';
    const body = `<path d="${S.d}" fill="${c}"/>`;
    const belly = S.belly ? `<ellipse cx="${fx}" cy="${fy + 46}" rx="40" ry="26" fill="${light}" opacity=".7"/>` : '';
    const shine = `<ellipse cx="${fx - sp - 4}" cy="${top + 30}" rx="9" ry="14" fill="#fff" opacity=".25" transform="rotate(25 ${fx - sp - 4} ${top + 30})"/>`;
    const cracks = S.cracks ? `<path d="M52 72l14 10-6 12M150 130l-12-6 4-14M120 58l-6 10" fill="none" stroke="${dark}" stroke-width="3" stroke-linecap="round" opacity=".55"/>` : '';

    if (cfg.extra === 'bandages') {
      front.push(`<clipPath id="${id}c"><path d="${S.d}"/></clipPath><g clip-path="url(#${id}c)" opacity=".92">` +
        [62, 92, 122, 148].map((y, i) => `<path d="M20 ${y + (i % 2 ? 8 : -6)}L180 ${y + (i % 2 ? -8 : 6)}" stroke="#f3ead2" stroke-width="13"/>`).join('') +
        `<path d="M20 ${76}L180 ${84}" stroke="${shade('#f3ead2', -0.12)}" stroke-width="3" opacity=".6"/></g>`);
    }

    // eyes
    const eyes = cfg.eyes === 1 ? [[0, -6, 19]] : cfg.eyes === 3 ? [[-30, 0, 11], [0, -18, 13], [30, 0, 11]] : [[-22, -6, 13], [22, -6, 13]];
    for (const [dx, dy, r] of eyes) {
      const x = fx + dx;
      const y = fy + dy;
      front.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>` +
        `<g class="b-pupil"><circle cx="${x + r * 0.15}" cy="${y + r * 0.12}" r="${r * 0.48}" fill="${ink}"/><circle cx="${x + r * 0.3}" cy="${y - r * 0.12}" r="${r * 0.16}" fill="#fff"/></g>` +
        `<rect class="b-lid" x="${x - r - 1}" y="${y - r - 1}" width="${2 * r + 2}" height="${2 * r + 2}" rx="${r}" fill="${shade(c, -0.08)}"/>`);
      const tilt = dx < 0 ? 5 : dx > 0 ? -5 : 0;
      front.push(`<path d="M${x - r} ${y - r - 6 - tilt}L${x + r} ${y - r - 6 + tilt}" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`);
    }

    // mouth
    const my = fy + 26;
    if (cfg.extra === 'feathers') {
      front.push(`<path d="M${fx - 15} ${my - 6}L${fx + 15} ${my - 6}L${fx} ${my + 18}Z" fill="#ff9f1c" stroke="${shade('#ff9f1c', -0.3)}" stroke-width="2"/>`);
    } else {
      front.push(`<path d="M${fx - 28} ${my}Q${fx} ${my + 30} ${fx + 28} ${my}Q${fx} ${my + 10} ${fx - 28} ${my}Z" fill="${ink}"/>`);
      if (cfg.fangs) front.push(`<path d="M${fx - 19} ${my + 4}l5 11 5-9ZM${fx + 9} ${my + 5}l5 10 5-11Z" fill="#fff"/>`);
      else front.push(`<ellipse cx="${fx}" cy="${my + 12}" rx="10" ry="5" fill="#ff6f91"/>`);
    }
    if (cfg.extra === 'tusks') {
      front.push(`<path d="M${fx - 26} ${my + 2}q-12 24 6 34q-4-16 4-30Z" fill="#fffaf0" stroke="#d9cbb0" stroke-width="2"/>` +
        `<path d="M${fx + 26} ${my + 2}q12 24-6 34q4-16-4-30Z" fill="#fffaf0" stroke="#d9cbb0" stroke-width="2"/>`);
    }

    // extras on top
    if (cfg.extra === 'eyepatch') {
      const [dx, dy, r] = eyes[eyes.length - 1];
      over.push(`<path d="M${fx - sp - 22} ${fy - 30}L${fx + sp + 22} ${fy + 4}" stroke="${ink}" stroke-width="4"/>` +
        `<ellipse cx="${fx + dx}" cy="${fy + dy}" rx="${r + 4}" ry="${r + 2}" fill="${ink}"/>` +
        `<path d="M${fx - 46} ${top + 8}Q${fx} ${top - 22} ${fx + 46} ${top + 8}Q${fx} ${top + 2} ${fx - 46} ${top + 8}Z" fill="#e8384f"/>` +
        `<circle cx="${fx - 6}" cy="${top - 2}" r="3" fill="#fff"/><circle cx="${fx + 10}" cy="${top}" r="3" fill="#fff"/>`);
    }
    if (cfg.extra === 'crown') {
      over.push(`<path d="M${fx - 30} ${top + 6}V${top - 20}L${fx - 15} ${top - 6}L${fx} ${top - 28}L${fx + 15} ${top - 6}L${fx + 30} ${top - 20}V${top + 6}Z" fill="#ffc800" stroke="#e0a200" stroke-width="2.5" stroke-linejoin="round"/>` +
        `<circle cx="${fx}" cy="${top - 4}" r="4" fill="#ff4b4b"/><circle cx="${fx - 18}" cy="${top}" r="3" fill="#1cb0f6"/><circle cx="${fx + 18}" cy="${top}" r="3" fill="#58cc02"/>`);
    }
    if (cfg.extra === 'hat') {
      over.push(`<path d="M${fx - 34} ${top + 10}L${fx + 8} ${top - 42}L${fx + 34} ${top + 10}Z" fill="#2c2f7a"/>` +
        `<ellipse cx="${fx}" cy="${top + 10}" rx="44" ry="9" fill="#23255f"/>` +
        `<path d="M${fx + 2} ${top - 18}l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#ffc800"/>`);
    }
    if (cfg.extra === 'mirror') {
      over.push(`<g class="b-mirror"><rect x="164" y="122" width="8" height="34" rx="4" fill="#b8860b"/>` +
        `<ellipse cx="168" cy="108" rx="20" ry="25" fill="#ffc800"/><ellipse cx="168" cy="108" rx="14" ry="19" fill="#d8f3ff"/>` +
        `<path d="M160 98l10-8M158 108l14-12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>`);
    }

    return `<ellipse class="b-shadow" cx="${fx}" cy="186" rx="58" ry="8" fill="#000" opacity=".12"/>` +
      `<g class="b-body">${behind.join('')}${feet}${body}${belly}${shine}${cracks}${front.join('')}${over.join('')}</g>`;
  }

  const monster = (cfg) => `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${monsterParts(cfg)}</svg>`;

  const ART =
    '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    `<g transform="translate(6 10) scale(.54)">${monsterParts({ color: '#ff4b4b', shape: 'blob', eyes: 2, horns: 2, fangs: true })}</g>` +
    '<g transform="rotate(-38 92 70)"><rect x="88" y="22" width="9" height="62" rx="3" fill="#e9eef2" stroke="#9aa7b0" stroke-width="2"/>' +
    '<path d="M88 22l4.5-10 4.5 10Z" fill="#e9eef2" stroke="#9aa7b0" stroke-width="2"/>' +
    '<rect x="78" y="82" width="29" height="7" rx="3.5" fill="#ffc800"/><rect x="88.5" y="89" width="8" height="18" rx="3" fill="#8c5a2b"/></g>' +
    '<path d="M18 14l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffc800"/></svg>';

  // --- content ----------------------------------------------------------------------------------
  function bossFor(topic) {
    const all = B.games.data.play.bosses;
    return all[topic] || all.all;
  }

  const poolFor = (topic, level) => B.games.lib.cardsFor(topic, level, { types: TYPES[level] || QUICK, min: MIN_CARDS });

  const plain = (s) => String(s == null ? '' : s).replace(/_{3,}/g, '…');

  B.games.register('boss', {
    name: 'Bossfight',
    icon: '🐉',
    art: ART,
    color: '#ff4b4b',
    blurb: 'Every topic has its monster. Answer its cards right to bring it down — before it gets you.',
    how: ['A right answer hits the boss, a wrong one costs a heart', '4 right in a row = a critical hit', 'Keys: Enter checks and continues; 1–4 pick an option'],
    topics: '*',
    ready: (topic, level) => poolFor(topic, level).length >= MIN_CARDS,
    lives: 3,

    play(stage, api) {
      const level = api.level;
      const boss = bossFor(api.topic);
      const maxHp = HP[level] || 7;
      let hp = maxHp;
      const next = B.games.lib.deal(poolFor(api.topic, level));
      let card = null;
      let ctrl = null;
      let ready = false;
      let phase = 'wait'; // wait → answer → busy → feedback → answer …
      let tauntTimer = 0;

      // --- layout ------------------------------------------------------------------------------
      const mon = h('div', { class: 'boss-mon', html: monster(boss) });
      const say = h('div', { class: 'boss-say', 'aria-live': 'polite', hidden: true });
      const hpBar = h('div', { class: 'boss-hp', role: 'meter', 'aria-label': 'Boss health', 'aria-valuemin': '0', 'aria-valuemax': String(maxHp) });
      const hpCells = Array.from({ length: maxHp }, () => h('span', { class: 'boss-hp-cell' }));
      hpBar.append(...hpCells);
      const arena = h('div', { class: 'boss-arena' },
        h('div', { class: 'boss-stage' }, mon, say),
        h('div', { class: 'boss-info' }, h('div', { class: 'boss-name' }, boss.name), hpBar));
      const flash = h('div', { class: 'boss-flash', 'aria-hidden': 'true' });
      const cardEl = h('div', { class: 'boss-card' });
      const fb = h('div', { class: 'boss-fb', 'aria-live': 'polite' });
      const mainBtn = h('button', { type: 'button', class: 'btn btn-primary boss-btn', disabled: true }, '⚔ Attack');
      mainBtn.addEventListener('click', () => (phase === 'feedback' ? nextCard() : check()));
      const foot = h('div', { class: 'boss-foot' }, fb, mainBtn);
      const wrap = h('div', { class: 'boss-wrap' }, arena, cardEl, foot, flash);
      stage.append(wrap);
      paintHp();

      function paintHp() {
        hpCells.forEach((cell, i) => cell.classList.toggle('lost', i >= hp));
        hpBar.setAttribute('aria-valuenow', String(hp));
      }

      function taunt(kind) {
        say.textContent = pick(TAUNT[kind]);
        say.hidden = false;
        B.util.pulse(say, 'pop');
        const mine = ++tauntTimer;
        api.after(1700, () => {
          if (mine === tauntTimer) say.hidden = true;
        });
      }

      const exApi = {
        changed(r) {
          if (phase !== 'answer') return;
          ready = !!r;
          mainBtn.disabled = !ready;
        },
        submit() {
          if (ready) check();
        },
        sfx: (n) => api.sfx(n),
        speak: (t) => B.store.setting('sound') !== false && api.speak(t),
        get card() {
          return card;
        },
      };

      function nextCard() {
        if (api.ended) return;
        B.gloss.hideTip();
        for (let tries = 0; tries < 5; tries++) {
          card = next();
          const def = card && B.ex.get(card.type);
          if (!def) continue;
          const exRoot = h('div', { class: 'ex ex-' + card.type });
          try {
            ctrl = def.render(card, exRoot, exApi);
          } catch (err) {
            console.error('[Brezel] boss: card failed to render', card.id, err);
            continue;
          }
          cardEl.replaceChildren(exRoot);
          cardEl.scrollTop = 0;
          cardEl.classList.remove('enter');
          void cardEl.offsetWidth;
          cardEl.classList.add('enter');
          fb.replaceChildren();
          foot.classList.remove('is-good', 'is-bad');
          ready = false;
          phase = 'answer';
          mainBtn.textContent = '⚔ Attack';
          mainBtn.className = 'btn btn-primary boss-btn';
          mainBtn.disabled = true;
          if (ctrl && ctrl.focus) ctrl.focus();
          return;
        }
        api.end({ note: 'No more cards to fight with.' });
      }

      function shoot(done) {
        if (reducedMotion() || typeof Element.prototype.animate !== 'function') return done();
        const box = wrap.getBoundingClientRect();
        const a = mainBtn.getBoundingClientRect();
        const b = mon.getBoundingClientRect();
        const shot = h('div', { class: 'boss-shot', 'aria-hidden': 'true' }, '🥨');
        shot.style.left = a.left - box.left + a.width / 2 + 'px';
        shot.style.top = a.top - box.top + 'px';
        wrap.append(shot);
        api.sfx('whoosh');
        const dx = b.left + b.width / 2 - (a.left + a.width / 2);
        const dy = b.top + b.height / 2 - a.top;
        const anim = shot.animate(
          [
            { transform: 'translate(-50%, -50%) scale(.6) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.3) rotate(540deg)`, opacity: 1 },
          ],
          { duration: 380, easing: 'cubic-bezier(.4,0,.7,1)' }
        );
        anim.onfinish = () => {
          shot.remove();
          done();
        };
      }

      function damage(n, crit) {
        const tag = h('div', { class: 'boss-dmg' + (crit ? ' crit' : ''), 'aria-hidden': 'true' }, crit ? `KRITISCH! −${n}` : `−${n}`);
        mon.parentNode.append(tag);
        api.after(1000, () => tag.remove());
      }

      function check() {
        if (phase !== 'answer' || !ready || api.ended) return;
        phase = 'busy';
        mainBtn.disabled = true;
        B.gloss.hideTip();
        let res;
        try {
          res = ctrl.check() || { ok: false };
          ctrl.lock(res);
        } catch (err) {
          console.error('[Brezel] boss: check failed', card.id, err);
          res = res || { ok: false };
        }
        let sol = null;
        try {
          sol = ctrl.solution ? ctrl.solution() : null;
        } catch (err) {
          sol = null;
        }
        if (res.ok) {
          const streak = api.combo + 1;
          const crit = streak % 4 === 0;
          const dmg = Math.min(hp, crit ? 2 : 1);
          foot.classList.add('is-good');
          fb.replaceChildren(h('b', {}, crit ? '💥 Kritischer Treffer!' : pick(['Treffer!', 'Volltreffer!', 'Richtig!', 'Bumm!'])));
          shoot(() => {
            if (api.ended) return;
            hp -= dmg;
            paintHp();
            B.util.pulse(mon, 'hit');
            damage(dmg, crit);
            api.sfx('boom');
            api.hit({ el: mon, points: 20 * dmg });
            if (hp <= 0) {
              mon.classList.add('defeated');
              say.hidden = true;
              api.sfx('levelup');
              api.after(1300, () => api.end({ won: true, note: `${boss.name} is defeated!` }));
              return;
            }
            taunt('hurt');
            api.after(800, nextCard);
          });
          return;
        }
        // wrong: the boss strikes back
        const d = B.ex.get(card.type).describe(card);
        B.util.pulse(mon, 'attack');
        B.util.pulse(flash, 'on');
        taunt('laugh');
        api.miss({ q: plain(d.q), a: plain(d.a), given: res.given ? String(res.given) : null, el: arena });
        foot.classList.add('is-bad');
        fb.replaceChildren(
          h('div', { class: 'boss-fb-head' }, h('b', {}, 'Autsch! '), 'The right answer:'),
          sol && sol.html ? h('div', { class: 'boss-fb-sol', html: sol.html }) : h('div', { class: 'boss-fb-sol', html: md(show(d.a)) }),
          card.explain ? h('div', { class: 'boss-fb-why', html: md(card.explain) }) : null);
        if (sol && sol.say && B.store.setting('sound') !== false) api.speak(sol.say);
        if (!api.lives) return; // out of hearts: the frame ends the game
        api.after(300, () => {
          if (api.ended) return;
          phase = 'feedback';
          mainBtn.textContent = 'Continue';
          mainBtn.className = 'btn btn-danger boss-btn';
          mainBtn.disabled = false;
          mainBtn.focus({ preventScroll: true });
        });
      }

      return {
        begin() {
          B.util.pulse(mon, 'roar');
          taunt('start');
          nextCard();
        },
        key(e) {
          const inField = /^(INPUT|TEXTAREA)$/.test(e.target && e.target.tagName);
          if (e.key === 'Enter') {
            if (phase === 'feedback') return nextCard(), true;
            if (phase === 'answer') {
              // a table moves to its next empty cell first
              if (ctrl && ctrl.key && inField && ctrl.key(e)) return true;
              if (ready) check();
              return true;
            }
            return phase === 'busy';
          }
          if (phase === 'answer' && ctrl && ctrl.key && !inField) return !!ctrl.key(e);
          return false;
        },
        destroy() {
          B.gloss.hideTip();
        },
      };
    },
  });

  // exposed for tests and for anyone who wants to draw a boss elsewhere
  B.games.data.play._gen.monster = monster;
  B.games.data.play._gen.bossPool = poolFor;
})();

</script>
  <script>/* js/games/regen.js */
/*
 * Artikel-Regen: nouns rain down in lanes. Answer the lowest one with der, die or das before it
 * hits the ground: right → it drops into its bucket (and is spoken: "der Bahnhof"), wrong → it
 * shatters, on the ground → splash. Both cost a life. Survive 90 seconds.
 * Nouns: Brezel.games.data.play.nouns (only those with a glossary meaning).
 *   Low: slow rain, 5 lives, the English meaning under each word · Medium: faster, 4 lives ·
 *   High: fast and dense, 3 lives. Speed and density keep rising during the game.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, reducedMotion } = B.util;

  const ARTS = ['der', 'die', 'das'];
  const FALL = { 1: 9500, 2: 7400, 3: 5600 }; // ms from the top to the ground at the start
  const SPAWN = { 1: 2900, 2: 2200, 3: 1650 }; // ms between new words at the start
  const LIVE = { 1: 3, 2: 4, 3: 5 }; // words in the air at most
  const nouns = () => B.games.data.play._gen.regenNouns();

  const ART =
    '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    '<g fill="#ffffff" stroke="#bfe6fb" stroke-width="3"><circle cx="38" cy="44" r="16"/><circle cx="60" cy="34" r="21"/><circle cx="84" cy="44" r="16"/></g>' +
    '<rect x="30" y="40" width="62" height="20" rx="10" fill="#ffffff"/>' +
    '<path d="M32 70c0 0-9 12-9 18a9 9 0 0 0 18 0c0-6-9-18-9-18z" fill="#1cb0f6"/>' +
    '<path d="M60 80c0 0-9 12-9 18a9 9 0 0 0 18 0c0-6-9-18-9-18z" fill="#ff4b8b"/>' +
    '<path d="M88 70c0 0-9 12-9 18a9 9 0 0 0 18 0c0-6-9-18-9-18z" fill="#58cc02"/>' +
    '<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">' +
    '<text x="32" y="92">der</text><text x="60" y="102">die</text><text x="88" y="92">das</text></g>' +
    '<path d="M100 14l2.6 6 6 2.6-6 2.6-2.6 6-2.6-6-6-2.6 6-2.6z" fill="#ffc800"/></svg>';

  const BUCKET =
    '<svg viewBox="0 0 48 40" aria-hidden="true"><path d="M6 10h36l-5 26a4 4 0 0 1-4 3H15a4 4 0 0 1-4-3Z" fill="currentColor" opacity=".9"/>' +
    '<ellipse cx="24" cy="10" rx="19" ry="5" fill="currentColor"/><ellipse cx="24" cy="10" rx="15" ry="3" fill="#000" opacity=".18"/></svg>';

  B.games.register('regen', {
    name: 'Artikel-Regen',
    icon: '🌧️',
    art: ART,
    color: '#1cb0f6',
    blurb: 'Nouns are raining down. Catch each one in the right bucket: der, die or das.',
    how: ['Answer the **lowest** word before it lands', 'Tap **der**, **die** or **das**', 'Keys: 1 / 2 / 3 or ← ↓ →'],
    topics: ['cases', 'gender', 'vocab'],
    ready: () => nouns().length >= 20,
    time: 90,
    lives: (level) => ({ 1: 5, 2: 4, 3: 3 })[level] || 4,

    play(stage, api) {
      const level = api.level;
      const next = B.games.lib.deal(nouns());
      const soundOn = () => B.store.setting('sound') !== false;
      const drops = []; // { el, noun, art, y, lane, h, done }
      let elapsed = 0;
      let spawnIn = 400;
      let caught = 0;
      let skyH = 0;
      let skyW = 0;
      let lanes = 3;

      const sky = h('div', { class: 'rg-sky', 'aria-live': 'polite' },
        h('div', { class: 'rg-cloud c1', 'aria-hidden': 'true' }),
        h('div', { class: 'rg-cloud c2', 'aria-hidden': 'true' }),
        h('div', { class: 'rg-ground', 'aria-hidden': 'true' }));
      const buckets = ARTS.map((art, i) => {
        const b = h('button', { type: 'button', class: 'rg-bucket rg-' + art, 'aria-label': `${art} (key ${i + 1})`, onClick: () => answer(art) },
          h('span', { class: 'rg-bucket-ico', html: BUCKET }),
          h('span', { class: 'rg-bucket-art' }, art),
          h('span', { class: 'rg-key', 'aria-hidden': 'true' }, String(i + 1)));
        return b;
      });
      const wrap = h('div', { class: 'rg-wrap' }, sky, h('div', { class: 'rg-buckets' }, buckets));
      stage.append(wrap);

      function measure() {
        skyH = sky.clientHeight;
        skyW = sky.clientWidth;
        lanes = skyW >= 560 ? 4 : 3;
      }
      const onResize = () => measure();
      window.addEventListener('resize', onResize);
      measure();

      const ground = () => skyH - 14; // where a word lands (its bottom edge)
      const live = () => drops.filter((d) => !d.done);
      const lowest = () => live().reduce((m, d) => (!m || d.y > m.y ? d : m), null);

      function paintActive() {
        const a = lowest();
        for (const d of drops) d.el.classList.toggle('active', d === a);
      }

      function spawn() {
        const n = next();
        if (!n) return;
        // a lane whose last word has moved down far enough
        const free = [];
        for (let i = 0; i < lanes; i++) {
          const top = live().filter((d) => d.lane === i).reduce((m, d) => Math.min(m, d.y), Infinity);
          if (top > 70) free.push(i);
        }
        if (!free.length) {
          spawnIn = 300;
          return;
        }
        const lane = free[Math.floor(Math.random() * free.length)];
        const el = h('div', { class: 'rg-drop', lang: 'de' },
          h('span', { class: 'rg-art' }),
          h('span', { class: 'rg-word' }, n.noun),
          level === 1 ? h('span', { class: 'rg-en' }, n.en) : null);
        sky.append(el);
        // the lane's centre, kept inside the sky for long words
        const w = el.offsetWidth || 120;
        const x = Math.max(w / 2 + 6, Math.min(skyW - w / 2 - 6, ((lane + 0.5) / lanes) * skyW));
        el.style.left = x + 'px';
        const d = { el, noun: n.noun, art: n.art, x, y: -el.offsetHeight - 4, lane, h: el.offsetHeight || 44, done: false };
        place(d);
        drops.push(d);
        paintActive();
      }

      function place(d) {
        d.el.style.transform = `translate(-50%, ${d.y}px)`;
      }

      function remove(d, ms) {
        d.done = true;
        api.after(ms, () => {
          d.el.remove();
          const i = drops.indexOf(d);
          if (i >= 0) drops.splice(i, 1);
        });
        paintActive();
      }

      function answer(art) {
        if (api.ended) return;
        const d = lowest();
        const btn = buckets[ARTS.indexOf(art)];
        B.util.pulse(btn, 'press');
        if (!d) return;
        d.el.querySelector('.rg-art').textContent = d.art;
        d.el.classList.add('rg-' + d.art);
        if (art === d.art) {
          caught++;
          api.hit({ el: d.el });
          fly(d, btn);
          B.util.pulse(btn, 'gulp');
          if (soundOn()) api.speak(`${d.art} ${d.noun}`);
        } else {
          d.el.classList.add('shatter');
          api.miss({ q: d.noun, a: `${d.art} ${d.noun}`, given: `${art} ${d.noun}`, el: d.el });
          remove(d, 450);
        }
      }

      function fly(d, btn) {
        d.done = true;
        paintActive();
        const s = sky.getBoundingClientRect();
        const b = btn.getBoundingClientRect();
        const dx = b.left + b.width / 2 - s.left - d.x;
        const dy = b.top + b.height / 2 - s.top - (d.y + d.h / 2);
        if (reducedMotion() || typeof d.el.animate !== 'function') return remove(d, 0);
        d.el.animate(
          [
            { transform: `translate(-50%, ${d.y}px) translate(0px, 0px) scale(1)`, opacity: 1 },
            { transform: `translate(-50%, ${d.y}px) translate(${dx}px, ${dy}px) scale(.35)`, opacity: 0.2 },
          ],
          { duration: 420, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' }
        );
        remove(d, 430);
      }

      function frame(dt) {
        if (!skyH) measure();
        elapsed += dt;
        const ramp = Math.max(0.5, 1 - elapsed / 150000); // slowly faster
        const speed = (ground() + 40) / (FALL[level] * ramp); // px per ms
        for (const d of drops) {
          if (d.done) continue;
          d.y += speed * dt;
          place(d);
          if (d.y + d.h >= ground()) {
            d.el.querySelector('.rg-art').textContent = d.art;
            d.el.classList.add('splash', 'rg-' + d.art);
            api.miss({ q: d.noun, a: `${d.art} ${d.noun}`, given: '— (it landed)', el: d.el });
            remove(d, 500);
          }
        }
        spawnIn -= dt;
        if (spawnIn <= 0) {
          spawnIn = SPAWN[level] * Math.max(0.55, 1 - elapsed / 120000);
          if (live().length < LIVE[level]) spawn();
        }
        paintActive();
      }

      return {
        begin() {
          measure();
          api.frame(frame);
        },
        key(e) {
          const k = { 1: 'der', 2: 'die', 3: 'das', ArrowLeft: 'der', ArrowDown: 'die', ArrowRight: 'das' }[e.key];
          if (!k) return false;
          answer(k);
          return true;
        },
        timeUp() {
          api.end({ won: true, note: `You survived the rain — ${caught} nouns caught!` });
        },
        destroy() {
          window.removeEventListener('resize', onResize);
        },
      };
    },
  });
})();

  <script>/* js/ui/charts.js */
/*
 * Small dependency-free charts for the review screen.
 *   card({title, sub, legend, body, table})  – chart frame with legend + "Table" toggle
 *   stacked(rows, series)                    – horizontal stacked bars (HTML)
 *   bars(rows)                               – single-series horizontal bars (HTML)
 *   line(points)                             – line chart with crosshair (SVG)
 *   meter(value)                             – one-value progress meter
 * Colours come from CSS variables (--s1, --s2, --track, --grid) so dark mode
 * gets its own validated steps. Every mark has a hover/focus tooltip.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, pct } = B.util;
  const SVG = 'http://www.w3.org/2000/svg';

  // --- tooltip -------------------------------------------------------------
  let tipEl = null;
  function tipNode() {
    if (!tipEl) {
      tipEl = h('div', { class: 'chart-tip', role: 'tooltip' });
      document.body.append(tipEl);
    }
    return tipEl;
  }

  function showTip(lines, x, y) {
    const t = tipNode();
    t.replaceChildren(...lines.filter(Boolean).map((l, i) => h('div', { class: i === 0 ? 'tip-title' : 'tip-line' }, l)));
    t.classList.add('show');
    const r = t.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2));
    let top = y - r.height - 10;
    if (top < 8) top = y + 24;
    t.style.left = left + 'px';
    t.style.top = top + 'px';
  }

  function hideTip() {
    if (tipEl) tipEl.classList.remove('show');
  }
  window.addEventListener('scroll', hideTip, { passive: true, capture: true });
  window.addEventListener('pointerdown', (e) => {
    if (!e.target.closest || !e.target.closest('[data-tip]')) hideTip();
  });

  /** Attach a tooltip to an element (mouse hover, touch tap, keyboard focus). */
  function hover(el, lines) {
    el.dataset.tip = '1';
    const at = (e) => {
      const r = el.getBoundingClientRect();
      const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2;
      showTip(typeof lines === 'function' ? lines() : lines, x, r.top);
    };
    el.addEventListener('pointerenter', at);
    el.addEventListener('pointermove', (e) => e.pointerType === 'mouse' && at(e));
    el.addEventListener('pointerdown', at);
    el.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && hideTip());
    el.addEventListener('focus', () => at());
    el.addEventListener('blur', hideTip);
  }

  // --- frame -----------------------------------------------------------------
  function legendRow(items) {
    return h('ul', { class: 'legend' }, items.map((it) => h('li', {}, h('span', { class: 'sw ' + it.cls, 'aria-hidden': 'true' }), it.label)));
  }

  function dataTable({ head, rows }) {
    const numeric = (v) => typeof v === 'number' || /^[\d.,%/ —–-]+$/.test(String(v));
    return h('div', { class: 'table-scroll' },
      h('table', { class: 'data-table' },
        h('thead', {}, h('tr', {}, head.map((x, i) => h('th', { scope: 'col', class: i ? 'num' : null }, x)))),
        h('tbody', {}, rows.map((r) => h('tr', {}, r.map((v, i) => (i ? h('td', { class: numeric(v) ? 'num' : null }, String(v)) : h('th', { scope: 'row' }, String(v)))))))));
  }

  function card({ title, sub, legend, body, table, extra }) {
    const legendEl = legend && legend.length > 1 ? legendRow(legend) : null;
    const tableEl = table ? dataTable(table) : null;
    let toggle = null;
    if (tableEl) {
      tableEl.hidden = true;
      toggle = h('button', { class: 'chart-toggle', type: 'button', 'aria-pressed': 'false' }, 'Table');
      toggle.addEventListener('click', () => {
        const on = toggle.getAttribute('aria-pressed') !== 'true';
        toggle.setAttribute('aria-pressed', String(on));
        toggle.textContent = on ? 'Chart' : 'Table';
        tableEl.hidden = !on;
        body.hidden = on;
        if (legendEl) legendEl.hidden = on;
        hideTip();
      });
    }
    return h('section', { class: 'chart-card card' },
      h('div', { class: 'chart-head' },
        h('div', {}, h('h3', { class: 'chart-title' }, title), sub ? h('p', { class: 'chart-sub' }, sub) : null),
        toggle),
      legendEl, body, tableEl, extra || null);
  }

  // --- stacked horizontal bars ------------------------------------------------
  /**
   * rows:   [{label, icon?, total, parts: [n, n], value: '24/38', badge?: Element}]
   * series: [{label, cls}] — one per part; the rest of the bar is the grey track.
   */
  function stacked(rows, series, { restLabel = 'Not mastered yet', unit = 'cards' } = {}) {
    const wrap = h('div', { class: 'hbars' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      const used = r.parts.reduce((a, b) => a + b, 0);
      r.parts.forEach((n, i) => {
        if (!n) return;
        const seg = h('div', { class: 'hbar-seg ' + series[i].cls, style: { width: (n / r.total) * 100 + '%' } });
        hover(seg, [r.label, `${series[i].label}: ${n} of ${r.total} ${unit} (${pct(n, r.total)}%)`]);
        track.append(seg);
      });
      const rest = r.total - used;
      if (rest > 0) {
        const seg = h('div', { class: 'hbar-seg hbar-rest' });
        hover(seg, [r.label, `${restLabel}: ${rest} of ${r.total} ${unit}`]);
        track.append(seg);
      }
      const aria = `${r.label}: ` + series.map((s, i) => `${s.label} ${r.parts[i]}`).join(', ') + `, ${restLabel.toLowerCase()} ${rest}, of ${r.total}` + (r.badgeText ? `. ${r.badgeText}` : '');
      wrap.append(
        h('div', { class: 'hbar-row', role: 'group', 'aria-label': aria },
          h('div', { class: 'hbar-label' },
            r.icon ? h('span', { class: 'hbar-icon', 'aria-hidden': 'true' }, r.icon) : null,
            h('span', { class: 'hbar-name', title: r.label }, r.label)),
          r.badge ? h('div', { class: 'hbar-badge' }, r.badge) : h('div', { class: 'hbar-badge' }),
          h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.value)))
      );
    }
    return wrap;
  }

  // --- single-series bars ------------------------------------------------------
  /** rows: [{label, value (0–100 or null), text: '82%', tip: [lines]}] */
  function bars(rows) {
    const wrap = h('div', { class: 'hbars hbars-single' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      if (r.value) track.append(h('div', { class: 'hbar-seg s1', style: { width: r.value + '%' } }));
      if (r.value < 100) track.append(h('div', { class: 'hbar-seg hbar-rest' }));
      const row = h('div', { class: 'hbar-row', tabindex: '0', 'aria-label': `${r.label}: ${r.text}` },
        h('div', { class: 'hbar-label' }, h('span', { class: 'hbar-name', title: r.label }, r.label)),
        h('div', { class: 'hbar-badge' }),
        h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.text)));
      hover(row, r.tip || [r.label, r.text]);
      wrap.append(row);
    }
    return wrap;
  }

  // --- line chart -------------------------------------------------------------
  const svg = (tag, attrs) => {
    const el = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    return el;
  };

  /**
   * points: [{x: 'label under the axis', y: 0–100, tip: [lines]}]
   * Re-draws itself when its container is resized.
   */
  function line(points, { yMax = 100, yFmt = (v) => v + '%', height = 210, ariaLabel = 'Line chart' } = {}) {
    const box = h('div', { class: 'line-chart', tabindex: '0', role: 'img', 'aria-label': ariaLabel });
    let active = -1;
    let geom = null;

    function draw() {
      const W = Math.max(260, Math.round(box.clientWidth || 600));
      const H = height;
      const m = { l: 40, r: 14, t: 14, b: 30 };
      const iw = W - m.l - m.r;
      const ih = H - m.t - m.b;
      const n = points.length;
      const xAt = (i) => m.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      const yAt = (v) => m.t + ih - (v / yMax) * ih;
      geom = { xAt, yAt, m, W, H };

      const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
      for (const v of [0, 25, 50, 75, 100]) {
        root.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: yAt(v), y2: yAt(v) }));
        const t = svg('text', { class: 'axis', x: m.l - 8, y: yAt(v) + 4, 'text-anchor': 'end' });
        t.textContent = yFmt(v);
        root.append(t);
      }
      // x labels: first, last and a few in between
      const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 56))));
      points.forEach((p, i) => {
        if (i % every && i !== n - 1) return;
        if (i !== n - 1 && n - 1 - i < every / 2 && i !== 0) return;
        const t = svg('text', { class: 'axis', x: xAt(i), y: H - 8, 'text-anchor': 'middle' });
        t.textContent = p.x;
        root.append(t);
      });
      const cross = svg('line', { class: 'crosshair', x1: 0, x2: 0, y1: m.t, y2: m.t + ih, visibility: 'hidden' });
      root.append(cross);
      if (n > 1) {
        const d = points.map((p, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
        root.append(svg('path', { class: 'series s1-stroke', d }));
      }
      const dots = points.map((p, i) => {
        const c = svg('circle', { class: 'dot s1-fill' + (p.hollow ? ' hollow' : ''), cx: xAt(i), cy: yAt(p.y), r: n > 24 ? 3 : 4 });
        root.append(c);
        return c;
      });
      geom.cross = cross;
      geom.dots = dots;
      box.replaceChildren(root);
      if (active >= 0) focusPoint(active, false);
    }

    function focusPoint(i, showTooltip = true) {
      if (!geom || !points.length) return;
      active = Math.max(0, Math.min(points.length - 1, i));
      const x = geom.xAt(active);
      geom.cross.setAttribute('x1', x);
      geom.cross.setAttribute('x2', x);
      geom.cross.setAttribute('visibility', 'visible');
      geom.dots.forEach((d, j) => d.classList.toggle('on', j === active));
      if (showTooltip) {
        const r = box.getBoundingClientRect();
        showTip(points[active].tip, r.left + x, r.top + geom.yAt(points[active].y));
      }
    }

    function clear() {
      if (!geom) return;
      geom.cross.setAttribute('visibility', 'hidden');
      geom.dots.forEach((d) => d.classList.remove('on'));
      active = -1;
      hideTip();
    }

    function nearest(clientX) {
      const r = box.getBoundingClientRect();
      const x = clientX - r.left;
      let best = 0;
      points.forEach((_, i) => {
        if (Math.abs(geom.xAt(i) - x) < Math.abs(geom.xAt(best) - x)) best = i;
      });
      return best;
    }

    box.dataset.tip = '1';
    box.addEventListener('pointermove', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerdown', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && clear());
    box.addEventListener('focus', () => focusPoint(active >= 0 ? active : points.length - 1));
    box.addEventListener('blur', clear);
    box.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        focusPoint((active < 0 ? points.length - 1 : active) + (e.key === 'ArrowLeft' ? -1 : 1));
      }
    });

    if (typeof ResizeObserver === 'function') {
      let lastW = 0;
      new ResizeObserver(() => {
        const w = Math.round(box.clientWidth);
        if (w && w !== lastW) {
          lastW = w;
          draw();
        }
      }).observe(box);
    }
    requestAnimationFrame(draw);
    return box;
  }

  // --- meter -------------------------------------------------------------------
  function meter(value, label) {
    return h('div', { class: 'meter', role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(value), 'aria-label': label },
      h('div', { class: 'meter-fill s1', style: { width: value + '%' } }));
  }

  B.charts = { card, stacked, bars, line, meter, hover, hideTip, legendRow };
})();

  <script>/* js/ui/achievements.js */
/*
 * Achievements on screen (definitions and unlocking: js/core/achievements.js).
 *   Brezel.ui.achievementsSection()      the home-page block: "Achievements x / N" and a grid of badges.
 *                                        Locked badges are grey with a lock (and a progress bar where there is one);
 *                                        earned ones are in colour with the date. Tap a badge for its details.
 *   Brezel.ui.celebrateAchievements(list) the "Achievement unlocked!" pop-up (one after another), with sound and confetti.
 *                                        Called by Brezel.achievements.evaluate().
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, pct } = B.util;

  B.ui = B.ui || {};

  const LOCK =
    '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/>' +
    '<path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';

  const longDate = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const shortDate = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

  /** [current, goal] of a definition, clamped; null if it has no progress. */
  function progressOf(def, snap) {
    if (!def.progress || !snap) return null;
    try {
      const [cur, goal] = def.progress(snap);
      const g = Math.max(1, Number(goal) || 1);
      return { cur: Math.max(0, Math.min(Number(cur) || 0, g)), goal: g };
    } catch (e) {
      return null;
    }
  }

  function art(def, { big = false, locked = false } = {}) {
    const el = h('span', { class: 'ach-art' + (big ? ' big' : ''), html: def.icon || '' });
    if (locked) el.append(h('span', { class: 'ach-lock', html: LOCK }));
    return el;
  }

  function bar(p, cls) {
    return h('span', { class: cls || 'ach-bar', 'aria-hidden': 'true' }, h('span', { style: { width: pct(p.cur, p.goal) + '%' } }));
  }

  function setColor(el, def) {
    el.style.setProperty('--ach', def.color || '#1cb0f6');
    return el;
  }

  // --- details dialog ----------------------------------------------------------------------------
  function openDetails(def) {
    const at = B.achievements.unlockedAt(def.id);
    const p = at ? null : progressOf(def, B.achievements.snapshot());
    B.app.sheet((close) => {
      const ok = h('button', { type: 'button', class: 'btn btn-primary btn-big', 'data-autofocus': '', onClick: () => close() }, at ? 'Toll!' : 'Got it');
      return setColor(h('div', { class: 'modal ach-modal ' + (at ? 'is-unlocked' : 'is-locked'), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ach-dlg-title' },
        h('div', { class: 'ach-hero' }, at ? h('span', { class: 'ach-rays', 'aria-hidden': 'true' }) : null, art(def, { big: true, locked: !at })),
        h('h2', { class: 'modal-title', id: 'ach-dlg-title', lang: 'de' }, def.name),
        h('p', { class: 'ach-en' }, def.en),
        h('p', { class: 'ach-desc' }, h('b', {}, at ? 'You did it: ' : 'How to earn it: '), def.desc),
        p && p.goal > 1
          ? h('div', { class: 'ach-progress' }, bar(p, 'ach-bar big'), h('span', { class: 'ach-progress-num' }, `${p.cur} / ${p.goal}`))
          : null,
        h('p', { class: 'ach-when' }, at ? `🏅 Earned on ${longDate(at)}` : 'Not earned yet. Keep going!'),
        ok), def);
    });
  }

  // --- home section ------------------------------------------------------------------------------
  B.ui.achievementsSection = function () {
    const A = B.achievements;
    if (!A) return null;
    const snap = A.snapshot();
    const { unlocked, total } = A.count();
    const grid = h('div', { class: 'ach-grid' });
    A.list.forEach((def, i) => {
      const at = A.unlockedAt(def.id);
      const p = at ? null : progressOf(def, snap);
      const label = at
        ? `${def.name} (${def.en}): earned on ${longDate(at)}`
        : `${def.name} (${def.en}): locked. ${def.desc}${p && p.goal > 1 ? ` Progress ${p.cur} of ${p.goal}.` : ''}`;
      const btn = h('button', { type: 'button', class: 'ach-badge ' + (at ? 'is-unlocked' : 'is-locked'), 'aria-label': label, onClick: () => openDetails(def) },
        art(def, { locked: !at }),
        h('span', { class: 'ach-name', lang: 'de' }, def.name),
        at
          ? h('span', { class: 'ach-meta' }, shortDate(at))
          : p && p.goal > 1 && p.cur > 0
            ? bar(p)
            : h('span', { class: 'ach-meta' }, 'Locked'));
      btn.style.setProperty('--i', String(i));
      grid.append(setColor(btn, def));
    });

    return h('section', { class: 'card ach-section', 'aria-labelledby': 'ach-title' },
      h('div', { class: 'ach-head' },
        h('h2', { class: 'section-title', id: 'ach-title' }, h('span', { 'aria-hidden': 'true' }, '🏅 '), 'Achievements'),
        h('span', { class: 'ach-count', 'aria-label': `${unlocked} of ${total} earned` }, h('b', {}, String(unlocked)), ` / ${total}`)),
      h('div', { class: 'ach-total', 'aria-hidden': 'true' }, h('span', { style: { width: pct(unlocked, total) + '%' } })),
      h('p', { class: 'muted small ach-help' }, 'Earn badges by learning and playing. Tap one to see how to get it.'),
      grid);
  };

  // --- "Achievement unlocked!" ----------------------------------------------------------------------
  const queue = [];
  let showing = false;
  let layer = null;

  B.ui.celebrateAchievements = function (list) {
    if (!list || !list.length || typeof document === 'undefined') return;
    queue.push(...list);
    B.audio.play('combo');
    if (B.app && B.app.confetti) setTimeout(() => B.app.confetti(Math.min(150, 60 + list.length * 25)), 120);
    if (!showing) next();
  };

  function next() {
    const def = queue.shift();
    if (!def) {
      showing = false;
      return;
    }
    showing = true;
    if (!layer || !layer.isConnected) {
      layer = h('div', { class: 'ach-pop-layer', role: 'status', 'aria-live': 'polite' });
      document.body.append(layer);
    }
    let timer = 0;
    let gone = false;
    const dismiss = () => {
      if (gone) return;
      gone = true;
      clearTimeout(timer);
      el.classList.add('out');
      setTimeout(() => {
        el.remove();
        next();
      }, 260);
    };
    const el = setColor(h('div', { class: 'ach-pop', onClick: dismiss },
      art(def),
      h('div', { class: 'ach-pop-text' },
        h('span', { class: 'ach-pop-kicker' }, 'Achievement unlocked!'),
        h('b', { class: 'ach-pop-name', lang: 'de' }, def.name),
        h('span', { class: 'ach-pop-en' }, def.en))), def);
    layer.append(el);
    timer = setTimeout(dismiss, queue.length ? 2600 : 3600);
  }
})();

  <script>/* js/ui/glossary.js */
/*
 * The 📖 Glossary of the card on screen: every German word in the question with its English
 * meaning (data/glossary.js), and the rule the card practises (data/rules.js).
 * Answer choices are never translated (see Brezel.ex.questionTexts). A card whose rule would
 * give the answer away (card.asksRule) keeps the rule folded until the learner opens it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md } = B.util;

  function words(card, texts) {
    if (card.gloss === false) {
      return h('p', { class: 'gl-note' }, '🤫 This card asks what the words mean, so their translations stay hidden.');
    }
    const rows = B.gloss.entries(card, texts);
    if (!rows.length) {
      return h('p', { class: 'gl-note' }, 'Nothing to translate here: the answer choices aren’t translated, so they can’t give the answer away.');
    }
    return h('dl', { class: 'gl-words' },
      rows.map((r) => h('div', { class: 'gl-row' },
        h('dt', { lang: 'de' }, r.de),
        h('dd', {},
          r.hidden ? h('span', { class: 'gl-hidden' }, '🤫 that’s what this card asks') : r.en,
          r.base ? h('span', { class: 'gl-base', lang: 'de', title: 'Dictionary form' }, r.base) : null))));
  }

  /** A rule's table (the articles of a case): the first column is a row label. */
  function table({ head, rows }) {
    return h('div', { class: 'table-scroll gl-table-wrap' },
      h('table', { class: 'data-table gl-table', lang: 'de' },
        head ? h('thead', {}, h('tr', {}, head.map((c) => h('th', { scope: 'col', html: md(c) })))) : null,
        h('tbody', {}, rows.map((r) => h('tr', {}, r.map((c, i) => h(i ? 'td' : 'th', { scope: i ? null : 'row', html: md(c) })))))));
  }

  /** One rule: title, text, table, points. The Rule book shows its title itself ({ title: false }). */
  function rule(r, { title = true } = {}) {
    return h('div', { class: 'gl-rule' },
      title ? h('h4', { class: 'gl-rule-title', html: md(r.title) }) : null,
      r.text ? h('p', { class: 'gl-rule-text', html: md(r.text) }) : null,
      r.table ? table(r.table) : null,
      r.points ? h('ul', { class: 'gl-points' }, r.points.map((p) => h('li', { html: md(p) }))) : null);
  }

  function rules(card) {
    const list = B.deck.rulesFor(card);
    if (!list.length) return null;
    const body = h('div', { class: 'gl-rules', tabindex: '-1' }, list.map((r) => rule(r)));
    const parts = [h('h3', { class: 'gl-h' }, list.length > 1 ? 'The rules' : 'The rule'), body];
    if (card.asksRule) {
      body.hidden = true;
      const show = h('button', { type: 'button', class: 'btn btn-outline gl-reveal' }, 'Show the rule anyway');
      const fold = h('div', { class: 'gl-fold' },
        h('p', {}, '🤫 This card asks about the rule itself, so reading it now gives the answer away.'),
        show);
      show.addEventListener('click', () => {
        fold.remove();
        body.hidden = false;
        body.focus({ preventScroll: true });
      });
      parts.splice(1, 0, fold);
    }
    return h('section', { class: 'gl-section' }, parts);
  }

  /** texts: [{text, loose?}] — the question text on screen (Brezel.ex.questionTexts or the card's glossTexts()). */
  function open(card, texts) {
    B.gloss.hideTip();
    return B.app.sheet((close) => {
      const done = h('button', { type: 'button', class: 'btn btn-primary btn-big', 'data-autofocus': '', onClick: () => close() }, 'Got it');
      return h('div', { class: 'modal sheet glossary', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gl-title' },
        h('header', { class: 'sheet-head' },
          h('h2', { id: 'gl-title', class: 'sheet-title' }, h('span', { 'aria-hidden': 'true' }, '📖 '), 'Glossary'),
          h('button', { type: 'button', class: 'icon-btn sheet-x', 'aria-label': 'Close', onClick: () => close() }, '✕')),
        h('div', { class: 'sheet-body', tabindex: '0' },
          h('section', { class: 'gl-section' }, h('h3', { class: 'gl-h' }, 'Words in this question'), words(card, texts)),
          rules(card)),
        h('footer', { class: 'sheet-foot' }, done));
    });
  }

  B.glossary = { open, rule };
})();
