  <script>/* js/ui/rulebook.js */
/*
 * 📖 Rule book: every grammar rule of data/rules.js, grouped by topic, with a search box.
 * Opened from the home screen, or from a topic's 📖 Rule tip with { topic } to open that topic.
 * The search ignores case, umlauts and accents of the question: "dativ" finds Dativ, "madchen" Mädchen.
 * Keys: / = search, Esc = clear the search, then back home.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, norm } = B.util;

  /** Everything a rule says, in one searchable string (umlauts also as plain vowels). */
  function haystack(r, topic) {
    const table = r.table ? [...(r.table.head || []), ...r.table.rows.flat()] : [];
    const text = norm([r.title, r.text, ...(r.points || []), ...table, topic.name, topic.de].join(' ').replace(/\*+/g, ''));
    return ` ${text} ${text.replace(/([aou])e/g, '$1')} `;
  }

  B.ui.rulebook = function (root, opts) {
    const back = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Back to home' }, '←');
    back.addEventListener('click', () => B.app.go('home'));
    const search = h('input', {
      class: 'rb-search',
      type: 'search',
      autocomplete: 'off',
      autocorrect: 'off',
      autocapitalize: 'off',
      spellcheck: 'false',
      enterkeyhint: 'search',
      'aria-label': 'Search the rules',
      placeholder: 'Search, e.g. Dativ, seit, Partizip',
    });
    const count = h('p', { class: 'muted small rb-count', 'aria-live': 'polite' });
    const empty = h('p', { class: 'card rb-empty', hidden: true });

    const sections = B.deck.topics.filter((t) => !t.collects).map((t) => {
      const rules = B.deck.rules.filter((r) => r.topic === t.id);
      if (!rules.length) return null;
      const items = rules.map((r) => ({
        el: h('details', { class: 'rb-rule' },
          h('summary', { class: 'rb-summary', html: md(r.title) }),
          B.glossary.rule(r, { title: false })),
        text: haystack(r, t),
      }));
      const el = h('section', { class: 'card rb-topic', 'aria-label': t.name },
        h('h2', { class: 'section-title rb-head' },
          h('span', { class: 'rb-icon', 'aria-hidden': 'true' }, t.icon),
          h('span', {}, t.name, h('small', { class: 'rb-de' }, t.de))),
        h('div', { class: 'rb-list' }, items.map((i) => i.el)));
      return { id: t.id, el, items };
    }).filter(Boolean);
    const total = sections.reduce((n, s) => n + s.items.length, 0);

    function filter() {
      const words = norm(search.value).split(' ').filter(Boolean);
      let shown = 0;
      for (const s of sections) {
        let any = false;
        for (const i of s.items) {
          const hit = words.every((w) => i.text.includes(w));
          i.el.hidden = !hit;
          if (words.length) i.el.open = hit;
          if (hit) shown++;
          any = any || hit;
        }
        s.el.hidden = !any;
      }
      count.textContent = words.length
        ? `${shown} of ${total} rules match`
        : `${total} rules in ${sections.length} topics. Tap a rule to open it.`;
      empty.hidden = shown > 0;
      empty.textContent = `No rule mentions “${search.value.trim()}”.`;
    }
    search.addEventListener('input', () => {
      if (!search.value) sections.forEach((s) => s.items.forEach((i) => (i.el.open = false)));
      filter();
    });

    root.append(
      h('header', { class: 'page-top' }, back, h('h1', { class: 'page-title' }, 'Rule book')),
      h('main', { class: 'rulebook' },
        h('div', { class: 'rb-tools' }, search, count),
        empty,
        sections.map((s) => s.el)));
    filter();

    const jump = opts.topic && sections.find((s) => s.id === opts.topic);
    if (jump) {
      jump.items.forEach((i) => (i.el.open = true));
      requestAnimationFrame(() => jump.el.scrollIntoView({ block: 'start' }));
    }

    return {
      onKey(e) {
        if (e.key === '/' && e.target !== search) {
          e.preventDefault();
          search.focus();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          if (search.value) {
            search.value = '';
            search.dispatchEvent(new Event('input'));
          } else B.app.go('home');
        }
      },
    };
  };
})();

</script>
  <script>/* js/ui/session.js */
/*
 * A learning session.
 *  - The queue is the reviews due today, then new cards (optionally one topic), cut to the session
 *    size and shuffled. Reviews come first, so a mastered card never waits past its day (js/core/srs.js).
 *  - A wrong answer shows the correct one and puts the card back at a random later position.
 *  - Only correct answers count as mastered (practice mode never changes mastery).
 *  - opts.level (low | medium | high | mixed) keeps only cards of that difficulty (js/core/level.js);
 *    a card and its easier copy are never in the same session.
 * The 📖 Glossary button (or G) shows the question's words in English and the card's rule.
 * 💡 Help me (or H) gives a hint, step by step (the exercise decides what: a first letter, two wrong
 * options gone, a word placed …). Each hint costs XP; the answer still counts when it is right.
 * Keys: Enter = check / continue, 1–6 = choose, G = Glossary, H = Help me, Esc = quit.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, randInt, pick, wait, pulse, reducedMotion } = B.util;

  const PRAISE = ['Richtig!', 'Super!', 'Sehr gut!', 'Genau!', 'Perfekt!', 'Toll!', 'Klasse!', 'Prima!'];
  const OOPS = ['Not quite', 'Almost!', 'Oops!', 'Not this time'];
  const COMBOS = { 3: '3 in a row!', 5: '5 in a row! +5 XP per card', 10: '10 in a row — unstoppable!', 15: '15 in a row!', 20: '20 in a row — Wahnsinn!', 30: '30 in a row!!' };
  const XP_CORRECT = 10;
  const XP_COMBO = 5; // bonus per card while on a streak of 5+
  const XP_HINT = 3; // each Help me hint costs this much of the card's XP (never below XP_MIN)
  const XP_MIN = 2;

  function buildQueue({ topic, size, practice, level }) {
    const lv = practice ? null : level;
    let list = practice ? shuffle(B.stats.mistakeCards()) : shuffle(B.stats.due(topic, lv)).concat(shuffle(B.stats.fresh(topic, lv)));
    // a card and its easier copy never come in the same session (reviews win: they come first)
    const seen = new Set();
    list = list.filter((c) => {
      const k = B.level.base(c);
      return !seen.has(k) && seen.add(k);
    });
    return shuffle(size ? list.slice(0, size) : list);
  }

  /** ●●●○○○ — a review card's step. */
  function stepDots(lv) {
    return h('span', { class: 'step-dots', 'aria-hidden': 'true' }, '●'.repeat(lv) + '○'.repeat(B.srs.MAX - lv));
  }

  B.ui.session = function (root, opts) {
    const practice = !!opts.practice;
    const queue = buildQueue(opts);
    if (!queue.length) {
      setTimeout(() => {
        B.app.toast(practice ? 'No mistakes to practise 🎉' : 'Nothing left to learn here 🎉');
        B.app.go('home');
      });
      return {};
    }

    const total = queue.length;
    const deckTotal = B.deck.cards.length;
    const level = practice ? 'mixed' : opts.level || 'mixed';
    const reviews = new Set(practice ? [] : queue.filter((c) => B.store.isDone(c.id)).map((c) => c.id));
    const cleared = new Set(); // answered correctly in this session
    const missed = new Set(); // answered wrong at least once in this session
    let idx = 0;
    let combo = 0;
    let bestCombo = 0;
    let xp = 0;
    let answered = 0;
    let correct = 0;
    let mastered = 0;
    let firstTry = 0;
    let card = null;
    let ctrl = null;
    let ready = false;
    let phase = 'answer'; // answer → feedback → (busy) → answer … → done
    let shownAt = 0;
    let comeBackGap = 0;
    let introEl = null;
    let introTimer = 0;
    let hintsUsed = 0; // on the card on screen
    let hintEl = null;
    const startedAt = Date.now();
    B.store.beginSession(practice, { level, size: opts.size || 0, total });

    const doneCount = () => B.deck.cards.reduce((n, c) => n + (B.store.isDone(c.id) ? 1 : 0), 0);

    // --- layout -----------------------------------------------------------------
    const quitBtn = h('button', { class: 'icon-btn quit-btn', type: 'button', 'aria-label': 'Quit session', title: 'Quit (Esc)' }, '✕');
    quitBtn.addEventListener('click', () => quit());
    const fill = h('div', { class: 'progress-fill' });
    const bar = h('div', { class: 'progress', role: 'progressbar', 'aria-label': 'Session progress', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': '0' }, fill);
    const doneNum = h('b', {}, String(doneCount()));
    const totalPill = h('div', { class: 'pill total-pill', title: practice ? 'Practice — mastery is not changed' : 'Cards mastered overall' },
      h('span', { 'aria-hidden': 'true' }, practice ? '🔁' : '⭐'), ' ', doneNum, h('span', { class: 'of' }, '/' + deckTotal));
    const comboEl = h('div', { class: 'combo-flag', 'aria-live': 'polite' });
    const stage = h('main', { class: 's-stage' });
    const skipBtn = h('button', { class: 'btn btn-ghost skip-btn', type: 'button' }, 'I don’t know');
    skipBtn.addEventListener('click', () => check(true));
    const helpBtn = h('button', { class: 'btn btn-outline help-btn', type: 'button', 'aria-label': 'Help me', title: 'A hint, step by step (H) — costs a little XP' },
      h('span', { class: 'help-icon', 'aria-hidden': 'true' }, '💡'), h('span', { class: 'help-btn-label' }, 'Help me'), h('span', { class: 'help-dots', 'aria-hidden': 'true' }));
    helpBtn.addEventListener('click', () => useHint());
    const glossBtn = h('button', { class: 'btn btn-outline gloss-btn', type: 'button', 'aria-label': 'Glossary', title: 'Words and rule (G)' },
      h('span', { 'aria-hidden': 'true' }, '📖'), h('span', { class: 'gloss-btn-label' }, 'Glossary'));
    glossBtn.addEventListener('click', () => openGlossary());
    const mainBtn = h('button', { class: 'btn btn-primary main-btn', type: 'button' }, 'Check');
    mainBtn.addEventListener('click', () => (phase === 'feedback' ? next() : check(false)));
    const feedback = h('div', { class: 'feedback', 'aria-live': 'polite' });
    const foot = h('footer', { class: 's-foot' }, feedback, h('div', { class: 's-foot-inner' }, skipBtn, helpBtn, glossBtn, mainBtn));

    root.append(h('div', { class: 'session' + (practice ? ' is-practice' : '') },
      h('header', { class: 's-top' }, quitBtn, bar, totalPill),
      comboEl,
      stage,
      foot));

    const api = {
      changed(r) {
        if (phase !== 'answer') return;
        ready = !!r;
        mainBtn.disabled = !ready;
      },
      submit() {
        if (ready) check(false);
      },
      sfx: (name) => B.audio.play(name),
      speak: (text) => B.audio.speak(text),
      /** Speak a German word the learner just picked (a choice, chip or tile) — only with sound on. */
      say(text) {
        if (text && B.store.setting('sound')) B.audio.speak(show(text));
      },
      get card() {
        return card;
      },
    };

    // --- flow ------------------------------------------------------------------------
    function showCard(animate) {
      B.gloss.hideTip();
      card = queue[idx];
      const def = B.ex.get(card.type);
      const topic = B.deck.topicMap[card.topic];
      const prev = B.store.cardState(card.id);
      const tag = missed.has(card.id)
        ? h('span', { class: 'again-tag' }, '↻ Try again')
        : reviews.has(card.id)
          ? h('span', { class: 'again-tag is-review', title: `Review · step ${prev.lv || 1} of ${B.srs.MAX}` }, '🔁 Review ', stepDots(prev.lv || 1))
          : prev && prev.w
            ? h('span', { class: 'again-tag old' }, '↻ Missed before')
            : null;
      const exRoot = h('div', { class: 'ex ex-' + card.type });
      const lv = B.level.of(card);
      hintEl = h('div', { class: 'hint-note', 'aria-live': 'polite', hidden: true });
      const wrap = h('div', { class: 's-card' + (animate ? ' enter' : '') },
        h('div', { class: 'card-meta' },
          h('span', { class: 'topic-tag' }, h('span', { 'aria-hidden': 'true' }, topic.icon + ' '), topic.name),
          h('span', { class: 'level-tag lv-' + lv, title: 'Difficulty' }, B.level.name(lv)),
          tag),
        exRoot,
        hintEl);
      // Drop the entrance class once it has played, otherwise removing a later
      // .shake would let card-in run a second time.
      if (animate) {
        wrap.addEventListener('animationend', function done(e) {
          if (e.target !== wrap) return;
          wrap.classList.remove('enter');
          wrap.removeEventListener('animationend', done);
        });
      }
      ready = false;
      phase = 'answer';
      hintsUsed = 0;
      setFooter('check');
      stage.replaceChildren(wrap);
      stage.scrollTop = 0;
      try {
        ctrl = def.render(card, exRoot, api);
      } catch (err) {
        // A broken card must never block the session: log it and move on.
        console.error('[Brezel] card failed to render', card.id, err);
        queue.splice(idx, 1);
        if (idx >= queue.length) return finish(false);
        return showCard(animate);
      }
      shownAt = performance.now();
      paintHelp();
      if (!introEl) focusCard();
    }

    // --- 💡 Help me ------------------------------------------------------------------------------
    const hintMax = () => (ctrl && ctrl.hint && ctrl.hints ? ctrl.hints : 0);

    function paintHelp() {
      const max = hintMax();
      const left = Math.max(0, max - hintsUsed);
      helpBtn.disabled = !left;
      helpBtn.title = !max ? 'No hints for this kind of card' : left ? `A hint, step by step (H) — ${left} left, each costs ${XP_HINT} XP` : 'No more hints for this card';
      helpBtn.querySelector('.help-dots').textContent = max > 1 ? '●'.repeat(left) + '○'.repeat(max - left) : '';
    }

    function useHint() {
      if (phase !== 'answer' || introEl || hintsUsed >= hintMax()) return;
      let res = null;
      try {
        res = ctrl.hint(hintsUsed + 1);
      } catch (err) {
        console.error('[Brezel] hint failed', card.id, err);
      }
      if (!res) {
        hintsUsed = hintMax();
        return paintHelp();
      }
      hintsUsed++;
      B.audio.play('tap');
      if (res.note || res.html) {
        hintEl.hidden = false;
        // res.html: markup built by the exercise itself (already escaped)
        hintEl.replaceChildren(h('span', { class: 'hint-icon', 'aria-hidden': 'true' }, '💡'), h('span', { html: res.html || md(res.note) }));
        pulse(hintEl, 'reveal');
      }
      paintHelp();
      if (B.achievements) B.achievements.evaluate();
      focusCard();
    }

    function focusCard() {
      if (ctrl && ctrl.focus) ctrl.focus();
      else if (document.activeElement && document.activeElement !== document.body && !stage.contains(document.activeElement)) document.activeElement.blur();
    }

    function openGlossary() {
      if (phase !== 'answer' || introEl) return;
      B.glossary.open(card, ctrl && ctrl.glossTexts ? ctrl.glossTexts() : B.ex.questionTexts(card));
    }

    function check(skipped) {
      if (phase !== 'answer' || introEl) return;
      if (!skipped && !ready) return;
      phase = 'feedback';
      B.gloss.hideTip();
      const ms = performance.now() - shownAt;
      let res = ctrl.check() || { ok: false };
      if (skipped) res = { ok: false, given: '', skipped: true };
      try {
        ctrl.lock(res);
      } catch (err) {
        console.error('[Brezel] lock failed', card.id, err);
      }
      const ok = !!res.ok;
      const firstSeen = !cleared.has(card.id) && !missed.has(card.id);
      answered++;
      let gained = 0;
      if (ok) {
        correct++;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        gained = Math.max(XP_MIN, XP_CORRECT - hintsUsed * XP_HINT) + (combo >= 5 ? XP_COMBO : 0);
        cleared.add(card.id);
        if (firstSeen) firstTry++;
      } else {
        combo = 0;
        missed.add(card.id);
        requeue();
      }
      xp += gained;
      const { newlyDone, due } = B.store.record(card, ok, res.skipped ? '(skipped)' : res.given, ms, { practice, xp: gained, hints: hintsUsed, skipped: !!res.skipped });
      if (newlyDone) {
        mastered++;
        doneNum.textContent = String(doneCount());
        pulse(totalPill, 'bump');
      }
      B.store.setBestCombo(bestCombo);
      paintProgress();
      B.audio.play(ok ? 'correct' : 'wrong');
      if (ok && COMBOS[combo]) showCombo(combo);
      if (!ok) pulse(stage.firstElementChild, 'shake');
      renderFeedback(res, ok, gained, due);
      setFooter(ok ? 'good' : 'bad');
      if (B.achievements) B.achievements.evaluate();
    }

    /** Wrong → back into the pile, at a random later spot (at least two cards later when possible). */
    function requeue() {
      const rest = queue.length - (idx + 1);
      const pos = randInt(idx + 1 + Math.min(2, rest), queue.length);
      queue.splice(pos, 0, card);
      comeBackGap = pos - idx - 1;
    }

    function paintProgress() {
      const p = (cleared.size / total) * 100;
      fill.style.width = p + '%';
      bar.setAttribute('aria-valuenow', String(cleared.size));
      bar.classList.toggle('has-progress', cleared.size > 0);
    }

    function showCombo(n) {
      comboEl.textContent = '🔥 ' + COMBOS[n];
      pulse(comboEl, 'show');
      setTimeout(() => B.audio.play('combo'), 260);
    }

    function renderFeedback(res, ok, gained, due) {
      let sol = null;
      try {
        sol = ctrl.solution ? ctrl.solution() : null;
      } catch (err) {
        console.error('[Brezel] solution failed', card.id, err);
      }
      const say = sol && sol.say;
      const title = ok ? (res.typo ? 'Correct — small typo' : pick(PRAISE)) : res.skipped ? 'Here’s the answer' : pick(OOPS);
      const speak = say && B.audio.canSpeak
        ? h('button', { class: 'speak-btn fb-speak', type: 'button', 'aria-label': 'Listen to the answer', title: 'Listen' }, '🔊')
        : null;
      if (speak) speak.addEventListener('click', () => B.audio.speak(say));

      const body = [];
      if (!ok && sol) body.push(h('div', { class: 'fb-label' }, 'Correct answer:'), h('div', { class: 'fb-answer', html: sol.html }));
      if (!ok && res.given && !res.skipped) {
        body.push(h('div', { class: 'fb-given' }, h('span', { class: 'fb-given-label' }, 'You answered: '), h('span', { class: 'fb-given-text' }, show(res.given))));
      }
      if (res.note) body.push(h('div', { class: 'fb-note', html: md(res.note) }));
      if (card.explain) body.push(h('div', { class: 'fb-explain' }, h('span', { class: 'fb-why' }, 'Why? '), h('span', { html: md(card.explain) })));
      if (ok && due != null) body.push(h('div', { class: 'fb-next' }, `📅 This card comes back ${B.srs.when(due, B.srs.day())} for a review.`));
      if (!ok) {
        body.push(h('div', { class: 'fb-again' }, comeBackGap === 0
          ? '↻ This card comes straight back — try it again.'
          : '↻ This card goes back into the pile — you’ll see it again later.'));
      }

      feedback.replaceChildren(h('div', { class: 'fb-inner' },
        h('div', { class: 'fb-head' },
          h('span', { class: 'fb-icon', 'aria-hidden': 'true' }, ok ? '✓' : '✗'),
          h('h3', { class: 'fb-title' }, title),
          gained ? h('span', { class: 'fb-xp', title: hintsUsed ? `${hintsUsed} hint${hintsUsed > 1 ? 's' : ''} used` : null }, `+${gained} XP` + (hintsUsed ? ' · 💡' + hintsUsed : '')) : null,
          speak),
        h('div', { class: 'fb-body' }, body)));
    }

    function setFooter(mode) {
      foot.classList.remove('is-good', 'is-bad', 'has-feedback');
      if (mode === 'check') {
        feedback.replaceChildren();
        mainBtn.textContent = 'Check';
        mainBtn.className = 'btn btn-primary main-btn';
        mainBtn.disabled = !ready;
        skipBtn.hidden = false;
        helpBtn.hidden = false;
        glossBtn.hidden = false;
        return;
      }
      foot.classList.add('has-feedback', mode === 'good' ? 'is-good' : 'is-bad');
      mainBtn.textContent = 'Continue';
      mainBtn.className = 'btn main-btn ' + (mode === 'good' ? 'btn-primary' : 'btn-danger');
      mainBtn.disabled = false;
      skipBtn.hidden = true;
      helpBtn.hidden = true;
      glossBtn.hidden = true;
      mainBtn.focus({ preventScroll: true });
    }

    async function next() {
      if (phase !== 'feedback') return;
      phase = 'busy';
      B.charts && B.charts.hideTip();
      idx++;
      if (idx >= queue.length) return finish(false);
      const old = stage.firstElementChild;
      if (old && !reducedMotion()) {
        old.classList.add('leave');
        foot.classList.add('leaving');
        await wait(170);
        foot.classList.remove('leaving');
      }
      if (phase === 'busy') showCard(true);
    }

    function finish(quitEarly) {
      if (phase === 'done') return;
      phase = 'done';
      B.store.endSession({ bestCombo, quit: !!quitEarly, fixed: practice ? cleared.size : 0 });
      if (B.achievements) B.achievements.evaluate();
      B.app.go('summary', {
        practice,
        opts,
        total,
        answered,
        correct,
        wrong: answered - correct,
        firstTry,
        reviewed: [...reviews].filter((id) => cleared.has(id)).length,
        cleared: cleared.size,
        missed: [...missed],
        mastered,
        xp,
        bestCombo,
        ms: Date.now() - startedAt,
        quit: !!quitEarly,
        level,
      });
    }

    async function quit() {
      if (phase === 'done') return;
      if (!answered) {
        phase = 'done';
        B.store.endSession();
        B.app.go('home');
        return;
      }
      const yes = await B.app.confirm({
        title: 'Quit this session?',
        text: 'Everything you answered is saved. Cards you haven’t got right yet stay in the pile for next time.',
        ok: 'Quit',
        cancel: 'Keep learning',
      });
      if (yes) finish(true);
    }

    // --- intro: "23 / 300" ------------------------------------------------------------
    function intro() {
      const done = doneCount();
      const topicName = opts.topic && opts.topic !== 'all' && B.deck.topicMap[opts.topic] ? ' · ' + B.deck.topicMap[opts.topic].name : '';
      const num = h('span', { class: 'intro-done' }, reducedMotion() ? String(done) : '0');
      const barFill = h('span', { class: 'intro-fill' });
      introEl = h('div', { class: 'intro', role: 'dialog', 'aria-label': `${done} of ${deckTotal} cards mastered` },
        h('div', { class: 'intro-inner' },
          h('div', { class: 'intro-mascot', 'aria-hidden': 'true' }, '🥨'),
          h('div', { class: 'intro-count' }, num, h('span', { class: 'intro-total' }, ' / ' + deckTotal)),
          h('div', { class: 'intro-label' }, 'cards mastered so far'),
          h('div', { class: 'intro-bar', 'aria-hidden': 'true' }, barFill),
          h('div', { class: 'intro-session' }, practice
            ? `Practising ${total} card${total === 1 ? '' : 's'} you got wrong before`
            : `This session: ${total} card${total === 1 ? '' : 's'}${reviews.size ? ` (${reviews.size} to review)` : ''}${topicName}` + (level !== 'mixed' ? ` · ${B.level.SETTINGS.find((x) => x.key === level).name}` : '')),
          h('div', { class: 'intro-tap' }, 'Tap anywhere to start')));
      introEl.addEventListener('click', dismissIntro);
      root.append(introEl);

      requestAnimationFrame(() => requestAnimationFrame(() => (barFill.style.width = (done / deckTotal) * 100 + '%')));
      if (!reducedMotion() && done > 0) {
        const t0 = performance.now();
        const step = (t) => {
          if (!introEl) return;
          const k = Math.min(1, (t - t0) / 900);
          num.textContent = String(Math.round(done * (1 - Math.pow(1 - k, 3))));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      introTimer = setTimeout(dismissIntro, 2600);
    }

    function dismissIntro() {
      if (!introEl) return;
      clearTimeout(introTimer);
      const el = introEl;
      introEl = null;
      el.classList.add('out');
      setTimeout(() => el.remove(), 260);
      focusCard();
    }

    // --- start ---------------------------------------------------------------------------
    showCard(false);
    paintProgress();
    intro();

    return {
      onKey(e) {
        if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
        if (introEl) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
            e.preventDefault();
            dismissIntro();
          }
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          if (B.gloss.tipOpen()) B.gloss.hideTip();
          else quit();
          return;
        }
        if (e.key === 'Enter' && e.repeat) {
          e.preventDefault();
          return;
        }
        if (phase === 'feedback') {
          if (e.key === 'Enter') {
            e.preventDefault();
            next();
          }
          return;
        }
        if (phase !== 'answer') return;
        if ((e.key === 'g' || e.key === 'G') && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
          e.preventDefault();
          openGlossary();
          return;
        }
        if ((e.key === 'h' || e.key === 'H') && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
          e.preventDefault();
          useHint();
          return;
        }
        if (ctrl && ctrl.key && ctrl.key(e)) {
          e.preventDefault();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          check(false);
        }
      },
      onBack: () => (introEl ? dismissIntro() : quit()),
      destroy() {
        clearTimeout(introTimer);
        B.gloss.hideTip();
        if (B.audio.canSpeak) window.speechSynthesis.cancel();
      },
    };
  };
})();

</script>
  <script>/* js/ui/summary.js */
/* End-of-session summary: XP, accuracy, time, newly mastered and reviewed cards, and the cards that were missed. */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, pct, fmtDuration } = B.util;

  function tile(icon, value, label, cls) {
    return h('div', { class: 'stat-tile ' + (cls || '') },
      h('div', { class: 'stat-icon', 'aria-hidden': 'true' }, icon),
      h('div', { class: 'stat-value' }, value),
      h('div', { class: 'stat-label' }, label));
  }

  /** Question + answer of a card for lists (summary and review). */
  function cardLine(card, extra) {
    const d = B.ex.get(card.type).describe(card);
    const topic = B.deck.topicMap[card.topic];
    const showPrompt = card.prompt && d.q !== card.prompt;
    return h('li', { class: 'miss-item' },
      h('div', { class: 'miss-top' },
        h('span', { class: 'topic-tag' }, h('span', { 'aria-hidden': 'true' }, topic.icon + ' '), topic.name),
        h('span', { class: 'type-tag' }, B.ex.label(card.type)),
        extra && extra.count ? h('span', { class: 'miss-count', title: 'Times answered wrong' }, `✗ ${extra.count}×`) : null,
        extra && extra.done != null ? h('span', { class: 'miss-state ' + (extra.done ? 'ok' : 'todo') }, extra.done ? '✓ mastered' : '… not yet') : null),
      showPrompt ? h('div', { class: 'miss-prompt', html: md(card.prompt) }) : null,
      h('div', { class: 'miss-q', html: B.ex.richText(d.q) }),
      extra && extra.given ? h('div', { class: 'miss-given' }, h('span', { class: 'miss-k' }, 'You wrote: '), h('s', {}, show(extra.given))) : null,
      h('div', { class: 'miss-a' }, h('span', { class: 'miss-k' }, 'Answer: '), h('span', { html: md(d.a) })),
      card.explain ? h('div', { class: 'miss-why', html: md(card.explain) }) : null);
  }

  B.ui.cardLine = cardLine;
  B.ui.tile = tile;

  B.ui.summary = function (root, r) {
    const ov = B.stats.overview();
    const acc = pct(r.correct, r.answered);
    const complete = ov.complete && !r.practice;
    const title = complete
      ? `You mastered all ${ov.total} cards!`
      : r.quit
        ? 'Session saved'
        : acc >= 90
          ? 'Ausgezeichnet!'
          : acc >= 70
            ? 'Gut gemacht!'
            : 'Session complete!';
    const subtitle = complete
      ? 'Wunderbar! Your detailed review with charts is ready.'
      : r.practice
        ? `You practised ${r.total} card${r.total === 1 ? '' : 's'} you had got wrong before.`
        : `You mastered ${r.mastered} new card${r.mastered === 1 ? '' : 's'}` +
          (r.reviewed ? ` and reviewed ${r.reviewed}` : '') +
          (r.quit ? ' before stopping.' : '.');

    const tiles = h('div', { class: 'stat-grid' },
      tile('⚡', '+' + r.xp, 'XP earned', 't-xp'),
      tile('🎯', acc + '%', `accuracy (${r.correct}/${r.answered})`, 't-acc'),
      tile('⏱️', fmtDuration(r.ms), 'time', 't-time'),
      tile(r.practice ? '🔁' : '⭐', r.practice ? String(r.cleared) : '+' + r.mastered, r.practice ? 'fixed' : 'mastered', 't-new'));

    const overall = h('div', { class: 'card overall' },
      h('div', { class: 'overall-row' }, h('b', {}, 'Overall'), h('span', {}, h('b', {}, String(ov.done)), ` / ${ov.total} mastered`)),
      h('div', { class: 'progress big', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(ov.total), 'aria-valuenow': String(ov.done), 'aria-label': 'Overall progress' },
        h('div', { class: 'progress-fill', style: { width: pct(ov.done, ov.total) + '%' } })),
      h('p', { class: 'muted small' }, (complete ? 'Every card is mastered' : `${ov.total - ov.done} cards left`) +
        (ov.due ? ` · ${ov.due} to review today` : '') +
        (r.bestCombo >= 3 ? ` · best combo this session: 🔥 ${r.bestCombo}` : '')));

    const missedCards = r.missed.map((id) => B.deck.cardMap[id]).filter(Boolean);
    const missedList = missedCards.length
      ? h('section', { class: 'card missed' },
        h('h2', { class: 'section-title' }, `Cards you missed (${missedCards.length})`),
        h('p', { class: 'muted small' }, r.practice
          ? 'Practice doesn’t change your progress — it’s just extra training.'
          : r.quit
            ? 'Cards marked “not yet” stay in the pile for your next session.'
            : 'Each one went back into the pile until you got it right. They stay in your review, so you can practise them again.'),
        h('ul', { class: 'miss-list' }, missedCards.map((c) => {
          const s = B.store.cardState(c.id);
          return cardLine(c, { done: B.store.isDone(c.id), given: !r.practice && s ? s.lw : null });
        })))
      : r.answered
        ? h('section', { class: 'card perfect' }, h('span', { 'aria-hidden': 'true' }, '💯 '), 'No mistakes this session!')
        : null;

    const primary = h('button', { class: 'btn btn-primary btn-big', type: 'button' }, complete ? 'See my detailed review' : 'Continue');
    primary.addEventListener('click', () => B.app.go(complete ? 'review' : 'home'));
    const pendingLeft = r.practice ? B.stats.mistakeCards().length : B.stats.pending(r.opts.topic, r.opts.level).length;
    const again = !complete && pendingLeft
      ? h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '▶ '), r.practice ? 'Practise again' : 'Keep going')
      : null;
    if (again) again.addEventListener('click', () => B.app.go('session', r.opts));
    const report = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '📊 '), 'Progress report');
    report.addEventListener('click', () => B.app.go('review'));

    root.append(h('main', { class: 'summary' },
      h('div', { class: 'summary-hero' },
        h('div', { class: 'summary-mascot' + (complete ? ' big' : ''), 'aria-hidden': 'true' }, complete ? '🏆' : acc >= 70 ? '🥨' : '💪'),
        h('h1', {}, title),
        h('p', { class: 'muted' }, subtitle)),
      tiles,
      overall,
      missedList,
      h('div', { class: 'summary-actions' }, primary, h('div', { class: 'home-links' }, again, complete ? null : report))));

    B.audio.play('complete');
    if (!r.quit && (acc >= 60 || complete)) setTimeout(() => B.app.confetti(complete ? 200 : 110), 150);
    primary.focus({ preventScroll: true });

    return {
      onKey(e) {
        if (e.key === 'Enter' && (e.target === document.body || e.target === primary)) {
          e.preventDefault();
          primary.click();
        }
      },
    };
  };
})();

  <script>/* js/ui/review.js */
/*
 * Detailed review: strong and weak areas with charts and numbers.

(function () {

  const B = window.Brezel;

  const SERIES = [

  function dateLabel(t) {
    try {
      return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

    }
  }

  B.ui.review = function (root) {

    const topics = B.stats.byTopic();
    const types = B.stats.byType();

    const back = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Back to home' }, '←');

    root.append(top, main);

    if (!ov.attempted) {
      const go = h('button', { class: 'btn btn-primary btn-big', type: 'button' }, 'Start learning');
      go.addEventListener('click', () => B.app.go('session', { topic: 'all', size: B.store.setting('size') }));
      main.append(h('section', { class: 'card empty-state' },
        h('div', { class: 'empty-mascot', 'aria-hidden': 'true' }, '🥨'),
        h('h2', {}, 'No answers yet'),
        h('p', { class: 'muted' }, 'Answer a few cards and your strengths and weak spots will show up here.'),
        go));
      return {};
    }

    // --- hero: first-try accuracy -----------------------------------------------------
    const heroStatus = B.ui.statusBadge(ov.status);
    main.append(h('section', { class: 'card review-hero' },
      ov.complete
        ? h('p', { class: 'banner' }, h('span', { 'aria-hidden': 'true' }, '🎉 '), `All ${ov.total} cards mastered — here’s how it went.`)
        : h('p', { class: 'banner soft' }, `You’ve mastered ${ov.done} of ${ov.total} cards. The report fills in as you go — the full review is ready when you finish the deck.`),
      h('div', { class: 'hero-num' },
        h('span', { class: 'hero-big' }, ov.firstPct + '%'),
        h('span', { class: 'hero-cap' }, 'right on the first try')),
      B.charts.meter(ov.firstPct, 'First-try accuracy'),
      h('div', { class: 'hero-foot' },
        heroStatus,
        h('span', { class: 'muted small' }, `${ov.first} of ${ov.attempted} cards answered correctly the first time you saw them`))));

    // --- KPI tiles -------------------------------------------------------------------------
    const tile = B.ui.tile;
    main.append(h('div', { class: 'stat-grid six' },
      tile('⭐', `${ov.done}/${ov.total}`, 'cards mastered'),
      tile('✍️', String(ov.answers), 'answers given'),
      tile('✗', String(ov.wrong), 'mistakes', ov.wrong ? 't-bad' : ''),
      tile('⏱️', fmtDuration(ov.timeMs), 'time practising'),
      tile('📅', String(ov.sessions), ov.sessions === 1 ? 'session' : 'sessions'),
      tile('🔥', String(ov.bestCombo), 'best combo')));

    // --- strengths & weak spots ----------------------------------------------------------------
    const judged = topics.filter((t) => t.status.key !== 'none');
    const strong = judged.filter((t) => t.status.key === 'good').sort((a, b) => b.firstPct - a.firstPct);
    const weak = judged.filter((t) => t.status.key !== 'good').sort((a, b) => a.firstPct - b.firstPct);
    const areaItem = (t) => h('li', { class: 'area-item' },
      h('span', { class: 'area-icon', 'aria-hidden': 'true' }, t.topic.icon),
      h('span', { class: 'area-name' }, t.topic.name),

    const noneYet = (txt) => h('p', { class: 'muted small' }, txt);
    main.append(h('div', { class: 'areas' },

        strong.length ? h('ul', { class: 'area-list' }, strong.map(areaItem)) : noneYet(`No topic is at ${B.stats.STRONG}%+ first-try accuracy yet — keep going!`)),
      h('section', { class: 'card area weak' },

    // --- memory: spaced repetition ------------------------------------------------------------------
    if (ov.done) {
      const mem = B.stats.memory(7);

          tile('🔁', String(ov.due), 'to review today', ov.due ? 't-due' : ''),

      const max = Math.max(1, ...mem.ahead.map((d) => d.count));
      const dayName = (d, i) => (i === 0 ? 'Today' : i === 1 ? 'Tomorrow'

    // --- chart: mastery by topic ------------------------------------------------------------------

    }));

    // --- chart: by exercise type ------------------------------------------------------------------------
    const typeRows = types
      .filter((t) => t.attempted)
      .sort((a, b) => a.firstPct - b.firstPct)

        label: t.label,
        value: t.firstPct,

    // --- chart: accuracy per session -------------------------------------------------------------------------

        table: {

          rows: sessions.map((s, i) => [`#${i + 1}${s.practice ? ' (practice)' : ''}`, dateLabel(s.start), s.answered, s.correct, s.wrong, s.accuracy + '%']),
        },

    }

    // --- most missed cards ---------------------------------------------------------------------------------------
    if (missed.length) {
      main.append(h('section', { class: 'card missed' },
        h('h2', { class: 'section-title' }, h('span', { 'aria-hidden': 'true' }, '🧐 '), 'Your most-missed cards'),
        h('p', { class: 'muted small' }, 'With what you wrote last time and the correct answer.'),
        h('ol', { class: 'miss-list' }, missed.map(({ card, state }) => B.ui.cardLine(card, { count: state.w, given: state.lw, done: state.done })))));

    // --- rule reminders for weak topics (Rules has no tip of its own: its cards' topics do) -------------------------

          h('h3', {}, h('span', { 'aria-hidden': 'true' }, t.topic.icon + ' '), t.topic.name, h('span', { class: 'muted' }, ' · ' + t.topic.de)),

    // --- actions -----------------------------------------------------------------------------------------------------
    const mistakes = ov.mistakes;
    const practise = h('button', { class: 'btn btn-primary btn-big', type: 'button', disabled: !mistakes }, mistakes ? `Practise my ${mistakes} mistake${mistakes === 1 ? '' : 's'}` : 'No mistakes to practise');
    practise.addEventListener('click', () => B.app.go('session', { practice: true, size: B.store.setting('size') }));

  <script>/* js/ui/arcade.js */
/*
 * The game screen. "Start Gaming" on the home screen opens it with { topic, level } (level =
 * the difficulty setting: low | medium | high | mixed). It plays the topic's games in a shuffled
 * rotation: intro → 3-2-1 → game → results → "Another game?".
 * The frame around a game (score, combo, lives, timer, results) lives here; the games themselves
 * are plugins in js/games/ (contract: js/games/engine.js).
 * Game time only runs while the page is visible, so switching apps pauses the game.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, pulse, reducedMotion } = B.util;

  const LEVELS = { 1: 'Low', 2: 'Medium', 3: 'High' };
  const SETTING_LEVEL = { low: 1, medium: 2, high: 3 };
  const COMBO_AT = { 5: '5 in a row! ×2', 10: '10 in a row! ×3', 15: '15 in a row!', 20: '20 in a row — Wahnsinn!', 30: '30 in a row!!' };
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';

  function levelFor(setting) {
    return SETTING_LEVEL[setting] || 1 + Math.floor(Math.random() * 3);
  }

  function bestScore(id, level) {
    return (B.store.state.games || []).filter((g) => g.game === id && g.level === level).reduce((m, g) => Math.max(m, g.score || 0), 0);
  }

  function artOf(def, big) {
    return def.art
      ? h('div', { class: 'g-art' + (big ? ' big' : ''), html: def.art, 'aria-hidden': 'true' })
      : h('div', { class: 'g-art g-art-emoji' + (big ? ' big' : ''), 'aria-hidden': 'true' }, def.icon || '🎮');
  }

  B.ui.arcade = function (root, opts) {
    const topic = opts.topic || 'all';
    const setting = opts.level || 'mixed';
    const available = B.games.forTopic(topic, SETTING_LEVEL[setting] || 2);
    if (!available.length) {
      setTimeout(() => {
        B.app.toast('Sorry, there are no games for this topic yet.');
        B.app.go('home');
      });
      return {};
    }
    const topicName = topic === 'all' ? 'All topics' : (B.deck.topicMap[topic] || {}).name || topic;

    // shuffled rotation; a requested game goes first
    let rotation = shuffle(available);
    if (opts.game) {
      const i = rotation.findIndex((g) => g.id === opts.game);
      if (i > 0) rotation.unshift(rotation.splice(i, 1)[0]);
    }
    let gi = 0;
    let run = null; // the game being played
    let overlay = null; // intro or results
    let overlayKey = null;

    const shell = h('div', { class: 'arcade' });
    root.append(shell);

    let pending = null; // the next rotation, once the current one is used up
    /** The game "Another game?" offers, without moving on yet. */
    function peekNext() {
      if (gi + 1 < rotation.length) return rotation[gi + 1];
      if (!pending) {
        const last = rotation[rotation.length - 1];
        pending = shuffle(available);
        if (pending.length > 1 && pending[0] === last) pending.push(pending.shift());
      }
      return pending[0];
    }
    function nextDef() {
      const def = peekNext();
      if (gi + 1 < rotation.length) gi++;
      else {
        rotation = pending;
        pending = null;
        gi = 0;
      }
      return def;
    }

    function setOverlay(el, onKey) {
      if (overlay) overlay.remove();
      overlay = el;
      overlayKey = onKey || null;
      if (el) shell.append(el);
    }

    // --- intro ---------------------------------------------------------------------------
    function intro(def) {
      if (run) run.stop();
      run = null;
      const level = levelFor(setting);
      shell.replaceChildren();
      shell.style.setProperty('--g', def.color || 'var(--blue)');
      shell.className = 'arcade is-intro';
      const go = h('button', { type: 'button', class: 'btn btn-primary btn-big g-go' }, 'Los geht’s!');
      go.addEventListener('click', () => start(def, level));
      const other = available.length > 1 ? h('button', { type: 'button', class: 'link-btn g-other' }, 'Play a different game →') : null;
      if (other) other.addEventListener('click', () => intro(nextDef()));
      const back = h('button', { type: 'button', class: 'icon-btn g-x', 'aria-label': 'Back home', title: 'Back (Esc)' }, '✕');
      back.addEventListener('click', () => B.app.go('home'));
      const best = bestScore(def.id, level);
      const card = h('div', { class: 'g-intro', role: 'dialog', 'aria-label': def.name },
        back,
        artOf(def, true),
        h('h1', { class: 'g-intro-name' }, def.name),
        h('p', { class: 'g-intro-blurb', html: md(def.blurb || '') }),
        h('div', { class: 'g-intro-tags' },
          h('span', { class: 'g-tag' }, topicName),
          h('span', { class: 'g-tag g-lv g-lv-' + level }, LEVELS[level] + (setting === 'mixed' ? ' · mixed' : '')),
          best ? h('span', { class: 'g-tag' }, '🏆 Best ' + best) : null),
        def.how && def.how.length ? h('ul', { class: 'g-how' }, def.how.map((x) => h('li', { html: md(x) }))) : null,
        go,
        other);
      setOverlay(h('div', { class: 'g-intro-wrap' }, card), (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          go.click();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          B.app.go('home');
        }
      });
      go.focus({ preventScroll: true });
    }

    // --- one game ----------------------------------------------------------------------------
    function start(def, level) {
      setOverlay(null);
      shell.replaceChildren();
      shell.className = 'arcade is-playing';

      const time = B.games.value(def.time, level) || 0;
      const maxLives = B.games.value(def.lives, level) || 0;
      const state = { score: 0, combo: 0, bestCombo: 0, correct: 0, wrong: 0, lives: maxLives, ended: false, started: false, mistakes: [], gt: 0, timeLeft: time };

      // frame
      const quitBtn = h('button', { type: 'button', class: 'icon-btn g-x', 'aria-label': 'Quit game', title: 'Quit (Esc)' }, '✕');
      quitBtn.addEventListener('click', () => quit());
      const scoreEl = h('b', {}, '0');
      const scorePill = h('div', { class: 'pill g-score', title: 'Score' }, h('span', { 'aria-hidden': 'true' }, '⭐'), ' ', scoreEl);
      const livesEl = maxLives ? h('div', { class: 'g-lives', 'aria-label': `${maxLives} lives` }) : null;
      const paintLives = () => {
        if (!livesEl) return;
        livesEl.replaceChildren(...Array.from({ length: maxLives }, (_, i) => h('span', { class: 'g-heart' + (i < state.lives ? '' : ' lost'), html: HEART })));
        livesEl.setAttribute('aria-label', `${state.lives} of ${maxLives} lives left`);
      };
      paintLives();
      const timerFill = h('span', {});
      const timerText = h('span', { class: 'g-time-text' });
      const bar = h('div', { class: 'g-bar' + (time ? '' : ' is-rounds') }, h('div', { class: 'g-timer' }, timerFill), timerText);
      const comboEl = h('div', { class: 'g-combo', 'aria-live': 'polite' });
      const stage = h('main', { class: 'g-stage' });
      shell.append(
        h('header', { class: 'g-top' },
          quitBtn,
          h('div', { class: 'g-name' }, h('span', { 'aria-hidden': 'true' }, def.icon || '🎮'), h('span', { class: 'g-name-text' }, def.name)),
          h('span', { class: 'g-tag g-lv g-lv-' + level }, LEVELS[level]),
          livesEl,
          scorePill),
        bar,
        comboEl,
        stage);

      // --- game clock: one rAF loop drives every timer, and stops while the page is hidden ----
      const tasks = []; // { at, fn, every? }
      const frames = new Set();
      const waits = new Set();
      let raf = 0;
      let lastT = 0;
      let lastTick = Math.ceil(time);

      function loop(t) {
        raf = requestAnimationFrame(loop);
        const dt = lastT ? Math.max(0, Math.min(100, t - lastT)) : 16;
        lastT = t;
        if (document.hidden || !state.started || state.ended) return;
        state.gt += dt;
        if (time) {
          state.timeLeft = Math.max(0, time - state.gt / 1000);
          timerFill.style.width = (state.timeLeft / time) * 100 + '%';
          const secs = Math.ceil(state.timeLeft);
          timerText.textContent = secs + ' s';
          bar.classList.toggle('low', state.timeLeft <= 10);
          if (secs < lastTick) {
            lastTick = secs;
            if (secs <= 5 && secs > 0) B.audio.play('tick');
          }
          if (state.timeLeft <= 0) {
            if (!state.timeUp) {
              // once only: a game's timeUp() may finish its last move before calling api.end()
              state.timeUp = true;
              if (ctrl && ctrl.timeUp) ctrl.timeUp();
              else api.end({ note: 'Time’s up!' });
            }
            return;
          }
        }
        for (const fn of Array.from(frames)) {
          if (state.ended) return;
          let keep;
          try {
            keep = fn(dt, state.gt);
          } catch (err) {
            console.error('[Brezel] game frame failed', def.id, err);
            keep = false;
          }
          if (keep === false) frames.delete(fn);
        }
        for (let i = 0; i < tasks.length; i++) {
          const task = tasks[i];
          if (state.ended) return;
          if (task.at > state.gt) continue;
          if (task.every) task.at += task.every;
          else tasks.splice(i--, 1);
          try {
            task.fn();
          } catch (err) {
            console.error('[Brezel] game timer failed', def.id, err);
          }
        }
      }

      function stopClock() {
        cancelAnimationFrame(raf);
        tasks.length = 0;
        frames.clear();
        for (const r of waits) r(false);
        waits.clear();
      }

      // --- the api handed to the game -----------------------------------------------------------
      function floatAt(el, text, cls) {
        const box = shell.getBoundingClientRect();
        const r = (el && el.isConnected ? el : scorePill).getBoundingClientRect();
        const f = h('div', { class: 'g-float ' + (cls || ''), 'aria-hidden': 'true' }, text);
        f.style.left = r.left - box.left + r.width / 2 + 'px';
        f.style.top = r.top - box.top + r.height / 2 + 'px';
        shell.append(f);
        setTimeout(() => f.remove(), 950);
      }

      const api = {
        topic,
        level,
        get ended() {
          return state.ended;
        },
        get score() {
          return state.score;
        },
        get combo() {
          return state.combo;
        },
        get lives() {
          return state.lives;
        },
        get timeLeft() {
          return state.timeLeft;
        },
        hit({ points = 10, el = null, text = null } = {}) {
          if (state.ended) return 0;
          state.correct++;
          state.combo++;
          state.bestCombo = Math.max(state.bestCombo, state.combo);
          const mult = state.combo >= 10 ? 3 : state.combo >= 5 ? 2 : 1;
          const pts = Math.round(points * mult);
          state.score += pts;
          scoreEl.textContent = String(state.score);
          pulse(scorePill, 'bump');
          floatAt(el, text || '+' + pts, 'good');
          B.audio.play('correct');
          if (COMBO_AT[state.combo]) {
            comboEl.textContent = '🔥 ' + COMBO_AT[state.combo];
            pulse(comboEl, 'show');
            setTimeout(() => B.audio.play('combo'), 200);
          }
          return pts;
        },
        miss({ q = null, a = null, given = null, el = null } = {}) {
          if (state.ended) return;
          state.wrong++;
          state.combo = 0;
          if (q || a) state.mistakes.push({ q, a, given });
          B.audio.play('wrong');
          floatAt(el, '✗', 'bad');
          pulse(el && el.isConnected ? el : stage, 'g-shake');
          if (maxLives) {
            state.lives = Math.max(0, state.lives - 1);
            paintLives();
            if (livesEl) pulse(livesEl, 'g-shake');
            if (!state.lives) api.after(650, () => api.end({ won: false, note: 'Out of lives' }));
          }
        },
        progress(done, total) {
          if (time) return;
          bar.classList.remove('is-empty');
          timerFill.style.width = (total ? (done / total) * 100 : 0) + '%';
          timerText.textContent = `${done} / ${total}`;
        },
        end(extra = {}) {
          if (state.ended) return;
          state.ended = true;
          stopClock();
          try {
            if (ctrl && ctrl.destroy) ctrl.destroy();
          } catch (err) {
            console.error('[Brezel] game destroy failed', def.id, err);
          }
          results(def, level, state, extra);
        },
        speak: (text, o) => B.audio.speak(text, o),
        sfx: (name) => B.audio.play(name),
        after(ms, fn) {
          if (!state.ended) tasks.push({ at: state.gt + ms, fn });
        },
        every(ms, fn) {
          if (!state.ended) tasks.push({ at: state.gt + ms, fn, every: Math.max(16, ms) });
        },
        frame(fn) {
          if (!state.ended) frames.add(fn);
          return () => frames.delete(fn);
        },
        wait(ms) {
          return new Promise((resolve) => {
            if (state.ended) return resolve(false);
            waits.add(resolve);
            tasks.push({ at: state.gt + ms, fn: () => waits.delete(resolve) && resolve(true) });
          });
        },
      };

      let ctrl = null;
      run = {
        def,
        state,
        stop() {
          if (!state.ended) {
            state.ended = true;
            stopClock();
            try {
              if (ctrl && ctrl.destroy) ctrl.destroy();
            } catch (err) {
              /* leaving anyway */
            }
          }
          cancelAnimationFrame(raf);
        },
        key: (e) => ctrl && ctrl.key && ctrl.key(e),
      };

      try {
        ctrl = def.play(stage, api) || {};
      } catch (err) {
        console.error('[Brezel] game failed to start', def.id, err);
        B.app.toast('This game could not start — trying another one.');
        run.stop();
        return available.length > 1 ? intro(nextDef()) : B.app.go('home');
      }
      if (time) {
        timerFill.style.width = '100%';
        timerText.textContent = Math.ceil(time) + ' s';
      } else if (!timerText.textContent) bar.classList.add('is-empty');
      raf = requestAnimationFrame(loop);
      countdown(() => {
        state.started = true;
        if (ctrl.begin) ctrl.begin();
      });
    }

    function countdown(done) {
      if (reducedMotion()) return done();
      const steps = ['3', '2', '1', 'Los!'];
      const el = h('div', { class: 'g-count', 'aria-hidden': 'true' });
      shell.append(el);
      let i = 0;
      const step = () => {
        if (!el.isConnected) return;
        if (i >= steps.length) {
          el.remove();
          return done();
        }
        el.replaceChildren(h('span', { class: i === steps.length - 1 ? 'go' : '' }, steps[i]));
        B.audio.play(i === steps.length - 1 ? 'go' : 'tick');
        i++;
        setTimeout(step, i === steps.length ? 420 : 560);
      };
      step();
    }

    // --- results + "Another game?" ------------------------------------------------------------
    function results(def, level, state, extra) {
      const ms = Math.round(state.gt);
      const perfect = state.wrong === 0 && state.correct > 0;
      const won = extra.won === true ? true : extra.won === false ? false : null;
      const prevBest = bestScore(def.id, level);
      const record = state.score > prevBest && state.score > 0;
      const xp = Math.min(60, state.correct * 2 + (won ? 15 : 0) + (perfect ? 10 : 0));
      B.store.recordGame({
        game: def.id, topic, level, score: state.score, correct: state.correct, wrong: state.wrong,
        won, perfect, ms, xp, bestCombo: state.bestCombo,
      });
      if (B.achievements) B.achievements.evaluate();

      const title = won === true ? 'Gewonnen!' : won === false ? (extra.note === 'Out of lives' ? 'Game over' : 'Knapp daneben!') : perfect ? 'Perfekt!' : state.correct >= 10 ? 'Super gespielt!' : 'Fertig!';
      const sub = extra.note && extra.note !== 'Out of lives' ? extra.note : won === false ? 'No lives left — have another go!' : perfect ? 'Not a single mistake.' : '';
      const scoreNum = h('div', { class: 'g-res-score' }, '0');
      const next = available.length > 1 ? peekNext() : null;
      const nextBtn = next ? h('button', { type: 'button', class: 'btn btn-primary btn-big' }, h('span', { 'aria-hidden': 'true' }, '▶ '), 'Yes — ' + next.name) : null;
      if (nextBtn) nextBtn.addEventListener('click', () => intro(nextDef()));
      const againBtn = h('button', { type: 'button', class: 'btn ' + (next ? 'btn-outline' : 'btn-primary btn-big') }, h('span', { 'aria-hidden': 'true' }, '↻ '), next ? 'Play this again' : 'Yes — play again');
      againBtn.addEventListener('click', () => intro(def));
      const homeBtn = h('button', { type: 'button', class: 'btn btn-outline' }, 'No, thanks');
      homeBtn.addEventListener('click', () => B.app.go('home'));

      const stat = (icon, val, label) => h('div', { class: 'g-res-stat' }, h('span', { 'aria-hidden': 'true' }, icon), h('b', {}, String(val)), h('small', {}, label));
      const mistakes = state.mistakes.slice(0, 8);
      const card = h('div', { class: 'g-results', role: 'dialog', 'aria-label': 'Results' },
        artOf(def, false),
        h('h1', { class: 'g-res-title' }, title),
        sub ? h('p', { class: 'g-res-sub' }, sub) : null,
        scoreNum,
        h('div', { class: 'g-res-best' }, record ? h('span', { class: 'g-record' }, prevBest ? '🏆 New best score!' : '🏆 First score!') : `Best: ${prevBest}`),
        h('div', { class: 'g-res-stats' },
          stat('✓', state.correct, 'right'),
          stat('✗', state.wrong, 'wrong'),
          stat('🔥', state.bestCombo, 'best combo'),
          stat('⚡', '+' + xp, 'XP')),
        mistakes.length
          ? h('details', { class: 'g-res-miss' }, h('summary', {}, `Your mistakes (${state.mistakes.length})`),
            h('ul', {}, mistakes.map((m) => h('li', {},
              m.q ? h('span', { class: 'g-miss-q', html: B.ex.richText(m.q) }) : null,
              m.given ? h('s', {}, show(m.given)) : null,
              m.a ? h('b', { html: '→ ' + md(show(m.a)) }) : null))))
          : null,
        h('div', { class: 'g-again' },
          h('h2', {}, 'Noch ein Spiel?'),
          h('p', { class: 'muted' }, 'Another game?'),
          nextBtn,
          h('div', { class: 'g-again-row' }, againBtn, homeBtn)));
      shell.className = 'arcade is-results';
      setOverlay(h('div', { class: 'g-results-wrap' }, card), (e) => {
        if (e.key === 'Enter' && (e.target === document.body || e.target.tagName !== 'BUTTON')) {
          e.preventDefault();
          (nextBtn || againBtn).click();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          B.app.go('home');
        }
      });
      B.audio.play(won === false ? 'wrong' : 'complete');
      if (won || perfect || record) setTimeout(() => B.app.confetti(won ? 160 : 90), 200);
      // count the score up
      if (reducedMotion() || !state.score) scoreNum.textContent = String(state.score);
      else {
        const t0 = performance.now();
        const step = (t) => {
          if (!scoreNum.isConnected) return;
          const k = Math.min(1, (t - t0) / 900);
          scoreNum.textContent = String(Math.round(state.score * (1 - Math.pow(1 - k, 3))));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      (nextBtn || againBtn).focus({ preventScroll: true });
    }

    async function quit() {
      if (!run || run.state.ended) return B.app.go('home');
      const yes = await B.app.confirm({ title: 'Quit this game?', text: 'This round won’t be scored.', ok: 'Quit', cancel: 'Keep playing' });
      if (yes) {
        run.stop();
        B.app.go('home');
      }
    }

    intro(rotation[0]);

    return {
      onKey(e) {
        if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
        if (overlayKey) return overlayKey(e);
        if (!run || run.state.ended) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          quit();
          return;
        }
        if (!run.state.started) return;
        if (run.key(e)) e.preventDefault();
      },
      onBack: () => quit(),
      destroy() {
        if (run) run.stop();
        if (B.audio.canSpeak) window.speechSynthesis.cancel();
      },
    };
  };
})();

</script>
  <script>/* js/app.js */
/*
 * App shell: start-up, screen routing, theme, toasts, dialogs and confetti.
 * Screens live in js/ui/*.js as Brezel.ui.<name>(root, params) and may return
 * { destroy(), onKey(e), onBack() }.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, pick, randInt, reducedMotion } = B.util;

  const appEl = document.getElementById('app');
  let current = null;
  let skipPop = false;
  let modalOpen = false;

  // --- routing ----------------------------------------------------------------
  function render(name, params) {
    if (B.charts) B.charts.hideTip();
    if (current && current.destroy) current.destroy();
    appEl.replaceChildren();
    window.scrollTo(0, 0);
    const el = h('div', { class: 'screen screen-' + name });
    appEl.append(el);
    current = Object.assign({ name }, B.ui[name](el, params || {}) || {});
  }

  /** Show a screen. Non-home screens get one history entry, so the phone's back button returns home. */
  function go(name, params) {
    const depth = (history.state && history.state.depth) || 0;
    if (name === 'home' && depth > 0) {
      skipPop = true;
      history.back();
    } else if (name !== 'home') {
      if (depth > 0) history.replaceState({ depth: 1 }, '');
      else history.pushState({ depth: 1 }, '');
    }
    render(name, params);
  }

  window.addEventListener('popstate', () => {
    if (skipPop) {
      skipPop = false;
      return;
    }
    if (current && current.onBack) {
      // stay on the page and let the screen decide (the session asks before quitting)
      history.pushState({ depth: 1 }, '');
      current.onBack();
      return;
    }
    if (current && current.name !== 'home') render('home');
  });

  document.addEventListener('keydown', (e) => {
    if (modalOpen) return;
    if (current && current.onKey) current.onKey(e);
  });

  // --- theme ------------------------------------------------------------------
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function applyTheme() {
    const pref = B.store.setting('theme');
    const dark = pref === 'dark' || (pref !== 'light' && darkQuery && darkQuery.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#131f24' : '#ffffff');
  }

  function toggleTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    B.store.setting('theme', dark ? 'light' : 'dark');
    applyTheme();
  }

  const isDark = () => document.documentElement.dataset.theme === 'dark';

  // --- toast ------------------------------------------------------------------
  function toast(text, { kind = '', ms = 2600 } = {}) {
    const layer = document.getElementById('toast-layer');
    const el = h('div', { class: 'toast ' + kind, role: 'status' }, text);
    layer.append(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, ms);
  }

  // --- dialogs ------------------------------------------------------------------
  let dialogSeq = 0;

  /** Show a .modal box over the screen. Esc and the backdrop close it; Tab stays inside. Returns close(value). */
  function modal(box, { initial, onClose }) {
    const prev = document.activeElement;
    const overlay = h('div', { class: 'modal-backdrop' }, box);
    let open = true;

    function close(value) {
      if (!open) return;
      open = false;
      modalOpen = false;
      document.removeEventListener('keydown', onKey, true);
      overlay.classList.add('out');
      setTimeout(() => overlay.remove(), 200);
      if (prev && prev.focus && prev.isConnected) prev.focus({ preventScroll: true });
      onClose(value);
    }
    function onKey(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        close(false);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const els = Array.from(box.querySelectorAll('button, [tabindex="0"]')).filter((el) => !el.disabled && el.offsetParent !== null);
        if (!els.length) return;
        const i = els.indexOf(document.activeElement);
        els[(i + (e.shiftKey ? -1 : 1) + els.length) % els.length].focus();
      }
    }
    overlay.addEventListener('click', (e) => e.target === overlay && close(false));
    document.addEventListener('keydown', onKey, true);
    modalOpen = true;
    document.body.append(overlay);
    if (initial) initial.focus({ preventScroll: true });
    return close;
  }

  function confirm({ title, text, ok = 'OK', cancel = 'Cancel', danger = false }) {
    return new Promise((resolve) => {
      const id = 'dlg-' + ++dialogSeq;
      const okBtn = h('button', { type: 'button', class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary') }, ok);
      const cancelBtn = h('button', { type: 'button', class: 'btn btn-outline' }, cancel);
      const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': id },
        h('div', { class: 'modal-mascot', 'aria-hidden': 'true' }, danger ? '😮' : '🥨'),
        h('h2', { id, class: 'modal-title' }, title),
        text ? h('p', { class: 'modal-text' }, text) : null,
        h('div', { class: 'modal-actions' }, cancelBtn, okBtn));
      const close = modal(box, { initial: danger ? cancelBtn : okBtn, onClose: resolve });
      okBtn.addEventListener('click', () => close(true));
      cancelBtn.addEventListener('click', () => close(false));
    });
  }

  /** A message with one button ("Sorry, there are no games …"). */
  function alert({ title, text, ok = 'OK', icon = '🥨' }) {
    return new Promise((resolve) => {
      const id = 'dlg-' + ++dialogSeq;
      const okBtn = h('button', { type: 'button', class: 'btn btn-primary' }, ok);
      const box = h('div', { class: 'modal', role: 'alertdialog', 'aria-modal': 'true', 'aria-labelledby': id },
        h('div', { class: 'modal-mascot', 'aria-hidden': 'true' }, icon),
        h('h2', { id, class: 'modal-title' }, title),
        text ? h('p', { class: 'modal-text' }, text) : null,
        h('div', { class: 'modal-actions' }, okBtn));
      const close = modal(box, { initial: okBtn, onClose: () => resolve() });
      okBtn.addEventListener('click', () => close(true));
    });
  }

  /** A dialog with any content (the Glossary): build(close) returns the .modal box. Resolves when it closes. */
  function sheet(build) {
    return new Promise((resolve) => {
      let close = null;
      const box = build((v) => close && close(v));
      close = modal(box, { initial: box.querySelector('[data-autofocus]'), onClose: resolve });
    });
  }

  // --- confetti -------------------------------------------------------------------
  function confetti(count = 110) {
    if (reducedMotion() || typeof Element.prototype.animate !== 'function') return;
    const colors = ['#58cc02', '#1cb0f6', '#ff9600', '#ff4b4b', '#ce82ff', '#ffc800'];
    const layer = h('div', { class: 'confetti', 'aria-hidden': 'true' });
    document.body.append(layer);
    const vh = window.innerHeight;
    for (let i = 0; i < count; i++) {
      const w = randInt(6, 11);
      const p = h('i', { style: { background: pick(colors), left: Math.random() * 100 + '%', width: w + 'px', height: Math.round(w * 1.5) + 'px', borderRadius: Math.random() < 0.3 ? '50%' : '2px' } });
      layer.append(p);
      const dx = (Math.random() - 0.5) * 260;
      p.animate(
        [
          { transform: 'translate3d(0, -20px, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate3d(${dx}px, ${vh + 40}px, 0) rotate(${randInt(-900, 900)}deg)`, opacity: 0.9 },
        ],
        { duration: randInt(1900, 3300), delay: Math.random() * 600, easing: 'cubic-bezier(.25,.6,.45,1)', fill: 'forwards' }
      );
    }
    setTimeout(() => layer.remove(), 4400);
  }

  // --- start-up -----------------------------------------------------------------------
  B.app = {
    go,
    toast,
    confirm,
    alert,
    sheet,
    confetti,
    applyTheme,
    toggleTheme,
    isDark,
    get screen() { return current && current.name; },
  };

  B.store.load();
  B.deck.finalize();
  applyTheme();
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', applyTheme);
  history.replaceState({ depth: 0 }, '');
  // achievements first, so badges earned with older progress already show on the home screen
  if (B.achievements && B.achievements.init) B.achievements.init();
  render('home');
  if (!B.store.storageOk) toast('⚠️ This browser is blocking storage — progress won’t be saved.', { kind: 'warn', ms: 6000 });
})();

</script>
