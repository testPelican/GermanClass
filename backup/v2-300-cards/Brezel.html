  <script>/* js/exercises/base.js */
/*
 * Exercise registry. Every exercise type is a plugin:
 *
 *   Brezel.ex.register('mc', {
 *     label: 'Multiple choice',
 *     validate(card, deck) -> [error strings]        // run once at start-up
 *     describe(card)       -> {q, a}                 // plain text for the review screen
 *     render(card, root, api) -> controller
 *   })
 *
 * controller = {
 *   check()    -> {ok, given, note?, typo?}  // given = what the learner answered (text)
 *   solution() -> {html, say?}               // the correct answer, shown when wrong
 *   lock(res)  -> void                       // freeze + colour the answer after checking
 *   key?(e)    -> true if the key was handled
 *   focus?()   -> focus the main input
 * }
 * api = { changed(ready), submit(), sfx(name), speak(text), card }
 *
 * Common card fields: id, type, prompt (instruction), q (German text shown in the
 * speech bubble, "___" marks a blank), say (text for the speaker button),
 * en (English meaning, shown small), explain (the "why", shown after answering).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show } = B.util;

  const types = Object.create(null);
  const BLANK = /_{3,}/;

  function register(name, def) {
    def.name = name;
    types[name] = def;
  }

  /** Markdown-lite + "___" blanks (done before show(), which turns _ into spaces). */
  function richText(text) {
    return String(text == null ? '' : text)
      .split(BLANK)
      .map((part) => md(show(part)))
      .join('<span class="blank-inline">&nbsp;</span>');
  }

  function speakButton(say) {
    if (!say || !B.audio.canSpeak) return null;
    return h('button', {
      class: 'speak-btn',
      type: 'button',
      'aria-label': 'Listen',
      title: 'Listen',
      onClick: (e) => {
        e.stopPropagation();
        B.audio.speak(say);
      },
    }, '🔊');
  }

  /** Mascot + speech bubble. */
  function bubble(text, { say, big } = {}) {
    return h('div', { class: 'bubble-row' },
      h('div', { class: 'mascot', 'aria-hidden': 'true' }, '🥨'),
      h('div', { class: 'bubble' + (big ? ' bubble-big' : '') },
        speakButton(say),
        h('span', { class: 'bubble-text', html: richText(text) }))
    );
  }

  /** Title + optional bubble — the standard top of every exercise. */
  function header(card, fallback, opts = {}) {
    const wrap = h('div', { class: 'ex-head' });
    wrap.append(h('h2', { class: 'ex-title', html: md(card.prompt || fallback) }));
    if (card.q && !opts.noBubble) wrap.append(bubble(card.q, { say: card.say, big: opts.big }));
    if (card.en && !opts.noEn) wrap.append(h('p', { class: 'ex-en' }, '“' + card.en + '”'));
    if (card.hint) wrap.append(h('p', { class: 'ex-hint' }, h('span', { 'aria-hidden': 'true' }, '💡 '), show(card.hint)));
    return wrap;
  }

  /** The question sentence with its blank filled in (for speech and solutions). */
  function filled(card, answer) {
    if (card.sayAnswer) return card.sayAnswer;
    if (card.q && BLANK.test(card.q)) return show(card.q.replace(BLANK, answer));
    return card.say || null;
  }

  /** Put text into the bubble's blank after checking. */
  function fillBlank(root, text, cls) {
    const b = root.querySelector('.blank-inline');
    if (!b) return;
    b.textContent = show(text);
    b.classList.add('filled');
    if (cls) b.classList.add(cls);
  }

  /** Buttons for ä ö ü ß; inserts into whichever input is active. */
  function umlautBar(getInput) {
    const chars = ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'];
    return h('div', { class: 'umlauts', role: 'group', 'aria-label': 'Special letters' },
      chars.map((ch) =>
        h('button', {
          type: 'button',
          class: 'umlaut',
          tabindex: '-1',
          // pointerdown + preventDefault keeps the keyboard open on phones
          onPointerdown: (e) => e.preventDefault(),
          onClick: () => {
            const input = getInput();
            if (!input || input.disabled) return;
            const s = input.selectionStart ?? input.value.length;
            const t = input.selectionEnd ?? input.value.length;
            input.value = input.value.slice(0, s) + ch + input.value.slice(t);
            input.focus();
            input.setSelectionRange(s + 1, s + 1);
            input.dispatchEvent(new Event('input', { bubbles: true }));
          },
        }, ch)
      )
    );
  }

  /** Typed-answer feedback note (typo accepted / wrong form / capital letter). */
  function typedNote(res, given) {
    if (res.ok && res.typo) return `Small typo — accepted! Exact spelling: **${show(res.matched)}**.`;
    if (res.ok && res.caseNote) return res.caseNote;
    if (!res.ok && res.reason === 'form') {
      return `Close, but “${given}” is a different grammatical form — one letter changes the grammar here, so it counts as wrong.`;
    }
    if (!res.ok && res.reason === 'short') {
      return 'Close — but short words like *ist, bin, im, ins, dem* must be spelled exactly: one letter changes the word.';
    }
    return null;
  }

  const asList = (x) => (Array.isArray(x) ? x : x == null ? [] : [x]);

  /** Validation helper: collect messages when conditions fail. */
  function need(errs, cond, msg) {
    if (!cond) errs.push(msg);
    return !!cond;
  }

  B.ex = {
    register,
    get: (name) => types[name],
    names: () => Object.keys(types),
    label: (name) => (types[name] ? types[name].label : name),
    BLANK,
    richText,
    speakButton,
    bubble,
    header,
    filled,
    fillBlank,
    umlautBar,
    typedNote,
    asList,
    need,
  };
})();

</script>
  <script>/* js/exercises/mc.js */
/*
 * Multiple choice.
 *   { type: 'mc', prompt, q?, correct: 'gearbeitet', wrong: ['arbeitet', 'arbeite'] }
 * Options are shuffled every time the card is shown. Keys 1–4 pick an option.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  B.ex.register('mc', {
    label: 'Multiple choice',

    validate(c) {
      const e = [];
      B.ex.need(e, typeof c.correct === 'string' && c.correct.length, 'mc needs "correct"');
      if (B.ex.need(e, Array.isArray(c.wrong) && c.wrong.length >= 1, 'mc needs a "wrong" list')) {
        B.ex.need(e, !c.wrong.includes(c.correct), 'the correct answer is also listed in "wrong"');
        B.ex.need(e, new Set(c.wrong).size === c.wrong.length, 'duplicate wrong options');
        B.ex.need(e, c.wrong.length <= 5, 'at most 6 options');
      }
      return e;
    },

    describe: (c) => ({ q: c.q ? c.q : c.prompt, a: show(c.correct) }),

    render(card, root, api) {
      const opts = shuffle([card.correct, ...card.wrong]);
      const long = opts.some((o) => show(o).length > 16);
      let sel = -1;
      let locked = false;

      const list = h('div', { class: 'choices ' + (long ? 'choices-col' : 'choices-grid'), role: 'radiogroup' });
      const btns = opts.map((o, i) => {
        const b = h('button', {
          class: 'choice',
          type: 'button',
          role: 'radio',
          'aria-checked': 'false',
          onClick: () => choose(i),
        },
          h('span', { class: 'key', 'aria-hidden': 'true' }, String(i + 1)),
          h('span', { class: 'choice-text', html: md(show(o)) })
        );
        list.append(b);
        return b;
      });

      function choose(i) {
        if (locked) return;
        sel = i;
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === i);
          b.setAttribute('aria-checked', String(j === i));
        });
        api.sfx('tap');
        api.changed(true);
      }

      root.append(B.ex.header(card, 'Choose the correct answer'), list);

      return {
        check: () => ({ ok: opts[sel] === card.correct, given: show(opts[sel]) }),
        solution: () => ({ html: md(show(card.correct)), say: B.ex.filled(card, card.correct) }),
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (opts[j] === card.correct) b.classList.add('good');
            else if (j === sel) b.classList.add('bad');
            else b.classList.add('dim');
          });
          B.ex.fillBlank(root, card.correct, res.ok ? 'good' : 'bad');
        },
        key(e) {
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= opts.length) {
            choose(n - 1);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/tf.js */
/*
 * True / false.
 *   { type: 'tf', prompt?, q?: 'German sentence', statement?: 'English claim',
 *     answer: true|false, fix?: 'the corrected sentence', labels?: ['Correct', 'Wrong'] }
 * Keys: 1 / T = first button, 2 / F = second.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show } = B.util;

  B.ex.register('tf', {
    label: 'True / false',

    validate(c) {
      const e = [];
      B.ex.need(e, typeof c.answer === 'boolean', 'tf needs "answer": true or false');
      B.ex.need(e, c.q || c.statement, 'tf needs "q" or "statement"');
      return e;
    },

    describe: (c) => ({
      q: [c.statement, c.q].filter(Boolean).join(' — ') || c.prompt,
      a: (c.answer ? (c.labels ? c.labels[0] : 'True') : c.labels ? c.labels[1] : 'False') + (c.fix ? ` → ${show(c.fix)}` : ''),
    }),

    render(card, root, api) {
      const labels = card.labels || ['True', 'False'];
      let sel = null;
      let locked = false;

      const head = B.ex.header(card, card.q ? 'Is this sentence correct?' : 'True or false?');
      if (card.statement) head.append(h('div', { class: 'tf-statement', html: md(show(card.statement)) }));

      const mk = (val, icon, label) =>
        h('button', {
          type: 'button',
          class: 'tf-btn ' + (val ? 'tf-yes' : 'tf-no'),
          'aria-pressed': 'false',
          onClick: () => choose(val),
        },
          h('span', { class: 'tf-icon', 'aria-hidden': 'true' }, icon),
          h('span', {}, label)
        );
      const yes = mk(true, '✓', labels[0]);
      const no = mk(false, '✗', labels[1]);

      function choose(val) {
        if (locked) return;
        sel = val;
        yes.classList.toggle('sel', val === true);
        no.classList.toggle('sel', val === false);
        yes.setAttribute('aria-pressed', String(val === true));
        no.setAttribute('aria-pressed', String(val === false));
        api.sfx('tap');
        api.changed(true);
      }

      root.append(head, h('div', { class: 'tf-row' }, yes, no));

      const answerLabel = card.answer ? labels[0] : labels[1];
      return {
        check: () => ({ ok: sel === card.answer, given: sel ? labels[0] : labels[1] }),
        solution: () => ({
          html: md(answerLabel) + (card.fix ? `<div class="sol-fix">✔ ${md(show(card.fix))}</div>` : ''),
          say: card.fix || (card.answer ? card.say || card.q : null),
        }),
        lock() {
          locked = true;
          for (const [btn, val] of [[yes, true], [no, false]]) {
            btn.disabled = true;
            if (val === card.answer) btn.classList.add('good');
            else if (val === sel) btn.classList.add('bad');
            else btn.classList.add('dim');
          }
        },
        key(e) {
          const k = e.key.toLowerCase();
          if (k === '1' || k === 't' || k === 'r' || k === 'y') return choose(true), true;
          if (k === '2' || k === 'f' || k === 'w' || k === 'n') return choose(false), true;
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/type.js */
/*
 * Typed answer. One wrong letter is forgiven as a typo (see core/check.js).
 *   { type: 'type', prompt, q?: 'Julia ___ in Salzburg.', hint?: 'wohnen',
 *     answer: 'wohnt' | ['alt 1', 'alt 2'], reject?: [...], strict?: true, noun?: true }
 * If q has a ___ the typed text appears live inside the sentence.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show } = B.util;

  B.ex.register('type', {
    label: 'Typed answer',

    validate(c) {
      const e = [];
      const answers = B.ex.asList(c.answer);
      B.ex.need(e, answers.length && answers.every((a) => typeof a === 'string' && a.trim()), 'type needs "answer"');
      if (c.reject) B.ex.need(e, !answers.some((a) => c.reject.includes(a)), 'an answer is also in "reject"');
      return e;
    },

    describe: (c) => ({ q: c.q || c.prompt, a: show(B.ex.asList(c.answer)[0]) }),

    render(card, root, api) {
      const answers = B.ex.asList(card.answer);
      const head = B.ex.header(card, 'Type the answer');
      const blank = head.querySelector('.blank-inline');
      const input = h('input', {
        class: 'type-input',
        type: 'text',
        autocomplete: 'off',
        autocorrect: 'off',
        autocapitalize: 'off',
        spellcheck: 'false',
        enterkeyhint: 'done',
        'aria-label': 'Your answer',
        placeholder: card.placeholder || (blank ? 'Type the missing word(s)' : 'Type your answer in German'),
      });
      input.addEventListener('input', () => {
        const v = input.value;
        if (blank) {
          blank.textContent = v || ' ';
          blank.classList.toggle('typing', !!v);
        }
        api.changed(v.trim().length > 0);
      });

      root.append(head, h('div', { class: 'type-box' }, input), B.ex.umlautBar(() => input));

      let res = null;
      return {
        focus: () => input.focus({ preventScroll: true }),
        check() {
          const given = input.value.trim();
          res = B.check.typed(given, answers, { reject: card.reject, strict: card.strict, nounHint: card.noun });
          return { ok: res.ok, given, typo: !!res.typo, note: B.ex.typedNote(res, given) };
        },
        solution() {
          const a = (res && res.matched) || answers[0];
          const say = card.sayAnswer || (card.q && B.ex.BLANK.test(card.q) ? B.ex.filled(card, a) : a);
          const alts = answers.filter((x) => x !== a);
          return {
            html: md(show(a)) + (alts.length ? `<div class="sol-alt">Also accepted: ${alts.map((x) => md(show(x))).join(', ')}</div>` : ''),
            say,
          };
        },
        lock(r) {
          input.disabled = true;
          input.classList.add(r.ok ? 'good' : 'bad');
          if (blank) blank.classList.add('filled', r.ok ? 'good' : 'bad');
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/table.js */
/*
 * Fill-in table (conjugation, participles …). Typed cells use the same typo rule.
 *   { type: 'table', verb: 'sein', blanks?: 4 }                  // rows from the verb list
 *   { type: 'table', head: ['Infinitiv', 'Perfekt'], rows: [['gehen', 'ist gegangen'], ...], blanks?: [0, 2] }
 * blanks: a number = that many random rows (default: up to 4), or explicit row indices.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle } = B.util;

  function rowsOf(card) {
    if (card.verb) return B.deck.verbRows(card.verb);
    return card.rows;
  }

  B.ex.register('table', {
    label: 'Fill-in table',

    validate(c, deck) {
      const e = [];
      if (c.verb) B.ex.need(e, deck.verbs[c.verb], `unknown verb "${c.verb}" (add it to data/lexicon.js)`);
      else B.ex.need(e, Array.isArray(c.rows) && c.rows.length >= 2 && c.rows.every((r) => r.length === 2), 'table needs "verb" or "rows" [[left, right], …]');
      if (Array.isArray(c.blanks)) {
        const n = c.verb ? 6 : (c.rows || []).length;
        B.ex.need(e, c.blanks.every((i) => i >= 0 && i < n), 'blank index out of range');
      }
      return e;
    },

    describe(c) {
      const rows = rowsOf(c) || [];
      return { q: c.prompt || (c.verb ? `Conjugate “${c.verb}”` : 'Fill in the table'), a: rows.map((r) => `${show(r[0])} ${show(r[1])}`).join(', ') };
    },

    render(card, root, api) {
      const rows = rowsOf(card);
      let blankIdx;
      if (Array.isArray(card.blanks)) blankIdx = card.blanks;
      else {
        const n = Math.min(rows.length, card.blanks || 4);
        blankIdx = shuffle(rows.map((_, i) => i)).slice(0, n);
      }
      const blanks = new Set(blankIdx);
      const head = card.head || ['', card.verb];
      const verb = card.verb && B.deck.verbs[card.verb];

      const inputs = [];
      let active = null;
      const tbody = h('tbody');
      rows.forEach((r, i) => {
        let cell;
        if (blanks.has(i)) {
          const input = h('input', {
            class: 'cell-input',
            type: 'text',
            autocomplete: 'off',
            autocorrect: 'off',
            autocapitalize: 'off',
            spellcheck: 'false',
            enterkeyhint: 'next',
            'aria-label': `${show(r[0])}`,
          });
          input.addEventListener('focus', () => (active = input));
          input.addEventListener('input', () => api.changed(inputs.every((x) => x.el.value.trim())));
          inputs.push({ el: input, row: i, answer: r[1] });
          cell = h('td', { class: 'cell-in' }, input, h('div', { class: 'cell-fix' }));
        } else {
          cell = h('td', { class: 'cell-given' }, show(r[1]));
        }
        tbody.append(h('tr', {}, h('th', { scope: 'row' }, show(r[0])), cell));
      });

      const title = card.prompt || (verb ? `Conjugate **${card.verb}**${verb.en ? ` (${verb.en})` : ''} in the present tense` : 'Fill in the table');
      const table = h('table', { class: 'fill-table' },
        head.some(Boolean) ? h('thead', {}, h('tr', {}, head.map((x) => h('th', { scope: 'col' }, show(x || ''))))) : null,
        tbody);

      root.append(B.ex.header(Object.assign({}, card, { prompt: title }), ''), h('div', { class: 'table-wrap' }, table), B.ex.umlautBar(() => active || inputs[0].el));

      let results = [];
      return {
        focus: () => inputs[0] && inputs[0].el.focus({ preventScroll: true }),
        check() {
          results = inputs.map((x) => {
            const given = x.el.value.trim();
            const res = B.check.typed(given, [x.answer], { strict: card.strict });
            return Object.assign({ given }, x, { res });
          });
          const ok = results.every((r) => r.res.ok);
          const wrong = results.filter((r) => !r.res.ok);
          const typos = results.filter((r) => r.res.typo);
          const formErr = wrong.find((r) => r.res.reason === 'form');
          let note = null;
          if (ok && typos.length) note = `Small typo — accepted! Exact spelling: ${typos.map((t) => `**${show(t.answer)}**`).join(', ')}.`;
          else if (formErr) note = `“${formErr.given}” is a different form of the verb — the ending decides who is doing it, so it counts as wrong.`;
          const given = (wrong.length ? wrong : results).map((r) => `${show(rows[r.row][0])} → ${r.given || '—'}`).join(', ');
          return { ok, given, typo: typos.length > 0, note };
        },
        solution() {
          const list = rows.map((r, i) =>
            `<div class="sol-row${blanks.has(i) ? ' is-blank' : ''}"><span>${md(show(r[0]))}</span> <strong>${md(show(r[1]))}</strong></div>`
          ).join('');
          const say = verb ? rows.map((r) => `${r[0].split('/')[0]} ${r[1]}`).join(', ') : rows.map((r) => r[1]).join(', ');
          return { html: `<div class="sol-table">${list}</div>`, say };
        },
        lock() {
          for (const r of results) {
            r.el.disabled = true;
            r.el.classList.add(r.res.ok ? 'good' : 'bad');
            if (!r.res.ok || r.res.typo) r.el.parentNode.querySelector('.cell-fix').textContent = show(r.answer);
          }
        },
        key(e) {
          if (e.key !== 'Enter' || !e.target || !e.target.classList.contains('cell-input')) return false;
          // Enter jumps to the next empty cell; on the last one it falls through to "Check".
          const idx = inputs.findIndex((x) => x.el === e.target);
          const next = inputs.slice(idx + 1).concat(inputs.slice(0, idx)).find((x) => !x.el.value.trim());
          if (next) {
            next.el.focus();
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/order.js */
/*
 * Sentence builder: tap or drag word tiles into the right order.
 *   { type: 'order', en: 'I live in Vienna.', answer: 'Ich wohne in Wien.',
 *     start?: 'In meiner Freizeit',   // fixed beginning (practise the inversion)
 *     extra?: ['wohnt'],              // distractor tiles that don't belong
 *     answers?: ['…'],                // other correct orders
 *     keepCase?: true }               // keep the first word capitalised (nouns)
 * Words joined with "_" stay together on one tile: "St._Pölten".
 * The first tile is shown in lower case so capitals don't give the start away.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffleAway, splitSentence } = B.util;

  function lowerFirst(word, card) {
    const bare = word.replace(/[,;:]+$/, '');
    if (card.keepCase || B.deck.properNouns.has(bare) || B.deck.properNouns.has(show(bare))) return show(word);
    return show(word.charAt(0).toLowerCase() + word.slice(1));
  }

  function sentenceCase(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  B.ex.register('order', {
    label: 'Sentence builder',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.answer === 'string' && c.answer.trim(), 'order needs "answer"')) return e;
      const { words } = splitSentence(c.answer);
      B.ex.need(e, words.length >= 2, 'order needs at least 2 words');
      if (c.start) {
        const sw = splitSentence(c.start).words;
        B.ex.need(e, sw.length < words.length && sw.every((w, i) => norm(w) === norm(words[i])), '"start" must be the beginning of "answer"');
      }
      return e;
    },

    describe: (c) => ({ q: c.en ? `“${c.en}”` : c.prompt || 'Build the sentence', a: show(c.answer) }),

    render(card, root, api) {
      const { words, punct } = splitSentence(card.answer);
      const startWords = card.start ? splitSentence(card.start).words : [];
      const body = words.slice(startWords.length);
      const tiles = body
        .map((w, i) => ({ w, label: i === 0 && !startWords.length ? lowerFirst(w, card) : show(w) }))
        .concat((card.extra || []).map((w) => ({ w, label: show(w), extra: true })));
      const bankOrder = shuffleAway(tiles.map((_, i) => i));

      let locked = false;
      const answerEl = h('div', { class: 'order-answer', 'aria-label': 'Your sentence', role: 'list' });
      if (startWords.length) answerEl.append(h('span', { class: 'tile locked', title: 'Fixed start' }, show(card.start)));
      const bankEl = h('div', { class: 'order-bank', 'aria-label': 'Word bank' });
      const all = [];

      const placed = () => Array.from(answerEl.querySelectorAll('.tile:not(.locked)'));
      const moveAll = (mutate) => flip(all, mutate);
      const update = () => api.changed(placed().length > 0);

      function toAnswer(el) {
        moveAll(() => answerEl.append(el));
        el.setAttribute('aria-label', `${el.textContent} (tap to remove)`);
      }
      function toBank(el) {
        moveAll(() => el._slot.append(el));
        el.setAttribute('aria-label', el.textContent);
      }

      for (const i of bankOrder) {
        const t = tiles[i];
        const el = h('button', { class: 'tile', type: 'button', role: 'listitem' }, t.label);
        el._t = t;
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow', 'aria-hidden': 'true' }, t.label), el);
        el._slot = slot;
        all.push(el);
        bankEl.append(slot);

        el.addEventListener('click', () => {
          if (locked) return;
          if (el.parentNode === answerEl) toBank(el);
          else toAnswer(el);
          api.sfx('tap');
          update();
        });

        let lastMove = 0;
        B.drag.attach(el, {
          enabled: () => !locked,
          onMove(ctx) {
            const now = performance.now();
            if (now - lastMove < 60) return; // don't thrash while tiles are still gliding
            const r = answerEl.getBoundingClientRect();
            const inside = ctx.x > r.left - 16 && ctx.x < r.right + 16 && ctx.y > r.top - 20 && ctx.y < r.bottom + 20;
            if (inside) {
              const others = placed().filter((k) => k !== el);
              const idx = B.drag.insertIndex(answerEl, ctx.x, ctx.y, el, '.tile:not(.locked)');
              const cur = el.parentNode === answerEl ? others.filter((k) => k.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING).length : -1;
              if (cur !== idx) {
                lastMove = now;
                moveAll(() => answerEl.insertBefore(el, others[idx] || null));
              }
            } else if (el.parentNode === answerEl) {
              lastMove = now;
              moveAll(() => el._slot.append(el));
            }
          },
          onEnd() {
            api.sfx('drop');
            update();
            return el;
          },
        });
      }

      root.append(
        B.ex.header(card, 'Put the words in the right order', { noEn: true }),
        card.en ? h('div', { class: 'order-en' }, h('span', { class: 'order-en-label' }, 'Translate'), ' “' + card.en + '”') : null,
        h('div', { class: 'order-stage' }, answerEl),
        bankEl
      );

      function built() {
        return startWords.concat(placed().map((el) => el._t.w));
      }
      function display(list) {
        return list.length ? sentenceCase(show(list.join(' '))) + punct : '—';
      }

      return {
        check() {
          const got = norm(built().join(' '));
          const ok = [card.answer, ...(card.answers || [])].some((a) => norm(a) === got);
          return { ok, given: display(built()) };
        },
        solution: () => ({ html: md(show(card.answer)), say: show(card.answer) }),
        lock(res) {
          locked = true;
          all.forEach((el) => (el.disabled = true));
          answerEl.classList.add(res.ok ? 'good' : 'bad');
        },
        key(e) {
          if (e.key === 'Backspace' && !locked) {
            const last = placed().pop();
            if (last) {
              toBank(last);
              update();
            }
            return true;
          }
          return false;
        },
      };
    },
  });
})();

  <script>/* js/exercises/match.js */
/*
 * Match pairs: tap an item on the left, then its partner on the right.
 *   { type: 'match', prompt, pairs: [['wohnen', 'to live'], ['kommen', 'to come'], …] }
 * Pairs are only marked right/wrong after pressing Check. Tap a paired item to undo it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, shuffle, shuffleAway } = B.util;
  const MAX = 6;

  B.ex.register('match', {
    label: 'Match pairs',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.pairs) && c.pairs.length >= 2, 'match needs at least 2 "pairs"')) return e;
      B.ex.need(e, c.pairs.length <= MAX, `at most ${MAX} pairs`);
      B.ex.need(e, c.pairs.every((p) => Array.isArray(p) && p.length === 2), 'each pair is [left, right]');
      B.ex.need(e, new Set(c.pairs.map((p) => p[0])).size === c.pairs.length, 'duplicate left items');
      B.ex.need(e, new Set(c.pairs.map((p) => p[1])).size === c.pairs.length, 'duplicate right items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Match the pairs', a: c.pairs.map((p) => `${show(p[0])} = ${show(p[1])}`).join(' · ') }),

    render(card, root, api) {
      const n = card.pairs.length;
      const leftOrder = shuffle(card.pairs.map((_, i) => i));
      const rightOrder = shuffleAway(leftOrder.slice());
      const link = new Map(); // left index -> right index
      const colorOf = new Map(); // left index -> colour slot
      let sel = null; // {side, i}
      let locked = false;

      const mk = (side, i) => {
        const text = card.pairs[i][side === 'L' ? 0 : 1];
        return h('button', { type: 'button', class: 'm-item', dataset: { side, i }, onClick: () => tap(side, i) },
          h('span', { class: 'm-badge', 'aria-hidden': 'true' }),
          h('span', { class: 'm-text', html: md(show(text)) }));
      };
      const L = leftOrder.map((i) => mk('L', i));
      const R = rightOrder.map((i) => mk('R', i));
      const elOf = (side, i) => (side === 'L' ? L[leftOrder.indexOf(i)] : R[rightOrder.indexOf(i)]);
      const partnerOf = (side, i) => {
        if (side === 'L') return link.has(i) ? link.get(i) : null;
        for (const [l, r] of link) if (r === i) return l;
        return null;
      };

      function freeColor() {
        const used = new Set(colorOf.values());
        for (let c = 0; c < MAX; c++) if (!used.has(c)) return c;
        return 0;
      }

      function unpair(l) {
        link.delete(l);
        colorOf.delete(l);
      }

      function tap(side, i) {
        if (locked) return;
        api.sfx('tap');
        const p = partnerOf(side, i);
        if (p !== null) {
          unpair(side === 'L' ? i : p);
          sel = { side, i };
        } else if (sel && sel.side !== side) {
          const l = side === 'L' ? i : sel.i;
          const r = side === 'R' ? i : sel.i;
          link.set(l, r);
          colorOf.set(l, freeColor());
          sel = null;
          paint();
          B.util.pulse(elOf('L', l), 'pop');
          B.util.pulse(elOf('R', r), 'pop');
          api.changed(link.size === n);
          return;
        } else if (sel && sel.side === side && sel.i === i) {
          sel = null;
        } else {
          sel = { side, i };
        }
        paint();
        api.changed(link.size === n);
      }

      function paint() {
        const order = [...link.keys()];
        for (const side of ['L', 'R']) {
          for (let i = 0; i < n; i++) {
            const el = elOf(side, i);
            const l = side === 'L' ? i : partnerOf('R', i);
            const paired = l !== null && link.has(l);
            el.classList.remove('paired', 'sel', ...Array.from({ length: MAX }, (_, c) => 'pc' + c));
            if (paired) el.classList.add('paired', 'pc' + colorOf.get(l));
            if (sel && sel.side === side && sel.i === i) el.classList.add('sel');
            el.querySelector('.m-badge').textContent = paired ? String(order.indexOf(l) + 1) : '';
            el.setAttribute('aria-pressed', String(!!(sel && sel.side === side && sel.i === i)));
          }
        }
      }

      root.append(
        B.ex.header(card, 'Match the pairs'),
        h('div', { class: 'match-grid', lang: 'de' }, h('div', { class: 'm-col' }, L), h('div', { class: 'm-col' }, R))
      );

      return {
        check() {
          const wrong = [...link].filter(([l, r]) => l !== r);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map(([l, r]) => `${show(card.pairs[l][0])} → ${show(card.pairs[r][1])}`).join(', ') : 'all pairs',
          };
        },
        solution: () => ({
          html: `<div class="sol-pairs">${card.pairs.map((p) => `<div><strong>${md(show(p[0]))}</strong> = ${md(show(p[1]))}</div>`).join('')}</div>`,
        }),
        lock() {
          locked = true;
          for (const [l, r] of link) {
            const cls = l === r ? 'good' : 'bad';
            elOf('L', l).classList.add(cls);
            elOf('R', r).classList.add(cls);
          }
          [...L, ...R].forEach((el) => (el.disabled = true));
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/gap.js */
/*
 * Fill the gaps with word chips.
 *   { type: 'gap', q: 'Ich {bin} 1990 in Polen {geboren}.', options: ['habe', 'gebären'] }
 * {…} marks a gap; "{ins|in das}" accepts either. options = extra wrong chips.
 * Tap a chip to drop it into the highlighted gap; tap a filled gap to empty it.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm, flip, shuffle } = B.util;
  const GAP = /\{([^}]+)\}/g;

  function parse(q) {
    const parts = [];
    let last = 0;
    let m;
    GAP.lastIndex = 0;
    while ((m = GAP.exec(q))) {
      if (m.index > last) parts.push({ text: q.slice(last, m.index) });
      parts.push({ gap: m[1].split('|').map((s) => s.trim()) });
      last = m.index + m[0].length;
    }
    if (last < q.length) parts.push({ text: q.slice(last) });
    return parts;
  }

  const fill = (card, get) => parse(card.q).map((p, i) => (p.gap ? get(p, i) : p.text)).join('');

  B.ex.register('gap', {
    label: 'Fill the gaps',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string', 'gap needs "q" with {gaps}')) return e;
      B.ex.need(e, parse(c.q).some((p) => p.gap), 'gap needs at least one {gap} in "q"');
      return e;
    },

    describe: (c) => ({ q: show(c.q.replace(GAP, '___')), a: show(fill(c, (p) => p.gap[0])) }),

    render(card, root, api) {
      const parts = parse(card.q);
      const gaps = [];
      let locked = false;
      let active = 0;

      const sentence = h('div', { class: 'gap-sentence' });
      parts.forEach((p) => {
        if (!p.gap) {
          sentence.append(h('span', { html: md(show(p.text)) }));
          return;
        }
        const g = { answers: p.gap, chip: null };
        g.el = h('button', { type: 'button', class: 'gap-slot', 'aria-label': 'Empty gap', onClick: () => tapGap(g) });
        gaps.push(g);
        sentence.append(g.el);
      });

      const chipWords = shuffle(gaps.map((g) => g.answers[0]).concat(card.options || []));
      const bank = h('div', { class: 'chip-bank' });
      const chips = chipWords.map((w) => {
        const el = h('button', { type: 'button', class: 'chip', onClick: () => tapChip(c) }, show(w));
        const slot = h('div', { class: 'slot' }, h('span', { class: 'tile-shadow chip-shadow', 'aria-hidden': 'true' }, show(w)), el);
        const c = { w, el, slot, gap: null };
        bank.append(slot);
        return c;
      });
      const allEls = () => chips.map((c) => c.el);

      function paint() {
        const firstEmpty = gaps.findIndex((g) => !g.chip);
        if (gaps[active] && gaps[active].chip && firstEmpty >= 0) active = firstEmpty;
        gaps.forEach((g, i) => {
          g.el.classList.toggle('active', !locked && i === active && !g.chip);
          g.el.classList.toggle('has-chip', !!g.chip);
          g.el.setAttribute('aria-label', g.chip ? `Gap: ${show(g.chip.w)} (tap to remove)` : 'Empty gap');
        });
        api.changed(gaps.every((g) => g.chip));
      }

      function tapChip(c) {
        if (locked) return;
        api.sfx('tap');
        if (c.gap) return tapGap(c.gap);
        let g = gaps[active] && !gaps[active].chip ? gaps[active] : gaps.find((x) => !x.chip);
        if (!g) {
          // every gap is full: swap with the active gap's chip
          g = gaps[active] || gaps[0];
          unplace(g);
        }
        flip(allEls(), () => {
          g.el.append(c.el);
          g.chip = c;
          c.gap = g;
        });
        active = gaps.indexOf(g) + 1;
        if (active >= gaps.length || gaps[active].chip) active = Math.max(0, gaps.findIndex((x) => !x.chip));
        paint();
      }

      function unplace(g) {
        const c = g.chip;
        if (!c) return;
        c.slot.append(c.el);
        c.gap = null;
        g.chip = null;
      }

      function tapGap(g) {
        if (locked) return;
        if (g.chip) {
          api.sfx('tap');
          flip(allEls(), () => unplace(g));
        }
        active = gaps.indexOf(g);
        paint();
      }

      root.append(B.ex.header(card, 'Fill in the gaps', { noBubble: true }), h('div', { class: 'gap-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), sentence), bank);
      paint();

      const filledWith = () => fill(card, (p, i) => {
        const g = gaps[parts.slice(0, i).filter((x) => x.gap).length];
        return g.chip ? g.chip.w : '___';
      });

      return {
        check() {
          const ok = gaps.every((g) => g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w)));
          return { ok, given: show(filledWith()) };
        },
        solution() {
          const html = parts.map((p) => (p.gap ? `<strong class="sol-mark">${md(show(p.gap[0]))}</strong>` : md(show(p.text)))).join('');
          return { html, say: show(fill(card, (p) => p.gap[0])) };
        },
        lock() {
          locked = true;
          gaps.forEach((g) => {
            const ok = g.chip && g.answers.some((a) => norm(a) === norm(g.chip.w));
            g.el.classList.add(ok ? 'good' : 'bad');
            g.el.disabled = true;
          });
          chips.forEach((c) => (c.el.disabled = true));
          paint();
        },
        key(e) {
          const n = parseInt(e.key, 10);
          const free = chips.filter((c) => !c.gap);
          if (n >= 1 && n <= free.length) {
            tapChip(free[n - 1]);
            return true;
          }
          return false;
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/sort.js */
/*
 * Sort words into groups (der / die / das, haben / sein, present / past …).
 *   { type: 'sort', prompt, buckets: [{ label: 'der', sub: 'masculine', items: ['Zug', 'Bus'] }, …] }
 * Tap a word, then tap a group — or drag the word onto the group.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, flip, shuffle } = B.util;

  B.ex.register('sort', {
    label: 'Sort into groups',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, Array.isArray(c.buckets) && c.buckets.length >= 2 && c.buckets.length <= 4, 'sort needs 2–4 "buckets"')) return e;
      B.ex.need(e, c.buckets.every((b) => b.label && Array.isArray(b.items) && b.items.length), 'each bucket needs a label and items');
      const items = c.buckets.flatMap((b) => b.items || []);
      B.ex.need(e, new Set(items).size === items.length, 'an item appears twice');
      B.ex.need(e, items.length <= 12, 'at most 12 items');
      return e;
    },

    describe: (c) => ({ q: c.prompt || 'Sort into groups', a: c.buckets.map((b) => `${show(b.label)}: ${b.items.map(show).join(', ')}`).join(' | ') }),

    render(card, root, api) {
      let locked = false;
      let sel = null;
      const pool = h('div', { class: 'sort-pool', 'aria-label': 'Words to sort', onClick: () => dropInto(-1) });
      const zones = card.buckets.map((b, bi) => {
        const items = h('div', { class: 'bucket-items' });
        const el = h('div', { class: 'bucket', role: 'button', tabindex: '0', 'aria-label': `Group ${show(b.label)}`, onClick: () => dropInto(bi) },
          h('div', { class: 'bucket-head' }, h('span', { class: 'bucket-label', html: md(show(b.label)) }), b.sub ? h('span', { class: 'bucket-sub' }, show(b.sub)) : null),
          items);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            dropInto(bi);
          }
        });
        return { el, items };
      });

      const chips = shuffle(card.buckets.flatMap((b, bi) => b.items.map((text) => ({ text, correct: bi, where: -1 }))));
      chips.forEach((c) => {
        c.el = h('button', { type: 'button', class: 'chip sort-chip' }, show(c.text));
        c.el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (locked) return;
          api.sfx('tap');
          sel = sel === c ? null : c;
          paint();
        });
        B.drag.attach(c.el, {
          enabled: () => !locked,
          onStart: () => {
            sel = null;
            paint();
          },
          onMove(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz, i) => zz.el.classList.toggle('hover', z === i));
            pool.classList.toggle('hover', z === -1 && c.where !== -1);
          },
          onEnd(ctx) {
            const z = zoneAt(ctx.over);
            zones.forEach((zz) => zz.el.classList.remove('hover'));
            pool.classList.remove('hover');
            if (z !== null) place(c, z);
            api.sfx('drop');
            return c.el;
          },
        });
        pool.append(c.el);
      });

      function zoneAt(node) {
        if (!node || !node.closest) return null;
        const b = node.closest('.bucket');
        if (b) return zones.findIndex((z) => z.el === b);
        if (node.closest('.sort-pool')) return -1;
        return null;
      }

      function place(c, where) {
        if (c.where === where) return;
        flip(chips.map((x) => x.el), () => {
          (where === -1 ? pool : zones[where].items).append(c.el);
          c.where = where;
        });
      }

      function dropInto(where) {
        if (locked || !sel) return;
        api.sfx('drop');
        place(sel, where);
        sel = null;
        paint();
      }

      function paint() {
        chips.forEach((c) => {
          c.el.classList.toggle('sel', sel === c);
          c.el.setAttribute('aria-pressed', String(sel === c));
        });
        zones.forEach((z) => z.el.classList.toggle('target', !!sel));
        pool.classList.toggle('empty', chips.every((c) => c.where !== -1));
        api.changed(chips.every((c) => c.where !== -1));
      }

      // keep the "ready" state in sync after drags too
      const obs = new MutationObserver(paint);
      obs.observe(pool, { childList: true });

      root.append(
        B.ex.header(card, 'Sort the words into the right group'),
        pool,
        h('div', { class: 'buckets buckets-' + zones.length }, zones.map((z) => z.el))
      );
      paint();

      return {
        check() {
          const wrong = chips.filter((c) => c.where !== c.correct);
          return {
            ok: wrong.length === 0,
            given: wrong.length ? wrong.map((c) => `${show(c.text)} → ${show(card.buckets[c.where] ? card.buckets[c.where].label : '?')}`).join(', ') : 'all correct',
          };
        },
        solution: () => ({
          html: `<div class="sol-buckets">${card.buckets.map((b) => `<div><strong>${md(show(b.label))}:</strong> ${b.items.map((x) => md(show(x))).join(', ')}</div>`).join('')}</div>`,
        }),
        lock() {
          locked = true;
          sel = null;
          obs.disconnect();
          paint();
          zones.forEach((z) => z.el.classList.remove('target'));
          chips.forEach((c) => {
            c.el.disabled = true;
            const ok = c.where === c.correct;
            c.el.classList.add(ok ? 'good' : 'bad');
            if (!ok) c.el.append(h('span', { class: 'chip-fix' }, '→ ' + show(card.buckets[c.correct].label)));
          });
        },
      };
    },
  });
})();

</script>
  <script>/* js/exercises/spot.js */
/*
 * Spot the mistake: tap the one wrong word in the sentence.
 *   { type: 'spot', q: 'Ich habe nach München umgezogen.', wrong: 'habe', correct: 'bin' }
 * Optional: at (word index, if the wrong word appears twice), fixed (full corrected sentence).
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, show, norm } = B.util;

  const bare = (t) => t.replace(/[.,!?;:…]+$/, '');
  const tokens = (q) => q.trim().split(/\s+/);
  const wrongIndex = (c) => (Number.isInteger(c.at) ? c.at : tokens(c.q).findIndex((t) => norm(bare(t)) === norm(c.wrong)));

  function corrected(c) {
    if (c.fixed) return c.fixed;
    const t = tokens(c.q);
    const i = wrongIndex(c);
    t[i] = c.correct + t[i].slice(bare(t[i]).length);
    return t.join(' ');
  }

  B.ex.register('spot', {
    label: 'Spot the mistake',

    validate(c) {
      const e = [];
      if (!B.ex.need(e, typeof c.q === 'string' && c.wrong && c.correct, 'spot needs "q", "wrong" and "correct"')) return e;
      B.ex.need(e, wrongIndex(c) >= 0, `"${c.wrong}" is not a word in the sentence`);
      return e;
    },

    describe: (c) => ({ q: c.q, a: `${show(c.wrong)} → ${show(c.correct)}: ${show(corrected(c))}` }),

    render(card, root, api) {
      const words = tokens(card.q);
      const wi = wrongIndex(card);
      let sel = -1;
      let locked = false;

      const line = h('div', { class: 'spot-line' });
      const btns = words.map((w, i) => {
        const b = h('button', { type: 'button', class: 'spot-word', 'aria-pressed': 'false', onClick: () => choose(i) }, show(w));
        line.append(b);
        return b;
      });

      function choose(i) {
        if (locked) return;
        sel = sel === i ? -1 : i;
        btns.forEach((b, j) => {
          b.classList.toggle('sel', j === sel);
          b.setAttribute('aria-pressed', String(j === sel));
        });
        api.sfx('tap');
        api.changed(sel >= 0);
      }

      root.append(
        B.ex.header(card, 'Tap the word that is **wrong**', { noBubble: true }),
        h('div', { class: 'spot-card' }, h('span', { class: 'mascot mini', 'aria-hidden': 'true' }, '🥨'), line)
      );

      const fix = corrected(card);
      return {
        check: () => ({ ok: sel === wi, given: sel >= 0 ? `“${show(bare(words[sel]))}”` : '—' }),
        solution: () => ({
          html: `<span class="sol-strike">${md(show(bare(words[wi])))}</span> → <strong>${md(show(card.correct))}</strong><div class="sol-fix">✔ ${md(show(fix))}</div>`,
          say: show(fix),
        }),
        lock(res) {
          locked = true;
          btns.forEach((b, j) => {
            b.disabled = true;
            if (j === wi) {
              b.classList.add(res.ok ? 'good' : 'was-wrong');
              b.after(h('span', { class: 'spot-fix' }, show(card.correct) + words[wi].slice(bare(words[wi]).length)));
              b.classList.add('struck');
            } else if (j === sel) b.classList.add('bad');
          });
        },
      };
    },
  });
})();

</script>

  <script>/* js/ui/charts.js */
/*
 * Small dependency-free charts for the review screen.
 *   card({title, sub, legend, body, table})  – chart frame with legend + "Table" toggle
 *   stacked(rows, series)                    – horizontal stacked bars (HTML)
 *   bars(rows)                               – single-series horizontal bars (HTML)
 *   line(points)                             – line chart with crosshair (SVG)
 *   meter(value)                             – one-value progress meter
 * Colours come from CSS variables (--s1, --s2, --track, --grid) so dark mode
 * gets its own validated steps. Every mark has a hover/focus tooltip.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, pct } = B.util;
  const SVG = 'http://www.w3.org/2000/svg';

  // --- tooltip -------------------------------------------------------------
  let tipEl = null;
  function tipNode() {
    if (!tipEl) {
      tipEl = h('div', { class: 'chart-tip', role: 'tooltip' });
      document.body.append(tipEl);
    }
    return tipEl;
  }

  function showTip(lines, x, y) {
    const t = tipNode();
    t.replaceChildren(...lines.filter(Boolean).map((l, i) => h('div', { class: i === 0 ? 'tip-title' : 'tip-line' }, l)));
    t.classList.add('show');
    const r = t.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2));
    let top = y - r.height - 10;
    if (top < 8) top = y + 24;
    t.style.left = left + 'px';
    t.style.top = top + 'px';
  }

  function hideTip() {
    if (tipEl) tipEl.classList.remove('show');
  }
  window.addEventListener('scroll', hideTip, { passive: true, capture: true });
  window.addEventListener('pointerdown', (e) => {
    if (!e.target.closest || !e.target.closest('[data-tip]')) hideTip();
  });

  /** Attach a tooltip to an element (mouse hover, touch tap, keyboard focus). */
  function hover(el, lines) {
    el.dataset.tip = '1';
    const at = (e) => {
      const r = el.getBoundingClientRect();
      const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2;
      showTip(typeof lines === 'function' ? lines() : lines, x, r.top);
    };
    el.addEventListener('pointerenter', at);
    el.addEventListener('pointermove', (e) => e.pointerType === 'mouse' && at(e));
    el.addEventListener('pointerdown', at);
    el.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && hideTip());
    el.addEventListener('focus', () => at());
    el.addEventListener('blur', hideTip);
  }

  // --- frame -----------------------------------------------------------------
  function legendRow(items) {
    return h('ul', { class: 'legend' }, items.map((it) => h('li', {}, h('span', { class: 'sw ' + it.cls, 'aria-hidden': 'true' }), it.label)));
  }

  function dataTable({ head, rows }) {
    const numeric = (v) => typeof v === 'number' || /^[\d.,%/ —–-]+$/.test(String(v));
    return h('div', { class: 'table-scroll' },
      h('table', { class: 'data-table' },
        h('thead', {}, h('tr', {}, head.map((x, i) => h('th', { scope: 'col', class: i ? 'num' : null }, x)))),
        h('tbody', {}, rows.map((r) => h('tr', {}, r.map((v, i) => (i ? h('td', { class: numeric(v) ? 'num' : null }, String(v)) : h('th', { scope: 'row' }, String(v)))))))));
  }

  function card({ title, sub, legend, body, table, extra }) {
    const legendEl = legend && legend.length > 1 ? legendRow(legend) : null;
    const tableEl = table ? dataTable(table) : null;
    let toggle = null;
    if (tableEl) {
      tableEl.hidden = true;
      toggle = h('button', { class: 'chart-toggle', type: 'button', 'aria-pressed': 'false' }, 'Table');
      toggle.addEventListener('click', () => {
        const on = toggle.getAttribute('aria-pressed') !== 'true';
        toggle.setAttribute('aria-pressed', String(on));
        toggle.textContent = on ? 'Chart' : 'Table';
        tableEl.hidden = !on;
        body.hidden = on;
        if (legendEl) legendEl.hidden = on;
        hideTip();
      });
    }
    return h('section', { class: 'chart-card card' },
      h('div', { class: 'chart-head' },
        h('div', {}, h('h3', { class: 'chart-title' }, title), sub ? h('p', { class: 'chart-sub' }, sub) : null),
        toggle),
      legendEl, body, tableEl, extra || null);
  }

  // --- stacked horizontal bars ------------------------------------------------
  /**
   * rows:   [{label, icon?, total, parts: [n, n], value: '24/38', badge?: Element}]
   * series: [{label, cls}] — one per part; the rest of the bar is the grey track.
   */
  function stacked(rows, series, { restLabel = 'Not mastered yet', unit = 'cards' } = {}) {
    const wrap = h('div', { class: 'hbars' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      const used = r.parts.reduce((a, b) => a + b, 0);
      r.parts.forEach((n, i) => {
        if (!n) return;
        const seg = h('div', { class: 'hbar-seg ' + series[i].cls, style: { width: (n / r.total) * 100 + '%' } });
        hover(seg, [r.label, `${series[i].label}: ${n} of ${r.total} ${unit} (${pct(n, r.total)}%)`]);
        track.append(seg);
      });
      const rest = r.total - used;
      if (rest > 0) {
        const seg = h('div', { class: 'hbar-seg hbar-rest' });
        hover(seg, [r.label, `${restLabel}: ${rest} of ${r.total} ${unit}`]);
        track.append(seg);
      }
      const aria = `${r.label}: ` + series.map((s, i) => `${s.label} ${r.parts[i]}`).join(', ') + `, ${restLabel.toLowerCase()} ${rest}, of ${r.total}` + (r.badgeText ? `. ${r.badgeText}` : '');
      wrap.append(
        h('div', { class: 'hbar-row', role: 'group', 'aria-label': aria },
          h('div', { class: 'hbar-label' },
            r.icon ? h('span', { class: 'hbar-icon', 'aria-hidden': 'true' }, r.icon) : null,
            h('span', { class: 'hbar-name', title: r.label }, r.label)),
          r.badge ? h('div', { class: 'hbar-badge' }, r.badge) : h('div', { class: 'hbar-badge' }),
          h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.value)))
      );
    }
    return wrap;
  }

  // --- single-series bars ------------------------------------------------------
  /** rows: [{label, value (0–100 or null), text: '82%', tip: [lines]}] */
  function bars(rows) {
    const wrap = h('div', { class: 'hbars hbars-single' });
    for (const r of rows) {
      const track = h('div', { class: 'hbar-track' });
      if (r.value) track.append(h('div', { class: 'hbar-seg s1', style: { width: r.value + '%' } }));
      if (r.value < 100) track.append(h('div', { class: 'hbar-seg hbar-rest' }));
      const row = h('div', { class: 'hbar-row', tabindex: '0', 'aria-label': `${r.label}: ${r.text}` },
        h('div', { class: 'hbar-label' }, h('span', { class: 'hbar-name', title: r.label }, r.label)),
        h('div', { class: 'hbar-badge' }),
        h('div', { class: 'hbar-main' }, track, h('span', { class: 'hbar-value' }, r.text)));
      hover(row, r.tip || [r.label, r.text]);
      wrap.append(row);
    }
    return wrap;
  }

  // --- line chart -------------------------------------------------------------
  const svg = (tag, attrs) => {
    const el = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    return el;
  };

  /**
   * points: [{x: 'label under the axis', y: 0–100, tip: [lines]}]
   * Re-draws itself when its container is resized.
   */
  function line(points, { yMax = 100, yFmt = (v) => v + '%', height = 210, ariaLabel = 'Line chart' } = {}) {
    const box = h('div', { class: 'line-chart', tabindex: '0', role: 'img', 'aria-label': ariaLabel });
    let active = -1;
    let geom = null;

    function draw() {
      const W = Math.max(260, Math.round(box.clientWidth || 600));
      const H = height;
      const m = { l: 40, r: 14, t: 14, b: 30 };
      const iw = W - m.l - m.r;
      const ih = H - m.t - m.b;
      const n = points.length;
      const xAt = (i) => m.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      const yAt = (v) => m.t + ih - (v / yMax) * ih;
      geom = { xAt, yAt, m, W, H };

      const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
      for (const v of [0, 25, 50, 75, 100]) {
        root.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: yAt(v), y2: yAt(v) }));
        const t = svg('text', { class: 'axis', x: m.l - 8, y: yAt(v) + 4, 'text-anchor': 'end' });
        t.textContent = yFmt(v);
        root.append(t);
      }
      // x labels: first, last and a few in between
      const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 56))));
      points.forEach((p, i) => {
        if (i % every && i !== n - 1) return;
        if (i !== n - 1 && n - 1 - i < every / 2 && i !== 0) return;
        const t = svg('text', { class: 'axis', x: xAt(i), y: H - 8, 'text-anchor': 'middle' });
        t.textContent = p.x;
        root.append(t);
      });
      const cross = svg('line', { class: 'crosshair', x1: 0, x2: 0, y1: m.t, y2: m.t + ih, visibility: 'hidden' });
      root.append(cross);
      if (n > 1) {
        const d = points.map((p, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
        root.append(svg('path', { class: 'series s1-stroke', d }));
      }
      const dots = points.map((p, i) => {
        const c = svg('circle', { class: 'dot s1-fill' + (p.hollow ? ' hollow' : ''), cx: xAt(i), cy: yAt(p.y), r: n > 24 ? 3 : 4 });
        root.append(c);
        return c;
      });
      geom.cross = cross;
      geom.dots = dots;
      box.replaceChildren(root);
      if (active >= 0) focusPoint(active, false);
    }

    function focusPoint(i, showTooltip = true) {
      if (!geom || !points.length) return;
      active = Math.max(0, Math.min(points.length - 1, i));
      const x = geom.xAt(active);
      geom.cross.setAttribute('x1', x);
      geom.cross.setAttribute('x2', x);
      geom.cross.setAttribute('visibility', 'visible');
      geom.dots.forEach((d, j) => d.classList.toggle('on', j === active));
      if (showTooltip) {
        const r = box.getBoundingClientRect();
        showTip(points[active].tip, r.left + x, r.top + geom.yAt(points[active].y));
      }
    }

    function clear() {
      if (!geom) return;
      geom.cross.setAttribute('visibility', 'hidden');
      geom.dots.forEach((d) => d.classList.remove('on'));
      active = -1;
      hideTip();
    }

    function nearest(clientX) {
      const r = box.getBoundingClientRect();
      const x = clientX - r.left;
      let best = 0;
      points.forEach((_, i) => {
        if (Math.abs(geom.xAt(i) - x) < Math.abs(geom.xAt(best) - x)) best = i;
      });
      return best;
    }

    box.dataset.tip = '1';
    box.addEventListener('pointermove', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerdown', (e) => focusPoint(nearest(e.clientX)));
    box.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && clear());
    box.addEventListener('focus', () => focusPoint(active >= 0 ? active : points.length - 1));
    box.addEventListener('blur', clear);
    box.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        focusPoint((active < 0 ? points.length - 1 : active) + (e.key === 'ArrowLeft' ? -1 : 1));
      }
    });

    if (typeof ResizeObserver === 'function') {
      let lastW = 0;
      new ResizeObserver(() => {
        const w = Math.round(box.clientWidth);
        if (w && w !== lastW) {
          lastW = w;
          draw();
        }
      }).observe(box);
    }
    requestAnimationFrame(draw);
    return box;
  }

  // --- meter -------------------------------------------------------------------
  function meter(value, label) {
    return h('div', { class: 'meter', role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(value), 'aria-label': label },
      h('div', { class: 'meter-fill s1', style: { width: value + '%' } }));
  }

  B.charts = { card, stacked, bars, line, meter, hover, hideTip, legendRow };
})();

</script>
  <script>/* js/ui/home.js */
/* Home screen: overall progress, session setup, topics with their grammar rules. */
(function () {
  'use strict';
  const B = window.Brezel;
  const { h, md, pct } = B.util;
  const SIZES = [10, 20, 50, 0]; // 0 = every remaining card

  B.ui = B.ui || {};

  function greeting() {
    const hr = new Date().getHours();
    if (hr < 11) return 'Guten Morgen!';
    if (hr < 18) return 'Guten Tag!';
    return 'Guten Abend!';
  }

  /** Progress ring (a meter for one value — the number is printed inside it). */
  function ring(done, total) {
    const r = 52;
    const C = 2 * Math.PI * r;
    const off = C * (1 - (total ? done / total : 0));
    const el = h('div', { class: 'ring', role: 'img', 'aria-label': `${done} of ${total} cards mastered` });
    el.innerHTML =
      `<svg viewBox="0 0 128 128" aria-hidden="true"><circle class="ring-track" cx="64" cy="64" r="${r}"/>` +
      `<circle class="ring-fill" cx="64" cy="64" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg>` +
      `<div class="ring-text"><b>${done}</b><span>/ ${total}</span></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const f = el.querySelector('.ring-fill');
      if (f) f.style.strokeDashoffset = off.toFixed(2);
    }));
    return el;
  }

  function statusBadge(s, extra) {
    if (!s || s.key === 'none') return null;
    return h('span', { class: 'badge badge-' + s.key }, h('span', { class: 'badge-icon', 'aria-hidden': 'true' }, s.icon), s.label + (extra ? ' · ' + extra : ''));
  }

  function currentStreak(st) {
    if (!st.last) return 0;
    const today = B.util.dayKey();
    const y = new Date();
    y.setDate(y.getDate() - 1);
    return st.last === today || st.last === B.util.dayKey(y) ? st.count : 0;
  }

  B.ui.statusBadge = statusBadge;

  B.ui.home = function (root) {
    const ov = B.stats.overview();
    const topics = B.stats.byTopic();
    let size = B.store.setting('size');
    if (!SIZES.includes(size)) size = 20;
    let topic = B.store.setting('topic');
    if (topic !== 'all' && !B.deck.topicMap[topic]) topic = 'all';

    // --- top bar -----------------------------------------------------------------
    const soundBtn = h('button', { class: 'icon-btn', type: 'button' });
    const paintSound = () => {
      const on = B.store.setting('sound');
      soundBtn.textContent = on ? '🔊' : '🔇';
      soundBtn.setAttribute('aria-label', on ? 'Sound on (tap to mute)' : 'Sound off (tap to unmute)');
      soundBtn.setAttribute('aria-pressed', String(!!on));
    };
    soundBtn.addEventListener('click', () => {
      B.store.setting('sound', !B.store.setting('sound'));
      paintSound();
      B.audio.play('tap');
    });
    paintSound();

    const themeBtn = h('button', { class: 'icon-btn', type: 'button' });
    const paintTheme = () => {
      const dark = B.app.isDark();
      themeBtn.textContent = dark ? '☀️' : '🌙';
      themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    };
    themeBtn.addEventListener('click', () => {
      B.app.toggleTheme();
      paintTheme();
    });
    paintTheme();

    const streak = currentStreak(ov.streak);
    const top = h('header', { class: 'home-top' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-logo', 'aria-hidden': 'true' }, '🥨'), h('span', { class: 'brand-name' }, 'Brezel')),
      h('div', { class: 'top-pills' },
        h('span', { class: 'pill pill-streak' + (streak ? '' : ' off'), title: 'Day streak' }, h('span', { 'aria-hidden': 'true' }, '🔥'), ' ', String(streak), h('span', { class: 'sr-only' }, ' day streak')),
        h('span', { class: 'pill pill-xp', title: 'Total XP' }, h('span', { 'aria-hidden': 'true' }, '⚡'), ' ', String(ov.xp), h('span', { class: 'sr-only' }, ' XP'))),
      h('div', { class: 'top-actions' }, soundBtn, themeBtn));

    // --- hero ---------------------------------------------------------------------
    const heroText = ov.complete
      ? h('div', { class: 'hero-text' },
        h('h1', {}, 'Alles fertig! 🎉'),
        h('p', {}, `You’ve mastered all ${ov.total} cards.`),
        h('p', { class: 'muted' }, 'Your detailed review is ready.'))
      : h('div', { class: 'hero-text' },
        h('h1', {}, greeting()),
        h('p', {}, ov.done ? `You’ve mastered ${ov.done} of ${ov.total} cards.` : `${ov.total} cards are waiting for you.`),
        h('p', { class: 'muted' },
          ov.done
            ? `${ov.total - ov.done} to go` + (ov.stillWrong ? ` · ${ov.stillWrong} need another try` : '')
            : 'Grammar first: word order, verbs, tenses, articles and more.'));
    const hero = h('section', { class: 'card hero' }, ring(ov.done, ov.total), heroText);

    // --- session setup --------------------------------------------------------------
    const startBtn = h('button', { class: 'btn btn-primary btn-big start-btn', type: 'button' });
    const startSub = h('p', { class: 'start-sub' });
    const sizeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Cards per session' });
    const sizeBtns = SIZES.map((n) => {
      const b = h('button', { type: 'button', class: 'seg-btn' }, n ? String(n) : 'All');
      b.addEventListener('click', () => {
        size = B.store.setting('size', n);
        B.audio.play('tap');
        paintSetup();
      });
      sizeSeg.append(b);
      return { n, b };
    });

    const chipRow = h('div', { class: 'topic-chips', role: 'group', 'aria-label': 'Topic' });
    const chipBtns = [{ id: 'all', icon: '✨', name: 'All topics' }].concat(B.deck.topics).map((t) => {
      const b = h('button', { type: 'button', class: 'topic-chip' }, h('span', { 'aria-hidden': 'true' }, t.icon), ' ', t.name);
      b.addEventListener('click', () => selectTopic(t.id));
      chipRow.append(b);
      return { id: t.id, b };
    });

    function selectTopic(id, scroll) {
      topic = B.store.setting('topic', id);
      B.audio.play('tap');
      paintSetup();
      const chip = chipBtns.find((c) => c.id === id);
      if (chip && chip.b.scrollIntoView) chip.b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: B.util.reducedMotion() ? 'auto' : 'smooth' });
      if (scroll) setup.scrollIntoView({ block: 'start', behavior: B.util.reducedMotion() ? 'auto' : 'smooth' });
    }

    function paintSetup() {
      const pending = B.stats.pending(topic).length;
      const n = size ? Math.min(size, pending) : pending;
      sizeBtns.forEach(({ n: k, b }) => b.setAttribute('aria-pressed', String(k === size)));
      chipBtns.forEach(({ id, b }) => b.setAttribute('aria-pressed', String(id === topic)));
      topicCards.forEach(({ id, el }) => el.classList.toggle('is-selected', id === topic));
      const tName = topic === 'all' ? 'all topics' : B.deck.topicMap[topic].name;
      if (!pending) {
        startBtn.disabled = true;
        startBtn.textContent = 'Topic complete ✓';
        startSub.textContent = 'Every card here is mastered — pick another topic.';
      } else {
        startBtn.disabled = false;
        startBtn.textContent = 'Start';
        startSub.textContent = `${n} card${n === 1 ? '' : 's'} · ${tName} · ${pending} left to master`;
      }
    }

    startBtn.addEventListener('click', () => B.app.go('session', { topic, size }));

    const mistakes = ov.mistakes;
    const practiseBtn = h('button', { class: 'btn btn-outline', type: 'button', disabled: !mistakes },
      h('span', { 'aria-hidden': 'true' }, '🔁 '), `Practise mistakes${mistakes ? ` (${mistakes})` : ''}`);
    practiseBtn.addEventListener('click', () => B.app.go('session', { practice: true, size }));
    const reportBtn = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '📊 '), ov.complete ? 'Detailed review' : 'Progress report');
    reportBtn.addEventListener('click', () => B.app.go('review'));

    let setup;
    if (ov.complete) {
      const reviewBtn = h('button', { class: 'btn btn-primary btn-big', type: 'button' }, 'See my detailed review');
      reviewBtn.addEventListener('click', () => B.app.go('review'));
      const againBtn = h('button', { class: 'btn btn-outline', type: 'button' }, h('span', { 'aria-hidden': 'true' }, '↺ '), 'Start over');
      againBtn.addEventListener('click', resetAll);
      setup = h('section', { class: 'card setup' },
        h('h2', { class: 'section-title' }, 'What next?'),
        reviewBtn,
        h('div', { class: 'home-links' }, practiseBtn, againBtn));
    } else {
      setup = h('section', { class: 'card setup' },
        h('h2', { class: 'section-title' }, 'New session'),
        h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Cards'), sizeSeg),
        h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Topic'), chipRow),
        startBtn,
        startSub,
        h('div', { class: 'home-links' }, practiseBtn, reportBtn));
    }

    // --- topics ------------------------------------------------------------------------
    const topicCards = topics.map((t) => {
      const tipId = 'tip-' + t.topic.id;
      const tip = h('div', { class: 'topic-tip', id: tipId, hidden: true, html: md(t.topic.tip || '') });
      const ruleBtn = h('button', { class: 'link-btn rule-btn', type: 'button', 'aria-expanded': 'false', 'aria-controls': tipId }, h('span', { 'aria-hidden': 'true' }, '📖 '), 'Rule');
      ruleBtn.addEventListener('click', () => {
        const open = tip.hidden;
        tip.hidden = !open;
        ruleBtn.setAttribute('aria-expanded', String(open));
        if (open) B.util.pulse(tip, 'reveal');
      });
      const main = h('button', { class: 'topic-main', type: 'button', 'aria-label': `${t.topic.name}: ${t.done} of ${t.total} mastered. Select topic.` },
        h('span', { class: 'topic-icon', 'aria-hidden': 'true' }, t.topic.icon),
        h('span', { class: 'topic-text' }, h('b', {}, t.topic.name), h('small', {}, t.topic.de)),
        h('span', { class: 'topic-count' }, t.done === t.total ? '✓' : `${t.done}/${t.total}`));
      main.addEventListener('click', () => selectTopic(t.topic.id, true));
      const bar = h('div', { class: 'mini-bar', 'aria-hidden': 'true' }, h('span', { style: { width: pct(t.done, t.total) + '%' } }));
      const el = h('article', { class: 'topic-card' + (t.done === t.total ? ' is-complete' : '') },
        main, bar,
        h('div', { class: 'topic-foot' }, statusBadge(t.status, t.attempted >= B.stats.MIN_CARDS ? `${t.firstPct}% first try` : '') || h('span', { class: 'muted small' }, t.attempted ? `${t.attempted} tried` : 'Not started'), ruleBtn),
        tip);
      return { id: t.topic.id, el };
    });

    async function resetAll() {
      const ok = await B.app.confirm({
        title: 'Start over?',
        text: 'This deletes all your progress, XP and statistics. The cards stay the same.',
        ok: 'Delete progress',
        cancel: 'Cancel',
        danger: true,
      });
      if (!ok) return;
      B.store.reset();
      B.app.toast('Progress reset — viel Erfolg! 🍀');
      B.app.go('home');
    }

    const resetBtn = h('button', { class: 'link-btn danger', type: 'button' }, 'Reset progress');
    resetBtn.addEventListener('click', resetAll);

    root.append(
      top,
      h('main', { class: 'home' },
        hero,
        setup,
        h('section', { class: 'topics' },
          h('h2', { class: 'section-title' }, 'Topics'),
          h('p', { class: 'muted small topics-help' }, 'Tap a topic to practise only that. Open 📖 Rule for a quick reminder.'),
          h('div', { class: 'topic-grid' }, topicCards.map((t) => t.el))),
        h('footer', { class: 'home-foot' }, resetBtn, h('p', { class: 'muted small' }, 'Progress is saved in this browser on this device.')))
    );
    if (!ov.complete) paintSetup();
    else topicCards.forEach(({ el }) => el.querySelector('.topic-main').setAttribute('disabled', ''));

    return {
      onKey(e) {
        if (e.key === 'Enter' && e.target === document.body && !ov.complete && !startBtn.disabled) {
          e.preventDefault();
          startBtn.click();
        }
      },
    };
  };
})();
