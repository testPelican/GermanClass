/*
 * Brezel — German grammar flashcards.
 * Duolingo-style look: chunky 3D buttons, rounded cards, bright feedback.
 * Light/dark themes are set on <html data-theme="light|dark"> by js/app.js.
 */

/* === Tokens ================================================================= */
:root,
[data-theme='light'] {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f7f7;
  --surface-3: #eeeeee;
  --border: #e5e5e5;
  --border-strong: #cfcfcf;
  --text: #3c3c3c;
  --text-2: #4b4b4b;
  --muted: #6b6b6b;
  --faint: #afafaf;

  --green: #58cc02;
  --green-shadow: #58a700;
  --on-green: #ffffff;
  --red: #ff4b4b;
  --red-shadow: #ea2b2b;
  --on-red: #ffffff;
  --blue: #1cb0f6;
  --blue-shadow: #1899d6;
  --on-blue: #ffffff;
  --blue-soft: #ddf4ff;
  --blue-soft-shadow: #84d8ff;
  --blue-ink: #0b6699;
  --link: #0f76b0;

  --good-bg: #d7ffb8;
  --good-ink: #2b7a00;
  --good-line: #58cc02;
  --bad-bg: #ffdfe0;
  --bad-ink: #b3261e;
  --bad-line: #ff4b4b;
  --orange: #ff9600;
  --orange-ink: #a35a00;
  --orange-soft: #fff1dc;
  --gold: #ffc800;
  --hint-bg: #fff4d6;
  --hint-ink: #5c3d00;
  --disabled-bg: #e5e5e5;
  --disabled-text: #afafaf;

  /* charts (validated palette) */
  --s1: #2a78d6;
  --s2: #eb6834;
  --track: #e5e5e5;
  --grid: #ececec;
  --status-good: #0ca30c;
  --status-warn: #fab219;
  --status-bad: #d03b3b;
  --tip-bg: #1f2d33;
  --tip-text: #ffffff;

  --overlay: rgba(0, 0, 0, 0.45);
  --lift: 0 10px 30px rgba(0, 0, 0, 0.12);
  --focus: #1cb0f6;

  /* match-pair colours (identity only; each pair also gets a number) */
  --pc0: #1cb0f6;
  --pc1: #ce82ff;
  --pc2: #ff9600;
  --pc3: #ff86d0;
  --pc4: #00c2a8;
  --pc5: #ffc800;
  --pc-tint: 14%;
}

[data-theme='dark'] {
  color-scheme: dark;
  --bg: #131f24;
  --surface: #131f24;
  --surface-2: #202f36;
  --surface-3: #2a3a42;
  --border: #37464f;
  --border-strong: #52656d;
  --text: #f1f7fb;
  --text-2: #dce6ec;
  --muted: #a0aeb6;
  --faint: #52656d;

  --green: #93d333;
  --green-shadow: #79b933;
  --on-green: #131f24;
  --red: #ff4b4b;
  --red-shadow: #d33131;
  --on-red: #131f24;
  --blue: #49c0f8;
  --blue-shadow: #1899d6;
  --on-blue: #131f24;
  --blue-soft: #193747;
  --blue-soft-shadow: #3f85a7;
  --blue-ink: #8fd8fb;
  --link: #49c0f8;

  --good-bg: #1f3a24;
  --good-ink: #93d333;
  --good-line: #79b933;
  --bad-bg: #3a2328;
  --bad-ink: #ff8a80;
  --bad-line: #ee5555;
  --orange-ink: #ffb449;
  --orange-soft: #3a2c17;
  --hint-bg: #33301c;
  --hint-ink: #ffe28a;
  --disabled-bg: #37464f;
  --disabled-text: #6f838c;

  --s1: #3987e5;
  --s2: #d95926;
  --track: #37464f;
  --grid: #26353c;
  --tip-bg: #f1f7fb;
  --tip-text: #131f24;

  --overlay: rgba(0, 0, 0, 0.6);
  --lift: 0 10px 30px rgba(0, 0, 0, 0.45);
  --pc-tint: 22%;
}

/* === Base =================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.25s ease, color 0.25s ease;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

button:disabled {
  cursor: default;
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.2;
  font-weight: 800;
}

p {
  margin: 0;
}

strong,
b {
  font-weight: 800;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 14px;
}

.noscript {
  padding: 40px 20px;
  text-align: center;
  font-weight: 700;
}

.app {
  min-height: 100vh;
  min-height: 100dvh;
}

.screen {
  animation: screen-in 0.28s ease both;
}

.card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 18px;
}

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin: 0 0 12px;
}

/* === Buttons ================================================================ */
.btn {
  --btn-bg: var(--surface);
  --btn-fg: var(--text);
  --btn-border: var(--border);
  --btn-shadow: var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 50px;
  padding: 0 22px;
  border: 2px solid var(--btn-border);
  border-radius: 16px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  box-shadow: 0 4px 0 var(--btn-shadow);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.15;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}

.btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--btn-shadow);
}

.btn-primary {
  --btn-bg: var(--green);
  --btn-fg: var(--on-green);
  --btn-border: var(--green);
  --btn-shadow: var(--green-shadow);
}

.btn-danger {
  --btn-bg: var(--red);
  --btn-fg: var(--on-red);
  --btn-border: var(--red);
  --btn-shadow: var(--red-shadow);
}

.btn-outline {
  --btn-fg: var(--link);
}

.btn-outline.danger-text {
  --btn-fg: var(--bad-ink);
}

.btn-ghost {
  --btn-bg: transparent;
  --btn-fg: var(--muted);
}

.btn:disabled,
.btn:disabled:hover {
  --btn-bg: var(--disabled-bg);
  --btn-fg: var(--disabled-text);
  --btn-border: var(--disabled-bg);
  --btn-shadow: transparent;
  filter: none;
}

.btn-outline:disabled,
.btn-ghost:disabled {
  --btn-bg: transparent;
  --btn-border: var(--border);
}

.btn-big {
  width: 100%;
  min-height: 54px;
  font-size: 17px;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.icon-btn:active {
  transform: scale(0.92);
}

.link-btn {
  padding: 4px 2px;
  border: 0;
  background: none;
  color: var(--link);
  font-weight: 800;
  font-size: 14px;
  border-radius: 6px;
}

.link-btn.danger {
  color: var(--bad-ink);
}

.speak-btn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  box-shadow: 0 4px 0 var(--blue-shadow);
  font-size: 20px;
  line-height: 1;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.speak-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--blue-shadow);
}

@media (hover: hover) {
  .btn:hover:not(:disabled) {
    filter: brightness(1.05);
  }
  .btn-outline:hover:not(:disabled),
  .btn-ghost:hover:not(:disabled) {
    --btn-bg: var(--surface-2);
    filter: none;
  }
  .icon-btn:hover {
    background: var(--surface-2);
  }
  .link-btn:hover {
    text-decoration: underline;
  }
  .speak-btn:hover {
    filter: brightness(1.06);
  }
}

/* === Pills & badges ========================================================== */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-height: 34px;
  padding: 4px 12px;
  border: 2px solid var(--border);
  border-radius: 999px;
  font-weight: 800;
  font-size: 15px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.pill-streak {
  color: var(--orange-ink);
}

.pill-streak.off {
  color: var(--muted);
  filter: grayscale(1);
}

.pill-xp {
  color: var(--text);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px 3px 3px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.3;
  color: var(--text);
  white-space: nowrap;
}

.badge-icon {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 900;
  line-height: 1;
  color: #ffffff;
}

.badge-good {
  background: rgba(12, 163, 12, 0.13);
}
.badge-good .badge-icon {
  background: var(--status-good);
}
.badge-warn {
  background: rgba(250, 178, 25, 0.2);
}
.badge-warn .badge-icon {
  background: var(--status-warn);
  color: #3a2a00;
}
.badge-bad {
  background: rgba(208, 59, 59, 0.13);
}
.badge-bad .badge-icon {
  background: var(--status-bad);
}

[data-theme='dark'] .badge-good {
  background: rgba(12, 163, 12, 0.22);
}
[data-theme='dark'] .badge-warn {
  background: rgba(250, 178, 25, 0.2);
}
[data-theme='dark'] .badge-bad {
  background: rgba(208, 59, 59, 0.26);
}

.topic-tag,
.type-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

/* === Progress bars ============================================================ */
.progress {
  position: relative;
  flex: 1;
  height: 16px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.progress.big {
  height: 20px;
  margin: 10px 0 8px;
}

.progress-fill {
  position: relative;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: var(--green);
  transition: width 0.55s cubic-bezier(0.3, 0.9, 0.3, 1.1);
}

.progress.has-progress .progress-fill,
.progress.big .progress-fill {
  min-width: 16px;
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 4px;
  left: 8px;
  right: 8px;
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.35);
}

.progress.big .progress-fill[style*='width: 0%'] {
  min-width: 0;
}

/* === Home ======================================================================== */
.home-top,
.page-top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bg);
  border-bottom: 2px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: auto;
}

.brand-logo {
  font-size: 30px;
  line-height: 1;
  display: inline-block;
  transform-origin: 50% 70%;
  animation: wobble 3.5s ease-in-out 1s infinite;
}

.brand-name {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: var(--green);
}

[data-theme='light'] .brand-name {
  color: var(--green-shadow);
}

.top-pills {
  display: flex;
  gap: 8px;
}

.top-actions {
  display: flex;
  gap: 2px;
}

.home {
  max-width: 1040px;
  margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}

.home > * {
  animation: rise-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.home > :nth-child(2) {
  animation-delay: 0.05s;
}
.home > :nth-child(3) {
  animation-delay: 0.1s;
}
.home > :nth-child(4) {
  animation-delay: 0.15s;
}

.hero {
  display: flex;
  align-items: center;
  gap: 20px;
}

.hero-text h1 {
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 6px;
}

.hero-text p {
  font-size: 16px;
}

.hero-text p + p {
  margin-top: 4px;
}

.ring {
  position: relative;
  width: 120px;
  height: 120px;
  flex: none;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring circle {
  fill: none;
  stroke-width: 12;
}

.ring-track {
  stroke: var(--track);
}

.ring-fill {
  stroke: var(--green);
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.3, 0.8, 0.3, 1);
}

.ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.05;
}

.ring-text b {
  font-size: 30px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.ring-text span {
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
}

.setup .field {
  margin-bottom: 14px;
}

.field-label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 2px solid var(--border);
  border-radius: 16px;
}

.seg-btn {
  flex: 1;
  min-height: 40px;
  border: 2px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
  font-size: 16px;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.seg-btn[aria-pressed='true'] {
  background: var(--blue-soft);
  border-color: var(--blue);
  color: var(--blue-ink);
}

.topic-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  margin: 0 -2px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.topic-chips::-webkit-scrollbar {
  display: none;
}

.topic-chip {
  flex: none;
  scroll-snap-align: start;
  min-height: 40px;
  padding: 6px 14px;
  border: 2px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}

.topic-chip:active {
  transform: translateY(2px);
  box-shadow: none;
}

.topic-chip[aria-pressed='true'] {
  background: var(--blue-soft);
  border-color: var(--blue);
  box-shadow: 0 2px 0 var(--blue-soft-shadow);
  color: var(--blue-ink);
}

.start-btn {
  margin-top: 4px;
}

.start-sub {
  margin: 10px 0 14px;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.home-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.home-links .btn {
  flex: 1 1 200px;
  min-height: 46px;
  padding: 0 14px;
  font-size: 14px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.setup .btn-big + .home-links {
  margin-top: 14px;
}

.topics .section-title {
  margin-bottom: 2px;
}

.topics-help {
  margin-bottom: 12px;
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}

.topic-card {
  display: grid;
  gap: 10px;
  align-content: start;
  padding: 12px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-bottom-width: 4px;
  border-radius: 18px;
  transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
}

.topic-card.is-selected {
  border-color: var(--blue);
  background: color-mix(in srgb, var(--blue-soft) 45%, var(--surface));
}

.topic-main {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  border-radius: 12px;
}

.topic-main:disabled {
  cursor: default;
}

.topic-icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: 14px;
  background: var(--surface-2);
  font-size: 26px;
  line-height: 1;
  transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.topic-text {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.topic-text b {
  font-size: 16px;
}

.topic-text small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
}

.topic-count {
  flex: none;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.topic-card.is-complete .topic-count {
  background: var(--good-bg);
  color: var(--good-ink);
}

.mini-bar {
  height: 10px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.mini-bar span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--green);
  transition: width 0.8s ease;
}

.topic-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
}

.topic-tip {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 14px;
  line-height: 1.6;
}

.topic-tip.reveal {
  animation: reveal 0.28s ease both;
}

.home-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding-top: 8px;
  text-align: center;
}

@media (hover: hover) {
  .topic-card:hover {
    border-color: var(--border-strong);
  }
  .topic-card.is-selected:hover {
    border-color: var(--blue);
  }
  .topic-card:hover .topic-icon {
    transform: scale(1.08) rotate(-4deg);
  }
  .topic-chip:hover {
    background: var(--surface-2);
  }
  .topic-chip[aria-pressed='true']:hover {
    background: var(--blue-soft);
  }
  .seg-btn:hover:not([aria-pressed='true']) {
    background: var(--surface-2);
  }
}

@media (min-width: 880px) {
  .home {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    padding-top: 24px;
  }
  .home .topics,
  .home .home-foot {
    grid-column: 1 / -1;
  }
  .hero {
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .ring {
    width: 160px;
    height: 160px;
  }
  .ring-text b {
    font-size: 40px;
  }
  .topic-chips {
    flex-wrap: wrap;
    overflow: visible;
  }
}

/* === Session layout ================================================================ */
.screen-session {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.session {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.s-top {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  padding-top: max(12px, env(safe-area-inset-top));
  flex: none;
}

.quit-btn {
  font-size: 24px;
  color: var(--faint);
}

.total-pill {
  border-color: transparent;
  padding: 4px 6px;
  color: var(--text);
}

.total-pill .of {
  color: var(--muted);
  font-weight: 700;
}

.total-pill.bump {
  animation: bump 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.is-practice .progress-fill {
  background: var(--blue);
}

.combo-flag {
  position: absolute;
  top: calc(64px + env(safe-area-inset-top));
  left: 50%;
  z-index: 30;
  padding: 8px 16px;
  border: 2px solid var(--orange);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--lift);
  color: var(--text);
  font-weight: 900;
  font-size: 16px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -12px);
}

.combo-flag.show {
  animation: combo 1.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.s-stage {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 10px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left));
}

.s-card {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-top: 8px;
}

.s-card.enter {
  animation: card-in 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.s-card.leave {
  animation: card-out 0.17s ease-in both;
}

.s-card.shake {
  animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.again-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--orange-soft);
  color: var(--orange-ink);
  font-size: 13px;
  font-weight: 800;
}

.again-tag.old {
  background: var(--surface-2);
  color: var(--muted);
}

/* footer: Check / Continue + feedback panel */
.s-foot {
  flex: none;
  border-top: 2px solid var(--border);
  background: var(--bg);
  padding: 16px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  transition: background-color 0.22s ease, border-color 0.22s ease;
}

.s-foot.is-good {
  background: var(--good-bg);
  border-top-color: transparent;
}

.s-foot.is-bad {
  background: var(--bad-bg);
  border-top-color: transparent;
}

.feedback {
  max-width: 1000px;
  margin: 0 auto;
}

.feedback:empty {
  display: none;
}

.s-foot.has-feedback .feedback {
  max-height: 44vh;
  max-height: 44dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin-bottom: 14px;
}

.s-foot.leaving .feedback,
.s-foot.leaving .s-foot-inner {
  opacity: 0.4;
  transition: opacity 0.15s ease;
}

.fb-inner {
  animation: fb-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.fb-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.fb-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  background: var(--surface);
  font-size: 22px;
  font-weight: 900;
  animation: pop-in 0.4s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.is-good .fb-icon,
.is-good .fb-title {
  color: var(--good-ink);
}

.is-bad .fb-icon,
.is-bad .fb-title,
.is-bad .fb-label {
  color: var(--bad-ink);
}

.fb-title {
  font-size: 22px;
  font-weight: 900;
}

.fb-xp {
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 900;
  animation: pop-in 0.45s 0.1s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.fb-speak {
  margin-left: auto;
  width: 38px;
  height: 38px;
  font-size: 18px;
}

.fb-body {
  display: grid;
  gap: 6px;
  font-size: 15px;
  color: var(--text);
}

.fb-body:empty {
  display: none;
}

.fb-label {
  font-weight: 900;
  font-size: 15px;
}

.fb-answer {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-top: -4px;
}

.fb-given {
  color: var(--muted);
  font-size: 14px;
}

.fb-given-label {
  font-weight: 800;
}

.fb-given-text {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  text-decoration-color: var(--bad-line);
}

.fb-note {
  padding: 8px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  font-size: 14px;
}

.fb-explain {
  font-size: 14px;
  line-height: 1.5;
}

.fb-why {
  font-weight: 900;
}

.fb-again {
  font-size: 14px;
  font-weight: 800;
  color: var(--muted);
}

.s-foot-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 1000px;
  margin: 0 auto;
}

.s-foot-inner .main-btn {
  min-width: 170px;
  margin-left: auto;
}

.skip-btn {
  min-width: 150px;
}

/* intro overlay: "23 / 250 mastered" */
.intro {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  cursor: pointer;
  animation: fade-in 0.2s ease both;
}

.intro.out {
  animation: fade-out 0.26s ease both;
  pointer-events: none;
}

.intro-inner {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.intro-mascot {
  font-size: 76px;
  line-height: 1;
  margin-bottom: 8px;
  display: inline-block;
  animation: hop 1.1s ease-in-out infinite;
}

.intro-count {
  font-size: 60px;
  font-weight: 900;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  animation: pop-in 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.intro-done {
  color: var(--good-ink);
}

.intro-total {
  color: var(--muted);
  font-size: 0.55em;
}

.intro-label {
  margin-top: 2px;
  font-size: 17px;
  font-weight: 800;
  color: var(--muted);
}

.intro-bar {
  display: block;
  height: 16px;
  margin: 20px 0 16px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.intro-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: var(--green);
  transition: width 1s cubic-bezier(0.3, 0.8, 0.3, 1);
}

.intro-session {
  font-size: 17px;
  font-weight: 800;
}

.intro-tap {
  margin-top: 26px;
  font-size: 14px;
  color: var(--muted);
  animation: breathe 1.6s ease-in-out infinite;
}

@media (max-width: 599px) {
  .s-foot-inner .main-btn {
    flex: 1;
    min-width: 0;
  }
  .skip-btn {
    min-width: 0;
    flex: 0 1 auto;
    padding: 0 14px;
  }
  .fb-title {
    font-size: 20px;
  }
}

/* === Exercise basics ================================================================== */
.ex-head {
  margin-bottom: 18px;
}

.ex-title {
  font-size: 23px;
  font-weight: 900;
  margin-bottom: 14px;
}

.ex-title em {
  font-style: normal;
  color: var(--link);
}

.ex-en {
  margin-top: 10px;
  color: var(--muted);
  font-style: italic;
  font-size: 15px;
}

.ex-hint {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--hint-bg);
  color: var(--hint-ink);
  font-size: 14px;
  font-weight: 700;
}

.bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.mascot {
  flex: none;
  font-size: 60px;
  line-height: 1;
  display: inline-block;
  transform-origin: 50% 90%;
  animation: bob 3s ease-in-out infinite;
}

.mascot.mini {
  font-size: 34px;
  animation: none;
}

.bubble {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
  margin-bottom: 14px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  font-size: 19px;
  line-height: 1.5;
}

.bubble::before,
.bubble::after {
  content: '';
  position: absolute;
  bottom: 14px;
  width: 0;
  height: 0;
  border-style: solid;
}

.bubble::before {
  left: -12px;
  border-width: 9px 12px 9px 0;
  border-color: transparent var(--border) transparent transparent;
}

.bubble::after {
  left: -8.5px;
  border-width: 7px 9px 7px 0;
  border-color: transparent var(--surface) transparent transparent;
  bottom: 16px;
}

.bubble-big {
  font-size: 22px;
  font-weight: 700;
}

.bubble .speak-btn {
  width: 38px;
  height: 38px;
  font-size: 18px;
  align-self: flex-start;
}

.bubble-text {
  min-width: 0;
  overflow-wrap: anywhere;
}

.blank-inline {
  display: inline-block;
  min-width: 70px;
  padding: 0 6px;
  margin: 0 3px;
  border-bottom: 3px solid var(--border-strong);
  text-align: center;
  line-height: 1.3;
  transition: border-color 0.15s ease, background-color 0.2s ease;
}

.blank-inline.typing {
  border-bottom-color: var(--blue);
}

.blank-inline.filled {
  border-radius: 8px 8px 0 0;
  font-weight: 800;
  animation: pop-in 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

.blank-inline.good {
  background: var(--good-bg);
  color: var(--good-ink);
  border-bottom-color: var(--good-line);
}

.blank-inline.bad {
  background: var(--bad-bg);
  color: var(--bad-ink);
  border-bottom-color: var(--bad-line);
}

/* === Multiple choice ================================================================ */
.choices {
  display: grid;
  gap: 12px;
}

.choices-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.choices-col {
  grid-template-columns: minmax(0, 1fr);
}

.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  text-align: left;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
}

.choices-grid .choice {
  justify-content: center;
  text-align: center;
  min-height: 72px;
  position: relative;
}

.choices-grid .choice .key {
  position: absolute;
  left: 10px;
  top: 10px;
}

.choice:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 0 0 var(--border);
}

.choice-text {
  min-width: 0;
  overflow-wrap: anywhere;
}

.choice-text em {
  font-style: normal;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.key {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border: 2px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
}

.choice.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 2px 0 var(--blue-soft-shadow);
  color: var(--blue-ink);
}

.choice.sel .key {
  border-color: var(--blue);
  color: var(--blue-ink);
}

.choice.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  box-shadow: 0 2px 0 var(--good-line);
  color: var(--good-ink);
  animation: pop 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.choice.bad {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  box-shadow: 0 2px 0 var(--bad-line);
  color: var(--bad-ink);
}

.choice.good .key,
.choice.bad .key {
  border-color: currentColor;
  color: inherit;
}

.choice.dim {
  opacity: 0.45;
}

.choice:disabled {
  cursor: default;
}

@media (hover: hover) {
  .choice:hover:not(:disabled):not(.sel) {
    background: var(--surface-2);
  }
}

@media (hover: none) {
  .key {
    display: none;
  }
}

/* === True / false ===================================================================== */
.tf-statement {
  margin-top: 4px;
  padding: 18px 20px;
  border: 2px solid var(--border);
  border-radius: 18px;
  background: var(--surface-2);
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  line-height: 1.45;
}

.tf-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.tf-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 104px;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 3px 0 var(--border);
  font-size: 18px;
  font-weight: 800;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s ease;
}

.tf-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 0 0 var(--border);
}

.tf-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  font-size: 22px;
  font-weight: 900;
  color: #ffffff;
  transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.tf-yes .tf-icon {
  background: var(--good-ink);
}

.tf-no .tf-icon {
  background: var(--bad-ink);
}

[data-theme='dark'] .tf-icon {
  color: var(--bg);
}

.tf-btn.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 3px 0 var(--blue-soft-shadow);
  color: var(--blue-ink);
}

.tf-btn.sel .tf-icon {
  transform: scale(1.12);
}

.tf-btn.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  box-shadow: 0 3px 0 var(--good-line);
  color: var(--good-ink);
  animation: pop 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.tf-btn.bad {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  box-shadow: 0 3px 0 var(--bad-line);
  color: var(--bad-ink);
}

.tf-btn.dim {
  opacity: 0.45;
}

@media (hover: hover) {
  .tf-btn:hover:not(:disabled):not(.sel) {
    background: var(--surface-2);
  }
}

/* === Typed answers ======================================================================= */
.type-box {
  position: relative;
}

.type-input,
.cell-input {
  width: 100%;
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  -webkit-appearance: none;
  appearance: none;
}

.type-input {
  min-height: 60px;
  padding: 14px 16px;
  font-size: 20px;
  font-weight: 700;
}

.type-input::placeholder,
.cell-input::placeholder {
  color: var(--faint);
  font-weight: 600;
}

.type-input:focus,
.cell-input:focus {
  border-color: var(--blue);
  background: var(--surface);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent);
}

.type-input.good,
.cell-input.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  color: var(--good-ink);
  box-shadow: none;
}

.type-input.bad,
.cell-input.bad {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  color: var(--bad-ink);
  box-shadow: none;
}

.type-input:disabled,
.cell-input:disabled {
  opacity: 1;
  -webkit-text-fill-color: currentColor;
}

.umlauts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.umlaut {
  min-width: 44px;
  height: 44px;
  padding: 0 10px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  font-size: 18px;
  font-weight: 800;
  transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
}

.umlaut:active {
  transform: translateY(2px);
  box-shadow: 0 0 0 var(--border);
  background: var(--surface-2);
}

/* fill-in table (conjugation) */
.table-wrap {
  overflow-x: auto;
}

.fill-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 8px;
  margin-top: -8px;
}

.fill-table thead th {
  padding: 0 8px 0 0;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
}

.fill-table tbody th {
  width: 1%;
  padding: 0 14px 0 2px;
  font-size: 17px;
  font-weight: 800;
  text-align: left;
  white-space: nowrap;
  vertical-align: middle;
}

.fill-table td {
  vertical-align: middle;
}

.cell-input {
  min-height: 48px;
  padding: 10px 12px;
  font-size: 18px;
  font-weight: 700;
}

.cell-given {
  padding: 11px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 18px;
  font-weight: 700;
}

.cell-fix {
  margin-top: 4px;
  padding-left: 4px;
  font-size: 14px;
  font-weight: 800;
  color: var(--good-ink);
}

.cell-fix:empty {
  display: none;
}

.cell-fix::before {
  content: '✔ ';
}

/* === Tiles & chips (order, gaps, sort) =========================================================== */
.tile,
.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  padding: 0 14px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease, box-shadow 0.08s ease;
}

.tile:active:not(:disabled),
.chip:active:not(:disabled) {
  box-shadow: 0 0 0 var(--border);
  background: var(--surface-2);
}

.tile:disabled,
.chip:disabled {
  cursor: default;
}

.tile.locked {
  background: var(--surface-2);
  color: var(--muted);
  box-shadow: none;
  border-style: dashed;
  cursor: default;
}

.slot {
  position: relative;
  display: inline-flex;
}

.tile-shadow {
  display: inline-flex;
  align-items: center;
  height: 46px;
  padding: 0 14px;
  border: 2px solid transparent;
  border-radius: 12px;
  background: var(--surface-3);
  color: transparent;
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
}

[data-theme='dark'] .tile-shadow {
  background: var(--surface-2);
}

.slot > .tile,
.slot > .chip {
  position: absolute;
  inset: 0;
  width: 100%;
}

.drag-src {
  opacity: 0.3;
}

.drag-ghost {
  z-index: 1000;
  transform: scale(1.06);
  box-shadow: var(--lift), 0 2px 0 var(--border);
  border-color: var(--blue);
  cursor: grabbing;
}

body.is-dragging,
body.is-dragging * {
  cursor: grabbing !important;
  -webkit-user-select: none;
  user-select: none;
}

@media (hover: hover) {
  .tile:hover:not(:disabled):not(.locked),
  .chip:hover:not(:disabled) {
    background: var(--surface-2);
  }
}

/* sentence order */
.order-en {
  margin: -6px 0 12px;
  color: var(--muted);
  font-size: 15px;
  font-style: italic;
}

.order-en-label {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  font-size: 11px;
  font-style: normal;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  vertical-align: 2px;
}

.order-stage {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

.order-answer {
  --row: 58px;
  flex: 1;
  min-width: 0;
  min-height: calc(var(--row) * 2);
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 12px 8px;
  padding: 0 4px;
  border-radius: 10px;
  background-image: linear-gradient(to bottom, transparent calc(var(--row) - 2px), var(--border) calc(var(--row) - 2px), var(--border) var(--row));
  background-size: 100% var(--row);
  background-position: 0 0;
  transition: background-color 0.25s ease;
}

.order-answer.good {
  background-color: var(--good-bg);
}

.order-answer.good .tile {
  border-color: var(--good-line);
  color: var(--good-ink);
  box-shadow: 0 2px 0 var(--good-line);
}

.order-answer.bad {
  background-color: var(--bad-bg);
}

.order-answer.bad .tile {
  border-color: var(--bad-line);
  color: var(--bad-ink);
  box-shadow: 0 2px 0 var(--bad-line);
}

.order-bank {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 26px;
}

/* gap fill */
.gap-card,
.spot-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
}

.gap-card .mascot.mini,
.spot-card .mascot.mini {
  margin-top: 4px;
}

.gap-sentence {
  flex: 1;
  min-width: 0;
  font-size: 20px;
  line-height: 56px;
}

.gap-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  min-width: 78px;
  height: 46px;
  margin: 0 4px;
  padding: 0;
  border: 0;
  border-bottom: 3px solid var(--border-strong);
  border-radius: 8px 8px 0 0;
  background: transparent;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.gap-slot.active {
  border-bottom-color: var(--blue);
  background: var(--blue-soft);
}

.gap-slot.has-chip {
  min-width: 0;
  border-bottom-color: transparent;
  background: transparent;
}

.gap-slot .chip {
  line-height: 1;
}

.gap-slot.good .chip {
  border-color: var(--good-line);
  background: var(--good-bg);
  color: var(--good-ink);
  box-shadow: 0 2px 0 var(--good-line);
}

.gap-slot.bad {
  border-bottom-color: var(--bad-line);
}

.gap-slot.bad .chip {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  color: var(--bad-ink);
  box-shadow: 0 2px 0 var(--bad-line);
}

.gap-slot:disabled {
  cursor: default;
}

.chip-bank {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 22px;
}

.chip-shadow {
  height: 46px;
}

/* sort into groups */
.sort-pool {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  margin-bottom: 16px;
  padding: 8px;
  border: 2px dashed transparent;
  border-radius: 16px;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.sort-pool.hover {
  border-color: var(--blue);
  background: var(--blue-soft);
}

.sort-pool.empty::after {
  content: '✓ All words placed — tap a word to move it';
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.buckets {
  display: grid;
  gap: 12px;
}

.buckets-2,
.buckets-4 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.buckets-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.bucket {
  display: flex;
  flex-direction: column;
  min-height: 150px;
  padding: 10px;
  border: 2px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  cursor: pointer;
  transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
}

.bucket-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
  text-align: center;
}

.bucket-label {
  font-size: 17px;
  font-weight: 900;
}

.bucket-sub {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
}

.bucket-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-content: flex-start;
  gap: 8px;
  flex: 1;
  padding-top: 10px;
}

.bucket.target {
  border-style: dashed;
  border-color: var(--blue);
}

.bucket.hover {
  border-style: solid;
  border-color: var(--blue);
  background: var(--blue-soft);
  transform: scale(1.02);
}

.sort-chip {
  height: auto;
  min-height: 44px;
  max-width: 100%;
  padding-block: 8px;
  font-size: 17px;
  line-height: 1.2;
  white-space: normal;
  text-align: center;
}

.chip.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 2px 0 var(--blue-soft-shadow);
  color: var(--blue-ink);
  transform: translateY(-3px);
}

.sort-chip.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  color: var(--good-ink);
  box-shadow: 0 2px 0 var(--good-line);
}

.sort-chip.bad {
  flex-direction: column;
  padding: 6px 12px;
  border-color: var(--bad-line);
  background: var(--bad-bg);
  color: var(--bad-ink);
  box-shadow: 0 2px 0 var(--bad-line);
}

.chip-fix {
  display: block;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

/* spot the mistake */
.spot-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 4px;
  flex: 1;
  min-width: 0;
  font-size: 20px;
}

.spot-word {
  padding: 6px 9px;
  border: 2px solid transparent;
  border-radius: 10px;
  background: transparent;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.3;
  text-decoration: underline dotted var(--border-strong);
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.spot-word.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  color: var(--blue-ink);
  text-decoration: none;
}

.spot-word.good,
.spot-word.was-wrong,
.spot-word.bad {
  text-decoration: none;
}

.spot-word.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  color: var(--good-ink);
}

.spot-word.was-wrong {
  border-color: var(--orange);
  border-style: dashed;
}

.spot-word.bad {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  color: var(--bad-ink);
}

.spot-word.struck {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  color: var(--muted);
}

.spot-word:disabled {
  cursor: default;
}

.spot-fix {
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--good-bg);
  color: var(--good-ink);
  font-size: 20px;
  font-weight: 800;
  line-height: 1.3;
  animation: pop-in 0.4s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}

@media (hover: hover) {
  .spot-word:hover:not(:disabled):not(.sel) {
    background: var(--surface-2);
  }
  .bucket:hover {
    border-color: var(--border-strong);
  }
  .bucket.target:hover,
  .bucket.hover:hover {
    border-color: var(--blue);
  }
}

/* === Match pairs ==================================================================== */
.match-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.m-col {
  display: grid;
  gap: 10px;
  align-content: start;
}

.m-item {
  --pc: var(--border);
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 2px 0 var(--border);
  text-align: left;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease, box-shadow 0.08s ease;
}

.m-item:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 0 0 var(--border);
}

.m-text {
  min-width: 0;
  overflow-wrap: anywhere;
  -webkit-hyphens: auto;
  hyphens: auto;
}

.m-badge {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 50%;
  background: var(--pc);
  color: #1b1b1b;
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
}

.m-badge:empty {
  display: none;
}

.m-item.sel {
  border-color: var(--blue);
  background: var(--blue-soft);
  box-shadow: 0 2px 0 var(--blue-soft-shadow);
  color: var(--blue-ink);
}

.m-item.paired {
  border-color: var(--pc);
  background: color-mix(in srgb, var(--pc) var(--pc-tint), var(--surface));
  box-shadow: 0 2px 0 var(--pc);
}

.m-item.pc0 {
  --pc: var(--pc0);
}
.m-item.pc1 {
  --pc: var(--pc1);
}
.m-item.pc2 {
  --pc: var(--pc2);
}
.m-item.pc3 {
  --pc: var(--pc3);
}
.m-item.pc4 {
  --pc: var(--pc4);
}
.m-item.pc5 {
  --pc: var(--pc5);
}

.m-item.pop {
  animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.m-item.good {
  border-color: var(--good-line);
  background: var(--good-bg);
  box-shadow: 0 2px 0 var(--good-line);
  color: var(--good-ink);
}

.m-item.bad {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  box-shadow: 0 2px 0 var(--bad-line);
  color: var(--bad-ink);
}

.m-item.good .m-badge {
  background: var(--good-line);
}

.m-item.bad .m-badge {
  background: var(--bad-line);
}

.m-item:disabled {
  cursor: default;
}

@media (hover: hover) {
  .m-item:hover:not(:disabled):not(.sel):not(.paired) {
    background: var(--surface-2);
  }
}

/* === Solutions inside the feedback panel ============================================== */
.sol-fix {
  margin-top: 4px;
  font-size: 16px;
  font-weight: 700;
}

.sol-alt {
  margin-top: 2px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

.sol-table,
.sol-pairs,
.sol-buckets {
  display: grid;
  gap: 2px;
  font-size: 16px;
}

.sol-row {
  display: flex;
  gap: 8px;
}

.sol-row span {
  min-width: 90px;
  font-weight: 600;
  color: var(--muted);
}

.sol-row.is-blank strong {
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.sol-row:not(.is-blank) {
  opacity: 0.75;
}

.sol-pairs strong,
.sol-buckets strong {
  font-weight: 900;
}

.sol-mark {
  padding: 0 4px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.sol-strike {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  opacity: 0.7;
}

/* === Summary ============================================================================ */
.summary {
  max-width: 640px;
  margin: 0 auto;
  padding: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid;
  gap: 16px;
}

.summary-hero {
  text-align: center;
  padding: 8px 0 4px;
}

.summary-mascot {
  display: inline-block;
  font-size: 80px;
  line-height: 1;
  margin-bottom: 10px;
  animation: pop-in 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both, hop 1.4s 0.7s ease-in-out 2;
}

.summary-mascot.big {
  font-size: 104px;
}

.summary-hero h1 {
  font-size: 30px;
  font-weight: 900;
  margin-bottom: 6px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.stat-tile {
  --accent: var(--border-strong);
  position: relative;
  padding: 16px 10px 14px;
  border: 2px solid var(--accent);
  border-radius: 18px;
  background: var(--surface);
  text-align: center;
  overflow: hidden;
  animation: rise-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.stat-tile::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 6px;
  background: var(--accent);
}

.stat-tile:nth-child(2) {
  animation-delay: 0.07s;
}
.stat-tile:nth-child(3) {
  animation-delay: 0.14s;
}
.stat-tile:nth-child(4) {
  animation-delay: 0.21s;
}
.stat-tile:nth-child(5) {
  animation-delay: 0.28s;
}
.stat-tile:nth-child(6) {
  animation-delay: 0.35s;
}

.t-xp {
  --accent: var(--gold);
}
.t-acc {
  --accent: var(--green);
}
.t-time {
  --accent: var(--blue);
}
.t-new {
  --accent: var(--pc1);
}
.t-bad {
  --accent: var(--red);
}

.stat-icon {
  font-size: 24px;
  line-height: 1.2;
}

.t-bad .stat-icon {
  color: var(--bad-ink);
  font-weight: 900;
}

.stat-value {
  font-size: 26px;
  font-weight: 900;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.overall-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.overall-row span {
  font-variant-numeric: tabular-nums;
}

.missed .section-title,
.tips .section-title {
  margin-bottom: 4px;
}

.missed > .muted {
  margin-bottom: 12px;
}

.miss-list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.miss-item {
  display: grid;
  gap: 4px;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}

.miss-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.miss-top .topic-tag,
.miss-top .type-tag {
  font-size: 12px;
  padding: 2px 8px;
}

.miss-count {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bad-bg);
  color: var(--bad-ink);
  font-size: 12px;
  font-weight: 900;
}

.miss-state {
  margin-left: auto;
  font-size: 12px;
  font-weight: 800;
}

.miss-state.ok {
  color: var(--good-ink);
}

.miss-state.todo {
  color: var(--muted);
}

.miss-prompt {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.miss-q {
  font-size: 17px;
  font-weight: 700;
}

.miss-q .blank-inline {
  min-width: 44px;
}

.miss-given {
  font-size: 14px;
  color: var(--muted);
}

.miss-given s {
  text-decoration-thickness: 2px;
  text-decoration-color: var(--bad-line);
}

.miss-k {
  font-weight: 800;
}

.miss-a {
  font-size: 15px;
  color: var(--good-ink);
  font-weight: 700;
}

.miss-a .miss-k {
  color: var(--muted);
}

.miss-why {
  margin-top: 4px;
  padding-left: 10px;
  border-left: 3px solid var(--border);
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.perfect {
  text-align: center;
  font-size: 18px;
  font-weight: 800;
}

.summary-actions,
.review-actions {
  display: grid;
  gap: 12px;
  margin-top: 4px;
}

.summary-actions .home-links,
.review-actions .home-links {
  justify-content: center;
}

@media (min-width: 560px) {
  .summary .stat-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

/* === Review / report ====================================================================== */
.page-title {
  font-size: 20px;
  font-weight: 900;
}

.review {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid;
  gap: 16px;
}

.review > * {
  animation: rise-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.review > :nth-child(2) {
  animation-delay: 0.05s;
}
.review > :nth-child(3) {
  animation-delay: 0.1s;
}
.review > :nth-child(4) {
  animation-delay: 0.15s;
}
.review > :nth-child(n + 5) {
  animation-delay: 0.2s;
}

.empty-state {
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 32px 20px;
  text-align: center;
}

.empty-mascot {
  font-size: 64px;
  line-height: 1;
  animation: bob 3s ease-in-out infinite;
}

.empty-state .btn {
  margin-top: 8px;
  max-width: 320px;
}

.review-hero {
  display: grid;
  gap: 12px;
  text-align: center;
}

.banner {
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--good-bg);
  color: var(--good-ink);
  font-weight: 800;
}

.banner.soft {
  background: var(--surface-2);
  color: var(--text-2);
  font-weight: 600;
  font-size: 15px;
}

.hero-num {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-big {
  font-size: 60px;
  font-weight: 900;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

.hero-cap {
  font-size: 15px;
  font-weight: 800;
  color: var(--muted);
}

.hero-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 12px;
}

.stat-grid.six {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 560px) {
  .stat-grid.six {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.areas {
  display: grid;
  gap: 16px;
}

@media (min-width: 700px) {
  .areas {
    grid-template-columns: 1fr 1fr;
  }
}

.area {
  border-top-width: 6px;
}

.area.strong {
  border-top-color: var(--status-good);
}

.area.weak {
  border-top-color: var(--status-warn);
}

.area-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.area-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--grid);
}

.area-item:last-child {
  border-bottom: 0;
}

.area-icon {
  font-size: 20px;
  width: 26px;
  text-align: center;
}

.area-name {
  flex: 1;
  min-width: 0;
  font-weight: 800;
}

.area-num {

  <script>/* js/core/util.js */

  <script>/* js/core/deck.js */
/*
 * The deck registry. Content files in /data call:
 *   Brezel.deck.addTopics([...])
 *   Brezel.deck.addVerbs({...}), addFamilies([...]), addProperNouns([...])
 *   Brezel.deck.addCards('topicId', [...])
 * finalize() then validates everything; broken cards are skipped and reported
 * in the console (and by tools/validate.js), so one typo never breaks the app.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm } = B.util;

  const PRONOUNS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

  const deck = {
    topics: [],
    topicMap: Object.create(null),
    rawCards: [],
    cards: [], // valid cards, after finalize()
    cardMap: Object.create(null),
    verbs: Object.create(null),
    families: [],
    properNouns: new Set(),
    problems: [],
    PRONOUNS,

    addTopics(list) {
      for (const t of list) {
        this.topics.push(t);
        this.topicMap[t.id] = t;
      }
    },

    addCards(topicId, list) {
      for (const c of list) this.rawCards.push(Object.assign({ topic: topicId }, c));
    },

    /** verbs: { wohnen: { en, forms: [6 present forms], pp, aux } } */
    addVerbs(obj) {
      for (const [inf, v] of Object.entries(obj)) this.verbs[inf] = Object.assign({ inf }, v);
    },

    /** Groups of words that differ by one letter but are different grammar (dem/den/der). */
    addFamilies(list) {
      for (const f of list) this.families.push(f);
    },

    addProperNouns(list) {
      for (const w of list) this.properNouns.add(w);
    },

    /** Table rows for a verb: [['ich','wohne'], ['du','wohnst'], ...] */
    verbRows(inf) {
      const v = this.verbs[inf];
      return v ? PRONOUNS.map((p, i) => [p, v.forms[i]]) : null;
    },

    /** True when a and b are different members of the same word family (e.g. wohnt/wohne). */
    sameFamily(a, b) {
      const fa = this._familyIndex.get(norm(a));
      const fb = this._familyIndex.get(norm(b));
      if (!fa || !fb) return false;
      for (const id of fa) if (fb.has(id)) return true;
      return false;
    },

    _familyIndex: new Map(),

    _buildFamilies() {
      const idx = new Map();
      const add = (words, id) => {
        for (const w of words) {
          if (!w) continue;
          const k = norm(w);
          if (!idx.has(k)) idx.set(k, new Set());
          idx.get(k).add(id);
        }
      };
      this.families.forEach((f, i) => add(f, 'f' + i));
      for (const v of Object.values(this.verbs)) {
        const forms = v.forms || [];
        // separable forms ("kaufe ein"): the conjugated part alone is a member too
        add([v.inf, v.pp, ...forms, ...forms.map((f) => f.split(' ')[0])], 'v:' + v.inf);
      }
      this._familyIndex = idx;
    },

    finalize() {
      this._buildFamilies();
      this.cards = [];
      this.cardMap = Object.create(null);
      this.problems = [];
      const seen = new Set();
      for (const c of this.rawCards) {
        const errs = [];
        if (!c.id) errs.push('missing id');
        else if (seen.has(c.id)) errs.push('duplicate id');
        if (!this.topicMap[c.topic]) errs.push(`unknown topic "${c.topic}"`);
        const type = B.ex && B.ex.get(c.type);
        if (!type) errs.push(`unknown type "${c.type}"`);
        else if (type.validate) errs.push(...type.validate(c, this));
        if (errs.length) {
          this.problems.push({ id: c.id || '(no id)', errors: errs });
          continue;
        }
        seen.add(c.id);
        this.cards.push(c);
        this.cardMap[c.id] = c;
      }
      if (this.problems.length && typeof console !== 'undefined') {
        console.warn(`[Brezel] ${this.problems.length} card(s) skipped:`, this.problems);
      }
      return this;
    },

    byTopic(topicId) {
      return this.cards.filter((c) => c.topic === topicId);
    },
  };

  B.deck = deck;
})();

  <script>/* js/core/check.js */
/*
 * Typed-answer checking.
 * Rule: one wrong letter is forgiven (a typo) — two is wrong.
 * Exceptions, so the typo rule never accepts wrong grammar:
 *   - if the "typo" is actually another real form of the same word
 *     (wohne vs wohnt, dem vs den, meine vs meiner) it counts as wrong;
 *   - short words (3 letters or less, e.g. "ist", "dem", "im") must be exact,
 *     on their own or inside a longer answer.
 * Umlauts may be typed as ae/oe/ue and ß as ss.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { norm, levenshtein } = B.util;

  /** The one word that differs between two normalised answers, if exactly one does. */
  function diffWord(input, answer) {
    const x = input.split(' ');
    const y = answer.split(' ');
    if (x.length !== y.length) return null;
    const diff = [];
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) diff.push(i);
    return diff.length === 1 ? { got: x[diff[0]], want: y[diff[0]] } : null;
  }

  /** Would the single-letter difference between a and b change the grammar? */
  function isOtherForm(input, answer) {
    const d = diffWord(input, answer);
    return !!d && B.deck.sameFamily(d.got, d.want);
  }

  /**
   * @param {string} input   what the learner typed
   * @param {string[]} answers accepted answers (first = the one we show)
   * @param {{reject?: string[], strict?: boolean, nounHint?: boolean}} opts
   * @returns {{ok:boolean, exact?:boolean, typo?:boolean, reason?:string, matched:string, caseNote?:string}}
   */
  function typed(input, answers, opts = {}) {
    const raw = String(input == null ? '' : input).trim();
    const ni = norm(raw);
    const list = answers.map((a) => ({ raw: a, n: norm(a) }));
    const fallback = list[0] ? list[0].raw : '';
    if (!ni) return { ok: false, empty: true, matched: fallback };

    for (const a of list) {
      if (a.n === ni) return { ok: true, exact: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
    }

    const reject = new Set((opts.reject || []).map(norm));
    if (reject.has(ni)) return { ok: false, reason: 'form', matched: fallback };

    if (!opts.strict) {
      for (const a of list) {
        if (a.n.length <= 3) continue;
        if (levenshtein(ni, a.n) !== 1) continue;
        if (isOtherForm(ni, a.n)) return { ok: false, reason: 'form', matched: a.raw };
        // inside a longer answer, a slip in a tiny word (ist/bin, im/in) is not a typo either
        const d = diffWord(ni, a.n);
        if (d && d.want.length <= 3) return { ok: false, reason: 'short', matched: a.raw };
        return { ok: true, typo: true, matched: a.raw, caseNote: caseNote(raw, a.raw, opts) };
      }
    }
    return { ok: false, matched: fallback };
  }

  /** Nouns (and formal Sie) are capitalised in German — remind gently when the learner didn't. */
  function caseNote(raw, answer, opts) {
    if (/\sSie\b/.test(answer) && /\ssie\b/.test(raw)) return 'Tip: formal **Sie** (you) is always written with a capital S.';
    if (!opts.nounHint) return null;
    const a = answer.trim();
    const first = a.charAt(0);
    if (first && first === first.toUpperCase() && first !== first.toLowerCase() && raw.charAt(0) === raw.charAt(0).toLowerCase()) {
      return `Remember: German nouns start with a capital letter — **${a}**.`;
    }
    return null;
  }

  B.check = { typed, isOtherForm };
})();

  <script>/* js/core/store.js */
/*
 * Progress persistence (localStorage). Everything is keyed by card id, so
 * adding new cards later keeps all existing progress.
 *
 * cards[id] = { a: attempts, w: wrong attempts, done: bool, first: 1|0 (first attempt right?),
 *               lw: last wrong answer given, d: time it was mastered }
 * log      = every answer: { id, ok, t, ms, s: session id, p: practice?1:0 }
 * sessions = { id, start, end, answered, correct, wrong, mastered, xp, practice }
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const KEY = 'brezel.progress.v1';

  const fresh = () => ({
    v: 1,
    createdAt: Date.now(),
    cards: {},
    log: [],
    sessions: [],
    xp: 0,
    streak: { count: 0, last: null, best: 0 },
    bestCombo: 0,
    settings: { sound: true, size: 20, topic: 'all', theme: 'auto' },
  });

  let state = fresh();
  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const base = fresh();
        state = Object.assign(base, parsed, {
          settings: Object.assign(base.settings, parsed.settings || {}),
          streak: Object.assign(base.streak, parsed.streak || {}),
        });
      }
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not load progress', e);
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
      console.warn('[Brezel] Could not save progress', e);
    }
  }

  const cardState = (id) => state.cards[id] || null;
  const isDone = (id) => !!(state.cards[id] && state.cards[id].done);

  function touchStreak() {
    const today = B.util.dayKey();
    const s = state.streak;
    if (s.last === today) return;
    const y = new Date();
    y.setDate(y.getDate() - 1);
    s.count = s.last === B.util.dayKey(y) ? s.count + 1 : 1;
    s.last = today;
    s.best = Math.max(s.best || 0, s.count);
  }

  function beginSession(practice) {
    const rec = {
      id: (state.sessions.length ? state.sessions[state.sessions.length - 1].id : 0) + 1,
      start: Date.now(),
      end: null,
      answered: 0,
      correct: 0,
      wrong: 0,
      mastered: 0,
      xp: 0,
      practice: !!practice,
    };
    state.sessions.push(rec);
    save();
    return rec;
  }

  function currentSession() {
    return state.sessions[state.sessions.length - 1];
  }

  /** Record one answer. Returns {newlyDone} */
  function record(card, ok, given, ms, { practice = false, xp = 0 } = {}) {
    const sess = currentSession();
    state.log.push({ id: card.id, ok: ok ? 1 : 0, t: Date.now(), ms: Math.round(ms || 0), s: sess ? sess.id : 0, p: practice ? 1 : 0 });
    touchStreak();
    state.xp += xp;
    if (sess) {
      sess.answered++;
      sess[ok ? 'correct' : 'wrong']++;
      sess.xp += xp;
      sess.end = Date.now();
    }
    let newlyDone = false;
    if (!practice) {
      const c = (state.cards[card.id] = state.cards[card.id] || { a: 0, w: 0, done: false, first: null });
      c.a++;
      if (c.first === null) c.first = ok ? 1 : 0;
      if (ok) {
        if (!c.done) {
          newlyDone = true;
          if (sess) sess.mastered++;
        }
        c.done = true;
        c.d = Date.now();
      } else {
        c.w++;
        c.lw = String(given == null ? '' : given).slice(0, 200);
      }
    }
    save();
    return { newlyDone };
  }

  function endSession(extra) {
    const sess = currentSession();
    if (sess) {
      sess.end = Date.now();
      Object.assign(sess, extra || {});
      // Drop sessions where nothing was answered — they add noise to the history.
      if (!sess.answered) state.sessions.pop();
    }
    save();
  }

  function setBestCombo(n) {
    if (n > (state.bestCombo || 0)) {
      state.bestCombo = n;
      save();
    }
  }

  function setting(key, value) {
    if (value === undefined) return state.settings[key];
    state.settings[key] = value;
    save();
    return value;
  }

  function reset() {
    const settings = state.settings;
    state = fresh();
    state.settings = settings;
    save();
  }

  B.store = {
    load, save, reset, cardState, isDone, beginSession, record, endSession, setBestCombo, setting,
    get state() { return state; },
    get storageOk() { return storageOk; },
  };
})();

/*
 * Progress statistics, computed from the deck + saved progress.
 * Used by the home screen, the session summary and the review report.
 */
(function () {
  'use strict';
  const B = window.Brezel;
  const { pct } = B.util;

  const STRONG = 85; // first-try accuracy (%) for "Strong"
  const OKAY = 65; // … for "Getting there"
  const MIN_CARDS = 3; // attempted cards needed before we judge an area
  const MAX_MS = 120000; // cap each answer's time so an idle tab doesn't count

  function status(p, attempted) {
    if (attempted < MIN_CARDS) return { key: 'none', icon: '·', label: 'Not enough data yet' };
    if (p >= STRONG) return { key: 'good', icon: '✓', label: 'Strong' };
    if (p >= OKAY) return { key: 'warn', icon: '!', label: 'Getting there' };
    return { key: 'bad', icon: '✗', label: 'Needs work' };
  }

  /** Aggregate a list of cards. first = right on the very first try; retry = mastered later. */
  function summarize(cards) {
    let done = 0, first = 0, retry = 0, attempted = 0, wrong = 0, answers = 0, stillWrong = 0;
    for (const c of cards) {
      const s = B.store.cardState(c.id);
      if (!s || !s.a) continue;
      attempted++;
      answers += s.a;
      wrong += s.w;
      if (s.done) {
        done++;
        if (s.first === 1) first++;
        else retry++;
      } else stillWrong++;
    }
    const firstPct = pct(first, attempted);
    return {
      total: cards.length,
      done,
      first,
      retry,
      stillWrong,
      unseen: cards.length - attempted,
      notDone: cards.length - done,
      attempted,
      answers,
      wrong,
      firstPct,
      accuracy: pct(answers - wrong, answers),
      status: status(firstPct, attempted),
    };
  }

  function overview() {
    const st = B.store.state;
    const all = summarize(B.deck.cards);
    const timeMs = st.log.reduce((sum, l) => sum + Math.min(l.ms || 0, MAX_MS), 0);
    return Object.assign(all, {
      timeMs,
      sessions: st.sessions.length,
      xp: st.xp,
      streak: st.streak,
      bestCombo: st.bestCombo || 0,
      mistakes: mistakeCards().length,
      complete: B.deck.cards.length > 0 && all.done === B.deck.cards.length,
    });
  }

  const byTopic = () => B.deck.topics.map((t) => Object.assign({ topic: t }, summarize(B.deck.byTopic(t.id))));

  function byType() {
    const groups = {};
    for (const c of B.deck.cards) (groups[c.type] = groups[c.type] || []).push(c);
    return Object.entries(groups).map(([type, cards]) => Object.assign({ type, label: B.ex.label(type) }, summarize(cards)));
  }

  /** Answer accuracy per session (oldest first), practice sessions included but flagged. */
  function sessions(limit = 30) {
    return B.store.state.sessions
      .filter((s) => s.answered > 0)
      .slice(-limit)
      .map((s) => ({
        id: s.id,
        start: s.start,
        answered: s.answered,
        correct: s.correct,
        wrong: s.wrong,
        accuracy: pct(s.correct, s.answered),
        practice: !!s.practice,
      }));
  }

  /** Cards answered wrong at least once. */
  function mistakeCards() {
    return B.deck.cards.filter((c) => {
      const s = B.store.cardState(c.id);
      return s && s.w > 0;
    });
  }

  /** The most-missed cards, worst first. */
  function missed(limit = 10) {
    return mistakeCards()
      .map((card) => ({ card, state: B.store.cardState(card.id) }))
      .sort((a, b) => b.state.w - a.state.w || (a.state.done ? 1 : 0) - (b.state.done ? 1 : 0) || b.state.a - a.state.a)
      .slice(0, limit);
  }

  const pending = (topic) =>
    B.deck.cards.filter((c) => (topic === 'all' || !topic || c.topic === topic) && !B.store.isDone(c.id));

  B.stats = { STRONG, OKAY, MIN_CARDS, status, summarize, overview, byTopic, byType, sessions, missed, mistakeCards, pending };
})();

/* Sound effects (synthesised with WebAudio — no files) and German text-to-speech. */
(function () {
  'use strict';
  const B = window.Brezel;
  let ctx = null;

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    // iOS also uses "interrupted" (after a call, locking the phone or switching apps)
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, { type = 'sine', gain = 0.15, slideTo = null } = {}) {
    const c = ac();
    if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  const sounds = {
    tap: () => tone(620, 0, 0.05, { gain: 0.05 }),
    drop: () => tone(420, 0, 0.07, { type: 'triangle', gain: 0.07 }),
    correct: () => {
      tone(784, 0, 0.12, { type: 'triangle', gain: 0.16 });
      tone(1175, 0.09, 0.26, { type: 'triangle', gain: 0.16 });
    },
    wrong: () => {
      tone(233, 0, 0.16, { type: 'sawtooth', gain: 0.05, slideTo: 190 });
      tone(185, 0.13, 0.26, { type: 'square', gain: 0.035, slideTo: 150 });
    },
    combo: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, i * 0.06, 0.14, { type: 'triangle', gain: 0.1 })),
    complete: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.32, { type: 'triangle', gain: 0.13 })),
  };

  function play(name) {
    if (!B.store.setting('sound')) return;
    try {
      sounds[name] && sounds[name]();
    } catch (e) {
      /* audio is decoration — never let it break the app */
    }
  }

  // --- Text to speech -------------------------------------------------------
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  let voice = null;

  function pickVoice() {
    if (!canSpeak) return null;
    const voices = window.speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
    if (!voices.length) return null;
    const score = (v) =>
      (/de-DE/i.test(v.lang) ? 4 : 0) +
      (/premium|enhanced|natural|neural/i.test(v.name) ? 3 : 0) +
      (/google|anna|petra|helena|katja|markus/i.test(v.name) ? 2 : 0) +
      (v.localService ? 1 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0];
  }

  if (canSpeak) {
    voice = pickVoice();
    window.speechSynthesis.addEventListener &&
      window.speechSynthesis.addEventListener('voiceschanged', () => (voice = pickVoice()));
  }

  function speak(text) {
    if (!canSpeak || !text) return;
    const clean = String(text).replace(/_/g, ' ').replace(/\//g, ', ').replace(/\s*…\s*/g, ' ');
    // Safari can drop an utterance queued straight after cancel(), so only cancel when needed
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'de-DE';
    if (voice) u.voice = voice;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  B.audio = { play, speak, canSpeak };
})();

/*
 * Minimal pointer-based drag helper (mouse, touch and pen share one code path).
 * A tap stays a normal click; the drag only starts after the pointer moves a
 * few pixels. While dragging, a floating clone follows the finger.
 *
 *   B.drag.attach(el, {
 *     onStart(ctx), onMove(ctx), onEnd(ctx)  // ctx: {el, ghost, x, y, over}
 *   })
 * onEnd may return a target element: the clone then glides into it before
 * disappearing; otherwise it glides back to el.
 */
(function () {
  'use strict';
  const B = window.Brezel;

  let suppressClickUntil = 0;
  window.addEventListener(
    'click',
    (e) => {
      if (Date.now() < suppressClickUntil) {
        e.stopPropagation();
        e.preventDefault();
      }
    },
    true
  );

  function attach(el, opts = {}) {
    const threshold = opts.threshold || 6;
    let start = null;
    let ctx = null;

    function under(x, y) {
      return document.elementFromPoint(x, y);
    }

    function down(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (opts.enabled && !opts.enabled()) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
      // Listen on window: the element may be moved around the DOM mid-drag
      // (live re-ordering), which can drop pointer capture in some browsers.
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', cancel);

      const r = el.getBoundingClientRect();
      const ghost = el.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.removeAttribute('id');
      Object.assign(ghost.style, {
        position: 'fixed',
        left: r.left + 'px',
        top: r.top + 'px',
        width: r.width + 'px',
        height: r.height + 'px',
        margin: '0',
        pointerEvents: 'none',
        zIndex: 1000,
      });
      document.body.appendChild(ghost);
      ctx = { el, ghost, dx: start.x - r.left, dy: start.y - r.top, x: e.clientX, y: e.clientY, over: null };
      el.classList.add('drag-src');
      document.body.classList.add('is-dragging');
      opts.onStart && opts.onStart(ctx);
    }

    function move(e) {
      if (!start || e.pointerId !== start.id) return;
      if (!ctx) {
        if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < threshold) return;
        begin(e);
      }
      e.preventDefault();
      ctx.x = e.clientX;
      ctx.y = e.clientY;
      ctx.ghost.style.left = e.clientX - ctx.dx + 'px';
      ctx.ghost.style.top = e.clientY - ctx.dy + 'px';
      ctx.over = under(e.clientX, e.clientY);
      opts.onMove && opts.onMove(ctx);
    }

    function finish(cancelled) {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      start = null;
      if (!ctx) return;
      const c = ctx;
      ctx = null;
      suppressClickUntil = Date.now() + 350;
      document.body.classList.remove('is-dragging');
      const dest = opts.onEnd ? opts.onEnd(Object.assign(c, { cancelled })) : null;
      settle(c, dest || el);
    }

    function up(e) {
      if (start && e.pointerId === start.id) finish(false);
    }
    function cancel(e) {
      if (start && e.pointerId === start.id) finish(true);
    }

    /** Glide the clone to where the real element ended up, then remove it. */
    function settle(c, target) {
      const done = () => {
        c.ghost.remove();
        c.el.classList.remove('drag-src');
      };
      // Let layout update (FLIP moves etc.) before measuring the destination.
      requestAnimationFrame(() => {
        const to = (target.isConnected ? target : c.el).getBoundingClientRect();
        if (B.util.reducedMotion() || typeof c.ghost.animate !== 'function') return done();
        const from = c.ghost.getBoundingClientRect();
        const anim = c.ghost.animate(
          [
            { transform: 'translate(0,0) scale(1.06)' },
            { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(1)` },
          ],
          { duration: 180, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
        );
        anim.onfinish = done;
        anim.oncancel = done;
      });
    }

    el.addEventListener('pointerdown', down);
    return () => el.removeEventListener('pointerdown', down);
  }

  /**
   * Index at which to insert a dragged item into a wrapping row of items,
   * based on the pointer position. `exclude` is the item being dragged.
   */
  function insertIndex(container, x, y, exclude, selector) {
    const kids = Array.from(container.children).filter(
      (k) => k !== exclude && !k.classList.contains('drag-ghost') && (!selector || k.matches(selector))
    );
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (y < r.top - 4) return i;
      if (y <= r.bottom + 4 && x < r.left + r.width / 2) return i;
    }
    return kids.length;
  }

  B.drag = { attach, insertIndex };
})();

</script>
